name: CI

on:
  # The default branch is claude/quranic-root-research-pwa-vhg2w3, not main,
  # so the previous `branches: [main]` meant CI had never once run on a push
  # -- only on pull requests. A direct commit to the default branch, or a
  # merge, went unchecked.
  push:
    branches: [claude/quranic-root-research-pwa-vhg2w3]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The treebank source (see scripts/lib/build-treebank.ts) ships as a
      # .rar archive; unrar-free extracts it the same way unzip already
      # handles Lane's Lexicon and the Arabic lexicons' .zip archives --
      # a system tool via execFileSync, not a bundled npm dependency.
      - name: Install unrar-free
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends unrar-free

      - name: Data pipeline (fetch + validate)
        run: pnpm data:check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
