sion\"]}]]}],[\"$\",\"div\",null,{\"className\":\"mt-8\",\"children\":[\"$\",\"$17\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"text-center text-sm text-muted\",\"children\":\"Loading verses…\"}],\"children\":[\"$\",\"$L1d\",null,{\"surahMeta\":{\"n\":64,\"nameAr\":\"التغابن\",\"nameEn\":\"The Mutual Disillusion\",\"translit\":\"At-Taghabun\",\"type\":\"medinan\",\"ayahs\":18},\"verses\":[{\"a\":1,\"w\":[\"يُسَبِّحُ\",\"لِلَّهِ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَمَا\",\"فِي\",\"ٱلۡأَرۡضِۖ\",\"لَهُ\",\"ٱلۡمُلۡكُ\",\"وَلَهُ\",\"ٱلۡحَمۡدُۖ\",\"وَهُوَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٌ\"],\"t\":\"Whatever is in the heavens and whatever is on the earth is exalting Allah. To Him belongs dominion, and to Him belongs [all] praise, and He is over all things competent\"},{\"a\":2,\"w\":[\"هُوَ\",\"ٱلَّذِي\",\"خَلَقَكُمۡ\",\"فَمِنكُمۡ\",\"كَافِرٞ\",\"وَمِنكُم\",\"مُّؤۡمِنٞۚ\",\"وَٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"بَصِيرٌ\"],\"t\":\"It is He who created you, and among you is the disbeliever, and among you is the believer. And Allah, of what you do, is Seeing\"},{\"a\":3,\"w\":[\"خَلَقَ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضَ\",\"بِٱلۡحَقِّ\",\"وَصَوَّرَكُمۡ\",\"فَأَحۡسَنَ\",\"صُوَرَكُمۡۖ\",\"وَإِلَيۡهِ\",\"ٱلۡمَصِيرُ\"],\"t\":\"He created the heavens and earth in truth and formed you and perfected your forms; and to Him is the [final] destination\"},{\"a\":4,\"w\":[\"يَعۡلَمُ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"وَيَعۡلَمُ\",\"مَا\",\"تُسِرُّونَ\",\"وَمَا\",\"تُعۡلِنُونَۚ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِذَاتِ\",\"ٱلصُّدُورِ\"],\"t\":\"He knows what is within the heavens and earth and knows what you conceal and what you declare. And Allah is Knowing of that within the breasts\"},{\"a\":5,\"w\":[\"أَلَمۡ\",\"يَأۡتِكُمۡ\",\"نَبَؤُاْ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"مِن\",\"قَبۡلُ\",\"فَذَاقُواْ\",\"وَبَالَ\",\"أَمۡرِهِمۡ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"Has there not come to you the news of those who disbelieved before? So they tasted the bad consequence of their affair, and they will have a painful punishment\"},{\"a\":6,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُۥ\",\"كَانَت\",\"تَّأۡتِيهِمۡ\",\"رُسُلُهُم\",\"بِٱلۡبَيِّنَٰتِ\",\"فَقَالُوٓاْ\",\"أَبَشَرٞ\",\"يَهۡدُونَنَا\",\"فَكَفَرُواْ\",\"وَتَوَلَّواْۖ\",\"وَّٱسۡتَغۡنَى\",\"ٱللَّهُۚ\",\"وَٱللَّهُ\",\"غَنِيٌّ\",\"حَمِيدٞ\"],\"t\":\"That is because their messengers used to come to them with clear evidences, but they said, \\\"Shall human beings guide us?\\\" and disbelieved and turned away. And Allah dispensed [with them]; and Allah is Free of need and Praiseworthy\"},{\"a\":7,\"w\":[\"زَعَمَ\",\"ٱلَّذِينَ\",\"كَفَرُوٓاْ\",\"أَن\",\"لَّن\",\"يُبۡعَثُواْۚ\",\"قُلۡ\",\"بَلَىٰ\",\"وَرَبِّي\",\"لَتُبۡعَثُنَّ\",\"ثُمَّ\",\"لَتُنَبَّؤُنَّ\",\"بِمَا\",\"عَمِلۡتُمۡۚ\",\"وَذَٰلِكَ\",\"عَلَى\",\"ٱللَّهِ\",\"يَسِيرٞ\"],\"t\":\"Those who disbelieve have claimed that they will never be resurrected. Say, \\\"Yes, by my Lord, you will surely be resurrected; then you will surely be informed of what you did. And that, for Allah, is easy\"},{\"a\":8,\"w\":[\"فَـَٔامِنُواْ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦ\",\"وَٱلنُّورِ\",\"ٱلَّذِيٓ\",\"أَنزَلۡنَاۚ\",\"وَٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"خَبِيرٞ\"],\"t\":\"So believe in Allah and His Messenger and the Qur'an which We have sent down. And Allah is Acquainted with what you do\"},{\"a\":9,\"w\":[\"يَوۡمَ\",\"يَجۡمَعُكُمۡ\",\"لِيَوۡمِ\",\"ٱلۡجَمۡعِۖ\",\"ذَٰلِكَ\",\"يَوۡمُ\",\"ٱلتَّغَابُنِۗ\",\"وَمَن\",\"يُؤۡمِنۢ\",\"بِٱللَّهِ\",\"وَيَعۡمَلۡ\",\"صَٰلِحٗا\",\"يُكَفِّرۡ\",\"عَنۡهُ\",\"سَيِّـَٔاتِهِۦ\",\"وَيُدۡخِلۡهُ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَآ\",\"أَبَدٗاۚ\",\"ذَٰلِكَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"The Day He will assemble you for the Day of Assembly - that is the Day of Deprivation. And whoever believes in Allah and does righteousness - He will remove from him his misdeeds and admit him to gardens beneath which rivers flow, wherein they will abide forever. That is the great attainment\"},{\"a\":10,\"w\":[\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"وَكَذَّبُواْ\",\"بِـَٔايَٰتِنَآ\",\"أُوْلَـٰٓئِكَ\",\"أَصۡحَٰبُ\",\"ٱلنَّارِ\",\"خَٰلِدِينَ\",\"فِيهَاۖ\",\"وَبِئۡسَ\",\"ٱلۡمَصِيرُ\"],\"t\":\"But the ones who disbelieved and denied Our verses - those are the companions of the Fire, abiding eternally therein; and wretched is the destination\"},{\"a\":11,\"w\":[\"مَآ\",\"أَصَابَ\",\"مِن\",\"مُّصِيبَةٍ\",\"إِلَّا\",\"بِإِذۡنِ\",\"ٱللَّهِۗ\",\"وَمَن\",\"يُؤۡمِنۢ\",\"بِٱللَّهِ\",\"يَهۡدِ\",\"قَلۡبَهُۥۚ\",\"وَٱللَّهُ\",\"بِكُلِّ\",\"شَيۡءٍ\",\"عَلِيمٞ\"],\"t\":\"No disaster strikes except by permission of Allah. And whoever believes in Allah - He will guide his heart. And Allah is Knowing of all things\"},{\"a\":12,\"w\":[\"وَأَطِيعُواْ\",\"ٱللَّهَ\",\"وَأَطِيعُواْ\",\"ٱلرَّسُولَۚ\",\"فَإِن\",\"تَوَلَّيۡتُمۡ\",\"فَإِنَّمَا\",\"عَلَىٰ\",\"رَسُولِنَا\",\"ٱلۡبَلَٰغُ\",\"ٱلۡمُبِينُ\"],\"t\":\"And obey Allah and obey the Messenger; but if you turn away - then upon Our Messenger is only [the duty of] clear notification\"},{\"a\":13,\"w\":[\"ٱللَّهُ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَۚ\",\"وَعَلَى\",\"ٱللَّهِ\",\"فَلۡيَتَوَكَّلِ\",\"ٱلۡمُؤۡمِنُونَ\"],\"t\":\"Allah - there is no deity except Him. And upon Allah let the believers rely\"},{\"a\":14,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِنَّ\",\"مِنۡ\",\"أَزۡوَٰجِكُمۡ\",\"وَأَوۡلَٰدِكُمۡ\",\"عَدُوّٗا\",\"لَّكُمۡ\",\"فَٱحۡذَرُوهُمۡۚ\",\"وَإِن\",\"تَعۡفُواْ\",\"وَتَصۡفَحُواْ\",\"وَتَغۡفِرُواْ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"غَفُورٞ\",\"رَّحِيمٌ\"],\"t\":\"O you who have believed, indeed, among your wives and your children are enemies to you, so beware of them. But if you pardon and overlook and forgive - then indeed, Allah is Forgiving and Merciful\"},{\"a\":15,\"w\":[\"إِنَّمَآ\",\"أَمۡوَٰلُكُمۡ\",\"وَأَوۡلَٰدُكُمۡ\",\"فِتۡنَةٞۚ\",\"وَٱللَّهُ\",\"عِندَهُۥٓ\",\"أَجۡرٌ\",\"عَظِيمٞ\"],\"t\":\"Your wealth and your children are but a trial, and Allah has with Him a great reward\"},{\"a\":16,\"w\":[\"فَٱتَّقُواْ\",\"ٱللَّهَ\",\"مَا\",\"ٱسۡتَطَعۡتُمۡ\",\"وَٱسۡمَعُواْ\",\"وَأَطِيعُواْ\",\"وَأَنفِقُواْ\",\"خَيۡرٗا\",\"لِّأَنفُسِكُمۡۗ\",\"وَمَن\",\"يُوقَ\",\"شُحَّ\",\"نَفۡسِهِۦ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡمُفۡلِحُونَ\"],\"t\":\"So fear Allah as much as you are able and listen and obey and spend [in the way of Allah]; it is better for your selves. And whoever is protected from the stinginess of his soul - it is those who will be the successful\"},{\"a\":17,\"w\":[\"إِن\",\"تُقۡرِضُواْ\",\"ٱللَّهَ\",\"قَرۡضًا\",\"حَسَنٗا\",\"يُضَٰعِفۡهُ\",\"لَكُمۡ\",\"وَيَغۡفِرۡ\",\"لَكُمۡۚ\",\"وَٱللَّهُ\",\"شَكُورٌ\",\"حَلِيمٌ\"],\"t\":\"If you loan Allah a goodly loan, He will multiply it for you and forgive you. And Allah is Most Appreciative and Forbearing\"},{\"a\":18,\"w\":[\"عَٰلِمُ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"Knower of the unseen and the witnessed, the Exalted in Might, the Wise\"}]}]}]}]]}]\n1a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1e:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n18:null\n1c:[[\"$\",\"title\",\"0\",{\"children\":\"At-Taghabun — Surah 64 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$
