"ٱلۡعِلۡمِ\",\"يَقُولُونَ\",\"ءَامَنَّا\",\"بِهِۦ\",\"كُلّٞ\",\"مِّنۡ\",\"عِندِ\",\"رَبِّنَاۗ\",\"وَمَا\",\"يَذَّكَّرُ\",\"إِلَّآ\",\"أُوْلُواْ\",\"ٱلۡأَلۡبَٰبِ\"],\"t\":\"It is He who has sent down to you, [O Muhammad], the Book; in it are verses [that are] precise - they are the foundation of the Book - and others unspecific. As for those in whose hearts is deviation [from truth], they will follow that of it which is unspecific, seeking discord and seeking an interpretation [suitable to them]. And no one knows its [true] interpretation except Allah. But those firm in knowledge say, \\\"We believe in it. All [of it] is from our Lord.\\\" And no one will be reminded except those of understanding\",\"pickthall\":\"He it is Who hath revealed unto thee (Muhammad) the Scripture wherein are clear revelations - they are the substance of the Book - and others (which are) allegorical. But those in whose hearts is doubt pursue, forsooth, that which is allegorical seeking (to cause) dissension by seeking to explain it. None knoweth its explanation save Allah. And those who are of sound instruction say: We believe therein; the whole is from our Lord; but only men of understanding really heed\"},{\"a\":8,\"w\":[\"رَبَّنَا\",\"لَا\",\"تُزِغۡ\",\"قُلُوبَنَا\",\"بَعۡدَ\",\"إِذۡ\",\"هَدَيۡتَنَا\",\"وَهَبۡ\",\"لَنَا\",\"مِن\",\"لَّدُنكَ\",\"رَحۡمَةًۚ\",\"إِنَّكَ\",\"أَنتَ\",\"ٱلۡوَهَّابُ\"],\"t\":\"[Who say], \\\"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower\",\"pickthall\":\"Our Lord! Cause not our hearts to stray after Thou hast guided us, and bestow upon us mercy from Thy Presence. Lo! Thou, only Thou, art the Bestower\"},{\"a\":9,\"w\":[\"رَبَّنَآ\",\"إِنَّكَ\",\"جَامِعُ\",\"ٱلنَّاسِ\",\"لِيَوۡمٖ\",\"لَّا\",\"رَيۡبَ\",\"فِيهِۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"لَا\",\"يُخۡلِفُ\",\"ٱلۡمِيعَادَ\"],\"t\":\"Our Lord, surely You will gather the people for a Day about which there is no doubt. Indeed, Allah does not fail in His promise\",\"pickthall\":\"Our Lord! Lo! it is Thou Who gatherest mankind together to a Day of which there is no doubt. Lo! Allah faileth not to keep the tryst\"},{\"a\":10,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لَن\",\"تُغۡنِيَ\",\"عَنۡهُمۡ\",\"أَمۡوَٰلُهُمۡ\",\"وَلَآ\",\"أَوۡلَٰدُهُم\",\"مِّنَ\",\"ٱللَّهِ\",\"شَيۡـٔٗاۖ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمۡ\",\"وَقُودُ\",\"ٱلنَّارِ\"],\"t\":\"Indeed, those who disbelieve - never will their wealth or their children avail them against Allah at all. And it is they who are fuel for the Fire\",\"pickthall\":\"(On that Day) neither the riches nor the progeny of those who disbelieve will aught avail them with Allah. They will be fuel for Fire\"},{\"a\":11,\"w\":[\"كَدَأۡبِ\",\"ءَالِ\",\"فِرۡعَوۡنَ\",\"وَٱلَّذِينَ\",\"مِن\",\"قَبۡلِهِمۡۚ\",\"كَذَّبُواْ\",\"بِـَٔايَٰتِنَا\",\"فَأَخَذَهُمُ\",\"ٱللَّهُ\",\"بِذُنُوبِهِمۡۗ\",\"وَٱللَّهُ\",\"شَدِيدُ\",\"ٱلۡعِقَابِ\"],\"t\":\"[Theirs is] like the custom of the people of Pharaoh and those before them. They denied Our signs, so Allah seized them for their sins. And Allah is severe in penalty\",\"pickthall\":\"Like Pharaoh's folk and those who were before them, they disbelieved Our revelations and so Allah seized them for their sins. And Allah is severe in punishment\"},{\"a\":12,\"w\":[\"قُل\",\"لِّلَّذِينَ\",\"كَفَرُواْ\",\"سَتُغۡلَبُونَ\",\"وَتُحۡشَرُونَ\",\"إِلَىٰ\",\"جَهَنَّمَۖ\",\"وَبِئۡسَ\",\"ٱلۡمِهَادُ\"],\"t\":\"Say to those who disbelieve, \\\"You will be overcome and gathered together to Hell, and wretched is the resting place\",\"pickthall\":\"Say (O Muhammad) unto those who disbelieve: Ye shall be overcome and gathered unto Hell, an evil resting-place\"},{\"a\":13,\"w\":[\"قَدۡ\",\"كَانَ\",\"لَكُمۡ\",\"ءَايَةٞ\",\"فِي\",\"فِئَتَيۡنِ\",\"ٱلۡتَقَتَاۖ\",\"فِئَةٞ\",\"تُقَٰتِلُ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَأُخۡرَىٰ\",\"كَافِرَةٞ\",\"يَرَوۡنَهُم\",\"مِّثۡلَيۡهِمۡ\",\"رَأۡيَ\",\"ٱلۡعَيۡنِۚ\",\"وَٱللَّهُ\",\"يُؤَيِّدُ\",\"بِنَصۡرِهِۦ\",\"مَن\",\"يَشَآءُۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَعِبۡرَةٗ\",\"لِّأُوْلِي\",\"ٱلۡأَبۡصَٰرِ\"],\"t\":\"Already there has been for you a sign in the two armies which met - one fighting in the cause of Allah and another of disbelievers. They saw them [to be] twice their [own] number by [their] eyesight. But Allah supports with His victory whom He wills. Indeed in that is a lesson for those of vision\",\"pickthall\":\"There was a token for you in two hosts which met: one army fighting in the way of Allah, and another disbelieving, whom they saw as twice their number, clearly, with their very eyes. Thus Allah strengtheneth with His succour whom He will. Lo! herein verily is a lesson for those who have eyes\"},{\"a\":14,\"w\":[\"زُيِّنَ\",\"لِلنَّاسِ\",\"حُبُّ\",\"ٱلشَّهَوَٰتِ\",\"مِنَ\",\"ٱلنِّسَآءِ\",\"وَٱلۡبَنِينَ\",\"وَٱلۡقَنَٰطِيرِ\",\"ٱلۡمُقَنطَرَةِ\",\"مِنَ\",\"ٱلذَّهَبِ\",\"وَٱلۡفِضَّةِ\",\"وَٱلۡخَيۡلِ\",\"ٱلۡمُسَوَّمَةِ\",\"وَٱلۡأَنۡعَٰمِ\",\"وَٱلۡحَرۡثِۗ\",\"ذَٰلِكَ\",\"مَتَٰعُ\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَاۖ\",\"وَٱللَّهُ\",\"عِندَهُۥ\",\"حُسۡنُ\",\"ٱلۡمَـَٔابِ\"],\"t\":\"Beautified for people is the love of that which they desire - of women and sons, heaped-up sums of gold and silver, fine branded horses, and cattle and tilled land. That is the enjoyment of worldly life, but Allah has with Him the best return\",\"pickthall\":\"Beautified for mankind is love of the joys (that come) from women and offspring; and stored-up heaps of gold and silver, and horses branded (with their mark), and cattle and land. That is comfort of the life of the world. Allah! With Him is a more excellent abode\"},{\"a\":15,\"w\":[\"۞قُلۡ\",\"أَؤُنَبِّئُكُم\",\"بِخَيۡرٖ\",\"مِّن\",\"ذَٰلِكُمۡۖ\",\"لِلَّذِينَ\",\"ٱتَّقَوۡاْ\",\"عِندَ\",\"رَبِّهِمۡ\",\"جَنَّـٰتٞ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَا\",\"وَأَزۡوَٰجٞ\",\"مُّطَهَّرَةٞ\",\"وَرِضۡوَٰنٞ\",\"مِّنَ\",\"ٱللَّهِۗ\",\"وَٱللَّهُ\",\"بَصِيرُۢ\",\"بِٱلۡعِبَادِ\"],\"t\":\"Say, \\\"Shall I inform you of [something] better than that? For those who fear Allah will be gardens in the presence of their Lord beneath which rivers flow, wherein they abide eternally, and purified spouses and approval from Allah. And Allah is Seeing of [His] servants\",\"pickthall\":\"Say: Shall I inform you of something better than that? For those who keep from evil, with their Lord, are Gardens underneath which rivers flow wherein they will abide, and pure companions, and contentment from Allah. Allah is Seer of His bondmen\"},{\"a\":16,\"w\":[\"ٱلَّذِينَ\",\"يَقُولُونَ\",\"رَبَّنَآ\",\"إِنَّنَآ\",\"ءَامَنَّا\",\"فَٱغۡفِرۡ\",\"لَنَا\",\"ذُنُوبَنَا\",\"وَقِنَا\",\"عَذَابَ\",\"ٱلنَّارِ\"],\"t\":\"Those who say, \\\"Our Lord, indeed we have believed, so forgive us our sins and protect us from the punishment of the Fire\",\"pickthall\":\"Those who say: Our Lord! Lo! we believe. So forgive us our sins and guard us from the punishment of Fire\"},{\"a\":17,\"w\":[\"ٱلصَّـٰبِرِينَ\",\"وَٱلصَّـٰدِقِينَ\",\"وَٱلۡقَٰنِتِينَ\",\"وَٱلۡمُنفِقِينَ\",\"وَٱلۡمُسۡتَغۡفِرِينَ\",\"بِٱلۡأَسۡحَارِ\"],\"t\":\"The patient, the true, the obedient, those who spend [in the way of Allah], and those who seek forgiveness before dawn\",\"pickthall\":\"The steadfast, and the truthful, and the obedient, those who spend (and hoard not), those who pray for pardon in the watches of the night\"},{\"a\":18,\"w\":[\"شَهِدَ\",\"ٱللَّهُ\",\"أَنَّهُۥ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَ\",\"وَٱلۡمَلَـٰٓئِكَةُ\",\"وَأُوْلُواْ\",\"ٱلۡعِلۡمِ\",\"قَآئِمَۢا\",\"بِٱلۡقِسۡطِۚ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"Allah witnesses that there is no deity except Him, and [so do] the angels and those of knowledge - [that He is] maintaining [creation] in justice. There is no deity except Him, the Exalted in Might, the Wise\",\"pickthall\":\"Allah (Himself) is Witness that there is no Allah save Him. And the angels and the men of learning (too are witness). Maintaining His creation in justice, there is no Allah save Him the Almighty, the Wise\"},{\"a\":19,\"w\":[\"إِنَّ\",\"ٱلدِّينَ\",\"عِندَ\",\"ٱللَّهِ\",\"ٱلۡإِسۡلَٰمُۗ\",\"وَمَا\",\"ٱخۡتَلَفَ\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"إِلَّا\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"جَآءَهُمُ\",\"ٱلۡعِلۡمُ\",\"بَغۡيَۢا\",\"بَيۡنَهُمۡۗ\",\"وَمَن\",\"يَكۡفُرۡ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"سَرِيعُ\",\"ٱلۡحِسَابِ\"],\"t\":\"Indeed, the religion in the sight of Allah is Islam. And those who were given the Scripture did not differ except after knowledge had come to them - out of jealous animosity between themselves. And whoever disbelieves in the verses of Allah, then indeed, Allah is swift in [taking] account\",\"pickthall\":\"Lo! religion with Allah (is) the Surrender (to His Will and Guidance). Those who (formerly) received the Scripture differed only after knowledge came unto them, through transgression among themselves. Whoso disbelieveth the revelations of Allah (will find that) lo! Allah is swift at reckoning\"},{\"a\":20,\"w\":[\"فَإِنۡ\",\"حَآجُّوكَ\",\"فَقُلۡ\",\"أَسۡلَمۡتُ\",\"وَجۡهِيَ\",\"لِلَّهِ\",\"وَمَنِ\",\"ٱتَّبَعَنِۗ\",\"وَقُل\",\"لِّلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"وَٱلۡأُمِّيِّـۧنَ\",\"ءَأَسۡلَمۡتُمۡۚ\",\"فَإِنۡ\",\"أَسۡلَمُواْ\",\"فَقَدِ\",\"ٱهۡتَدَواْۖ\",\"وَّإِن\",\"تَوَلَّوۡاْ\",\"فَإِنَّمَا\",\"عَلَيۡكَ\",\"ٱلۡبَلَٰغُۗ\",\"وَٱللَّهُ\",\"بَصِيرُۢ\",\"بِٱلۡعِبَادِ\"],\"t\":\"So if they argue with you, say, \\\"I have submitted myself to Allah [in Islam], and [so have] those who follow me.\\\" And say to those who were given the Scripture and [to] the unlearned, \\\"Have you submitted yourselves?\\\" And if they submit [in Islam], they are rightly guided; but if they turn away - then upon you is only the [duty of] notification. And Allah is Seeing of [His] servants\",\"pickthall\":\"And if they argue with thee, (O Muhammad), say: I have surrendered my purpose to Allah and (so have) those who follow me. And say unto those who have received the Scripture and those who read not: Have ye (too) surrendered? If they surrender, then truly they are rightly guided, and if they turn away, then it is thy duty only to convey the message (unto them). Allah is Seer of (His) bondmen\"},{\"a\":21,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"يَكۡفُرُونَ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"وَيَقۡتُلُونَ\",\"ٱلنَّبِيِّـۧنَ\",\"بِغَيۡرِ\",\"حَقّٖ\",\"وَيَقۡتُلُونَ\",\"ٱلَّذِينَ\",\"يَأۡمُرُونَ\",\"بِٱلۡقِسۡطِ\",\"مِنَ\",\"ٱلنَّاسِ\",\"فَبَشِّرۡهُم\",\"بِعَذَابٍ\",\"أَلِيمٍ\"],\"t\":\"Those who disbelieve in the signs of Allah and kill the prophets without right and kill those who order justice from among the people - give them tidings of a painful punishment\",\"pickthall\":\"Lo! those who disbelieve the revelations of Allah, and slay the prophets wrongfully, and slay those of mankind who enjoin equity: promise them a painful doom\"},{\"a\":22,\"w\":[\"أُوْلَـٰٓئِكَ\",\"ٱلَّذِينَ\",\"حَبِطَتۡ\",\"أَعۡمَٰلُهُمۡ\",\"فِي\",\"ٱلدُّنۡيَا\",\"وَٱلۡأٓخِرَةِ\",\"وَمَا\",\"لَهُم\",\"مِّن\",\"نَّـٰصِرِينَ\"],\"t\":\"They are the ones whose deeds have become worthless in this world and the Hereafter, and for them there will be no helpers\",\"pickthall\":\"Those are they whose works have failed in the world and the Hereafter; and they have no helpers\"},{\"a\":23,\"w\":[\"أَلَمۡ\",\"تَرَ\",\"إِلَى\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"نَصِيبٗا\",\"مِّنَ\",\"ٱلۡكِتَٰبِ\",\"يُدۡعَوۡنَ\",\"إِلَىٰ\",\"كِتَٰبِ\",\"ٱللَّهِ\",\"لِيَحۡكُمَ\",\"بَيۡنَهُمۡ\",\"ثُمَّ\",\"يَتَوَلَّىٰ\",\"فَرِيقٞ\",\"مِّنۡهُمۡ\",\"وَهُم\",\"مُّعۡرِضُونَ\"],\"t\":\"Do you not consider, [O Muhammad], those who were given a portion of the Scripture? They are invited to the Scripture of Allah that it should arbitrate between them; then a party of them turns away, and they are refusing\",\"pickthall\":\"Hast thou not seen how those who have received a portion of the Scripture invoke the Scripture of Allah (in their disputes) that it may judge between them; then a faction of them turn away, being opposed (to it)\"},{\"a\":24,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَالُواْ\",\"لَن\",\"تَمَسَّنَا\",\"ٱلنَّارُ\",\"إِلَّآ\",\"أَيَّامٗا\",\"مَّعۡدُودَٰتٖۖ\",\"وَغَرَّهُمۡ\",\"فِي\",\"دِينِهِم\",\"مَّا\",\"كَانُواْ\",\"يَفۡتَرُونَ\"],\"t\":\"That is because they say, \\\"Never will the Fire touch us except for [a few] numbered days,\\\" and [because] they were deluded in their religion by what they were inventing\",\"pickthall\":\"That is because they say: The Fire will not touch us save for a certain number of days. That which they used to invent hath deceived them regarding their religion\"},{\"a\":25,\"w\":[\"فَكَيۡفَ\",\"إِذَا\",\"جَمَعۡنَٰهُمۡ\",\"لِيَوۡمٖ\",\"لَّا\",\"رَيۡبَ\",\"فِيهِ\",\"وَوُفِّيَتۡ\",\"كُلُّ\",\"نَفۡسٖ\",\"مَّا\",\"كَسَبَتۡ\",\"وَهُمۡ\",\"لَا\",\"يُظۡلَمُونَ\"],\"t\":\"So how will it be when We assemble them for a Day about which there is no doubt? And each soul will be compensated [in full for] what it earned, and they will not be wronged\",\"pickthall\":\"How (will it be with them) when We have brought them all together to a Day of which there is no doubt, when every soul will be paid in full what it hath earned, and they will not be wronged\"},{\"a\":26,\"w\":[\"قُلِ\",\"ٱللَّهُمَّ\",\"مَٰلِكَ\",\"ٱلۡمُلۡكِ\",\"تُؤۡتِي\",\"ٱلۡمُلۡكَ\",\"مَن\",\"تَشَآءُ\",\"وَتَنزِعُ\",\"ٱلۡمُلۡكَ\",\"مِمَّن\",\"تَشَآءُ\",\"وَتُعِزُّ\",\"مَن\",\"تَشَآءُ\",\"وَتُذِلُّ\",\"مَن\",\"تَشَآءُۖ\",\"بِيَدِكَ\",\"ٱلۡخَيۡرُۖ\",\"إِنَّكَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٞ\"],\"t\":\"Say, \\\"O Allah, Owner of Sovereignty, You give sovereignty to whom You will and You take sovereignty away from whom You will. You honor whom You will and You humble whom You will. In Your hand is [all] good. Indeed, You are over all things competent\",\"pickthall\":\"Say: O Allah! Owner of Sovereignty! Thou givest sovereignty unto whom Thou wilt, and Thou withdrawest sovereignty from whom Thou wilt. Thou exaltest whom Thou wilt, and Thou abasest whom Thou wilt. In Thy hand is the good. Lo! Thou art Able to do all things\"},{\"a\":27,\"w\":[\"تُولِجُ\",\"ٱلَّيۡلَ\",\"فِي\",\"ٱلنَّهَارِ\",\"وَتُولِجُ\",\"ٱلنَّهَارَ\",\"فِي\",\"ٱلَّيۡلِۖ\",\"وَتُخۡرِجُ\",\"ٱلۡحَيَّ\",\"مِنَ\",\"ٱلۡمَيِّتِ\",\"وَتُخۡرِجُ\",\"ٱلۡمَيِّتَ\",\"مِنَ\",\"ٱلۡحَيِّۖ\",\"وَتَرۡزُقُ\",\"مَن\",\"تَشَآءُ\",\"بِغَيۡرِ\",\"حِسَابٖ\"],\"t\":\"You cause the night to enter the day, and You cause the day to enter the night; and You bring the living out of the dead, and You bring the dead out of the living. And You give provision to whom You will without account\",\"pickthall\":\"Thou causest the night to pass into the day, and Thou causest the day to pass into the night. And Thou bringest forth the living from the dead, and Thou bringest forth the dead from the living. And Thou givest sustenance to whom Thou choosest, without stint\"},{\"a\":28,\"w\":[\"لَّا\",\"يَتَّخِذِ\",\"ٱلۡمُؤۡمِنُونَ\",\"ٱلۡكَٰفِرِينَ\",\"أَوۡلِيَآءَ\",\"مِن\",\"دُونِ\",\"ٱلۡمُؤۡمِنِينَۖ\",\"وَمَن\",\"يَفۡعَلۡ\",\"ذَٰلِكَ\",\"فَلَيۡسَ\",\"مِنَ\",\"ٱللَّهِ\",\"فِي\",\"شَيۡءٍ\",\"إِلَّآ\",\"أَن\",\"تَتَّقُواْ\",\"مِنۡهُمۡ\",\"تُقَىٰةٗۗ\",\"وَيُحَذِّرُكُمُ\",\"ٱللَّهُ\",\"نَفۡسَهُۥۗ\",\"وَإِلَى\",\"ٱللَّهِ\",\"ٱلۡمَصِيرُ\"],\"t\":\"Let not believers take disbelievers as allies rather than believers. And whoever [of you] does that has nothing with Allah, except when taking precaution against them in prudence. And Allah warns you of Himself, and to Allah is the [final] destination\",\"pickthall\":\"Let not the believers take disbelievers for their friends in preference to believers. Whoso doeth that hath no connection with Allah unless (it be) that ye but guard yourselves against them, taking (as it were) security. Allah biddeth you beware (only) of Himself. Unto Allah is the journeying\"},{\"a\":29,\"w\":[\"قُلۡ\",\"إِن\",\"تُخۡفُواْ\",\"مَا\",\"فِي\",\"صُدُورِكُمۡ\",\"أَوۡ\",\"تُبۡدُوهُ\",\"يَعۡلَمۡهُ\",\"ٱللَّهُۗ\",\"وَيَعۡلَمُ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَمَا\",\"فِي\",\"ٱلۡأَرۡضِۗ\",\"وَٱللَّهُ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٞ\"],\"t\":\"Say, \\\"Whether you conceal what is in your breasts or reveal it, Allah knows it. And He knows that which is in the heavens and that which is on the earth. And Allah is over all things competent\",\"pickthall\":\"Say, (O Muhammad): Whether ye hide that which is in your breasts or reveal it, Allah knoweth it. He knoweth that which is in the heavens and that which is in the earth, and Allah is Able to do all things\"},{\"a\":30,\"w\":[\"يَوۡمَ\",\"تَجِدُ\",\"كُلُّ\",\"نَفۡسٖ\",\"مَّا\",\"عَمِلَتۡ\",\"مِنۡ\",\"خَيۡرٖ\",\"مُّحۡضَرٗا\",\"وَمَا\",\"عَمِلَتۡ\",\"مِن\",\"سُوٓءٖ\",\"تَوَدُّ\",\"لَوۡ\",\"أَنَّ\",\"بَيۡنَهَا\",\"وَبَيۡنَهُۥٓ\",\"أَمَدَۢا\",\"بَعِيدٗاۗ\",\"وَيُحَذِّرُكُمُ\",\"ٱللَّهُ\",\"نَفۡسَهُۥۗ\",\"وَٱللَّهُ\",\"رَءُوفُۢ\",\"بِٱلۡعِبَادِ\"],\"t\":\"The Day every soul will find what it has done of good present [before it] and what it has done of evil, it will wish that between itself and that [evil] was a great distance. And Allah warns you of Himself, and Allah is Kind to [His] servants\",\"pickthall\":\"On the Day when every soul will find itself confronted with all that it hath done of good and all that it hath done of evil (every soul) will long that there might be a mighty space of distance between it and that (evil). Allah biddeth you beware of Him. And Allah is Full of Pity for (His) bondmen\"},{\"a\":31,\"w\":[\"قُلۡ\",\"إِن\",\"كُنتُمۡ\",\"تُحِبُّونَ\",\"ٱللَّهَ\",\"فَٱتَّبِعُونِي\",\"يُحۡبِبۡكُمُ\",\"ٱللَّهُ\",\"وَيَغۡفِرۡ\",\"لَكُمۡ\",\"ذُنُوبَكُمۡۚ\",\"وَٱللَّهُ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"Say, [O Muhammad], \\\"If you should love Allah, then follow me, [so] Allah will love you and forgive you your sins. And Allah is Forgiving and Merciful\",\"pickthall\":\"Say, (O Muhammad, to mankind): If ye love Allah, follow me; Allah will love you and forgive you your sins. Allah is Forgiving, Merciful\"},{\"a\":32,\"w\":[\"قُلۡ\",\"أَطِيعُواْ\",\"ٱللَّهَ\",\"وَٱلرَّسُولَۖ\",\"فَإِن\",\"تَوَلَّوۡاْ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"لَا\",\"يُحِبُّ\",\"ٱلۡكَٰفِرِينَ\"],\"t\":\"Say, \\\"Obey Allah and the Messenger.\\\" But if they turn away - then indeed, Allah does not like the disbelievers\",\"pickthall\":\"Say: Obey Allah and the messenger. But if they turn away, lo! Allah loveth not the disbelievers (in His guidance)\"},{\"a\":33,\"w\":[\"۞إِنَّ\",\"ٱللَّهَ\",\"ٱصۡطَفَىٰٓ\",\"ءَادَمَ\",\"وَنُوحٗا\",\"وَءَالَ\",\"إِبۡرَٰهِيمَ\",\"وَءَالَ\",\"عِمۡرَٰنَ\",\"عَلَى\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"Indeed, Allah chose Adam and Noah and the family of Abraham and the family of 'Imran over the worlds\",\"pickthall\":\"Lo! Allah preferred Adam and Noah and the Family of Abraham and the Family of 'Imran above (all His) creatures\"},{\"a\":34,\"w\":[\"ذُرِّيَّةَۢ\",\"بَعۡضُهَا\",\"مِنۢ\",\"بَعۡضٖۗ\",\"وَٱللَّهُ\",\"سَمِيعٌ\",\"عَلِيمٌ\"],\"t\":\"Descendants, some of them from others. And Allah is Hearing and Knowing\",\"pickthall\":\"They were descendants one of another. Allah is Hearer, Knower\"},{\"a\":35,\"w\":[\"إِذۡ\",\"قَالَتِ\",\"ٱمۡرَأَتُ\",\"عِمۡرَٰنَ\",\"رَبِّ\",\"إِنِّي\",\"نَذَرۡتُ\",\"لَكَ\",\"مَا\",\"فِي\",\"بَطۡنِي\",\"مُحَرَّرٗا\",\"فَتَقَبَّلۡ\",\"مِنِّيٓۖ\",\"إِنَّكَ\",\"أَنتَ\",\"ٱلسَّمِيعُ\",\"ٱلۡعَلِيمُ\"],\"t\":\"[Mention, O Muhammad], when the wife of 'Imran said, \\\"My Lord, indeed I have pledged to You what is in my womb, consecrated [for Your service], so accept this from me. Indeed, You are the Hearing, the Knowing\",\"pickthall\":\"(Remember) when the wife of 'Imran said: My Lord! I have vowed unto Thee that which is in my belly as a consecrated (offering). Accept it from me. Lo! Thou, only Thou, art the Hearer, the Knower\"},{\"a\":36,\"w\":[\"فَلَمَّا\",\"وَضَعَتۡهَا\",\"قَالَتۡ\",\"رَبِّ\",\"إِنِّي\",\"وَضَعۡتُهَآ\",\"أُنثَىٰ\",\"وَٱللَّهُ\",\"أَعۡلَمُ\",\"بِمَا\",\"وَضَعَتۡ\",\"وَلَيۡسَ\",\"ٱلذَّكَرُ\",\"كَٱلۡأُنثَىٰۖ\",\"وَإِنِّي\",\"سَمَّيۡتُهَا\",\"مَرۡيَمَ\",\"وَإِنِّيٓ\",\"أُعِيذُهَا\",\"بِكَ\",\"وَذُرِّيَّتَهَا\",\"مِنَ\",\"ٱلشَّيۡطَٰنِ\",\"ٱلرَّجِيمِ\"],\"t\":\"But when she delivered her, she said, \\\"My Lord, I have delivered a female.\\\" And Allah was most knowing of what she delivered, \\\"And the male is not like the female. And I have named her Mary, and I seek refuge for her in You and [for] her descendants from Satan, the expelled [from the mercy of Allah]\",\"pickthall\":\"And when she was delivered she said: My Lord! Lo! I am delivered of a female - Allah knew best of what she was delivered - the male is not as the female; and lo! I have named her Mary, and lo! I crave Thy protection for her and for her offspring from Satan the outcast\"},{\"a\":37,\"w\":[\"فَتَقَبَّلَهَا\",\"رَبُّهَا\",\"بِقَبُولٍ\",\"حَسَنٖ\",\"وَأَنۢبَتَهَا\",\"نَبَاتًا\",\"حَسَنٗا\",\"وَكَفَّلَهَا\",\"زَكَرِيَّاۖ\",\"كُلَّمَا\",\"دَخَلَ\",\"عَلَيۡهَا\",\"زَكَرِيَّا\",\"ٱلۡمِحۡرَابَ\",\"وَجَدَ\",\"عِندَهَا\",\"رِزۡقٗاۖ\",\"قَالَ\",\"يَٰمَرۡيَمُ\",\"أَنَّىٰ\",\"لَكِ\",\"هَٰذَاۖ\",\"قَالَتۡ\",\"هُوَ\",\"مِنۡ\",\"عِندِ\",\"ٱللَّهِۖ\",\"إِنَّ\",\"ٱللَّهَ\",\"يَرۡزُقُ\",\"مَن\",\"يَشَآءُ\",\"بِغَيۡرِ\",\"حِسَابٍ\"],\"t\":\"So her Lord accepted her with good acceptance and caused her to grow in a good manner and put her in the care of Zechariah. Every time Zechariah entered upon her in the prayer chamber, he found with her provision. He said, \\\"O Mary, from where is this [coming] to you?\\\" She said, \\\"It is from Allah. Indeed, Allah provides for whom He wills without account\",\"pickthall\":\"And her Lord accepted her with full acceptance and vouchsafed to her a goodly growth; and made Zachariah her guardian. Whenever Zachariah went into the sanctuary where she was, he found that she had food. He said: O Mary! Whence cometh unto thee this (food)? She answered: It is from Allah. Allah giveth without stint to whom He will\"},{\"a\":38,\"w\":[\"هُنَالِكَ\",\"دَعَا\",\"زَكَرِيَّا\",\"رَبَّهُۥۖ\",\"قَالَ\",\"رَبِّ\",\"هَبۡ\",\"لِي\",\"مِن\",\"لَّدُنكَ\",\"ذُرِّيَّةٗ\",\"طَيِّبَةًۖ\",\"إِنَّكَ\",\"سَمِيعُ\",\"ٱلدُّعَآءِ\"],\"t\":\"At that, Zechariah called upon his Lord, saying, \\\"My Lord, grant me from Yourself a good offspring. Indeed, You are the Hearer of supplication\",\"pickthall\":\"Then Zachariah prayed unto his Lord and said: My Lord! Bestow upon me of Thy bounty goodly offspring. Lo! Thou art the Hearer of Prayer\"},{\"a\":39,\"w\":[\"فَنَادَتۡهُ\",\"ٱلۡمَلَـٰٓئِكَةُ\",\"وَهُوَ\",\"قَآئِمٞ\",\"يُصَلِّي\",\"فِي\",\"ٱلۡمِحۡرَابِ\",\"أَنَّ\",\"ٱللَّهَ\",\"يُبَشِّرُكَ\",\"بِيَحۡيَىٰ\",\"مُصَدِّقَۢا\",\"بِكَلِمَةٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَسَيِّدٗا\",\"وَحَصُورٗا\",\"وَنَبِيّٗا\",\"مِّنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"So the angels called him while he was standing in prayer in the chamber, \\\"Indeed, Allah gives you good tidings of John, confirming a word from Allah and [who will be] honorable, abstaining [from women], and a prophet from among the righteous\",\"pickthall\":\"And the angels called to him as he stood praying in the sanctuary: Allah giveth thee glad tidings of (a son whose name is) John, (who cometh) to confirm a word from Allah lordly, chaste, a prophet of the righteous\"},{\"a\":40,\"w\":[\"قَالَ\",\"رَبِّ\",\"أَنَّىٰ\",\"يَكُونُ\",\"لِي\",\"غُلَٰمٞ\",\"وَقَدۡ\",\"بَلَغَنِيَ\",\"ٱلۡكِبَرُ\",\"وَٱمۡرَأَتِي\",\"عَاقِرٞۖ\",\"قَالَ\",\"كَذَٰلِكَ\",\"ٱللَّهُ\",\"يَفۡعَلُ\",\"مَا\",\"يَشَآءُ\"],\"t\":\"He said, \\\"My Lord, how will I have a boy when I have reached old age and my wife is barren?\\\" The angel said, \\\"Such is Allah; He does what He wills\",\"pickthall\":\"He said: My Lord! How can I have a son when age hath overtaken me already and my wife is barren? (The angel) answered: So (it will be). Allah doeth what He will\"},{\"a\":41,\"w\":[\"قَالَ\",\"رَبِّ\",\"ٱجۡعَل\",\"لِّيٓ\",\"ءَايَةٗۖ\",\"قَالَ\",\"ءَايَتُكَ\",\"أَلَّا\",\"تُكَلِّمَ\",\"ٱلنَّاسَ\",\"ثَلَٰثَةَ\",\"أَيَّامٍ\",\"إِلَّا\",\"رَمۡزٗاۗ\",\"وَٱذۡكُر\",\"رَّبَّكَ\",\"كَثِيرٗا\",\"وَسَبِّحۡ\",\"بِٱلۡعَشِيِّ\",\"وَٱلۡإِبۡكَٰرِ\"],\"t\":\"He said, \\\"My Lord, make for me a sign.\\\" He Said, \\\"Your sign is that you will not [be able to] speak to the people for three days except by gesture. And remember your Lord much and exalt [Him with praise] in the evening and the morning\",\"pickthall\":\"He said: My Lord! Appoint a token for me. (The angel) said: The token unto thee (shall be) that thou shalt not speak unto mankind three days except by signs. Remember thy Lord much, and praise (Him) in the early hours of night and morning\"},{\"a\":42,\"w\":[\"وَإِذۡ\",\"قَالَتِ\",\"ٱلۡمَلَـٰٓئِكَةُ\",\"يَٰمَرۡيَمُ\",\"إِنَّ\",\"ٱللَّهَ\",\"ٱصۡطَفَىٰكِ\",\"وَطَهَّرَكِ\",\"وَٱصۡطَفَىٰكِ\",\"عَلَىٰ\",\"نِسَآءِ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"And [mention] when the angels said, \\\"O Mary, indeed Allah has chosen you and purified you and chosen you above the women of the worlds\",\"pickthall\":\"And when the angels said: O Mary! Lo! Allah hath chosen thee and made thee pure, and hath preferred thee above (all) the women of creation\"},{\"a\":43,\"w\":[\"يَٰمَرۡيَمُ\",\"ٱقۡنُتِي\",\"لِرَبِّكِ\",\"وَٱسۡجُدِي\",\"وَٱرۡكَعِي\",\"مَعَ\",\"ٱلرَّـٰكِعِينَ\"],\"t\":\"O Mary, be devoutly obedient to your Lord and prostrate and bow with those who bow [in prayer]\",\"pickthall\":\"O Mary! Be obedient to thy Lord, prostrate thyself and bow with those who bow (in worship)\"},{\"a\":44,\"w\":[\"ذَٰلِكَ\",\"مِنۡ\",\"أَنۢبَآءِ\",\"ٱلۡغَيۡبِ\",\"نُوحِيهِ\",\"إِلَيۡكَۚ\",\"وَمَا\",\"كُنتَ\",\"لَدَيۡهِمۡ\",\"إِذۡ\",\"يُلۡقُونَ\",\"أَقۡلَٰمَهُمۡ\",\"أَيُّهُمۡ\",\"يَكۡفُلُ\",\"مَرۡيَمَ\",\"وَمَا\",\"كُنتَ\",\"لَدَيۡهِمۡ\",\"إِذۡ\",\"يَخۡتَصِمُونَ\"],\"t\":\"That is from the news of the unseen which We reveal to you, [O Muhammad]. And you were not with them when they cast their pens as to which of them should be responsible for Mary. Nor were you with them when they disputed\",\"pickthall\":\"This is of the tidings of things hidden. We reveal it unto thee (Muhammad). Thou wast not present with them when they threw their pens (to know) which of them should be the guardian of Mary, nor wast thou present with them when they quarrelled (thereupon)\"},{\"a\":45,\"w\":[\"إِذۡ\",\"قَالَتِ\",\"ٱلۡمَلَـٰٓئِكَةُ\",\"يَٰمَرۡيَمُ\",\"إِنَّ\",\"ٱللَّهَ\",\"يُبَشِّرُكِ\",\"بِكَلِمَةٖ\",\"مِّنۡهُ\",\"ٱسۡمُهُ\",\"ٱلۡمَسِيحُ\",\"عِيسَى\",\"ٱبۡنُ\",\"مَرۡيَمَ\",\"وَجِيهٗا\",\"فِي\",\"ٱلدُّنۡيَا\",\"وَٱلۡأٓخِرَةِ\",\"وَمِنَ\",\"ٱلۡمُقَرَّبِينَ\"],\"t\":\"[And mention] when the angels said, \\\"O Mary, indeed Allah gives you good tidings of a word from Him, whose name will be the Messiah, Jesus, the son of Mary - distinguished in this world and the Hereafter and among those brought near [to Allah]\",\"pickthall\":\"(And remember) when the angels said: O Mary! Lo! Allah giveth thee glad tidings of a word from him, whose name is the Messiah, Jesus, son of Mary, illustrious in the world and the Hereafter, and one of those brought near (unto Allah)\"},{\"a\":46,\"w\":[\"وَيُكَلِّمُ\",\"ٱلنَّاسَ\",\"فِي\",\"ٱلۡمَهۡدِ\",\"وَكَهۡلٗا\",\"وَمِنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"He will speak to the people in the cradle and in maturity and will be of the righteous\",\"pickthall\":\"He will speak unto mankind in his cradle and in his manhood, and he is of the righteous\"},{\"a\":47,\"w\":[\"قَالَتۡ\",\"رَبِّ\",\"أَنَّىٰ\",\"يَكُونُ\",\"لِي\",\"وَلَدٞ\",\"وَلَمۡ\",\"يَمۡسَسۡنِي\",\"بَشَرٞۖ\",\"قَالَ\",\"كَذَٰلِكِ\",\"ٱللَّهُ\",\"يَخۡلُقُ\",\"مَا\",\"يَشَآءُۚ\",\"إِذَا\",\"قَضَىٰٓ\",\"أَمۡرٗا\",\"فَإِنَّمَا\",\"يَقُولُ\",\"لَهُۥ\",\"كُن\",\"فَيَكُونُ\"],\"t\":\"She said, \\\"My Lord, how will I have a child when no man has touched me?\\\" [The angel] said, \\\"Such is Allah; He creates what He wills. When He decrees a matter, He only says to it, 'Be,' and it is\",\"pickthall\":\"She said: My Lord! How can I have a child when no mortal hath touched me? He said: So (it will be). Allah createth what He will. If He decreeth a thing, He saith unto it only: Be! and it is\"},{\"a\":48,\"w\":[\"وَيُعَلِّمُهُ\",\"ٱلۡكِتَٰبَ\",\"وَٱلۡحِكۡمَةَ\",\"وَٱلتَّوۡرَىٰةَ\",\"وَٱلۡإِنجِيلَ\"],\"t\":\"And He will teach him writing and wisdom and the Torah and the Gospel\",\"pickthall\":\"And He will teach him the Scripture and wisdom, and the Torah and the Gospel\"},{\"a\":49,\"w\":[\"وَرَسُولًا\",\"إِلَىٰ\",\"بَنِيٓ\",\"إِسۡرَـٰٓءِيلَ\",\"أَنِّي\",\"قَدۡ\",\"جِئۡتُكُم\",\"بِـَٔايَةٖ\",\"مِّن\",\"رَّبِّكُمۡ\",\"أَنِّيٓ\",\"أَخۡلُقُ\",\"لَكُم\",\"مِّنَ\",\"ٱلطِّينِ\",\"كَهَيۡـَٔةِ\",\"ٱلطَّيۡرِ\",\"فَأَنفُخُ\",\"فِيهِ\",\"فَيَكُونُ\",\"طَيۡرَۢا\",\"بِإِذۡنِ\",\"ٱللَّهِۖ\",\"وَأُبۡرِئُ\",\"ٱلۡأَكۡمَهَ\",\"وَٱلۡأَبۡرَصَ\",\"وَأُحۡيِ\",\"ٱلۡمَوۡتَىٰ\",\"بِإِذۡنِ\",\"ٱللَّهِۖ\",\"وَأُنَبِّئُكُم\",\"بِمَا\",\"تَأۡكُلُونَ\",\"وَمَا\",\"تَدَّخِرُونَ\",\"فِي\",\"بُيُوتِكُمۡۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَةٗ\",\"لَّكُمۡ\",\"إِن\",\"كُنتُم\",\"مُّؤۡمِنِينَ\"],\"t\":\"And [make him] a messenger to the Children of Israel, [who will say], 'Indeed I have come to you with a sign from your Lord in that I design for you from clay [that which is] like the form of a bird, then I breathe into it and it becomes a bird by permission of Allah. And I cure the blind and the leper, and I give life to the dead - by permission of Allah. And I inform you of what you eat and what you store in your houses. Indeed in that is a sign for you, if you are believers\",\"pickthall\":\"And will make him a messenger unto the Children of Israel, (saying): Lo! I come unto you with a sign from your Lord. Lo! I fashion for you out of clay the likeness of a bird, and I breathe into it and it is a bird, by Allah's leave. I heal him who was born blind, and the leper, and I raise the dead, by Allah's leave. And I announce unto you what ye eat and what ye store up in your houses. Lo! herein verily is a portent for you, if ye are to be believers\"},{\"a\":50,\"w\":[\"وَمُصَدِّقٗا\",\"لِّمَا\",\"بَيۡنَ\",\"يَدَيَّ\",\"مِنَ\",\"ٱلتَّوۡرَىٰةِ\",\"وَلِأُحِلَّ\",\"لَكُم\",\"بَعۡضَ\",\"ٱلَّذِي\",\"حُرِّمَ\",\"عَلَيۡكُمۡۚ\",\"وَجِئۡتُكُم\",\"بِـَٔايَةٖ\",\"مِّن\",\"رَّبِّكُمۡ\",\"فَٱتَّقُواْ\",\"ٱللَّهَ\",\"وَأَطِيعُونِ\"],\"t\":\"And [I have come] confirming what was before me of the Torah and to make lawful for you some of what was forbidden to you. And I have come to you with a sign from your Lord, so fear Allah and obey me\",\"pickthall\":\"And (I come) confirming that which was before me of the Torah, and to make lawful some of that which was forbidden unto you. I come unto you with a sign from your Lord, so keep your duty to Allah and obey me\"},{\"a\":51,\"w\":[\"إِنَّ\",\"ٱللَّهَ\",\"رَبِّي\",\"وَرَبُّكُمۡ\",\"فَٱعۡبُدُوهُۚ\",\"هَٰذَا\",\"صِرَٰطٞ\",\"مُّسۡتَقِيمٞ\"],\"t\":\"Indeed, Allah is my Lord and your Lord, so worship Him. That is the straight path\",\"pickthall\":\"Lo! Allah is my Lord and your Lord, so worship Him. That is a straight path\"},{\"a\":52,\"w\":[\"۞فَلَمَّآ\",\"أَحَسَّ\",\"عِيسَىٰ\",\"مِنۡهُمُ\",\"ٱلۡكُفۡرَ\",\"قَالَ\",\"مَنۡ\",\"أَنصَارِيٓ\",\"إِلَى\",\"ٱللَّهِۖ\",\"قَالَ\",\"ٱلۡحَوَارِيُّونَ\",\"نَحۡنُ\",\"أَنصَارُ\",\"ٱللَّهِ\",\"ءَامَنَّا\",\"بِٱللَّهِ\",\"وَٱشۡهَدۡ\",\"بِأَنَّا\",\"مُسۡلِمُونَ\"],\"t\":\"But when Jesus felt [persistence in] disbelief from them, he said, \\\"Who are my supporters for [the cause of] Allah?\\\" The disciples said, \\\"We are supporters for Allah. We have believed in Allah and testify that we are Muslims [submitting to Him]\",\"pickthall\":\"But when Jesus became conscious of their disbelief, he cried: Who will be my helpers in the cause of Allah? The disciples said: We will be Allah's helpers. We believe in Allah, and bear thou witness that we have surrendered (unto Him)\"},{\"a\":53,\"w\":[\"رَبَّنَآ\",\"ءَامَنَّا\",\"بِمَآ\",\"أَنزَلۡتَ\",\"وَٱتَّبَعۡنَا\",\"ٱلرَّسُولَ\",\"فَٱكۡتُبۡنَا\",\"مَعَ\",\"ٱلشَّـٰهِدِينَ\"],\"t\":\"Our Lord, we have believed in what You revealed and have followed the messenger Jesus, so register us among the witnesses [to truth]\",\"pickthall\":\"Our Lord! We believe in that which Thou hast revealed and we follow him whom Thou hast sent. Enrol us among those who witness (to the truth)\"},{\"a\":54,\"w\":[\"وَمَكَرُواْ\",\"وَمَكَرَ\",\"ٱللَّهُۖ\",\"وَٱللَّهُ\",\"خَيۡرُ\",\"ٱلۡمَٰكِرِينَ\"],\"t\":\"And the disbelievers planned, but Allah planned. And Allah is the best of planners\",\"pickthall\":\"And they (the disbelievers) schemed, and Allah schemed (against them): and Allah is the best of schemers\"},{\"a\":55,\"w\":[\"إِذۡ\",\"قَالَ\",\"ٱللَّهُ\",\"يَٰعِيسَىٰٓ\",\"إِنِّي\",\"مُتَوَفِّيكَ\",\"وَرَافِعُكَ\",\"إِلَيَّ\",\"وَمُطَهِّرُكَ\",\"مِنَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَجَاعِلُ\",\"ٱلَّذِينَ\",\"ٱتَّبَعُوكَ\",\"فَوۡقَ\",\"ٱلَّذِينَ\",\"كَفَرُوٓاْ\",\"إِلَىٰ\",\"يَوۡمِ\",\"ٱلۡقِيَٰمَةِۖ\",\"ثُمَّ\",\"إِلَيَّ\",\"مَرۡجِعُكُمۡ\",\"فَأَحۡكُمُ\",\"بَيۡنَكُمۡ\",\"فِيمَا\",\"كُنتُمۡ\",\"فِيهِ\",\"تَخۡتَلِفُونَ\"],\"t\":\"[Mention] when Allah said, \\\"O Jesus, indeed I will take you and raise you to Myself and purify you from those who disbelieve and make those who follow you [in submission to Allah alone] superior to those who disbelieve until the Day of Resurrection. Then to Me is your return, and I will judge between you concerning that in which you used to differ\",\"pickthall\":\"(And remember) when Allah said: O Jesus! Lo! I am gathering thee and causing thee to ascend unto Me, and am cleansing thee of those who disbelieve and am setting those who follow thee above those who disbelieve until the Day of Resurrection. Then unto Me ye will (all) return, and I shall judge between you as to that wherein ye used to differ\"},{\"a\":56,\"w\":[\"فَأَمَّا\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"فَأُعَذِّبُهُمۡ\",\"عَذَابٗا\",\"شَدِيدٗا\",\"فِي\",\"ٱلدُّنۡيَا\",\"وَٱلۡأٓخِرَةِ\",\"وَمَا\",\"لَهُم\",\"مِّن\",\"نَّـٰصِرِينَ\"],\"t\":\"And as for those who disbelieved, I will punish them with a severe punishment in this world and the Hereafter, and they will have no helpers\",\"pickthall\":\"As for those who disbelieve I shall chastise them with a heavy chastisement in the world and the Hereafter; and they will have no helpers\"},{\"a\":57,\"w\":[\"وَأَمَّا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"فَيُوَفِّيهِمۡ\",\"أُجُورَهُمۡۗ\",\"وَٱللَّهُ\",\"لَا\",\"يُحِبُّ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"But as for those who believed and did righteous deeds, He will give them in full their rewards, and Allah does not like the wrongdoers\",\"pickthall\":\"And as for those who believe and do good works, He will pay them their wages in full. Allah loveth not wrong-doers\"},{\"a\":58,\"w\":[\"ذَٰلِكَ\",\"نَتۡلُوهُ\",\"عَلَيۡكَ\",\"مِنَ\",\"ٱلۡأٓيَٰتِ\",\"وَٱلذِّكۡرِ\",\"ٱلۡحَكِيمِ\"],\"t\":\"This is what We recite to you, [O Muhammad], of [Our] verses and the precise [and wise] message\",\"pickthall\":\"This (which) We recite unto thee is a revelation and a wise reminder\"},{\"a\":59,\"w\":[\"إِنَّ\",\"مَثَلَ\",\"عِيسَىٰ\",\"عِندَ\",\"ٱللَّهِ\",\"كَمَثَلِ\",\"ءَادَمَۖ\",\"خَلَقَهُۥ\",\"مِن\",\"تُرَابٖ\",\"ثُمَّ\",\"قَالَ\",\"لَهُۥ\",\"كُن\",\"فَيَكُونُ\"],\"t\":\"Indeed, the example of Jesus to Allah is like that of Adam. He created Him from dust; then He said to him, \\\"Be,\\\" and he was\",\"pickthall\":\"Lo! the likeness of Jesus with Allah is as the likeness of Adam. He created him of dust, then He said unto him: Be! and he is\"},{\"a\":60,\"w\":[\"ٱلۡحَقُّ\",\"مِن\",\"رَّبِّكَ\",\"فَلَا\",\"تَكُن\",\"مِّنَ\",\"ٱلۡمُمۡتَرِينَ\"],\"t\":\"The truth is from your Lord, so do not be among the doubters\",\"pickthall\":\"(This is) the truth from thy Lord (O Muhammad), so be not thou of those who waver\"},{\"a\":61,\"w\":[\"فَمَنۡ\",\"حَآجَّكَ\",\"فِيهِ\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"جَآءَكَ\",\"مِنَ\",\"ٱلۡعِلۡمِ\",\"فَقُلۡ\",\"تَعَالَوۡاْ\",\"نَدۡعُ\",\"أَبۡنَآءَنَا\",\"وَأَبۡنَآءَكُمۡ\",\"وَنِسَآءَنَا\",\"وَنِسَآءَكُمۡ\",\"وَأَنفُسَنَا\",\"وَأَنفُسَكُمۡ\",\"ثُمَّ\",\"نَبۡتَهِلۡ\",\"فَنَجۡعَل\",\"لَّعۡنَتَ\",\"ٱللَّهِ\",\"عَلَى\",\"ٱلۡكَٰذِبِينَ\"],\"t\":\"Then whoever argues with you about it after [this] knowledge has come to you - say, \\\"Come, let us call our sons and your sons, our women and your women, ourselves and yourselves, then supplicate earnestly [together] and invoke the curse of Allah upon the liars [among us]\",\"pickthall\":\"And whoso disputeth with thee concerning him, after the knowledge which hath come unto thee, say (unto him): Come! We will summon our sons and your sons, and our women and your women, and ourselves and yourselves, then we will pray humbly (to our Lord) and (solemnly) invoke the curse of Allah upon those who lie\"},{\"a\":62,\"w\":[\"إِنَّ\",\"هَٰذَا\",\"لَهُوَ\",\"ٱلۡقَصَصُ\",\"ٱلۡحَقُّۚ\",\"وَمَا\",\"مِنۡ\",\"إِلَٰهٍ\",\"إِلَّا\",\"ٱللَّهُۚ\",\"وَإِنَّ\",\"ٱللَّهَ\",\"لَهُوَ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"Indeed, this is the true narration. And there is no deity except Allah. And indeed, Allah is the Exalted in Might, the Wise\",\"pickthall\":\"Lo! This verily is the true narrative. There is no Allah save Allah, and lo! Allah, He verily is, is the Mighty, the Wise\"},{\"a\":63,\"w\":[\"فَإِن\",\"تَوَلَّوۡاْ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"عَلِيمُۢ\",\"بِٱلۡمُفۡسِدِينَ\"],\"t\":\"But if they turn away, then indeed - Allah is Knowing of the corrupters\",\"pickthall\":\"And if they turn away, then lo! Allah is Aware of (who are) the corrupters\"},{\"a\":64,\"w\":[\"قُلۡ\",\"يَـٰٓأَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"تَعَالَوۡاْ\",\"إِلَىٰ\",\"كَلِمَةٖ\",\"سَوَآءِۭ\",\"بَيۡنَنَا\",\"وَبَيۡنَكُمۡ\",\"أَلَّا\",\"نَعۡبُدَ\",\"إِلَّا\",\"ٱللَّهَ\",\"وَلَا\",\"نُشۡرِكَ\",\"بِهِۦ\",\"شَيۡـٔٗا\",\"وَلَا\",\"يَتَّخِذَ\",\"بَعۡضُنَا\",\"بَعۡضًا\",\"أَرۡبَابٗا\",\"مِّن\",\"دُونِ\",\"ٱللَّهِۚ\",\"فَإِن\",\"تَوَلَّوۡاْ\",\"فَقُولُواْ\",\"ٱشۡهَدُواْ\",\"بِأَنَّا\",\"مُسۡلِمُونَ\"],\"t\":\"Say, \\\"O People of the Scripture, come to a word that is equitable between us and you - that we will not worship except Allah and not associate anything with Him and not take one another as lords instead of Allah.\\\" But if they turn away, then say, \\\"Bear witness that we are Muslims [submitting to Him]\",\"pickthall\":\"Say: O People of the Scripture! Come to an agreement between us and you: that we shall worship none but Allah, and that we shall ascribe no partner unto Him, and that none of us shall take others for lords beside Allah. And if they turn away, then say: Bear witness that we are they who have surrendered (unto Him)\"},{\"a\":65,\"w\":[\"يَـٰٓأَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"لِمَ\",\"تُحَآجُّونَ\",\"فِيٓ\",\"إِبۡرَٰهِيمَ\",\"وَمَآ\",\"أُنزِلَتِ\",\"ٱلتَّوۡرَىٰةُ\",\"وَٱلۡإِنجِيلُ\",\"إِلَّا\",\"مِنۢ\",\"بَعۡدِهِۦٓۚ\",\"أَفَلَا\",\"تَعۡقِلُونَ\"],\"t\":\"O People of the Scripture, why do you argue about Abraham while the Torah and the Gospel were not revealed until after him? Then will you not reason\",\"pickthall\":\"O People of the Scripture! Why will ye argue about Abraham, when the Torah and the Gospel were not revealed till after him? Have ye then no sense\"},{\"a\":66,\"w\":[\"هَـٰٓأَنتُمۡ\",\"هَـٰٓؤُلَآءِ\",\"حَٰجَجۡتُمۡ\",\"فِيمَا\",\"لَكُم\",\"بِهِۦ\",\"عِلۡمٞ\",\"فَلِمَ\",\"تُحَآجُّونَ\",\"فِيمَا\",\"لَيۡسَ\",\"لَكُم\",\"بِهِۦ\",\"عِلۡمٞۚ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"وَأَنتُمۡ\",\"لَا\",\"تَعۡلَمُونَ\"],\"t\":\"Here you are - those who have argued about that of which you have [some] knowledge, but why do you argue about that of which you have no knowledge? And Allah knows, while you know not\",\"pickthall\":\"Lo! ye are those who argue about that whereof ye have some knowledge: Why then argue ye concerning that whereof ye have no knowledge? Allah knoweth. Ye know not\"},{\"a\":67,\"w\":[\"مَا\",\"كَانَ\",\"إِبۡرَٰهِيمُ\",\"يَهُودِيّٗا\",\"وَلَا\",\"نَصۡرَانِيّٗا\",\"وَلَٰكِن\",\"كَانَ\",\"حَنِيفٗا\",\"مُّسۡلِمٗا\",\"وَمَا\",\"كَانَ\",\"مِنَ\",\"ٱلۡمُشۡرِكِينَ\"],\"t\":\"Abraham was neither a Jew nor a Christian, but he was one inclining toward truth, a Muslim [submitting to Allah]. And he was not of the polytheists\",\"pickthall\":\"Abraham was not a Jew, nor yet a Christian; but he was an upright man who had surrendered (to Allah), and he was not of the idolaters\"},{\"a\":68,\"w\":[\"إِنَّ\",\"أَوۡلَى\",\"ٱلنَّاسِ\",\"بِإِبۡرَٰهِيمَ\",\"لَلَّذِينَ\",\"ٱتَّبَعُوهُ\",\"وَهَٰذَا\",\"ٱلنَّبِيُّ\",\"وَٱلَّذِينَ\",\"ءَامَنُواْۗ\",\"وَٱللَّهُ\",\"وَلِيُّ\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"Indeed, the most worthy of Abraham among the people are those who followed him [in submission to Allah] and this prophet, and those who believe [in his message]. And Allah is the ally of the believers\",\"pickthall\":\"Lo! those of mankind who have the best claim to Abraham are those who followed him, and this Prophet and those who believe (with him); and Allah is the Protecting Guardian of the believers\"},{\"a\":69,\"w\":[\"وَدَّت\",\"طَّآئِفَةٞ\",\"مِّنۡ\",\"أَهۡلِ\",\"ٱلۡكِتَٰبِ\",\"لَوۡ\",\"يُضِلُّونَكُمۡ\",\"وَمَا\",\"يُضِلُّونَ\",\"إِلَّآ\",\"أَنفُسَهُمۡ\",\"وَمَا\",\"يَشۡعُرُونَ\"],\"t\":\"A faction of the people of the Scripture wish they could mislead you. But they do not mislead except themselves, and they perceive [it] not\",\"pickthall\":\"A party of the People of the Scripture long to make you go astray; and they make none to go astray except themselves, but they perceive not\"},{\"a\":70,\"w\":[\"يَـٰٓأَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"لِمَ\",\"تَكۡفُرُونَ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"وَأَنتُمۡ\",\"تَشۡهَدُونَ\"],\"t\":\"O People of the Scripture, why do you disbelieve in the verses of Allah while you witness [to their truth]\",\"pickthall\":\"O People of the Scripture! Why disbelieve ye in the revelations of Allah, when ye (yourselves) bear witness (to their truth)\"},{\"a\":71,\"w\":[\"يَـٰٓأَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"لِمَ\",\"تَلۡبِسُونَ\",\"ٱلۡحَقَّ\",\"بِٱلۡبَٰطِلِ\",\"وَتَكۡتُمُونَ\",\"ٱلۡحَقَّ\",\"وَأَنتُمۡ\",\"تَعۡلَمُونَ\"],\"t\":\"O People of the Scripture, why do you confuse the truth with falsehood and conceal the truth while you know [it]\",\"pickthall\":\"O People of the Scripture! Why confound ye truth with falsehood and knowingly conceal the truth\"},{\"a\":72,\"w\":[\"وَقَالَت\",\"طَّآئِفَةٞ\",\"مِّنۡ\",\"أَهۡلِ\",\"ٱلۡكِتَٰبِ\",\"ءَامِنُواْ\",\"بِٱلَّذِيٓ\",\"أُنزِلَ\",\"عَلَى\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَجۡهَ\",\"ٱلنَّهَارِ\",\"وَٱكۡفُرُوٓاْ\",\"ءَاخِرَهُۥ\",\"لَعَلَّهُمۡ\",\"يَرۡجِعُونَ\"],\"t\":\"And a faction of the People of the Scripture say [to each other], \\\"Believe in that which was revealed to the believers at the beginning of the day and reject it at its end that perhaps they will abandon their religion\",\"pickthall\":\"And a party of the People of the Scripture say: Believe in that which hath been revealed unto those who believe at the opening of the day, and disbelieve at the end thereof, in order that they may return\"},{\"a\":73,\"w\":[\"وَلَا\",\"تُؤۡمِنُوٓاْ\",\"إِلَّا\",\"لِمَن\",\"تَبِعَ\",\"دِينَكُمۡ\",\"قُلۡ\",\"إِنَّ\",\"ٱلۡهُدَىٰ\",\"هُدَى\",\"ٱللَّهِ\",\"أَن\",\"يُؤۡتَىٰٓ\",\"أَحَدٞ\",\"مِّثۡلَ\",\"مَآ\",\"أُوتِيتُمۡ\",\"أَوۡ\",\"يُحَآجُّوكُمۡ\",\"عِندَ\",\"رَبِّكُمۡۗ\",\"قُلۡ\",\"إِنَّ\",\"ٱلۡفَضۡلَ\",\"بِيَدِ\",\"ٱللَّهِ\",\"يُؤۡتِيهِ\",\"مَن\",\"يَشَآءُۗ\",\"وَٱللَّهُ\",\"وَٰسِعٌ\",\"عَلِيمٞ\"],\"t\":\"And do not trust except those who follow your religion.\\\" Say, \\\"Indeed, the [true] guidance is the guidance of Allah. [Do you fear] lest someone be given [knowledge] like you were given or that they would [thereby] argue with you before your Lord?\\\" Say, \\\"Indeed, [all] bounty is in the hand of Allah - He grants it to whom He wills. And Allah is all-Encompassing and Wise\",\"pickthall\":\"And believe not save in one who followeth your religion - Say (O Muhammad): Lo! the guidance is Allah's Guidance - that anyone is given the like of that which was given unto you or that they may argue with you in the presence of their Lord. Say (O Muhammad): Lo! the bounty is in Allah's hand. He bestoweth it on whom He will. Allah is All-Embracing, All-Knowing\"},{\"a\":74,\"w\":[\"يَخۡتَصُّ\",\"بِرَحۡمَتِهِۦ\",\"مَن\",\"يَشَآءُۗ\",\"وَٱللَّهُ\",\"ذُو\",\"ٱلۡفَضۡلِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"He selects for His mercy whom He wills. And Allah is the possessor of great bounty\",\"pickthall\":\"He selecteth for His mercy whom He will. Allah is of Infinite Bounty\"},{\"a\":75,\"w\":[\"۞وَمِنۡ\",\"أَهۡلِ\",\"ٱلۡكِتَٰبِ\",\"مَنۡ\",\"إِن\",\"تَأۡمَنۡهُ\",\"بِقِنطَارٖ\",\"يُؤَدِّهِۦٓ\",\"إِلَيۡكَ\",\"وَمِنۡهُم\",\"مَّنۡ\",\"إِن\",\"تَأۡمَنۡهُ\",\"بِدِينَارٖ\",\"لَّا\",\"يُؤَدِّهِۦٓ\",\"إِلَيۡكَ\",\"إِلَّا\",\"مَا\",\"دُمۡتَ\",\"عَلَيۡهِ\",\"قَآئِمٗاۗ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَالُواْ\",\"لَيۡسَ\",\"عَلَيۡنَا\",\"فِي\",\"ٱلۡأُمِّيِّـۧنَ\",\"سَبِيلٞ\",\"وَيَقُولُونَ\",\"عَلَى\",\"ٱللَّهِ\",\"ٱلۡكَذِبَ\",\"وَهُمۡ\",\"يَعۡلَمُونَ\"],\"t\":\"And among the People of the Scripture is he who, if you entrust him with a great amount [of wealth], he will return it to you. And among them is he who, if you entrust him with a [single] silver coin, he will not return it to you unless you are constantly standing over him [demanding it]. That is because they say, \\\"There is no blame upon us concerning the unlearned.\\\" And they speak untruth about Allah while they know [it]\",\"pickthall\":\"Among the People of the Scripture there is he who, if thou trust him with a weight of treasure, will return it to thee. And among them there is he who, if thou trust him with a piece of gold, will not return it to thee unless thou keep standing over him. That is because they say: We have no duty to the Gentiles. They speak a lie concerning Allah knowingly\"},{\"a\":76,\"w\":[\"بَلَىٰۚ\",\"مَنۡ\",\"أَوۡفَىٰ\",\"بِعَهۡدِهِۦ\",\"وَٱتَّقَىٰ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"يُحِبُّ\",\"ٱلۡمُتَّقِينَ\"],\"t\":\"But yes, whoever fulfills his commitment and fears Allah - then indeed, Allah loves those who fear Him\",\"pickthall\":\"Nay, but (the chosen of Allah is) he who fulfilleth his pledge and wardeth off (evil); for lo! Allah loveth those who ward off (evil)\"},{\"a\":77,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"يَشۡتَرُونَ\",\"بِعَهۡدِ\",\"ٱللَّهِ\",\"وَأَيۡمَٰنِهِمۡ\",\"ثَمَنٗا\",\"قَلِيلًا\",\"أُوْلَـٰٓئِكَ\",\"لَا\",\"خَلَٰقَ\",\"لَهُمۡ\",\"فِي\",\"ٱلۡأٓخِرَةِ\",\"وَلَا\",\"يُكَلِّمُهُمُ\",\"ٱللَّهُ\",\"وَلَا\",\"يَنظُرُ\",\"إِلَيۡهِمۡ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِ\",\"وَلَا\",\"يُزَكِّيهِمۡ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"Indeed, those who exchange the covenant of Allah and their [own] oaths for a small price will have no share in the Hereafter, and Allah will not speak to them or look at them on the Day of Resurrection, nor will He purify them; and they will have a painful punishment\",\"pickthall\":\"Lo! those who purchase a small gain at the cost of Allah's covenant and their oaths, they have no portion in the Hereafter. Allah will neither speak to them nor look upon them on the Day of Resurrection, nor will He make them grow. Theirs will be a painful doom\"},{\"a\":78,\"w\":[\"وَإِنَّ\",\"مِنۡهُمۡ\",\"لَفَرِيقٗا\",\"يَلۡوُۥنَ\",\"أَلۡسِنَتَهُم\",\"بِٱلۡكِتَٰبِ\",\"لِتَحۡسَبُوهُ\",\"مِنَ\",\"ٱلۡكِتَٰبِ\",\"وَمَا\",\"هُوَ\",\"مِنَ\",\"ٱلۡكِتَٰبِ\",\"وَيَقُولُونَ\",\"هُوَ\",\"مِنۡ\",\"عِندِ\",\"ٱللَّهِ\",\"وَمَا\",\"هُوَ\",\"مِنۡ\",\"عِندِ\",\"ٱللَّهِۖ\",\"وَيَقُولُونَ\",\"عَلَى\",\"ٱللَّهِ\",\"ٱلۡكَذِبَ\",\"وَهُمۡ\",\"يَعۡلَمُونَ\"],\"t\":\"And indeed, there is among them a party who alter the Scripture with their tongues so you may think it is from the Scripture, but it is not from the Scripture. And they say, \\\"This is from Allah,\\\" but it is not from Allah. And they speak untruth about Allah while they know\",\"pickthall\":\"And lo! there is a party of them who distort the Scripture with their tongues, that ye may think that what they say is from the Scripture, when it is not from the Scripture. And they say: It is from Allah, when it is not from Allah; and they speak a lie concerning Allah knowingly\"},{\"a\":79,\"w\":[\"مَا\",\"كَانَ\",\"لِبَشَرٍ\",\"أَن\",\"يُؤۡتِيَهُ\",\"ٱللَّهُ\",\"ٱلۡكِتَٰبَ\",\"وَٱلۡحُكۡمَ\",\"وَٱلنُّبُوَّةَ\",\"ثُمَّ\",\"يَقُولَ\",\"لِلنَّاسِ\",\"كُونُواْ\",\"عِبَادٗا\",\"لِّي\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"وَلَٰكِن\",\"كُونُواْ\",\"رَبَّـٰنِيِّـۧنَ\",\"بِمَا\",\"كُنتُمۡ\",\"تُعَلِّمُونَ\",\"ٱلۡكِتَٰبَ\",\"وَبِمَا\",\"كُنتُمۡ\",\"تَدۡرُسُونَ\"],\"t\":\"It is not for a human [prophet] that Allah should give him the Scripture and authority and prophethood and then he would say to the people, \\\"Be servants to me rather than Allah,\\\" but [instead, he would say], \\\"Be pious scholars of the Lord because of what you have taught of the Scripture and because of what you have studied\",\"pickthall\":\"It is not (possible) for any human being unto whom Allah had given the Scripture and wisdom and the prophethood that he should afterwards have said unto mankind: Be slaves of me instead of Allah; but (what he said was): Be ye faithful servants of the Lord by virtue of your constant teaching of the Scripture and of your constant study thereof\"},{\"a\":80,\"w\":[\"وَلَا\",\"يَأۡمُرَكُمۡ\",\"أَن\",\"تَتَّخِذُواْ\",\"ٱلۡمَلَـٰٓئِكَةَ\",\"وَٱلنَّبِيِّـۧنَ\",\"أَرۡبَابًاۚ\",\"أَيَأۡمُرُكُم\",\"بِٱلۡكُفۡرِ\",\"بَعۡدَ\",\"إِذۡ\",\"أَنتُم\",\"مُّسۡلِمُونَ\"],\"t\":\"Nor could he order you to take the angels and prophets as lords. Would he order you to disbelief after you had been Muslims\",\"pickthall\":\"And he commanded you not that ye should take the angels and the prophets for lords. Would he command you to disbelieve after ye had surrendered (to Allah)\"},{\"a\":81,\"w\":[\"وَإِذۡ\",\"أَخَذَ\",\"ٱللَّهُ\",\"مِيثَٰقَ\",\"ٱلنَّبِيِّـۧنَ\",\"لَمَآ\",\"ءَاتَيۡتُكُم\",\"مِّن\",\"كِتَٰبٖ\",\"وَحِكۡمَةٖ\",\"ثُمَّ\",\"جَآءَكُمۡ\",\"رَسُولٞ\",\"مُّصَدِّقٞ\",\"لِّمَا\",\"مَعَكُمۡ\",\"لَتُؤۡمِنُنَّ\",\"بِهِۦ\",\"وَلَتَنصُرُنَّهُۥۚ\",\"قَالَ\",\"ءَأَقۡرَرۡتُمۡ\",\"وَأَخَذۡتُمۡ\",\"عَلَىٰ\",\"ذَٰلِكُمۡ\",\"إِصۡرِيۖ\",\"قَالُوٓاْ\",\"أَقۡرَرۡنَاۚ\",\"قَالَ\",\"فَٱشۡهَدُواْ\",\"وَأَنَا۠\",\"مَعَكُم\",\"مِّنَ\",\"ٱلشَّـٰهِدِينَ\"],\"t\":\"And [recall, O People of the Scripture], when Allah took the covenant of the prophets, [saying], \\\"Whatever I give you of the Scripture and wisdom and then there comes to you a messenger confirming what is with you, you [must] believe in him and support him.\\\" [Allah] said, \\\"Have you acknowledged and taken upon that My commitment?\\\" They said, \\\"We have acknowledged it.\\\" He said, \\\"Then bear witness, and I am with you among the witnesses\",\"pickthall\":\"When Allah made (His) covenant with the prophets, (He said): Behold that which I have given you of the Scripture and knowledge. And afterward there will come unto you a messenger, confirming that which ye possess. Ye shall believe in him and ye shall help him. He said: Do ye agree, and will ye take up My burden (which I lay upon you) in this (matter)? They answered: We agree. He said: Then bear ye witness. I will be a witness with you\"},{\"a\":82,\"w\":[\"فَمَن\",\"تَوَلَّىٰ\",\"بَعۡدَ\",\"ذَٰلِكَ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡفَٰسِقُونَ\"],\"t\":\"And whoever turned away after that - they were the defiantly disobedient\",\"pickthall\":\"Then whosoever after this shall turn away: they will be miscreants\"},{\"a\":83,\"w\":[\"أَفَغَيۡرَ\",\"دِينِ\",\"ٱللَّهِ\",\"يَبۡغُونَ\",\"وَلَهُۥٓ\",\"أَسۡلَمَ\",\"مَن\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"طَوۡعٗا\",\"وَكَرۡهٗا\",\"وَإِلَيۡهِ\",\"يُرۡجَعُونَ\"],\"t\":\"So is it other than the religion of Allah they desire, while to Him have submitted [all] those within the heavens and earth, willingly or by compulsion, and to Him they will be returned\",\"pickthall\":\"Seek they other than the religion of Allah, when unto Him submitteth whosoever is in the heavens and the earth, willingly or unwillingly, and unto Him they will be returned\"},{\"a\":84,\"w\":[\"قُلۡ\",\"ءَامَنَّا\",\"بِٱللَّهِ\",\"وَمَآ\",\"أُنزِلَ\",\"عَلَيۡنَا\",\"وَمَآ\",\"أُنزِلَ\",\"عَلَىٰٓ\",\"إِبۡرَٰهِيمَ\",\"وَإِسۡمَٰعِيلَ\",\"وَإِسۡحَٰقَ\",\"وَيَعۡقُوبَ\",\"وَٱلۡأَسۡبَاطِ\",\"وَمَآ\",\"أُوتِيَ\",\"مُوسَىٰ\",\"وَعِيسَىٰ\",\"وَٱلنَّبِيُّونَ\",\"مِن\",\"رَّبِّهِمۡ\",\"لَا\",\"نُفَرِّقُ\",\"بَيۡنَ\",\"أَحَدٖ\",\"مِّنۡهُمۡ\",\"وَنَحۡنُ\",\"لَهُۥ\",\"مُسۡلِمُونَ\"],\"t\":\"Say, \\\"We have believed in Allah and in what was revealed to us and what was revealed to Abraham, Ishmael, Isaac, Jacob, and the Descendants, and in what was given to Moses and Jesus and to the prophets from their Lord. We make no distinction between any of them, and we are Muslims [submitting] to Him\",\"pickthall\":\"Say (O Muhammad): We believe in Allah and that which is revealed unto us and that which was revealed unto Abraham and Ishmael and Isaac and Jacob and the tribes, and that which was vouchsafed unto Moses and Jesus and the prophets from their Lord. We make no distinction between any of them, and unto Him we have surrendered\"},{\"a\":85,\"w\":[\"وَمَن\",\"يَبۡتَغِ\",\"غَيۡرَ\",\"ٱلۡإِسۡلَٰمِ\",\"دِينٗا\",\"فَلَن\",\"يُقۡبَلَ\",\"مِنۡهُ\",\"وَهُوَ\",\"فِي\",\"ٱلۡأٓخِرَةِ\",\"مِنَ\",\"ٱلۡخَٰسِرِينَ\"],\"t\":\"And whoever desires other than Islam as religion - never will it be accepted from him, and he, in the Hereafter, will be among the losers\",\"pickthall\":\"And whoso seeketh as religion other than the Surrender (to Allah) it will not be accepted from him, and he will be a loser in the Hereafter\"},{\"a\":86,\"w\":[\"كَيۡفَ\",\"يَهۡدِي\",\"ٱللَّهُ\",\"قَوۡمٗا\",\"كَفَرُواْ\",\"بَعۡدَ\",\"إِيمَٰنِهِمۡ\",\"وَشَهِدُوٓاْ\",\"أَنَّ\",\"ٱلرَّسُولَ\",\"حَقّٞ\",\"وَجَآءَهُمُ\",\"ٱلۡبَيِّنَٰتُۚ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"How shall Allah guide a people who disbelieved after their belief and had witnessed that the Messenger is true and clear signs had come to them? And Allah does not guide the wrongdoing people\",\"pickthall\":\"How shall Allah guide a people who disbelieved after their belief and (after) they bore witness that the messenger is true and after clear proofs (of Allah's Sovereignty) had come unto them. And Allah guideth not wrongdoing folk\"},{\"a\":87,\"w\":[\"أُوْلَـٰٓئِكَ\",\"جَزَآؤُهُمۡ\",\"أَنَّ\",\"عَلَيۡهِمۡ\",\"لَعۡنَةَ\",\"ٱللَّهِ\",\"وَٱلۡمَلَـٰٓئِكَةِ\",\"وَٱلنَّاسِ\",\"أَجۡمَعِينَ\"],\"t\":\"Those - their recompense will be that upon them is the curse of Allah and the angels and the people, all together\",\"pickthall\":\"As for such, their guerdon is that on them rests the curse of Allah and of angels and of men combined\"},{\"a\":88,\"w\":[\"خَٰلِدِينَ\",\"فِيهَا\",\"لَا\",\"يُخَفَّفُ\",\"عَنۡهُمُ\",\"ٱلۡعَذَابُ\",\"وَلَا\",\"هُمۡ\",\"يُنظَرُونَ\"],\"t\":\"Abiding eternally therein. The punishment will not be lightened for them, nor will they be reprieved\",\"pickthall\":\"They will abide therein. Their doom will not be lightened, neither will they be reprieved\"},{\"a\":89,\"w\":[\"إِلَّا\",\"ٱلَّذِينَ\",\"تَابُواْ\",\"مِنۢ\",\"بَعۡدِ\",\"ذَٰلِكَ\",\"وَأَصۡلَحُواْ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"غَفُورٞ\",\"رَّحِيمٌ\"],\"t\":\"Except for those who repent after that and correct themselves. For indeed, Allah is Forgiving and Merciful\",\"pickthall\":\"Save those who afterward repent and do right. Lo! Allah is Forgiving, Merciful\"},{\"a\":90,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"بَعۡدَ\",\"إِيمَٰنِهِمۡ\",\"ثُمَّ\",\"ٱزۡدَادُواْ\",\"كُفۡرٗا\",\"لَّن\",\"تُقۡبَلَ\",\"تَوۡبَتُهُمۡ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلضَّآلُّونَ\"],\"t\":\"Indeed, those who reject the message after their belief and then increase in disbelief - never will their [claimed] repentance be accepted, and they are the ones astray\",\"pickthall\":\"Lo! those who disbelieve after their (profession of) belief, and afterward grow violent in disbelief: their repentance will not be accepted. And such are those who are astray\"},{\"a\":91,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَمَاتُواْ\",\"وَهُمۡ\",\"كُفَّارٞ\",\"فَلَن\",\"يُقۡبَلَ\",\"مِنۡ\",\"أَحَدِهِم\",\"مِّلۡءُ\",\"ٱلۡأَرۡضِ\",\"ذَهَبٗا\",\"وَلَوِ\",\"ٱفۡتَدَىٰ\",\"بِهِۦٓۗ\",\"أُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\",\"وَمَا\",\"لَهُم\",\"مِّن\",\"نَّـٰصِرِينَ\"],\"t\":\"Indeed, those who disbelieve and die while they are disbelievers - never would the [whole] capacity of the earth in gold be accepted from one of them if he would [seek to] ransom himself with it. For those there will be a painful punishment, and they will have no helpers\",\"pickthall\":\"Lo! those who disbelieve, and die in disbelief, the (whole) earth full of gold would not be accepted from such an one if it were offered as a ransom (for his soul). Theirs will be a painful doom and they will have no helpers\"},{\"a\":92,\"w\":[\"لَن\",\"تَنَالُواْ\",\"ٱلۡبِرَّ\",\"حَتَّىٰ\",\"تُنفِقُواْ\",\"مِمَّا\",\"تُحِبُّونَۚ\",\"وَمَا\",\"تُنفِقُواْ\",\"مِن\",\"شَيۡءٖ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"بِهِۦ\",\"عَلِيمٞ\"],\"t\":\"Never will you attain the good [reward] until you spend [in the way of Allah] from that which you love. And whatever you spend - indeed, Allah is Knowing of it\",\"pickthall\":\"Ye will not attain unto piety until ye spend of that which ye love. And whatsoever ye spend, Allah is Aware thereof\"},{\"a\":93,\"w\":[\"۞كُلُّ\",\"ٱلطَّعَامِ\",\"كَانَ\",\"حِلّٗا\",\"لِّبَنِيٓ\",\"إِسۡرَـٰٓءِيلَ\",\"إِلَّا\",\"مَا\",\"حَرَّمَ\",\"إِسۡرَـٰٓءِيلُ\",\"عَلَىٰ\",\"نَفۡسِهِۦ\",\"مِن\",\"قَبۡلِ\",\"أَن\",\"تُنَزَّلَ\",\"ٱلتَّوۡرَىٰةُۚ\",\"قُلۡ\",\"فَأۡتُواْ\",\"بِٱلتَّوۡرَىٰةِ\",\"فَٱتۡلُوهَآ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"All food was lawful to the Children of Israel except what Israel had made unlawful to himself before the Torah was revealed. Say, [O Muhammad], \\\"So bring the Torah and recite it, if you should be truthful\",\"pickthall\":\"All food was lawful unto the Children of Israel, save that which Israel forbade himself, (in days) before the Torah was revealed. Say: Produce the Torah and read it (unto us) if ye are truthful\"},{\"a\":94,\"w\":[\"فَمَنِ\",\"ٱفۡتَرَىٰ\",\"عَلَى\",\"ٱللَّهِ\",\"ٱلۡكَذِبَ\",\"مِنۢ\",\"بَعۡدِ\",\"ذَٰلِكَ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلظَّـٰلِمُونَ\"],\"t\":\"And whoever invents about Allah untruth after that - then those are [truly] the wrongdoers\",\"pickthall\":\"And whoever shall invent a falsehood after that concerning Allah, such will be wrong-doers\"},{\"a\":95,\"w\":[\"قُلۡ\",\"صَدَقَ\",\"ٱللَّهُۗ\",\"فَٱتَّبِعُواْ\",\"مِلَّةَ\",\"إِبۡرَٰهِيمَ\",\"حَنِيفٗاۖ\",\"وَمَا\",\"كَانَ\",\"مِنَ\",\"ٱلۡمُشۡرِكِينَ\"],\"t\":\"Say, \\\"Allah has told the truth. So follow the religion of Abraham, inclining toward truth; and he was not of the polytheists\",\"pickthall\":\"Say: Allah speaketh truth. So follow the religion of Abraham, the upright. He was not of the idolaters\"},{\"a\":96,\"w\":[\"إِنَّ\",\"أَوَّلَ\",\"بَيۡتٖ\",\"وُضِعَ\",\"لِلنَّاسِ\",\"لَلَّذِي\",\"بِبَكَّةَ\",\"مُبَارَكٗا\",\"وَهُدٗى\",\"لِّلۡعَٰلَمِينَ\"],\"t\":\"Indeed, the first House [of worship] established for mankind was that at Makkah - blessed and a guidance for the worlds\",\"pickthall\":\"Lo! the first Sanctuary appointed for mankind was that at Becca, a blessed place, a guidance to the peoples\"},{\"a\":97,\"w\":[\"فِيهِ\",\"ءَايَٰتُۢ\",\"بَيِّنَٰتٞ\",\"مَّقَامُ\",\"إِبۡرَٰهِيمَۖ\",\"وَمَن\",\"دَخَلَهُۥ\",\"كَانَ\",\"ءَامِنٗاۗ\",\"وَلِلَّهِ\",\"عَلَى\",\"ٱلنَّاسِ\",\"حِجُّ\",\"ٱلۡبَيۡتِ\",\"مَنِ\",\"ٱسۡتَطَاعَ\",\"إِلَيۡهِ\",\"سَبِيلٗاۚ\",\"وَمَن\",\"كَفَرَ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"غَنِيٌّ\",\"عَنِ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"In it are clear signs [such as] the standing place of Abraham. And whoever enters it shall be safe. And [due] to Allah from the people is a pilgrimage to the House - for whoever is able to find thereto a way. But whoever disbelieves - then indeed, Allah is free from need of the worlds\",\"pickthall\":\"Wherein are plain memorials (of Allah's guidance); the place where Abraham stood up to pray; and whosoever entereth it is safe. And pilgrimage to the House is a duty unto Allah for mankind, for him who can find a way thither. As for him who disbelieveth, (let him know that) lo! Allah is Independent of (all) creatures\"},{\"a\":98,\"w\":[\"قُلۡ\",\"يَـٰٓأَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"لِمَ\",\"تَكۡفُرُونَ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"وَٱللَّهُ\",\"شَهِيدٌ\",\"عَلَىٰ\",\"مَا\",\"تَعۡمَلُونَ\"],\"t\":\"Say, \\\"O People of the Scripture, why do you disbelieve in the verses of Allah while Allah is Witness over what you do\",\"pickthall\":\"Say: O People of the Scripture! Why disbelieve ye in the revelations of Allah, when Allah (Himself) is Witness of what ye do\"},{\"a\":99,\"w\":[\"قُلۡ\",\"يَـٰٓأَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"لِمَ\",\"تَصُدُّونَ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِ\",\"مَنۡ\",\"ءَامَنَ\",\"تَبۡغُونَهَا\",\"عِوَجٗا\",\"وَأَنتُمۡ\",\"شُهَدَآءُۗ\",\"وَمَا\",\"ٱللَّهُ\",\"بِغَٰفِلٍ\",\"عَمَّا\",\"تَعۡمَلُونَ\"],\"t\":\"Say, \\\"O People of the Scripture, why do you avert from the way of Allah those who believe, seeking to make it [seem] deviant, while you are witnesses [to the truth]? And Allah is not unaware of what you do\",\"pickthall\":\"Say: O People of the Scripture! Why drive ye back believers from the way of Allah, seeking to make it crooked, when ye are witnesses (to Allah's guidance)? Allah is not unaware of what ye do\"},{\"a\":100,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِن\",\"تُطِيعُواْ\",\"فَرِيقٗا\",\"مِّنَ\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"يَرُدُّوكُم\",\"بَعۡدَ\",\"إِيمَٰنِكُمۡ\",\"كَٰفِرِينَ\"],\"t\":\"O you who have believed, if you obey a party of those who were given the Scripture, they would turn you back, after your belief, [to being] unbelievers\",\"pickthall\":\"O ye who believe! If ye obey a party of those who have received the Scripture they will make you disbelievers after your belief\"},{\"a\":101,\"w\":[\"وَكَيۡفَ\",\"تَكۡفُرُونَ\",\"وَأَنتُمۡ\",\"تُتۡلَىٰ\",\"عَلَيۡكُمۡ\",\"ءَايَٰتُ\",\"ٱللَّهِ\",\"وَفِيكُمۡ\",\"رَسُولُهُۥۗ\",\"وَمَن\",\"يَعۡتَصِم\",\"بِٱللَّهِ\",\"فَقَدۡ\",\"هُدِيَ\",\"إِلَىٰ\",\"صِرَٰطٖ\",\"مُّسۡتَقِيمٖ\"],\"t\":\"And how could you disbelieve while to you are being recited the verses of Allah and among you is His Messenger? And whoever holds firmly to Allah has [indeed] been guided to a straight path\",\"pickthall\":\"How can ye disbelieve, when it is ye unto whom Allah's revelations are recited, and His messenger is in your midst? He who holdeth fast to Allah, he indeed is guided unto a right path\"},{\"a\":102,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّقُواْ\",\"ٱللَّهَ\",\"حَقَّ\",\"تُقَاتِهِۦ\",\"وَلَا\",\"تَمُوتُنَّ\",\"إِلَّا\",\"وَأَنتُم\",\"مُّسۡلِمُونَ\"],\"t\":\"O you who have believed, fear Allah as He should be feared and do not die except as Muslims [in submission to Him]\",\"pickthall\":\"O ye who believe! Observe your duty to Allah with right observance, and die not save as those who have surrendered (unto Him)\"},{\"a\":103,\"w\":[\"وَٱعۡتَصِمُواْ\",\"بِحَبۡلِ\",\"ٱللَّهِ\",\"جَمِيعٗا\",\"وَلَا\",\"تَفَرَّقُواْۚ\",\"وَٱذۡكُرُواْ\",\"نِعۡمَتَ\",\"ٱللَّهِ\",\"عَلَيۡكُمۡ\",\"إِذۡ\",\"كُنتُمۡ\",\"أَعۡدَآءٗ\",\"فَأَلَّفَ\",\"بَيۡنَ\",\"قُلُوبِكُمۡ\",\"فَأَصۡبَحۡتُم\",\"بِنِعۡمَتِهِۦٓ\",\"إِخۡوَٰنٗا\",\"وَكُنتُمۡ\",\"عَلَىٰ\",\"شَفَا\",\"حُفۡرَةٖ\",\"مِّنَ\",\"ٱلنَّارِ\",\"فَأَنقَذَكُم\",\"مِّنۡهَاۗ\",\"كَذَٰلِكَ\",\"يُبَيِّنُ\",\"ٱللَّهُ\",\"لَكُمۡ\",\"ءَايَٰتِهِۦ\",\"لَعَلَّكُمۡ\",\"تَهۡتَدُونَ\"],\"t\":\"And hold firmly to the rope of Allah all together and do not become divided. And remember the favor of Allah upon you - when you were enemies and He brought your hearts together and you became, by His favor, brothers. And you were on the edge of a pit of the Fire, and He saved you from it. Thus does Allah make clear to you His verses that you may be guided\",\"pickthall\":\"And hold fast, all of you together, to the cable of Allah, and do not separate. And remember Allah's favour unto you: How ye were enemies and He made friendship between your hearts so that ye became as brothers by His grace; and (how) ye were upon the brink of an abyss of fire, and He did save you from it. Thus Allah maketh clear His revelations unto you, that haply ye may be guided\"},{\"a\":104,\"w\":[\"وَلۡتَكُن\",\"مِّنكُمۡ\",\"أُمَّةٞ\",\"يَدۡعُونَ\",\"إِلَى\",\"ٱلۡخَيۡرِ\",\"وَيَأۡمُرُونَ\",\"بِٱلۡمَعۡرُوفِ\",\"وَيَنۡهَوۡنَ\",\"عَنِ\",\"ٱلۡمُنكَرِۚ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡمُفۡلِحُونَ\"],\"t\":\"And let there be [arising] from you a nation inviting to [all that is] good, enjoining what is right and forbidding what is wrong, and those will be the successful\",\"pickthall\":\"And there may spring from you a nation who invite to goodness, and enjoin right conduct and forbid indecency. Such are they who are successful\"},{\"a\":105,\"w\":[\"وَلَا\",\"تَكُونُواْ\",\"كَٱلَّذِينَ\",\"تَفَرَّقُواْ\",\"وَٱخۡتَلَفُواْ\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"جَآءَهُمُ\",\"ٱلۡبَيِّنَٰتُۚ\",\"وَأُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"عَذَابٌ\",\"عَظِيمٞ\"],\"t\":\"And do not be like the ones who became divided and differed after the clear proofs had come to them. And those will have a great punishment\",\"pickthall\":\"And be ye not as those who separated and disputed after the clear proofs had come unto them. For such there is an awful doom\"},{\"a\":106,\"w\":[\"يَوۡمَ\",\"تَبۡيَضُّ\",\"وُجُوهٞ\",\"وَتَسۡوَدُّ\",\"وُجُوهٞۚ\",\"فَأَمَّا\",\"ٱلَّذِينَ\",\"ٱسۡوَدَّتۡ\",\"وُجُوهُهُمۡ\",\"أَكَفَرۡتُم\",\"بَعۡدَ\",\"إِيمَٰنِكُمۡ\",\"فَذُوقُواْ\",\"ٱلۡعَذَابَ\",\"بِمَا\",\"كُنتُمۡ\",\"تَكۡفُرُونَ\"],\"t\":\"On the Day [some] faces will turn white and [some] faces will turn black. As for those whose faces turn black, [to them it will be said], \\\"Did you disbelieve after your belief? Then taste the punishment for what you used to reject\",\"pickthall\":\"On the Day when (some) faces will be whitened and (some) faces will be blackened; and as for those whose faces have been blackened, it will be said unto them: Disbelieved ye after your (profession of) belief? Then taste the punishment for that ye disbelieved\"},{\"a\":107,\"w\":[\"وَأَمَّا\",\"ٱلَّذِينَ\",\"ٱبۡيَضَّتۡ\",\"وُجُوهُهُمۡ\",\"فَفِي\",\"رَحۡمَةِ\",\"ٱللَّهِۖ\",\"هُمۡ\",\"فِيهَا\",\"خَٰلِدُونَ\"],\"t\":\"But as for those whose faces will turn white, [they will be] within the mercy of Allah. They will abide therein eternally\",\"pickthall\":\"And as for those whose faces have been whitened, in the mercy of Allah they dwell for ever\"},{\"a\":108,\"w\":[\"تِلۡكَ\",\"ءَايَٰتُ\",\"ٱللَّهِ\",\"نَتۡلُوهَا\",\"عَلَيۡكَ\",\"بِٱلۡحَقِّۗ\",\"وَمَا\",\"ٱللَّهُ\",\"يُرِيدُ\",\"ظُلۡمٗا\",\"لِّلۡعَٰلَمِينَ\"],\"t\":\"These are the verses of Allah. We recite them to you, [O Muhammad], in truth; and Allah wants no injustice to the worlds\",\"pickthall\":\"These are revelations of Allah. We recite them unto thee in truth. Allah willeth no injustice to (His) creatures\"},{\"a\":109,\"w\":[\"وَلِلَّهِ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَمَا\",\"فِي\",\"ٱلۡأَرۡضِۚ\",\"وَإِلَى\",\"ٱللَّهِ\",\"تُرۡجَعُ\",\"ٱلۡأُمُورُ\"],\"t\":\"To Allah belongs whatever is in the heavens and whatever is on the earth. And to Allah will [all] matters be returned\",\"pickthall\":\"Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth; and unto Allah all things are returned\"},{\"a\":110,\"w\":[\"كُنتُمۡ\",\"خَيۡرَ\",\"أُمَّةٍ\",\"أُخۡرِجَتۡ\",\"لِلنَّاسِ\",\"تَأۡمُرُونَ\",\"بِٱلۡمَعۡرُوفِ\",\"وَتَنۡهَوۡنَ\",\"عَنِ\",\"ٱلۡمُنكَرِ\",\"وَتُؤۡمِنُونَ\",\"بِٱللَّهِۗ\",\"وَلَوۡ\",\"ءَامَنَ\",\"أَهۡلُ\",\"ٱلۡكِتَٰبِ\",\"لَكَانَ\",\"خَيۡرٗا\",\"لَّهُمۚ\",\"مِّنۡهُمُ\",\"ٱلۡمُؤۡمِنُونَ\",\"وَأَكۡثَرُهُمُ\",\"ٱلۡفَٰسِقُونَ\"],\"t\":\"You are the best nation produced [as an example] for mankind. You enjoin what is right and forbid what is wrong and believe in Allah. If only the People of the Scripture had believed, it would have been better for them. Among them are believers, but most of them are defiantly disobedient\",\"pickthall\":\"Ye are the best community that hath been raised up for mankind. Ye enjoin right conduct and forbid indecency; and ye believe in Allah. And if the People of the Scripture had believed it had been better for them. Some of them are believers; but most of them are evil-livers\"},{\"a\":111,\"w\":[\"لَن\",\"يَضُرُّوكُمۡ\",\"إِلَّآ\",\"أَذٗىۖ\",\"وَإِن\",\"يُقَٰتِلُوكُمۡ\",\"يُوَلُّوكُمُ\",\"ٱلۡأَدۡبَارَ\",\"ثُمَّ\",\"لَا\",\"يُنصَرُونَ\"],\"t\":\"They will not harm you except for [some] annoyance. And if they fight you, they will show you their backs; then they will not be aided\",\"pickthall\":\"They will not harm you save a trifling hurt, and if they fight against you they will turn and flee. And afterward they will not be helped\"},{\"a\":112,\"w\":[\"ضُرِبَتۡ\",\"عَلَيۡهِمُ\",\"ٱلذِّلَّةُ\",\"أَيۡنَ\",\"مَا\",\"ثُقِفُوٓاْ\",\"إِلَّا\",\"بِحَبۡلٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَحَبۡلٖ\",\"مِّنَ\",\"ٱلنَّاسِ\",\"وَبَآءُو\",\"بِغَضَبٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَضُرِبَتۡ\",\"عَلَيۡهِمُ\",\"ٱلۡمَسۡكَنَةُۚ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"كَانُواْ\",\"يَكۡفُرُونَ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"وَيَقۡتُلُونَ\",\"ٱلۡأَنۢبِيَآءَ\",\"بِغَيۡرِ\",\"حَقّٖۚ\",\"ذَٰلِكَ\",\"بِمَا\",\"عَصَواْ\",\"وَّكَانُواْ\",\"يَعۡتَدُونَ\"],\"t\":\"They have been put under humiliation [by Allah] wherever they are overtaken, except for a covenant from Allah and a rope from the Muslims. And they have drawn upon themselves anger from Allah and have been put under destitution. That is because they disbelieved in the verses of Allah and killed the prophets without right. That is because they disobeyed and [habitually] transgressed\",\"pickthall\":\"Ignominy shall be their portion wheresoever they are found save (where they grasp) a rope from Allah and a rope from men. They have incurred anger from their Lord, and wretchedness is laid upon them. That is because they used to disbelieve the revelations of Allah, and slew the prophets wrongfully. That is because they were rebellious and used to transgress\"},{\"a\":113,\"w\":[\"۞لَيۡسُواْ\",\"سَوَآءٗۗ\",\"مِّنۡ\",\"أَهۡلِ\",\"ٱلۡكِتَٰبِ\",\"أُمَّةٞ\",\"قَآئِمَةٞ\",\"يَتۡلُونَ\",\"ءَايَٰتِ\",\"ٱللَّهِ\",\"ءَانَآءَ\",\"ٱلَّيۡلِ\",\"وَهُمۡ\",\"يَسۡجُدُونَ\"],\"t\":\"They are not [all] the same; among the People of the Scripture is a community standing [in obedience], reciting the verses of Allah during periods of the night and prostrating [in prayer]\",\"pickthall\":\"They are not all alike. Of the People of the Scripture there is a staunch community who recite the revelations of Allah in the night season, falling prostrate (before Him)\"},{\"a\":114,\"w\":[\"يُؤۡمِنُونَ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"وَيَأۡمُرُونَ\",\"بِٱلۡمَعۡرُوفِ\",\"وَيَنۡهَوۡنَ\",\"عَنِ\",\"ٱلۡمُنكَرِ\",\"وَيُسَٰرِعُونَ\",\"فِي\",\"ٱلۡخَيۡرَٰتِۖ\",\"وَأُوْلَـٰٓئِكَ\",\"مِنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"They believe in Allah and the Last Day, and they enjoin what is right and forbid what is wrong and hasten to good deeds. And those are among the righteous\",\"pickthall\":\"They believe in Allah and the Last Day, and enjoin right conduct and forbid indecency, and vie one with another in good works. These are of the righteous\"},{\"a\":115,\"w\":[\"وَمَا\",\"يَفۡعَلُواْ\",\"مِنۡ\",\"خَيۡرٖ\",\"فَلَن\",\"يُكۡفَرُوهُۗ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِٱلۡمُتَّقِينَ\"],\"t\":\"And whatever good they do - never will it be removed from them. And Allah is Knowing of the righteous\",\"pickthall\":\"And whatever good they do, they will not be denied the meed thereof. Allah is Aware of those who ward off (evil)\"},{\"a\":116,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لَن\",\"تُغۡنِيَ\",\"عَنۡهُمۡ\",\"أَمۡوَٰلُهُمۡ\",\"وَلَآ\",\"أَوۡلَٰدُهُم\",\"مِّنَ\",\"ٱللَّهِ\",\"شَيۡـٔٗاۖ\",\"وَأُوْلَـٰٓئِكَ\",\"أَصۡحَٰبُ\",\"ٱلنَّارِۖ\",\"هُمۡ\",\"فِيهَا\",\"خَٰلِدُونَ\"],\"t\":\"Indeed, those who disbelieve - never will their wealth or their children avail them against Allah at all, and those are the companions of the Fire; they will abide therein eternally\",\"pickthall\":\"Lo! the riches and the progeny of those who disbelieve will not avail them aught against Allah; and such are rightful owners of the Fire. They will abide therein\"},{\"a\":117,\"w\":[\"مَثَلُ\",\"مَا\",\"يُنفِقُونَ\",\"فِي\",\"هَٰذِهِ\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَا\",\"كَمَثَلِ\",\"رِيحٖ\",\"فِيهَا\",\"صِرٌّ\",\"أَصَابَتۡ\",\"حَرۡثَ\",\"قَوۡمٖ\",\"ظَلَمُوٓاْ\",\"أَنفُسَهُمۡ\",\"فَأَهۡلَكَتۡهُۚ\",\"وَمَا\",\"ظَلَمَهُمُ\",\"ٱللَّهُ\",\"وَلَٰكِنۡ\",\"أَنفُسَهُمۡ\",\"يَظۡلِمُونَ\"],\"t\":\"The example of what they spend in this worldly life is like that of a wind containing frost which strikes the harvest of a people who have wronged themselves and destroys it. And Allah has not wronged them, but they wrong themselves\",\"pickthall\":\"The likeness of that which they spend in this life of the world is as the likeness of a biting, icy wind which smiteth the harvest of a people who have wronged themselves, and devastateth it. Allah wronged them not, but they do wrong themselves\"},{\"a\":118,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَا\",\"تَتَّخِذُواْ\",\"بِطَانَةٗ\",\"مِّن\",\"دُونِكُمۡ\",\"لَا\",\"يَأۡلُونَكُمۡ\",\"خَبَالٗا\",\"وَدُّواْ\",\"مَا\",\"عَنِتُّمۡ\",\"قَدۡ\",\"بَدَتِ\",\"ٱلۡبَغۡضَآءُ\",\"مِنۡ\",\"أَفۡوَٰهِهِمۡ\",\"وَمَا\",\"تُخۡفِي\",\"صُدُورُهُمۡ\",\"أَكۡبَرُۚ\",\"قَدۡ\",\"بَيَّنَّا\",\"لَكُمُ\",\"ٱلۡأٓيَٰتِۖ\",\"إِن\",\"كُنتُمۡ\",\"تَعۡقِلُونَ\"],\"t\":\"O you who have believed, do not take as intimates those other than yourselves, for they will not spare you [any] ruin. They wish you would have hardship. Hatred has already appeared from their mouths, and what their breasts conceal is greater. We have certainly made clear to you the signs, if you will use reason\",\"pickthall\":\"O ye who believe! Take not for intimates others than your own folk, who would spare no pains to ruin you; they love to hamper you. Hatred is revealed by (the utterance of) their mouths, but that which their breasts hide is greater. We have made plain for you the revelations if ye will understand\"},{\"a\":119,\"w\":[\"هَـٰٓأَنتُمۡ\",\"أُوْلَآءِ\",\"تُحِبُّونَهُمۡ\",\"وَلَا\",\"يُحِبُّونَكُمۡ\",\"وَتُؤۡمِنُونَ\",\"بِٱلۡكِتَٰبِ\",\"كُلِّهِۦ\",\"وَإِذَا\",\"لَقُوكُمۡ\",\"قَالُوٓاْ\",\"ءَامَنَّا\",\"وَإِذَا\",\"خَلَوۡاْ\",\"عَضُّواْ\",\"عَلَيۡكُمُ\",\"ٱلۡأَنَامِلَ\",\"مِنَ\",\"ٱلۡغَيۡظِۚ\",\"قُلۡ\",\"مُوتُواْ\",\"بِغَيۡظِكُمۡۗ\",\"إِنَّ\",\"ٱللَّهَ\",\"عَلِيمُۢ\",\"بِذَاتِ\",\"ٱلصُّدُورِ\"],\"t\":\"Here you are loving them but they are not loving you, while you believe in the Scripture - all of it. And when they meet you, they say, \\\"We believe.\\\" But when they are alone, they bite their fingertips at you in rage. Say, \\\"Die in your rage. Indeed, Allah is Knowing of that within the breasts\",\"pickthall\":\"Lo! ye are those who love them though they love you not, and ye believe in all the Scripture. When they fall in with you they say: We believe; but when they go apart they bite their finger-tips at you, for rage. Say: Perish in your rage! Lo! Allah is Aware of what is hidden in (your) breasts\"},{\"a\":120,\"w\":[\"إِن\",\"تَمۡسَسۡكُمۡ\",\"حَسَنَةٞ\",\"تَسُؤۡهُمۡ\",\"وَإِن\",\"تُصِبۡكُمۡ\",\"سَيِّئَةٞ\",\"يَفۡرَحُواْ\",\"بِهَاۖ\",\"وَإِن\",\"تَصۡبِرُواْ\",\"وَتَتَّقُواْ\",\"لَا\",\"يَضُرُّكُمۡ\",\"كَيۡدُهُمۡ\",\"شَيۡـًٔاۗ\",\"إِنَّ\",\"ٱللَّهَ\",\"بِمَا\",\"يَعۡمَلُونَ\",\"مُحِيطٞ\"],\"t\":\"If good touches you, it distresses them; but if harm strikes you, they rejoice at it. And if you are patient and fear Allah, their plot will not harm you at all. Indeed, Allah is encompassing of what they do\",\"pickthall\":\"If a lucky chance befall you, it is evil unto them, and if disaster strike you they rejoice thereat. But if ye persevere and keep from evil their guile will never harm you. Lo! Allah is Surrounding what they do\"},{\"a\":121,\"w\":[\"وَإِذۡ\",\"غَدَوۡتَ\",\"مِنۡ\",\"أَهۡلِكَ\",\"تُبَوِّئُ\",\"ٱلۡمُؤۡمِنِينَ\",\"مَقَٰعِدَ\",\"لِلۡقِتَالِۗ\",\"وَٱللَّهُ\",\"سَمِيعٌ\",\"عَلِيمٌ\"],\"t\":\"And [remember] when you, [O Muhammad], left your family in the morning to post the believers at their stations for the battle [of Uhud] - and Allah is Hearing and Knowing\",\"pickthall\":\"And when thou settedst forth at daybreak from thy housefolk to assign to the believers their positions for the battle, Allah was Hearer, Knower\"},{\"a\":122,\"w\":[\"إِذۡ\",\"هَمَّت\",\"طَّآئِفَتَانِ\",\"مِنكُمۡ\",\"أَن\",\"تَفۡشَلَا\",\"وَٱللَّهُ\",\"وَلِيُّهُمَاۗ\",\"وَعَلَى\",\"ٱللَّهِ\",\"فَلۡيَتَوَكَّلِ\",\"ٱلۡمُؤۡمِنُونَ\"],\"t\":\"When two parties among you were about to lose courage, but Allah was their ally; and upon Allah the believers should rely\",\"pickthall\":\"When two parties of you almost fell away, and Allah was their Protecting Friend. In Allah let believers put their trust\"},{\"a\":123,\"w\":[\"وَلَقَدۡ\",\"نَصَرَكُمُ\",\"ٱللَّهُ\",\"بِبَدۡرٖ\",\"وَأَنتُمۡ\",\"أَذِلَّةٞۖ\",\"فَٱتَّقُواْ\",\"ٱللَّهَ\",\"لَعَلَّكُمۡ\",\"تَشۡكُرُونَ\"],\"t\":\"And already had Allah given you victory at [the battle of] Badr while you were few in number. Then fear Allah; perhaps you will be grateful\",\"pickthall\":\"Allah had already given you the victory at Badr, when ye were contemptible. So observe your duty to Allah in order that ye may be thankful\"},{\"a\":124,\"w\":[\"إِذۡ\",\"تَقُولُ\",\"لِلۡمُؤۡمِنِينَ\",\"أَلَن\",\"يَكۡفِيَكُمۡ\",\"أَن\",\"يُمِدَّكُمۡ\",\"رَبُّكُم\",\"بِثَلَٰثَةِ\",\"ءَالَٰفٖ\",\"مِّنَ\",\"ٱلۡمَلَـٰٓئِكَةِ\",\"مُنزَلِينَ\"],\"t\":\"[Remember] when you said to the believers, \\\"Is it not sufficient for you that your Lord should reinforce you with three thousand angels sent down\",\"pickthall\":\"When thou didst say unto the believers: Is it not sufficient for you that your Lord should support you with three thousand angels sent down (to your help)\"},{\"a\":125,\"w\":[\"بَلَىٰٓۚ\",\"إِن\",\"تَصۡبِرُواْ\",\"وَتَتَّقُواْ\",\"وَيَأۡتُوكُم\",\"مِّن\",\"فَوۡرِهِمۡ\",\"هَٰذَا\",\"يُمۡدِدۡكُمۡ\",\"رَبُّكُم\",\"بِخَمۡسَةِ\",\"ءَالَٰفٖ\",\"مِّنَ\",\"ٱلۡمَلَـٰٓئِكَةِ\",\"مُسَوِّمِينَ\"],\"t\":\"Yes, if you remain patient and conscious of Allah and the enemy come upon you [attacking] in rage, your Lord will reinforce you with five thousand angels having marks [of distinction]\",\"pickthall\":\"Nay, but if ye persevere, and keep from evil, and (the enemy) attack you suddenly, your Lord will help you with five thousand angels sweeping on\"},{\"a\":126,\"w\":[\"وَمَا\",\"جَعَلَهُ\",\"ٱللَّهُ\",\"إِلَّا\",\"بُشۡرَىٰ\",\"لَكُمۡ\",\"وَلِتَطۡمَئِنَّ\",\"قُلُوبُكُم\",\"بِهِۦۗ\",\"وَمَا\",\"ٱلنَّصۡرُ\",\"إِلَّا\",\"مِنۡ\",\"عِندِ\",\"ٱللَّهِ\",\"ٱلۡعَزِيزِ\",\"ٱلۡحَكِيمِ\"],\"t\":\"And Allah made it not except as [a sign of] good tidings for you and to reassure your hearts thereby. And victory is not except from Allah, the Exalted in Might, the Wise\",\"pickthall\":\"Allah ordained this only as a message of good cheer for you, and that thereby your hearts might be at rest - Victory cometh only from Allah, the Mighty, the Wise\"},{\"a\":127,\"w\":[\"لِيَقۡطَعَ\",\"طَرَفٗا\",\"مِّنَ\",\"ٱلَّذِينَ\",\"كَفَرُوٓاْ\",\"أَوۡ\",\"يَكۡبِتَهُمۡ\",\"فَيَنقَلِبُواْ\",\"خَآئِبِينَ\"],\"t\":\"That He might cut down a section of the disbelievers or suppress them so that they turn back disappointed\",\"pickthall\":\"That He may cut off a part of those who disbelieve, or overwhelm them so that they retire, frustrated\"},{\"a\":128,\"w\":[\"لَيۡسَ\",\"لَكَ\",\"مِنَ\",\"ٱلۡأَمۡرِ\",\"شَيۡءٌ\",\"أَوۡ\",\"يَتُوبَ\",\"عَلَيۡهِمۡ\",\"أَوۡ\",\"يُعَذِّبَهُمۡ\",\"فَإِنَّهُمۡ\",\"ظَٰلِمُونَ\"],\"t\":\"Not for you, [O Muhammad, but for Allah], is the decision whether He should [cut them down] or forgive them or punish them, for indeed, they are wrongdoers\",\"pickthall\":\"It is no concern at all of thee (Muhammad) whether He relent toward them or punish them; for they are evil-doers\"},{\"a\":129,\"w\":[\"وَلِلَّهِ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَمَا\",\"فِي\",\"ٱلۡأَرۡضِۚ\",\"يَغۡفِرُ\",\"لِمَن\",\"يَشَآءُ\",\"وَيُعَذِّبُ\",\"مَن\",\"يَشَآءُۚ\",\"وَٱللَّهُ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"And to Allah belongs whatever is in the heavens and whatever is on the earth. He forgives whom He wills and punishes whom He wills. And Allah is Forgiving and Merciful\",\"pickthall\":\"Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth. He forgiveth whom He will, and punisheth whom He will. Allah is Forgiving, Merciful\"},{\"a\":130,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُ
