واْ\",\"لَا\",\"تَأۡكُلُواْ\",\"ٱلرِّبَوٰٓاْ\",\"أَضۡعَٰفٗا\",\"مُّضَٰعَفَةٗۖ\",\"وَٱتَّقُواْ\",\"ٱللَّهَ\",\"لَعَلَّكُمۡ\",\"تُفۡلِحُونَ\"],\"t\":\"O you who have believed, do not consume usury, doubled and multiplied, but fear Allah that you may be successful\",\"pickthall\":\"O ye who believe! Devour not usury, doubling and quadrupling (the sum lent). Observe your duty to Allah, that ye may be successful\"},{\"a\":131,\"w\":[\"وَٱتَّقُواْ\",\"ٱلنَّارَ\",\"ٱلَّتِيٓ\",\"أُعِدَّتۡ\",\"لِلۡكَٰفِرِينَ\"],\"t\":\"And fear the Fire, which has been prepared for the disbelievers\",\"pickthall\":\"And ward off (from yourselves) the Fire prepared for disbelievers\"},{\"a\":132,\"w\":[\"وَأَطِيعُواْ\",\"ٱللَّهَ\",\"وَٱلرَّسُولَ\",\"لَعَلَّكُمۡ\",\"تُرۡحَمُونَ\"],\"t\":\"And obey Allah and the Messenger that you may obtain mercy\",\"pickthall\":\"And obey Allah and the messenger, that ye may find mercy\"},{\"a\":133,\"w\":[\"۞وَسَارِعُوٓاْ\",\"إِلَىٰ\",\"مَغۡفِرَةٖ\",\"مِّن\",\"رَّبِّكُمۡ\",\"وَجَنَّةٍ\",\"عَرۡضُهَا\",\"ٱلسَّمَٰوَٰتُ\",\"وَٱلۡأَرۡضُ\",\"أُعِدَّتۡ\",\"لِلۡمُتَّقِينَ\"],\"t\":\"And hasten to forgiveness from your Lord and a garden as wide as the heavens and earth, prepared for the righteous\",\"pickthall\":\"And vie one with another for forgiveness from your Lord, and for a paradise as wide as are the heavens and the earth, prepared for those who ward off (evil)\"},{\"a\":134,\"w\":[\"ٱلَّذِينَ\",\"يُنفِقُونَ\",\"فِي\",\"ٱلسَّرَّآءِ\",\"وَٱلضَّرَّآءِ\",\"وَٱلۡكَٰظِمِينَ\",\"ٱلۡغَيۡظَ\",\"وَٱلۡعَافِينَ\",\"عَنِ\",\"ٱلنَّاسِۗ\",\"وَٱللَّهُ\",\"يُحِبُّ\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"Who spend [in the cause of Allah] during ease and hardship and who restrain anger and who pardon the people - and Allah loves the doers of good\",\"pickthall\":\"Those who spend (of that which Allah hath given them) in ease and in adversity, those who control their wrath and are forgiving toward mankind; Allah loveth the good\"},{\"a\":135,\"w\":[\"وَٱلَّذِينَ\",\"إِذَا\",\"فَعَلُواْ\",\"فَٰحِشَةً\",\"أَوۡ\",\"ظَلَمُوٓاْ\",\"أَنفُسَهُمۡ\",\"ذَكَرُواْ\",\"ٱللَّهَ\",\"فَٱسۡتَغۡفَرُواْ\",\"لِذُنُوبِهِمۡ\",\"وَمَن\",\"يَغۡفِرُ\",\"ٱلذُّنُوبَ\",\"إِلَّا\",\"ٱللَّهُ\",\"وَلَمۡ\",\"يُصِرُّواْ\",\"عَلَىٰ\",\"مَا\",\"فَعَلُواْ\",\"وَهُمۡ\",\"يَعۡلَمُونَ\"],\"t\":\"And those who, when they commit an immorality or wrong themselves [by transgression], remember Allah and seek forgiveness for their sins - and who can forgive sins except Allah? - and [who] do not persist in what they have done while they know\",\"pickthall\":\"And those who, when they do an evil thing or wrong themselves, remember Allah and implore forgiveness for their sins - Who forgiveth sins save Allah only? - and will not knowingly repeat (the wrong) they did\"},{\"a\":136,\"w\":[\"أُوْلَـٰٓئِكَ\",\"جَزَآؤُهُم\",\"مَّغۡفِرَةٞ\",\"مِّن\",\"رَّبِّهِمۡ\",\"وَجَنَّـٰتٞ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَاۚ\",\"وَنِعۡمَ\",\"أَجۡرُ\",\"ٱلۡعَٰمِلِينَ\"],\"t\":\"Those - their reward is forgiveness from their Lord and gardens beneath which rivers flow [in Paradise], wherein they will abide eternally; and excellent is the reward of the [righteous] workers\",\"pickthall\":\"The reward of such will be forgiveness from their Lord, and Gardens underneath which rivers flow, wherein they will abide for ever - a bountiful reward for workers\"},{\"a\":137,\"w\":[\"قَدۡ\",\"خَلَتۡ\",\"مِن\",\"قَبۡلِكُمۡ\",\"سُنَنٞ\",\"فَسِيرُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"فَٱنظُرُواْ\",\"كَيۡفَ\",\"كَانَ\",\"عَٰقِبَةُ\",\"ٱلۡمُكَذِّبِينَ\"],\"t\":\"Similar situations [as yours] have passed on before you, so proceed throughout the earth and observe how was the end of those who denied\",\"pickthall\":\"Systems have passed away before you. Do but travel in the land and see the nature of the consequence for those who did deny (the messengers)\"},{\"a\":138,\"w\":[\"هَٰذَا\",\"بَيَانٞ\",\"لِّلنَّاسِ\",\"وَهُدٗى\",\"وَمَوۡعِظَةٞ\",\"لِّلۡمُتَّقِينَ\"],\"t\":\"This [Qur'an] is a clear statement to [all] the people and a guidance and instruction for those conscious of Allah\",\"pickthall\":\"This is a declaration for mankind, a guidance and an admonition unto those who ward off (evil)\"},{\"a\":139,\"w\":[\"وَلَا\",\"تَهِنُواْ\",\"وَلَا\",\"تَحۡزَنُواْ\",\"وَأَنتُمُ\",\"ٱلۡأَعۡلَوۡنَ\",\"إِن\",\"كُنتُم\",\"مُّؤۡمِنِينَ\"],\"t\":\"So do not weaken and do not grieve, and you will be superior if you are [true] believers\",\"pickthall\":\"Faint not nor grieve, for ye will overcome them if ye are (indeed) believers\"},{\"a\":140,\"w\":[\"إِن\",\"يَمۡسَسۡكُمۡ\",\"قَرۡحٞ\",\"فَقَدۡ\",\"مَسَّ\",\"ٱلۡقَوۡمَ\",\"قَرۡحٞ\",\"مِّثۡلُهُۥۚ\",\"وَتِلۡكَ\",\"ٱلۡأَيَّامُ\",\"نُدَاوِلُهَا\",\"بَيۡنَ\",\"ٱلنَّاسِ\",\"وَلِيَعۡلَمَ\",\"ٱللَّهُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَيَتَّخِذَ\",\"مِنكُمۡ\",\"شُهَدَآءَۗ\",\"وَٱللَّهُ\",\"لَا\",\"يُحِبُّ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"If a wound should touch you - there has already touched the [opposing] people a wound similar to it. And these days [of varying conditions] We alternate among the people so that Allah may make evident those who believe and [may] take to Himself from among you martyrs - and Allah does not like the wrongdoers\",\"pickthall\":\"If ye have received a blow, the (disbelieving) people have received a blow the like thereof. These are (only) the vicissitudes which We cause to follow one another for mankind, to the end that Allah may know those who believe and may choose witnesses from among you; and Allah loveth not wrong-doers\"},{\"a\":141,\"w\":[\"وَلِيُمَحِّصَ\",\"ٱللَّهُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَيَمۡحَقَ\",\"ٱلۡكَٰفِرِينَ\"],\"t\":\"And that Allah may purify the believers [through trials] and destroy the disbelievers\",\"pickthall\":\"And that Allah may prove those who believe, and may blight the disbelievers\"},{\"a\":142,\"w\":[\"أَمۡ\",\"حَسِبۡتُمۡ\",\"أَن\",\"تَدۡخُلُواْ\",\"ٱلۡجَنَّةَ\",\"وَلَمَّا\",\"يَعۡلَمِ\",\"ٱللَّهُ\",\"ٱلَّذِينَ\",\"جَٰهَدُواْ\",\"مِنكُمۡ\",\"وَيَعۡلَمَ\",\"ٱلصَّـٰبِرِينَ\"],\"t\":\"Or do you think that you will enter Paradise while Allah has not yet made evident those of you who fight in His cause and made evident those who are steadfast\",\"pickthall\":\"Or deemed ye that ye would enter paradise while yet Allah knoweth not those of you who really strive, nor knoweth those (of you) who are steadfast\"},{\"a\":143,\"w\":[\"وَلَقَدۡ\",\"كُنتُمۡ\",\"تَمَنَّوۡنَ\",\"ٱلۡمَوۡتَ\",\"مِن\",\"قَبۡلِ\",\"أَن\",\"تَلۡقَوۡهُ\",\"فَقَدۡ\",\"رَأَيۡتُمُوهُ\",\"وَأَنتُمۡ\",\"تَنظُرُونَ\"],\"t\":\"And you had certainly wished for martyrdom before you encountered it, and you have [now] seen it [before you] while you were looking on\",\"pickthall\":\"And verily ye used to wish for death before ye met it (in the field). Now ye have seen it with your eyes\"},{\"a\":144,\"w\":[\"وَمَا\",\"مُحَمَّدٌ\",\"إِلَّا\",\"رَسُولٞ\",\"قَدۡ\",\"خَلَتۡ\",\"مِن\",\"قَبۡلِهِ\",\"ٱلرُّسُلُۚ\",\"أَفَإِيْن\",\"مَّاتَ\",\"أَوۡ\",\"قُتِلَ\",\"ٱنقَلَبۡتُمۡ\",\"عَلَىٰٓ\",\"أَعۡقَٰبِكُمۡۚ\",\"وَمَن\",\"يَنقَلِبۡ\",\"عَلَىٰ\",\"عَقِبَيۡهِ\",\"فَلَن\",\"يَضُرَّ\",\"ٱللَّهَ\",\"شَيۡـٔٗاۚ\",\"وَسَيَجۡزِي\",\"ٱللَّهُ\",\"ٱلشَّـٰكِرِينَ\"],\"t\":\"Muhammad is not but a messenger. [Other] messengers have passed on before him. So if he was to die or be killed, would you turn back on your heels [to unbelief]? And he who turns back on his heels will never harm Allah at all; but Allah will reward the grateful\",\"pickthall\":\"Muhammad is but a messenger, messengers (the like of whom) have passed away before him. Will it be that, when he dieth or is slain, ye will turn back on your heels? He who turneth back on his heels doth no hurt to Allah, and Allah will reward the thankful\"},{\"a\":145,\"w\":[\"وَمَا\",\"كَانَ\",\"لِنَفۡسٍ\",\"أَن\",\"تَمُوتَ\",\"إِلَّا\",\"بِإِذۡنِ\",\"ٱللَّهِ\",\"كِتَٰبٗا\",\"مُّؤَجَّلٗاۗ\",\"وَمَن\",\"يُرِدۡ\",\"ثَوَابَ\",\"ٱلدُّنۡيَا\",\"نُؤۡتِهِۦ\",\"مِنۡهَا\",\"وَمَن\",\"يُرِدۡ\",\"ثَوَابَ\",\"ٱلۡأٓخِرَةِ\",\"نُؤۡتِهِۦ\",\"مِنۡهَاۚ\",\"وَسَنَجۡزِي\",\"ٱلشَّـٰكِرِينَ\"],\"t\":\"And it is not [possible] for one to die except by permission of Allah at a decree determined. And whoever desires the reward of this world - We will give him thereof; and whoever desires the reward of the Hereafter - We will give him thereof. And we will reward the grateful\",\"pickthall\":\"No soul can ever die except by Allah's leave and at a term appointed. Whoso desireth the reward of the world, We bestow on him thereof; and whoso desireth the reward of the Hereafter, We bestow on him thereof. We shall reward the thankful\"},{\"a\":146,\"w\":[\"وَكَأَيِّن\",\"مِّن\",\"نَّبِيّٖ\",\"قَٰتَلَ\",\"مَعَهُۥ\",\"رِبِّيُّونَ\",\"كَثِيرٞ\",\"فَمَا\",\"وَهَنُواْ\",\"لِمَآ\",\"أَصَابَهُمۡ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَمَا\",\"ضَعُفُواْ\",\"وَمَا\",\"ٱسۡتَكَانُواْۗ\",\"وَٱللَّهُ\",\"يُحِبُّ\",\"ٱلصَّـٰبِرِينَ\"],\"t\":\"And how many a prophet [fought and] with him fought many religious scholars. But they never lost assurance due to what afflicted them in the cause of Allah, nor did they weaken or submit. And Allah loves the steadfast\",\"pickthall\":\"And with how many a prophet have there been a number of devoted men who fought (beside him). They quailed not for aught that befell them in the way of Allah, nor did they weaken, nor were they brought low. Allah loveth the steadfast\"},{\"a\":147,\"w\":[\"وَمَا\",\"كَانَ\",\"قَوۡلَهُمۡ\",\"إِلَّآ\",\"أَن\",\"قَالُواْ\",\"رَبَّنَا\",\"ٱغۡفِرۡ\",\"لَنَا\",\"ذُنُوبَنَا\",\"وَإِسۡرَافَنَا\",\"فِيٓ\",\"أَمۡرِنَا\",\"وَثَبِّتۡ\",\"أَقۡدَامَنَا\",\"وَٱنصُرۡنَا\",\"عَلَى\",\"ٱلۡقَوۡمِ\",\"ٱلۡكَٰفِرِينَ\"],\"t\":\"And their words were not but that they said, \\\"Our Lord, forgive us our sins and the excess [committed] in our affairs and plant firmly our feet and give us victory over the disbelieving people\",\"pickthall\":\"Their cry was only that they said: Our Lord! forgive us for our sins and wasted efforts, make our foothold sure, and give us victory over the disbelieving folk\"},{\"a\":148,\"w\":[\"فَـَٔاتَىٰهُمُ\",\"ٱللَّهُ\",\"ثَوَابَ\",\"ٱلدُّنۡيَا\",\"وَحُسۡنَ\",\"ثَوَابِ\",\"ٱلۡأٓخِرَةِۗ\",\"وَٱللَّهُ\",\"يُحِبُّ\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"So Allah gave them the reward of this world and the good reward of the Hereafter. And Allah loves the doers of good\",\"pickthall\":\"So Allah gave them the reward of the world and the good reward of the Hereafter. Allah loveth those whose deeds are good\"},{\"a\":149,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِن\",\"تُطِيعُواْ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"يَرُدُّوكُمۡ\",\"عَلَىٰٓ\",\"أَعۡقَٰبِكُمۡ\",\"فَتَنقَلِبُواْ\",\"خَٰسِرِينَ\"],\"t\":\"O you who have believed, if you obey those who disbelieve, they will turn you back on your heels, and you will [then] become losers\",\"pickthall\":\"O ye who believe! if ye obey those who disbelieve, they will make you turn back on your heels, and ye turn back as losers\"},{\"a\":150,\"w\":[\"بَلِ\",\"ٱللَّهُ\",\"مَوۡلَىٰكُمۡۖ\",\"وَهُوَ\",\"خَيۡرُ\",\"ٱلنَّـٰصِرِينَ\"],\"t\":\"But Allah is your protector, and He is the best of helpers\",\"pickthall\":\"But Allah is your Protector, and He is the Best of Helpers\"},{\"a\":151,\"w\":[\"سَنُلۡقِي\",\"فِي\",\"قُلُوبِ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"ٱلرُّعۡبَ\",\"بِمَآ\",\"أَشۡرَكُواْ\",\"بِٱللَّهِ\",\"مَا\",\"لَمۡ\",\"يُنَزِّلۡ\",\"بِهِۦ\",\"سُلۡطَٰنٗاۖ\",\"وَمَأۡوَىٰهُمُ\",\"ٱلنَّارُۖ\",\"وَبِئۡسَ\",\"مَثۡوَى\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"We will cast terror into the hearts of those who disbelieve for what they have associated with Allah of which He had not sent down [any] authority. And their refuge will be the Fire, and wretched is the residence of the wrongdoers\",\"pickthall\":\"We shall cast terror into the hearts of those who disbelieve because they ascribe unto Allah partners, for which no warrant hath been revealed. Their habitation is the Fire, and hapless the abode of the wrong-doers\"},{\"a\":152,\"w\":[\"وَلَقَدۡ\",\"صَدَقَكُمُ\",\"ٱللَّهُ\",\"وَعۡدَهُۥٓ\",\"إِذۡ\",\"تَحُسُّونَهُم\",\"بِإِذۡنِهِۦۖ\",\"حَتَّىٰٓ\",\"إِذَا\",\"فَشِلۡتُمۡ\",\"وَتَنَٰزَعۡتُمۡ\",\"فِي\",\"ٱلۡأَمۡرِ\",\"وَعَصَيۡتُم\",\"مِّنۢ\",\"بَعۡدِ\",\"مَآ\",\"أَرَىٰكُم\",\"مَّا\",\"تُحِبُّونَۚ\",\"مِنكُم\",\"مَّن\",\"يُرِيدُ\",\"ٱلدُّنۡيَا\",\"وَمِنكُم\",\"مَّن\",\"يُرِيدُ\",\"ٱلۡأٓخِرَةَۚ\",\"ثُمَّ\",\"صَرَفَكُمۡ\",\"عَنۡهُمۡ\",\"لِيَبۡتَلِيَكُمۡۖ\",\"وَلَقَدۡ\",\"عَفَا\",\"عَنكُمۡۗ\",\"وَٱللَّهُ\",\"ذُو\",\"فَضۡلٍ\",\"عَلَى\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"And Allah had certainly fulfilled His promise to you when you were killing the enemy by His permission until [the time] when you lost courage and fell to disputing about the order [given by the Prophet] and disobeyed after He had shown you that which you love. Among you are some who desire this world, and among you are some who desire the Hereafter. Then he turned you back from them [defeated] that He might test you. And He has already forgiven you, and Allah is the possessor of bounty for the believers\",\"pickthall\":\"Allah verily made good His promise unto you when ye routed them by His leave, until (the moment) when your courage failed you, and ye disagreed about the order and ye disobeyed, after He had shown you that for which ye long. Some of you desired the world, and some of you desired the Hereafter. Therefore He made you flee from them, that He might try you. Yet now He hath forgiven you. Allah is a Lord of Kindness to believers\"},{\"a\":153,\"w\":[\"۞إِذۡ\",\"تُصۡعِدُونَ\",\"وَلَا\",\"تَلۡوُۥنَ\",\"عَلَىٰٓ\",\"أَحَدٖ\",\"وَٱلرَّسُولُ\",\"يَدۡعُوكُمۡ\",\"فِيٓ\",\"أُخۡرَىٰكُمۡ\",\"فَأَثَٰبَكُمۡ\",\"غَمَّۢا\",\"بِغَمّٖ\",\"لِّكَيۡلَا\",\"تَحۡزَنُواْ\",\"عَلَىٰ\",\"مَا\",\"فَاتَكُمۡ\",\"وَلَا\",\"مَآ\",\"أَصَٰبَكُمۡۗ\",\"وَٱللَّهُ\",\"خَبِيرُۢ\",\"بِمَا\",\"تَعۡمَلُونَ\"],\"t\":\"[Remember] when you [fled and] climbed [the mountain] without looking aside at anyone while the Messenger was calling you from behind. So Allah repaid you with distress upon distress so you would not grieve for that which had escaped you [of victory and spoils of war] or [for] that which had befallen you [of injury and death]. And Allah is [fully] Acquainted with what you do\",\"pickthall\":\"When ye climbed (the hill) and paid no heed to anyone, while the messenger, in your rear, was calling you (to fight). Therefor He rewarded you grief for (his) grief, that (He might teach) you not to sorrow either for that which ye missed or for that which befell you. Allah is Informed of what ye do\"},{\"a\":154,\"w\":[\"ثُمَّ\",\"أَنزَلَ\",\"عَلَيۡكُم\",\"مِّنۢ\",\"بَعۡدِ\",\"ٱلۡغَمِّ\",\"أَمَنَةٗ\",\"نُّعَاسٗا\",\"يَغۡشَىٰ\",\"طَآئِفَةٗ\",\"مِّنكُمۡۖ\",\"وَطَآئِفَةٞ\",\"قَدۡ\",\"أَهَمَّتۡهُمۡ\",\"أَنفُسُهُمۡ\",\"يَظُنُّونَ\",\"بِٱللَّهِ\",\"غَيۡرَ\",\"ٱلۡحَقِّ\",\"ظَنَّ\",\"ٱلۡجَٰهِلِيَّةِۖ\",\"يَقُولُونَ\",\"هَل\",\"لَّنَا\",\"مِنَ\",\"ٱلۡأَمۡرِ\",\"مِن\",\"شَيۡءٖۗ\",\"قُلۡ\",\"إِنَّ\",\"ٱلۡأَمۡرَ\",\"كُلَّهُۥ\",\"لِلَّهِۗ\",\"يُخۡفُونَ\",\"فِيٓ\",\"أَنفُسِهِم\",\"مَّا\",\"لَا\",\"يُبۡدُونَ\",\"لَكَۖ\",\"يَقُولُونَ\",\"لَوۡ\",\"كَانَ\",\"لَنَا\",\"مِنَ\",\"ٱلۡأَمۡرِ\",\"شَيۡءٞ\",\"مَّا\",\"قُتِلۡنَا\",\"هَٰهُنَاۗ\",\"قُل\",\"لَّوۡ\",\"كُنتُمۡ\",\"فِي\",\"بُيُوتِكُمۡ\",\"لَبَرَزَ\",\"ٱلَّذِينَ\",\"كُتِبَ\",\"عَلَيۡهِمُ\",\"ٱلۡقَتۡلُ\",\"إِلَىٰ\",\"مَضَاجِعِهِمۡۖ\",\"وَلِيَبۡتَلِيَ\",\"ٱللَّهُ\",\"مَا\",\"فِي\",\"صُدُورِكُمۡ\",\"وَلِيُمَحِّصَ\",\"مَا\",\"فِي\",\"قُلُوبِكُمۡۚ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِذَاتِ\",\"ٱلصُّدُورِ\"],\"t\":\"Then after distress, He sent down upon you security [in the form of] drowsiness, overcoming a faction of you, while another faction worried about themselves, thinking of Allah other than the truth - the thought of ignorance, saying, \\\"Is there anything for us [to have done] in this matter?\\\" Say, \\\"Indeed, the matter belongs completely to Allah.\\\" They conceal within themselves what they will not reveal to you. They say, \\\"If there was anything we could have done in the matter, some of us would not have been killed right here.\\\" Say, \\\"Even if you had been inside your houses, those decreed to be killed would have come out to their death beds.\\\" [It was] so that Allah might test what is in your breasts and purify what is in your hearts. And Allah is Knowing of that within the breasts\",\"pickthall\":\"Then, after grief, He sent down security for you. As slumber did it overcome a party of you, while (the other) party, who were anxious on their own account, thought wrongly of Allah, the thought of ignorance. They said: Have we any part in the cause? Say (O Muhammad): The cause belongeth wholly to Allah. They hide within themselves (a thought) which they reveal not unto thee, saying: Had we had any part in the cause we should not have been slain here. Say: Even though ye had been in your houses, those appointed to be slain would have gone forth to the places where they were to lie. (All this hath been) in order that Allah might try what is in your breasts and prove what is in your hearts. Allah is Aware of what is hidden in the breasts (of men)\"},{\"a\":155,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"تَوَلَّوۡاْ\",\"مِنكُمۡ\",\"يَوۡمَ\",\"ٱلۡتَقَى\",\"ٱلۡجَمۡعَانِ\",\"إِنَّمَا\",\"ٱسۡتَزَلَّهُمُ\",\"ٱلشَّيۡطَٰنُ\",\"بِبَعۡضِ\",\"مَا\",\"كَسَبُواْۖ\",\"وَلَقَدۡ\",\"عَفَا\",\"ٱللَّهُ\",\"عَنۡهُمۡۗ\",\"إِنَّ\",\"ٱللَّهَ\",\"غَفُورٌ\",\"حَلِيمٞ\"],\"t\":\"Indeed, those of you who turned back on the day the two armies met, it was Satan who caused them to slip because of some [blame] they had earned. But Allah has already forgiven them. Indeed, Allah is Forgiving and Forbearing\",\"pickthall\":\"Lo! those of you who turned back on the day when the two hosts met, Satan alone it was who caused them to backslide, because of some of that which they have earned. Now Allah hath forgiven them. Lo! Allah is Forgiving, Clement\"},{\"a\":156,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَا\",\"تَكُونُواْ\",\"كَٱلَّذِينَ\",\"كَفَرُواْ\",\"وَقَالُواْ\",\"لِإِخۡوَٰنِهِمۡ\",\"إِذَا\",\"ضَرَبُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"أَوۡ\",\"كَانُواْ\",\"غُزّٗى\",\"لَّوۡ\",\"كَانُواْ\",\"عِندَنَا\",\"مَا\",\"مَاتُواْ\",\"وَمَا\",\"قُتِلُواْ\",\"لِيَجۡعَلَ\",\"ٱللَّهُ\",\"ذَٰلِكَ\",\"حَسۡرَةٗ\",\"فِي\",\"قُلُوبِهِمۡۗ\",\"وَٱللَّهُ\",\"يُحۡيِۦ\",\"وَيُمِيتُۗ\",\"وَٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"بَصِيرٞ\"],\"t\":\"O you who have believed, do not be like those who disbelieved and said about their brothers when they traveled through the land or went out to fight, \\\"If they had been with us, they would not have died or have been killed,\\\" so Allah makes that [misconception] a regret within their hearts. And it is Allah who gives life and causes death, and Allah is Seeing of what you do\",\"pickthall\":\"O ye who believe! Be not as those who disbelieved and said of their brethren who went abroad in the land or were fighting in the field: If they had been (here) with us they would not have died or been killed: that Allah may make it anguish in their hearts. Allah giveth life and causeth death; and Allah is Seer of what ye do\"},{\"a\":157,\"w\":[\"وَلَئِن\",\"قُتِلۡتُمۡ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"أَوۡ\",\"مُتُّمۡ\",\"لَمَغۡفِرَةٞ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرَحۡمَةٌ\",\"خَيۡرٞ\",\"مِّمَّا\",\"يَجۡمَعُونَ\"],\"t\":\"And if you are killed in the cause of Allah or die - then forgiveness from Allah and mercy are better than whatever they accumulate [in this world]\",\"pickthall\":\"And what though ye be slain in Allah's way or die therein? Surely pardon from Allah and mercy are better than all that they amass\"},{\"a\":158,\"w\":[\"وَلَئِن\",\"مُّتُّمۡ\",\"أَوۡ\",\"قُتِلۡتُمۡ\",\"لَإِلَى\",\"ٱللَّهِ\",\"تُحۡشَرُونَ\"],\"t\":\"And whether you die or are killed, unto Allah you will be gathered\",\"pickthall\":\"What though ye be slain or die, when unto Allah ye are gathered\"},{\"a\":159,\"w\":[\"فَبِمَا\",\"رَحۡمَةٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"لِنتَ\",\"لَهُمۡۖ\",\"وَلَوۡ\",\"كُنتَ\",\"فَظًّا\",\"غَلِيظَ\",\"ٱلۡقَلۡبِ\",\"لَٱنفَضُّواْ\",\"مِنۡ\",\"حَوۡلِكَۖ\",\"فَٱعۡفُ\",\"عَنۡهُمۡ\",\"وَٱسۡتَغۡفِرۡ\",\"لَهُمۡ\",\"وَشَاوِرۡهُمۡ\",\"فِي\",\"ٱلۡأَمۡرِۖ\",\"فَإِذَا\",\"عَزَمۡتَ\",\"فَتَوَكَّلۡ\",\"عَلَى\",\"ٱللَّهِۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"يُحِبُّ\",\"ٱلۡمُتَوَكِّلِينَ\"],\"t\":\"So by mercy from Allah, [O Muhammad], you were lenient with them. And if you had been rude [in speech] and harsh in heart, they would have disbanded from about you. So pardon them and ask forgiveness for them and consult them in the matter. And when you have decided, then rely upon Allah. Indeed, Allah loves those who rely [upon Him]\",\"pickthall\":\"It was by the mercy of Allah that thou wast lenient with them (O Muhammad), for if thou hadst been stern and fierce of heart they would have dispersed from round about thee. So pardon them and ask forgiveness for them and consult with them upon the conduct of affairs. And when thou art resolved, then put thy trust in Allah. Lo! Allah loveth those who put their trust (in Him)\"},{\"a\":160,\"w\":[\"إِن\",\"يَنصُرۡكُمُ\",\"ٱللَّهُ\",\"فَلَا\",\"غَالِبَ\",\"لَكُمۡۖ\",\"وَإِن\",\"يَخۡذُلۡكُمۡ\",\"فَمَن\",\"ذَا\",\"ٱلَّذِي\",\"يَنصُرُكُم\",\"مِّنۢ\",\"بَعۡدِهِۦۗ\",\"وَعَلَى\",\"ٱللَّهِ\",\"فَلۡيَتَوَكَّلِ\",\"ٱلۡمُؤۡمِنُونَ\"],\"t\":\"If Allah should aid you, no one can overcome you; but if He should forsake you, who is there that can aid you after Him? And upon Allah let the believers rely\",\"pickthall\":\"If Allah is your helper none can overcome you, and if He withdraw His help from you, who is there who can help you after Him? In Allah let believers put their trust\"},{\"a\":161,\"w\":[\"وَمَا\",\"كَانَ\",\"لِنَبِيٍّ\",\"أَن\",\"يَغُلَّۚ\",\"وَمَن\",\"يَغۡلُلۡ\",\"يَأۡتِ\",\"بِمَا\",\"غَلَّ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِۚ\",\"ثُمَّ\",\"تُوَفَّىٰ\",\"كُلُّ\",\"نَفۡسٖ\",\"مَّا\",\"كَسَبَتۡ\",\"وَهُمۡ\",\"لَا\",\"يُظۡلَمُونَ\"],\"t\":\"It is not [attributable] to any prophet that he would act unfaithfully [in regard to war booty]. And whoever betrays, [taking unlawfully], will come with what he took on the Day of Resurrection. Then will every soul be [fully] compensated for what it earned, and they will not be wronged\",\"pickthall\":\"It is not for any prophet to embezzle. Whoso embezzleth will bring what he embezzled with him on the Day of Resurrection. Then every soul will be paid in full what it hath earned; and they will not be wronged\"},{\"a\":162,\"w\":[\"أَفَمَنِ\",\"ٱتَّبَعَ\",\"رِضۡوَٰنَ\",\"ٱللَّهِ\",\"كَمَنۢ\",\"بَآءَ\",\"بِسَخَطٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَمَأۡوَىٰهُ\",\"جَهَنَّمُۖ\",\"وَبِئۡسَ\",\"ٱلۡمَصِيرُ\"],\"t\":\"So is one who pursues the pleasure of Allah like one who brings upon himself the anger of Allah and whose refuge is Hell? And wretched is the destination\",\"pickthall\":\"Is one who followeth the pleasure of Allah as one who hath earned condemnation from Allah, whose habitation is the Fire, a hapless journey's end\"},{\"a\":163,\"w\":[\"هُمۡ\",\"دَرَجَٰتٌ\",\"عِندَ\",\"ٱللَّهِۗ\",\"وَٱللَّهُ\",\"بَصِيرُۢ\",\"بِمَا\",\"يَعۡمَلُونَ\"],\"t\":\"They are [varying] degrees in the sight of Allah, and Allah is Seeing of whatever they do\",\"pickthall\":\"There are degrees (of grace and reprobation) with Allah, and Allah is Seer of what they do\"},{\"a\":164,\"w\":[\"لَقَدۡ\",\"مَنَّ\",\"ٱللَّهُ\",\"عَلَى\",\"ٱلۡمُؤۡمِنِينَ\",\"إِذۡ\",\"بَعَثَ\",\"فِيهِمۡ\",\"رَسُولٗا\",\"مِّنۡ\",\"أَنفُسِهِمۡ\",\"يَتۡلُواْ\",\"عَلَيۡهِمۡ\",\"ءَايَٰتِهِۦ\",\"وَيُزَكِّيهِمۡ\",\"وَيُعَلِّمُهُمُ\",\"ٱلۡكِتَٰبَ\",\"وَٱلۡحِكۡمَةَ\",\"وَإِن\",\"كَانُواْ\",\"مِن\",\"قَبۡلُ\",\"لَفِي\",\"ضَلَٰلٖ\",\"مُّبِينٍ\"],\"t\":\"Certainly did Allah confer [great] favor upon the believers when He sent among them a Messenger from themselves, reciting to them His verses and purifying them and teaching them the Book and wisdom, although they had been before in manifest error\",\"pickthall\":\"Allah verily hath shown grace to the believers by sending unto them a messenger of their own who reciteth unto them His revelations, and causeth them to grow, and teacheth them the Scripture and wisdom; although before (he came to them) they were in flagrant error\"},{\"a\":165,\"w\":[\"أَوَلَمَّآ\",\"أَصَٰبَتۡكُم\",\"مُّصِيبَةٞ\",\"قَدۡ\",\"أَصَبۡتُم\",\"مِّثۡلَيۡهَا\",\"قُلۡتُمۡ\",\"أَنَّىٰ\",\"هَٰذَاۖ\",\"قُلۡ\",\"هُوَ\",\"مِنۡ\",\"عِندِ\",\"أَنفُسِكُمۡۗ\",\"إِنَّ\",\"ٱللَّهَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٞ\"],\"t\":\"Why [is it that] when a [single] disaster struck you [on the day of Uhud], although you had struck [the enemy in the battle of Badr] with one twice as great, you said, \\\"From where is this?\\\" Say, \\\"It is from yourselves.\\\" Indeed, Allah is over all things competent\",\"pickthall\":\"And was it so, when a disaster smote you, though ye had smitten (them with a disaster) twice (as great), that ye said: How is this? Say (unto them, O Muhammad): It is from yourselves. Lo! Allah is Able to do all things\"},{\"a\":166,\"w\":[\"وَمَآ\",\"أَصَٰبَكُمۡ\",\"يَوۡمَ\",\"ٱلۡتَقَى\",\"ٱلۡجَمۡعَانِ\",\"فَبِإِذۡنِ\",\"ٱللَّهِ\",\"وَلِيَعۡلَمَ\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"And what struck you on the day the two armies met was by permission of Allah that He might make evident the [true] believers\",\"pickthall\":\"That which befell you, on the day when the two armies met, was by permission of Allah; that He might know the true believers\"},{\"a\":167,\"w\":[\"وَلِيَعۡلَمَ\",\"ٱلَّذِينَ\",\"نَافَقُواْۚ\",\"وَقِيلَ\",\"لَهُمۡ\",\"تَعَالَوۡاْ\",\"قَٰتِلُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"أَوِ\",\"ٱدۡفَعُواْۖ\",\"قَالُواْ\",\"لَوۡ\",\"نَعۡلَمُ\",\"قِتَالٗا\",\"لَّٱتَّبَعۡنَٰكُمۡۗ\",\"هُمۡ\",\"لِلۡكُفۡرِ\",\"يَوۡمَئِذٍ\",\"أَقۡرَبُ\",\"مِنۡهُمۡ\",\"لِلۡإِيمَٰنِۚ\",\"يَقُولُونَ\",\"بِأَفۡوَٰهِهِم\",\"مَّا\",\"لَيۡسَ\",\"فِي\",\"قُلُوبِهِمۡۚ\",\"وَٱللَّهُ\",\"أَعۡلَمُ\",\"بِمَا\",\"يَكۡتُمُونَ\"],\"t\":\"And that He might make evident those who are hypocrites. For it was said to them, \\\"Come, fight in the way of Allah or [at least] defend.\\\" They said, \\\"If we had known [there would be] fighting, we would have followed you.\\\" They were nearer to disbelief that day than to faith, saying with their mouths what was not in their hearts. And Allah is most Knowing of what they conceal\",\"pickthall\":\"And that He might know the hypocrites, unto whom it was said: Come, fight in the way of Allah, or defend yourselves. They answered: If we knew aught of fighting we would follow you. On that day they were nearer disbelief than faith. They utter with their mouths a thing which is not in their hearts. Allah is Best Aware of what they hide\"},{\"a\":168,\"w\":[\"ٱلَّذِينَ\",\"قَالُواْ\",\"لِإِخۡوَٰنِهِمۡ\",\"وَقَعَدُواْ\",\"لَوۡ\",\"أَطَاعُونَا\",\"مَا\",\"قُتِلُواْۗ\",\"قُلۡ\",\"فَٱدۡرَءُواْ\",\"عَنۡ\",\"أَنفُسِكُمُ\",\"ٱلۡمَوۡتَ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"Those who said about their brothers while sitting [at home], \\\"If they had obeyed us, they would not have been killed.\\\" Say, \\\"Then prevent death from yourselves, if you should be truthful\",\"pickthall\":\"Those who, while they sat at home, said of their brethren (who were fighting for the cause of Allah): If they had been guided by us they would not have been slain. Say (unto them, O Muhammad): Then avert death from yourselves if ye are truthful\"},{\"a\":169,\"w\":[\"وَلَا\",\"تَحۡسَبَنَّ\",\"ٱلَّذِينَ\",\"قُتِلُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"أَمۡوَٰتَۢاۚ\",\"بَلۡ\",\"أَحۡيَآءٌ\",\"عِندَ\",\"رَبِّهِمۡ\",\"يُرۡزَقُونَ\"],\"t\":\"And never think of those who have been killed in the cause of Allah as dead. Rather, they are alive with their Lord, receiving provision\",\"pickthall\":\"Think not of those, who are slain in the way of Allah, as dead. Nay, they are living. With their Lord they have provision\"},{\"a\":170,\"w\":[\"فَرِحِينَ\",\"بِمَآ\",\"ءَاتَىٰهُمُ\",\"ٱللَّهُ\",\"مِن\",\"فَضۡلِهِۦ\",\"وَيَسۡتَبۡشِرُونَ\",\"بِٱلَّذِينَ\",\"لَمۡ\",\"يَلۡحَقُواْ\",\"بِهِم\",\"مِّنۡ\",\"خَلۡفِهِمۡ\",\"أَلَّا\",\"خَوۡفٌ\",\"عَلَيۡهِمۡ\",\"وَلَا\",\"هُمۡ\",\"يَحۡزَنُونَ\"],\"t\":\"Rejoicing in what Allah has bestowed upon them of His bounty, and they receive good tidings about those [to be martyred] after them who have not yet joined them - that there will be no fear concerning them, nor will they grieve\",\"pickthall\":\"Jubilant (are they) because of that which Allah hath bestowed upon them of His bounty, rejoicing for the sake of those who have not joined them but are left behind: That there shall no fear come upon them neither shall they grieve\"},{\"a\":171,\"w\":[\"۞يَسۡتَبۡشِرُونَ\",\"بِنِعۡمَةٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَفَضۡلٖ\",\"وَأَنَّ\",\"ٱللَّهَ\",\"لَا\",\"يُضِيعُ\",\"أَجۡرَ\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"They receive good tidings of favor from Allah and bounty and [of the fact] that Allah does not allow the reward of believers to be lost\",\"pickthall\":\"They rejoice because of favour from Allah and kindness, and that Allah wasteth not the wage of the believers\"},{\"a\":172,\"w\":[\"ٱلَّذِينَ\",\"ٱسۡتَجَابُواْ\",\"لِلَّهِ\",\"وَٱلرَّسُولِ\",\"مِنۢ\",\"بَعۡدِ\",\"مَآ\",\"أَصَابَهُمُ\",\"ٱلۡقَرۡحُۚ\",\"لِلَّذِينَ\",\"أَحۡسَنُواْ\",\"مِنۡهُمۡ\",\"وَٱتَّقَوۡاْ\",\"أَجۡرٌ\",\"عَظِيمٌ\"],\"t\":\"Those [believers] who responded to Allah and the Messenger after injury had struck them. For those who did good among them and feared Allah is a great reward\",\"pickthall\":\"As for those who heard the call of Allah and His messenger after the harm befell them (in the fight); for such of them as do right and ward off (evil), there is great reward\"},{\"a\":173,\"w\":[\"ٱلَّذِينَ\",\"قَالَ\",\"لَهُمُ\",\"ٱلنَّاسُ\",\"إِنَّ\",\"ٱلنَّاسَ\",\"قَدۡ\",\"جَمَعُواْ\",\"لَكُمۡ\",\"فَٱخۡشَوۡهُمۡ\",\"فَزَادَهُمۡ\",\"إِيمَٰنٗا\",\"وَقَالُواْ\",\"حَسۡبُنَا\",\"ٱللَّهُ\",\"وَنِعۡمَ\",\"ٱلۡوَكِيلُ\"],\"t\":\"Those to whom hypocrites said, \\\"Indeed, the people have gathered against you, so fear them.\\\" But it [merely] increased them in faith, and they said, \\\"Sufficient for us is Allah, and [He is] the best Disposer of affairs\",\"pickthall\":\"Those unto whom men said: Lo! the people have gathered against you, therefor fear them. (The threat of danger) but increased the faith of them and they cried: Allah is Sufficient for us! Most Excellent is He in Whom we trust\"},{\"a\":174,\"w\":[\"فَٱنقَلَبُواْ\",\"بِنِعۡمَةٖ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَفَضۡلٖ\",\"لَّمۡ\",\"يَمۡسَسۡهُمۡ\",\"سُوٓءٞ\",\"وَٱتَّبَعُواْ\",\"رِضۡوَٰنَ\",\"ٱللَّهِۗ\",\"وَٱللَّهُ\",\"ذُو\",\"فَضۡلٍ\",\"عَظِيمٍ\"],\"t\":\"So they returned with favor from Allah and bounty, no harm having touched them. And they pursued the pleasure of Allah, and Allah is the possessor of great bounty\",\"pickthall\":\"So they returned with grace and favour from Allah, and no harm touched them. They followed the good pleasure of Allah, and Allah is of Infinite Bounty\"},{\"a\":175,\"w\":[\"إِنَّمَا\",\"ذَٰلِكُمُ\",\"ٱلشَّيۡطَٰنُ\",\"يُخَوِّفُ\",\"أَوۡلِيَآءَهُۥ\",\"فَلَا\",\"تَخَافُوهُمۡ\",\"وَخَافُونِ\",\"إِن\",\"كُنتُم\",\"مُّؤۡمِنِينَ\"],\"t\":\"That is only Satan who frightens [you] of his supporters. So fear them not, but fear Me, if you are [indeed] believers\",\"pickthall\":\"It is only the devil who would make (men) fear his partisans. Fear them not; fear Me, if ye are true believers\"},{\"a\":176,\"w\":[\"وَلَا\",\"يَحۡزُنكَ\",\"ٱلَّذِينَ\",\"يُسَٰرِعُونَ\",\"فِي\",\"ٱلۡكُفۡرِۚ\",\"إِنَّهُمۡ\",\"لَن\",\"يَضُرُّواْ\",\"ٱللَّهَ\",\"شَيۡـٔٗاۚ\",\"يُرِيدُ\",\"ٱللَّهُ\",\"أَلَّا\",\"يَجۡعَلَ\",\"لَهُمۡ\",\"حَظّٗا\",\"فِي\",\"ٱلۡأٓخِرَةِۖ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"عَظِيمٌ\"],\"t\":\"And do not be grieved, [O Muhammad], by those who hasten into disbelief. Indeed, they will never harm Allah at all. Allah intends that He should give them no share in the Hereafter, and for them is a great punishment\",\"pickthall\":\"Let not their conduct grieve thee, who run easily to disbelief, for lo! they injure Allah not at all. It is Allah's Will to assign them no portion in the Hereafter, and theirs will be an awful doom\"},{\"a\":177,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"ٱشۡتَرَوُاْ\",\"ٱلۡكُفۡرَ\",\"بِٱلۡإِيمَٰنِ\",\"لَن\",\"يَضُرُّواْ\",\"ٱللَّهَ\",\"شَيۡـٔٗاۖ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"Indeed, those who purchase disbelief [in exchange] for faith - never will they harm Allah at all, and for them is a painful punishment\",\"pickthall\":\"Those who purchase disbelief at the price of faith harm Allah not at all, but theirs will be a painful doom\"},{\"a\":178,\"w\":[\"وَلَا\",\"يَحۡسَبَنَّ\",\"ٱلَّذِينَ\",\"كَفَرُوٓاْ\",\"أَنَّمَا\",\"نُمۡلِي\",\"لَهُمۡ\",\"خَيۡرٞ\",\"لِّأَنفُسِهِمۡۚ\",\"إِنَّمَا\",\"نُمۡلِي\",\"لَهُمۡ\",\"لِيَزۡدَادُوٓاْ\",\"إِثۡمٗاۖ\",\"وَلَهُمۡ\",\"عَذَابٞ\",\"مُّهِينٞ\"],\"t\":\"And let not those who disbelieve ever think that [because] We extend their time [of enjoyment] it is better for them. We only extend it for them so that they may increase in sin, and for them is a humiliating punishment\",\"pickthall\":\"And let not those who disbelieve imagine that the rein We give them bodeth good unto their souls. We only give them rein that they may grow in sinfulness. And theirs will be a shameful doom\"},{\"a\":179,\"w\":[\"مَّا\",\"كَانَ\",\"ٱللَّهُ\",\"لِيَذَرَ\",\"ٱلۡمُؤۡمِنِينَ\",\"عَلَىٰ\",\"مَآ\",\"أَنتُمۡ\",\"عَلَيۡهِ\",\"حَتَّىٰ\",\"يَمِيزَ\",\"ٱلۡخَبِيثَ\",\"مِنَ\",\"ٱلطَّيِّبِۗ\",\"وَمَا\",\"كَانَ\",\"ٱللَّهُ\",\"لِيُطۡلِعَكُمۡ\",\"عَلَى\",\"ٱلۡغَيۡبِ\",\"وَلَٰكِنَّ\",\"ٱللَّهَ\",\"يَجۡتَبِي\",\"مِن\",\"رُّسُلِهِۦ\",\"مَن\",\"يَشَآءُۖ\",\"فَـَٔامِنُواْ\",\"بِٱللَّهِ\",\"وَرُسُلِهِۦۚ\",\"وَإِن\",\"تُؤۡمِنُواْ\",\"وَتَتَّقُواْ\",\"فَلَكُمۡ\",\"أَجۡرٌ\",\"عَظِيمٞ\"],\"t\":\"Allah would not leave the believers in that [state] you are in [presently] until He separates the evil from the good. Nor would Allah reveal to you the unseen. But [instead], Allah chooses of His messengers whom He wills, so believe in Allah and His messengers. And if you believe and fear Him, then for you is a great reward\",\"pickthall\":\"It is not (the purpose) of Allah to leave you in your present state till He shall separate the wicked from the good. And it is not (the purpose of) Allah to let you know the Unseen. But Allah chooseth of His messengers whom He will, (to receive knowledge thereof). So believe in Allah and His messengers. If ye believe and ward off (evil), yours will be a vast reward\"},{\"a\":180,\"w\":[\"وَلَا\",\"يَحۡسَبَنَّ\",\"ٱلَّذِينَ\",\"يَبۡخَلُونَ\",\"بِمَآ\",\"ءَاتَىٰهُمُ\",\"ٱللَّهُ\",\"مِن\",\"فَضۡلِهِۦ\",\"هُوَ\",\"خَيۡرٗا\",\"لَّهُمۖ\",\"بَلۡ\",\"هُوَ\",\"شَرّٞ\",\"لَّهُمۡۖ\",\"سَيُطَوَّقُونَ\",\"مَا\",\"بَخِلُواْ\",\"بِهِۦ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِۗ\",\"وَلِلَّهِ\",\"مِيرَٰثُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۗ\",\"وَٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"خَبِيرٞ\"],\"t\":\"And let not those who [greedily] withhold what Allah has given them of His bounty ever think that it is better for them. Rather, it is worse for them. Their necks will be encircled by what they withheld on the Day of Resurrection. And to Allah belongs the heritage of the heavens and the earth. And Allah, with what you do, is [fully] Acquainted\",\"pickthall\":\"And let not those who hoard up that which Allah hath bestowed upon them of His bounty think that it is better for them. Nay, it is worse for them. That which they hoard will be their collar on the Day of Resurrection. Allah's is the heritage of the heavens and the earth, and Allah is Informed of what ye do\"},{\"a\":181,\"w\":[\"لَّقَدۡ\",\"سَمِعَ\",\"ٱللَّهُ\",\"قَوۡلَ\",\"ٱلَّذِينَ\",\"قَالُوٓاْ\",\"إِنَّ\",\"ٱللَّهَ\",\"فَقِيرٞ\",\"وَنَحۡنُ\",\"أَغۡنِيَآءُۘ\",\"سَنَكۡتُبُ\",\"مَا\",\"قَالُواْ\",\"وَقَتۡلَهُمُ\",\"ٱلۡأَنۢبِيَآءَ\",\"بِغَيۡرِ\",\"حَقّٖ\",\"وَنَقُولُ\",\"ذُوقُواْ\",\"عَذَابَ\",\"ٱلۡحَرِيقِ\"],\"t\":\"Allah has certainly heard the statement of those [Jews] who said, \\\"Indeed, Allah is poor, while we are rich.\\\" We will record what they said and their killing of the prophets without right and will say, \\\"Taste the punishment of the Burning Fire\",\"pickthall\":\"Verily Allah heard the saying of those who said, (when asked for contributions to the war): \\\"Allah, forsooth, is poor, and we are rich!\\\" We shall record their saying with their slaying of the prophets wrongfully and We shall say: Taste ye the punishment of burning\"},{\"a\":182,\"w\":[\"ذَٰلِكَ\",\"بِمَا\",\"قَدَّمَتۡ\",\"أَيۡدِيكُمۡ\",\"وَأَنَّ\",\"ٱللَّهَ\",\"لَيۡسَ\",\"بِظَلَّامٖ\",\"لِّلۡعَبِيدِ\"],\"t\":\"That is for what your hands have put forth and because Allah is not ever unjust to [His] servants\",\"pickthall\":\"This is on account of that which your own hands have sent before (you to the judgment). Allah is no oppressor of (His) bondmen\"},{\"a\":183,\"w\":[\"ٱلَّذِينَ\",\"قَالُوٓاْ\",\"إِنَّ\",\"ٱللَّهَ\",\"عَهِدَ\",\"إِلَيۡنَآ\",\"أَلَّا\",\"نُؤۡمِنَ\",\"لِرَسُولٍ\",\"حَتَّىٰ\",\"يَأۡتِيَنَا\",\"بِقُرۡبَانٖ\",\"تَأۡكُلُهُ\",\"ٱلنَّارُۗ\",\"قُلۡ\",\"قَدۡ\",\"جَآءَكُمۡ\",\"رُسُلٞ\",\"مِّن\",\"قَبۡلِي\",\"بِٱلۡبَيِّنَٰتِ\",\"وَبِٱلَّذِي\",\"قُلۡتُمۡ\",\"فَلِمَ\",\"قَتَلۡتُمُوهُمۡ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"[They are] those who said, \\\"Indeed, Allah has taken our promise not to believe any messenger until he brings us an offering which fire [from heaven] will consume.\\\" Say, \\\"There have already come to you messengers before me with clear proofs and [even] that of which you speak. So why did you kill them, if you should be truthful\",\"pickthall\":\"(The same are) those who say: Lo! Allah hath charged us that we believe not in any messenger until he bring us an offering which fire (from heaven) shall devour. Say (unto them, O Muhammad): Messengers came unto you before me with miracles, and with that (very miracle) which ye describe. Why then did ye slay them? (Answer that) if ye are truthful\"},{\"a\":184,\"w\":[\"فَإِن\",\"كَذَّبُوكَ\",\"فَقَدۡ\",\"كُذِّبَ\",\"رُسُلٞ\",\"مِّن\",\"قَبۡلِكَ\",\"جَآءُو\",\"بِٱلۡبَيِّنَٰتِ\",\"وَٱلزُّبُرِ\",\"وَٱلۡكِتَٰبِ\",\"ٱلۡمُنِيرِ\"],\"t\":\"Then if they deny you, [O Muhammad] - so were messengers denied before you, who brought clear proofs and written ordinances and the enlightening Scripture\",\"pickthall\":\"And if they deny thee, even so did they deny messengers who were before thee, who came with miracles and with the Psalms and with the Scripture giving light\"},{\"a\":185,\"w\":[\"كُلُّ\",\"نَفۡسٖ\",\"ذَآئِقَةُ\",\"ٱلۡمَوۡتِۗ\",\"وَإِنَّمَا\",\"تُوَفَّوۡنَ\",\"أُجُورَكُمۡ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِۖ\",\"فَمَن\",\"زُحۡزِحَ\",\"عَنِ\",\"ٱلنَّارِ\",\"وَأُدۡخِلَ\",\"ٱلۡجَنَّةَ\",\"فَقَدۡ\",\"فَازَۗ\",\"وَمَا\",\"ٱلۡحَيَوٰةُ\",\"ٱلدُّنۡيَآ\",\"إِلَّا\",\"مَتَٰعُ\",\"ٱلۡغُرُورِ\"],\"t\":\"Every soul will taste death, and you will only be given your [full] compensation on the Day of Resurrection. So he who is drawn away from the Fire and admitted to Paradise has attained [his desire]. And what is the life of this world except the enjoyment of delusion\",\"pickthall\":\"Every soul will taste of death. And ye will be paid on the Day of Resurrection only that which ye have fairly earned. Whoso is removed from the Fire and is made to enter paradise, he indeed is triumphant. The life of this world is but comfort of illusion\"},{\"a\":186,\"w\":[\"۞لَتُبۡلَوُنَّ\",\"فِيٓ\",\"أَمۡوَٰلِكُمۡ\",\"وَأَنفُسِكُمۡ\",\"وَلَتَسۡمَعُنَّ\",\"مِنَ\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"مِن\",\"قَبۡلِكُمۡ\",\"وَمِنَ\",\"ٱلَّذِينَ\",\"أَشۡرَكُوٓاْ\",\"أَذٗى\",\"كَثِيرٗاۚ\",\"وَإِن\",\"تَصۡبِرُواْ\",\"وَتَتَّقُواْ\",\"فَإِنَّ\",\"ذَٰلِكَ\",\"مِنۡ\",\"عَزۡمِ\",\"ٱلۡأُمُورِ\"],\"t\":\"You will surely be tested in your possessions and in yourselves. And you will surely hear from those who were given the Scripture before you and from those who associate others with Allah much abuse. But if you are patient and fear Allah - indeed, that is of the matters [worthy] of determination\",\"pickthall\":\"Assuredly ye will be tried in your property and in your persons, and ye will hear much wrong from those who were given the Scripture before you, and from the idolaters. But if ye persevere and ward off (evil), then that is of the steadfast heart of things\"},{\"a\":187,\"w\":[\"وَإِذۡ\",\"أَخَذَ\",\"ٱللَّهُ\",\"مِيثَٰقَ\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"لَتُبَيِّنُنَّهُۥ\",\"لِلنَّاسِ\",\"وَلَا\",\"تَكۡتُمُونَهُۥ\",\"فَنَبَذُوهُ\",\"وَرَآءَ\",\"ظُهُورِهِمۡ\",\"وَٱشۡتَرَوۡاْ\",\"بِهِۦ\",\"ثَمَنٗا\",\"قَلِيلٗاۖ\",\"فَبِئۡسَ\",\"مَا\",\"يَشۡتَرُونَ\"],\"t\":\"And [mention, O Muhammad], when Allah took a covenant from those who were given the Scripture, [saying], \\\"You must make it clear to the people and not conceal it.\\\" But they threw it away behind their backs and exchanged it for a small price. And wretched is that which they purchased\",\"pickthall\":\"And (remember) when Allah laid a charge on those who had received the Scripture (He said): Ye are to expound it to mankind and not to hide it. But they flung it behind their backs and bought thereby a little gain. Verily evil is that which they have gained thereby\"},{\"a\":188,\"w\":[\"لَا\",\"تَحۡسَبَنَّ\",\"ٱلَّذِينَ\",\"يَفۡرَحُونَ\",\"بِمَآ\",\"أَتَواْ\",\"وَّيُحِبُّونَ\",\"أَن\",\"يُحۡمَدُواْ\",\"بِمَا\",\"لَمۡ\",\"يَفۡعَلُواْ\",\"فَلَا\",\"تَحۡسَبَنَّهُم\",\"بِمَفَازَةٖ\",\"مِّنَ\",\"ٱلۡعَذَابِۖ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"And never think that those who rejoice in what they have perpetrated and like to be praised for what they did not do - never think them [to be] in safety from the punishment, and for them is a painful punishment\",\"pickthall\":\"Think not that those who exult in what they have given, and love to be praised for what they have not done - Think not, they are in safety from the doom. A painful doom is theirs\"},{\"a\":189,\"w\":[\"وَلِلَّهِ\",\"مُلۡكُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۗ\",\"وَٱللَّهُ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٌ\"],\"t\":\"And to Allah belongs the dominion of the heavens and the earth, and Allah is over all things competent\",\"pickthall\":\"Unto Allah belongeth the Sovereignty of the heavens and the earth. Allah is Able to do all things\"},{\"a\":190,\"w\":[\"إِنَّ\",\"فِي\",\"خَلۡقِ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"وَٱخۡتِلَٰفِ\",\"ٱلَّيۡلِ\",\"وَٱلنَّهَارِ\",\"لَأٓيَٰتٖ\",\"لِّأُوْلِي\",\"ٱلۡأَلۡبَٰبِ\"],\"t\":\"Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding\",\"pickthall\":\"Lo! In the creation of the heavens and the earth and (in) the difference of night and day are tokens (of His Sovereignty) for men of understanding\"},{\"a\":191,\"w\":[\"ٱلَّذِينَ\",\"يَذۡكُرُونَ\",\"ٱللَّهَ\",\"قِيَٰمٗا\",\"وَقُعُودٗا\",\"وَعَلَىٰ\",\"جُنُوبِهِمۡ\",\"وَيَتَفَكَّرُونَ\",\"فِي\",\"خَلۡقِ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"رَبَّنَا\",\"مَا\",\"خَلَقۡتَ\",\"هَٰذَا\",\"بَٰطِلٗا\",\"سُبۡحَٰنَكَ\",\"فَقِنَا\",\"عَذَابَ\",\"ٱلنَّارِ\"],\"t\":\"Who remember Allah while standing or sitting or [lying] on their sides and give thought to the creation of the heavens and the earth, [saying], \\\"Our Lord, You did not create this aimlessly; exalted are You [above such a thing]; then protect us from the punishment of the Fire\",\"pickthall\":\"Such as remember Allah, standing, sitting, and reclining, and consider the creation of the heavens and the earth, (and say): Our Lord! Thou createdst not this in vain. Glory be to Thee! Preserve us from the doom of Fire\"},{\"a\":192,\"w\":[\"رَبَّنَآ\",\"إِنَّكَ\",\"مَن\",\"تُدۡخِلِ\",\"ٱلنَّارَ\",\"فَقَدۡ\",\"أَخۡزَيۡتَهُۥۖ\",\"وَمَا\",\"لِلظَّـٰلِمِينَ\",\"مِنۡ\",\"أَنصَارٖ\"],\"t\":\"Our Lord, indeed whoever You admit to the Fire - You have disgraced him, and for the wrongdoers there are no helpers\",\"pickthall\":\"Our Lord! Whom Thou causest to enter the Fire: him indeed Thou hast confounded. For evil-doers there will be no helpers\"},{\"a\":193,\"w\":[\"رَّبَّنَآ\",\"إِنَّنَا\",\"سَمِعۡنَا\",\"مُنَادِيٗا\",\"يُنَادِي\",\"لِلۡإِيمَٰنِ\",\"أَنۡ\",\"ءَامِنُواْ\",\"بِرَبِّكُمۡ\",\"فَـَٔامَنَّاۚ\",\"رَبَّنَا\",\"فَٱغۡفِرۡ\",\"لَنَا\",\"ذُنُوبَنَا\",\"وَكَفِّرۡ\",\"عَنَّا\",\"سَيِّـَٔاتِنَا\",\"وَتَوَفَّنَا\",\"مَعَ\",\"ٱلۡأَبۡرَارِ\"],\"t\":\"Our Lord, indeed we have heard a caller calling to faith, [saying], 'Believe in your Lord,' and we have believed. Our Lord, so forgive us our sins and remove from us our misdeeds and cause us to die with the righteous\",\"pickthall\":\"Our Lord! Lo! we have heard a crier calling unto Faith: \\\"Believe ye in your Lord!\\\" So we believed. Our Lord! Therefor forgive us our sins, and remit from us our evil deeds, and make us die the death of the righteous\"},{\"a\":194,\"w\":[\"رَبَّنَا\",\"وَءَاتِنَا\",\"مَا\",\"وَعَدتَّنَا\",\"عَلَىٰ\",\"رُسُلِكَ\",\"وَلَا\",\"تُخۡزِنَا\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِۖ\",\"إِنَّكَ\",\"لَا\",\"تُخۡلِفُ\",\"ٱلۡمِيعَادَ\"],\"t\":\"Our Lord, and grant us what You promised us through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in [Your] promise\",\"pickthall\":\"Our Lord! And give us that which Thou hast promised to us by Thy messengers. Confound us not upon the Day of Resurrection. Lo! Thou breakest not the tryst\"},{\"a\":195,\"w\":[\"فَٱسۡتَجَابَ\",\"لَهُمۡ\",\"رَبُّهُمۡ\",\"أَنِّي\",\"لَآ\",\"أُضِيعُ\",\"عَمَلَ\",\"عَٰمِلٖ\",\"مِّنكُم\",\"مِّن\",\"ذَكَرٍ\",\"أَوۡ\",\"أُنثَىٰۖ\",\"بَعۡضُكُم\",\"مِّنۢ\",\"بَعۡضٖۖ\",\"فَٱلَّذِينَ\",\"هَاجَرُواْ\",\"وَأُخۡرِجُواْ\",\"مِن\",\"دِيَٰرِهِمۡ\",\"وَأُوذُواْ\",\"فِي\",\"سَبِيلِي\",\"وَقَٰتَلُواْ\",\"وَقُتِلُواْ\",\"لَأُكَفِّرَنَّ\",\"عَنۡهُمۡ\",\"سَيِّـَٔاتِهِمۡ\",\"وَلَأُدۡخِلَنَّهُمۡ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"ثَوَابٗا\",\"مِّنۡ\",\"عِندِ\",\"ٱللَّهِۚ\",\"وَٱللَّهُ\",\"عِندَهُۥ\",\"حُسۡنُ\",\"ٱلثَّوَابِ\"],\"t\":\"And their Lord responded to them, \\\"Never will I allow to be lost the work of [any] worker among you, whether male or female; you are of one another. So those who emigrated or were evicted from their homes or were harmed in My cause or fought or were killed - I will surely remove from them their misdeeds, and I will surely admit them to gardens beneath which rivers flow as reward from Allah, and Allah has with Him the best reward\",\"pickthall\":\"And their Lord hath heard them (and He saith): Lo! I suffer not the work of any worker, male or female, to be lost. Ye proceed one from another. So those who fled and were driven forth from their homes and suffered damage for My cause, and fought and were slain, verily I shall remit their evil deeds from them and verily I shall bring them into Gardens underneath which rivers flow - A reward from Allah. And with Allah is the fairest of rewards\"},{\"a\":196,\"w\":[\"لَا\",\"يَغُرَّنَّكَ\",\"تَقَلُّبُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"فِي\",\"ٱلۡبِلَٰدِ\"],\"t\":\"Be not deceived by the [uninhibited] movement of the disbelievers throughout the land\",\"pickthall\":\"Let not the vicissitude (of the success) of those who disbelieve, in the land, deceive thee (O Muhammad)\"},{\"a\":197,\"w\":[\"مَتَٰعٞ\",\"قَلِيلٞ\",\"ثُمَّ\",\"مَأۡوَىٰهُمۡ\",\"جَهَنَّمُۖ\",\"وَبِئۡسَ\",\"ٱلۡمِهَادُ\"],\"t\":\"[It is but] a small enjoyment; then their [final] refuge is Hell, and wretched is the resting place\",\"pickthall\":\"It is but a brief comfort. And afterward their habitation will be hell, an ill abode\"},{\"a\":198,\"w\":[\"لَٰكِنِ\",\"ٱلَّذِينَ\",\"ٱتَّقَوۡاْ\",\"رَبَّهُمۡ\",\"لَهُمۡ\",\"جَنَّـٰتٞ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَا\",\"نُزُلٗا\",\"مِّنۡ\",\"عِندِ\",\"ٱللَّهِۗ\",\"وَمَا\",\"عِندَ\",\"ٱللَّهِ\",\"خَيۡرٞ\",\"لِّلۡأَبۡرَارِ\"],\"t\":\"But those who feared their Lord will have gardens beneath which rivers flow, abiding eternally therein, as accommodation from Allah. And that which is with Allah is best for the righteous\",\"pickthall\":\"But those who keep their duty to their Lord, for them are Gardens underneath which rivers flow, wherein they will be safe for ever. A gift of welcome from their Lord. That which Allah hath in store is better for the righteous\"},{\"a\":199,\"w\":[\"وَإِنَّ\",\"مِنۡ\",\"أَهۡلِ\",\"ٱلۡكِتَٰبِ\",\"لَمَن\",\"يُؤۡمِنُ\",\"بِٱللَّهِ\",\"وَمَآ\",\"أُنزِلَ\",\"إِلَيۡكُمۡ\",\"وَمَآ\",\"أُنزِلَ\",\"إِلَيۡهِمۡ\",\"خَٰشِعِينَ\",\"لِلَّهِ\",\"لَا\",\"يَشۡتَرُونَ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"ثَمَنٗا\",\"قَلِيلًاۚ\",\"أُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"أَجۡرُهُمۡ\",\"عِندَ\",\"رَبِّهِمۡۗ\",\"إِنَّ\",\"ٱللَّهَ\",\"سَرِيعُ\",\"ٱلۡحِسَابِ\"],\"t\":\"And indeed, among the People of the Scripture are those who believe in Allah and what was revealed to you and what was revealed to them, [being] humbly submissive to Allah. They do not exchange the verses of Allah for a small price. Those will have their reward with their Lord. Indeed, Allah is swift in account\",\"pickthall\":\"And lo! of the People of the Scripture there are some who believe in Allah and that which is revealed unto you and that which was revealed unto them, humbling themselves before Allah. They purchase not a trifling gain at the price of the revelations of Allah. Verily their reward is with their Lord. Lo! Allah is swift to take account\"},{\"a\":200,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱصۡبِرُواْ\",\"وَصَابِرُواْ\",\"وَرَابِطُواْ\",\"وَٱتَّقُواْ\",\"ٱللَّهَ\",\"لَعَلَّكُمۡ\",\"تُفۡلِحُونَ\"],\"t\":\"O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful\",\"pickthall\":\"O ye who believe! Endure, outdo all others in endurance, be ready, and observe your duty to Allah, in order that ye may succeed\"}]}]}]}]\n17:I[81329,[\"/Holy-Qur-an/_next/static/chunks/24efh__7za5e0.js\",\"/Holy-Qur-an/_next/static/chunks/22b8_m0w9yaf8.js\"],\"IconMark\"]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\nd:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Ali 'Imran — Surah 3 · Quran
