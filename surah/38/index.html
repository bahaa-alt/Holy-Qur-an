r; nay but they have not yet tasted My doom\"},{\"a\":9,\"w\":[\"أَمۡ\",\"عِندَهُمۡ\",\"خَزَآئِنُ\",\"رَحۡمَةِ\",\"رَبِّكَ\",\"ٱلۡعَزِيزِ\",\"ٱلۡوَهَّابِ\"],\"t\":\"Or do they have the depositories of the mercy of your Lord, the Exalted in Might, the Bestower\",\"pickthall\":\"Or are theirs the treasures of the mercy of thy Lord, the Mighty, the Bestower\"},{\"a\":10,\"w\":[\"أَمۡ\",\"لَهُم\",\"مُّلۡكُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"وَمَا\",\"بَيۡنَهُمَاۖ\",\"فَلۡيَرۡتَقُواْ\",\"فِي\",\"ٱلۡأَسۡبَٰبِ\"],\"t\":\"Or is theirs the dominion of the heavens and the earth and what is between them? Then let them ascend through [any] ways of access\",\"pickthall\":\"Or is the kingdom of the heavens and the earth and all that is between them theirs? Then let them ascend by ropes\"},{\"a\":11,\"w\":[\"جُندٞ\",\"مَّا\",\"هُنَالِكَ\",\"مَهۡزُومٞ\",\"مِّنَ\",\"ٱلۡأَحۡزَابِ\"],\"t\":\"[They are but] soldiers [who will be] defeated there among the companies [of disbelievers]\",\"pickthall\":\"A defeated host are (all) the factions that are there\"},{\"a\":12,\"w\":[\"كَذَّبَتۡ\",\"قَبۡلَهُمۡ\",\"قَوۡمُ\",\"نُوحٖ\",\"وَعَادٞ\",\"وَفِرۡعَوۡنُ\",\"ذُو\",\"ٱلۡأَوۡتَادِ\"],\"t\":\"The people of Noah denied before them, and [the tribe of] 'Aad and Pharaoh, the owner of stakes\",\"pickthall\":\"The folk of Noah before them denied (their messenger) and (so did the tribe of) A'ad, and Pharaoh firmly planted\"},{\"a\":13,\"w\":[\"وَثَمُودُ\",\"وَقَوۡمُ\",\"لُوطٖ\",\"وَأَصۡحَٰبُ\",\"لۡـَٔيۡكَةِۚ\",\"أُوْلَـٰٓئِكَ\",\"ٱلۡأَحۡزَابُ\"],\"t\":\"And [the tribe of] Thamud and the people of Lot and the companions of the thicket. Those are the companies\",\"pickthall\":\"And (the tribe of) Thamud, and the folk of Lot, and the dwellers in the wood: these were the factions\"},{\"a\":14,\"w\":[\"إِن\",\"كُلٌّ\",\"إِلَّا\",\"كَذَّبَ\",\"ٱلرُّسُلَ\",\"فَحَقَّ\",\"عِقَابِ\"],\"t\":\"Each of them denied the messengers, so My penalty was justified\",\"pickthall\":\"Not one of them but did deny the messengers, therefor My doom was justified\"},{\"a\":15,\"w\":[\"وَمَا\",\"يَنظُرُ\",\"هَـٰٓؤُلَآءِ\",\"إِلَّا\",\"صَيۡحَةٗ\",\"وَٰحِدَةٗ\",\"مَّا\",\"لَهَا\",\"مِن\",\"فَوَاقٖ\"],\"t\":\"And these [disbelievers] await not but one blast [of the Horn]; for it there will be no delay\",\"pickthall\":\"These wait for but one Shout, there will be no second thereto\"},{\"a\":16,\"w\":[\"وَقَالُواْ\",\"رَبَّنَا\",\"عَجِّل\",\"لَّنَا\",\"قِطَّنَا\",\"قَبۡلَ\",\"يَوۡمِ\",\"ٱلۡحِسَابِ\"],\"t\":\"And they say, \\\"Our Lord, hasten for us our share [of the punishment] before the Day of Account\",\"pickthall\":\"They say: Our Lord! Hasten on for us our fate before the Day of Reckoning\"},{\"a\":17,\"w\":[\"ٱصۡبِرۡ\",\"عَلَىٰ\",\"مَا\",\"يَقُولُونَ\",\"وَٱذۡكُرۡ\",\"عَبۡدَنَا\",\"دَاوُۥدَ\",\"ذَا\",\"ٱلۡأَيۡدِۖ\",\"إِنَّهُۥٓ\",\"أَوَّابٌ\"],\"t\":\"Be patient over what they say and remember Our servant, David, the possessor of strength; indeed, he was one who repeatedly turned back [to Allah]\",\"pickthall\":\"Bear with what they say, and remember Our bondman David, lord of might, Lo! he was ever turning in repentance (toward Allah)\"},{\"a\":18,\"w\":[\"إِنَّا\",\"سَخَّرۡنَا\",\"ٱلۡجِبَالَ\",\"مَعَهُۥ\",\"يُسَبِّحۡنَ\",\"بِٱلۡعَشِيِّ\",\"وَٱلۡإِشۡرَاقِ\"],\"t\":\"Indeed, We subjected the mountains [to praise] with him, exalting [Allah] in the [late] afternoon and [after] sunrise\",\"pickthall\":\"Lo! We subdued the hills to hymn the praises (of their Lord) with him at nightfall and sunrise\"},{\"a\":19,\"w\":[\"وَٱلطَّيۡرَ\",\"مَحۡشُورَةٗۖ\",\"كُلّٞ\",\"لَّهُۥٓ\",\"أَوَّابٞ\"],\"t\":\"And the birds were assembled, all with him repeating [praises]\",\"pickthall\":\"And the birds assembled; all were turning unto Him\"},{\"a\":20,\"w\":[\"وَشَدَدۡنَا\",\"مُلۡكَهُۥ\",\"وَءَاتَيۡنَٰهُ\",\"ٱلۡحِكۡمَةَ\",\"وَفَصۡلَ\",\"ٱلۡخِطَابِ\"],\"t\":\"And We strengthened his kingdom and gave him wisdom and discernment in speech\",\"pickthall\":\"We made his kingdom strong and gave him wisdom and decisive speech\"},{\"a\":21,\"w\":[\"۞وَهَلۡ\",\"أَتَىٰكَ\",\"نَبَؤُاْ\",\"ٱلۡخَصۡمِ\",\"إِذۡ\",\"تَسَوَّرُواْ\",\"ٱلۡمِحۡرَابَ\"],\"t\":\"And has there come to you the news of the adversaries, when they climbed over the wall of [his] prayer chamber\",\"pickthall\":\"And hath the story of the litigants come unto thee? How they climbed the wall into the royal chamber\"},{\"a\":22,\"w\":[\"إِذۡ\",\"دَخَلُواْ\",\"عَلَىٰ\",\"دَاوُۥدَ\",\"فَفَزِعَ\",\"مِنۡهُمۡۖ\",\"قَالُواْ\",\"لَا\",\"تَخَفۡۖ\",\"خَصۡمَانِ\",\"بَغَىٰ\",\"بَعۡضُنَا\",\"عَلَىٰ\",\"بَعۡضٖ\",\"فَٱحۡكُم\",\"بَيۡنَنَا\",\"بِٱلۡحَقِّ\",\"وَلَا\",\"تُشۡطِطۡ\",\"وَٱهۡدِنَآ\",\"إِلَىٰ\",\"سَوَآءِ\",\"ٱلصِّرَٰطِ\"],\"t\":\"When they entered upon David and he was alarmed by them? They said, \\\"Fear not. [We are] two adversaries, one of whom has wronged the other, so judge between us with truth and do not exceed [it] and guide us to the sound path\",\"pickthall\":\"How they burst in upon David, and he was afraid of them. They said: Be not afraid! (We are) two litigants, one of whom hath wronged the other, therefor judge aright between us; be not unjust; and show us the fair way\"},{\"a\":23,\"w\":[\"إِنَّ\",\"هَٰذَآ\",\"أَخِي\",\"لَهُۥ\",\"تِسۡعٞ\",\"وَتِسۡعُونَ\",\"نَعۡجَةٗ\",\"وَلِيَ\",\"نَعۡجَةٞ\",\"وَٰحِدَةٞ\",\"فَقَالَ\",\"أَكۡفِلۡنِيهَا\",\"وَعَزَّنِي\",\"فِي\",\"ٱلۡخِطَابِ\"],\"t\":\"Indeed this, my brother, has ninety-nine ewes, and I have one ewe; so he said, 'Entrust her to me,' and he overpowered me in speech\",\"pickthall\":\"Lo! this my brother hath ninety and nine ewes while I had one ewe; and he said: Entrust it to me, and he conquered me in speech\"},{\"a\":24,\"w\":[\"قَالَ\",\"لَقَدۡ\",\"ظَلَمَكَ\",\"بِسُؤَالِ\",\"نَعۡجَتِكَ\",\"إِلَىٰ\",\"نِعَاجِهِۦۖ\",\"وَإِنَّ\",\"كَثِيرٗا\",\"مِّنَ\",\"ٱلۡخُلَطَآءِ\",\"لَيَبۡغِي\",\"بَعۡضُهُمۡ\",\"عَلَىٰ\",\"بَعۡضٍ\",\"إِلَّا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"وَقَلِيلٞ\",\"مَّا\",\"هُمۡۗ\",\"وَظَنَّ\",\"دَاوُۥدُ\",\"أَنَّمَا\",\"فَتَنَّـٰهُ\",\"فَٱسۡتَغۡفَرَ\",\"رَبَّهُۥ\",\"وَخَرَّۤ\",\"رَاكِعٗاۤ\",\"وَأَنَابَ۩\"],\"t\":\"[David] said, \\\"He has certainly wronged you in demanding your ewe [in addition] to his ewes. And indeed, many associates oppress one another, except for those who believe and do righteous deeds - and few are they.\\\" And David became certain that We had tried him, and he asked forgiveness of his Lord and fell down bowing [in prostration] and turned in repentance [to Allah]\",\"pickthall\":\"(David) said: He hath wronged thee in demanding thine ewe in addition to his ewes, and lo! many partners oppress one another, save such as believe and do good works, and they are few. And David guessed that We had tried him, and he sought forgiveness of his Lord, and he bowed himself and fell down prostrate and repented\"},{\"a\":25,\"w\":[\"فَغَفَرۡنَا\",\"لَهُۥ\",\"ذَٰلِكَۖ\",\"وَإِنَّ\",\"لَهُۥ\",\"عِندَنَا\",\"لَزُلۡفَىٰ\",\"وَحُسۡنَ\",\"مَـَٔابٖ\"],\"t\":\"So We forgave him that; and indeed, for him is nearness to Us and a good place of return\",\"pickthall\":\"So We forgave him that; and lo! he had access to Our presence and a happy journey's end\"},{\"a\":26,\"w\":[\"يَٰدَاوُۥدُ\",\"إِنَّا\",\"جَعَلۡنَٰكَ\",\"خَلِيفَةٗ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"فَٱحۡكُم\",\"بَيۡنَ\",\"ٱلنَّاسِ\",\"بِٱلۡحَقِّ\",\"وَلَا\",\"تَتَّبِعِ\",\"ٱلۡهَوَىٰ\",\"فَيُضِلَّكَ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِۚ\",\"إِنَّ\",\"ٱلَّذِينَ\",\"يَضِلُّونَ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِ\",\"لَهُمۡ\",\"عَذَابٞ\",\"شَدِيدُۢ\",\"بِمَا\",\"نَسُواْ\",\"يَوۡمَ\",\"ٱلۡحِسَابِ\"],\"t\":\"[We said], \\\"O David, indeed We have made you a successor upon the earth, so judge between the people in truth and do not follow [your own] desire, as it will lead you astray from the way of Allah.\\\" Indeed, those who go astray from the way of Allah will have a severe punishment for having forgotten the Day of Account\",\"pickthall\":\"(And it was said unto him): O David! Lo! We have set thee as a viceroy in the earth; therefor judge aright between mankind, and follow not desire that it beguile thee from the way of Allah. Lo! those who wander from the way of Allah have an awful doom, forasmuch as they forgot the Day of Reckoning\"},{\"a\":27,\"w\":[\"وَمَا\",\"خَلَقۡنَا\",\"ٱلسَّمَآءَ\",\"وَٱلۡأَرۡضَ\",\"وَمَا\",\"بَيۡنَهُمَا\",\"بَٰطِلٗاۚ\",\"ذَٰلِكَ\",\"ظَنُّ\",\"ٱلَّذِينَ\",\"كَفَرُواْۚ\",\"فَوَيۡلٞ\",\"لِّلَّذِينَ\",\"كَفَرُواْ\",\"مِنَ\",\"ٱلنَّارِ\"],\"t\":\"And We did not create the heaven and the earth and that between them aimlessly. That is the assumption of those who disbelieve, so woe to those who disbelieve from the Fire\",\"pickthall\":\"And We created not the heaven and the earth and all that is between them in vain. That is the opinion of those who disbelieve. And woe unto those who disbelieve, from the Fire\"},{\"a\":28,\"w\":[\"أَمۡ\",\"نَجۡعَلُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"كَٱلۡمُفۡسِدِينَ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"أَمۡ\",\"نَجۡعَلُ\",\"ٱلۡمُتَّقِينَ\",\"كَٱلۡفُجَّارِ\"],\"t\":\"Or should we treat those who believe and do righteous deeds like corrupters in the land? Or should We treat those who fear Allah like the wicked\",\"pickthall\":\"Shall We treat those who believe and do good works as those who spread corruption in the earth; or shall We treat the pious as the wicked\"},{\"a\":29,\"w\":[\"كِتَٰبٌ\",\"أَنزَلۡنَٰهُ\",\"إِلَيۡكَ\",\"مُبَٰرَكٞ\",\"لِّيَدَّبَّرُوٓاْ\",\"ءَايَٰتِهِۦ\",\"وَلِيَتَذَكَّرَ\",\"أُوْلُواْ\",\"ٱلۡأَلۡبَٰبِ\"],\"t\":\"[This is] a blessed Book which We have revealed to you, [O Muhammad], that they might reflect upon its verses and that those of understanding would be reminded\",\"pickthall\":\"(This is) a Scripture that We have revealed unto thee, full of blessing, that they may ponder its revelations, and that men of understanding may reflect\"},{\"a\":30,\"w\":[\"وَوَهَبۡنَا\",\"لِدَاوُۥدَ\",\"سُلَيۡمَٰنَۚ\",\"نِعۡمَ\",\"ٱلۡعَبۡدُ\",\"إِنَّهُۥٓ\",\"أَوَّابٌ\"],\"t\":\"And to David We gave Solomon. An excellent servant, indeed he was one repeatedly turning back [to Allah]\",\"pickthall\":\"And We bestowed on David, Solomon. How excellent a slave! Lo! he was ever turning in repentance (toward Allah)\"},{\"a\":31,\"w\":[\"إِذۡ\",\"عُرِضَ\",\"عَلَيۡهِ\",\"بِٱلۡعَشِيِّ\",\"ٱلصَّـٰفِنَٰتُ\",\"ٱلۡجِيَادُ\"],\"t\":\"[Mention] when there were exhibited before him in the afternoon the poised [standing] racehorses\",\"pickthall\":\"When there were shown to him at eventide lightfooted coursers\"},{\"a\":32,\"w\":[\"فَقَالَ\",\"إِنِّيٓ\",\"أَحۡبَبۡتُ\",\"حُبَّ\",\"ٱلۡخَيۡرِ\",\"عَن\",\"ذِكۡرِ\",\"رَبِّي\",\"حَتَّىٰ\",\"تَوَارَتۡ\",\"بِٱلۡحِجَابِ\"],\"t\":\"And he said, \\\"Indeed, I gave preference to the love of good [things] over the remembrance of my Lord until the sun disappeared into the curtain [of darkness]\",\"pickthall\":\"And he said: Lo! I have preferred the good things (of the world) to the remembrance of my Lord; till they were taken out of sight behind the curtain\"},{\"a\":33,\"w\":[\"رُدُّوهَا\",\"عَلَيَّۖ\",\"فَطَفِقَ\",\"مَسۡحَۢا\",\"بِٱلسُّوقِ\",\"وَٱلۡأَعۡنَاقِ\"],\"t\":\"[He said], \\\"Return them to me,\\\" and set about striking [their] legs and necks\",\"pickthall\":\"(Then he said): Bring them back to me, and fell to slashing (with his sword their) legs and necks\"},{\"a\":34,\"w\":[\"وَلَقَدۡ\",\"فَتَنَّا\",\"سُلَيۡمَٰنَ\",\"وَأَلۡقَيۡنَا\",\"عَلَىٰ\",\"كُرۡسِيِّهِۦ\",\"جَسَدٗا\",\"ثُمَّ\",\"أَنَابَ\"],\"t\":\"And We certainly tried Solomon and placed on his throne a body; then he returned\",\"pickthall\":\"And verily We tried Solomon, and set upon his throne a (mere) body. Then did he repent\"},{\"a\":35,\"w\":[\"قَالَ\",\"رَبِّ\",\"ٱغۡفِرۡ\",\"لِي\",\"وَهَبۡ\",\"لِي\",\"مُلۡكٗا\",\"لَّا\",\"يَنۢبَغِي\",\"لِأَحَدٖ\",\"مِّنۢ\",\"بَعۡدِيٓۖ\",\"إِنَّكَ\",\"أَنتَ\",\"ٱلۡوَهَّابُ\"],\"t\":\"He said, \\\"My Lord, forgive me and grant me a kingdom such as will not belong to anyone after me. Indeed, You are the Bestower\",\"pickthall\":\"He said: My Lord! Forgive me and bestow on me sovereignty such as shall not belong to any after me. Lo! Thou art the Bestower\"},{\"a\":36,\"w\":[\"فَسَخَّرۡنَا\",\"لَهُ\",\"ٱلرِّيحَ\",\"تَجۡرِي\",\"بِأَمۡرِهِۦ\",\"رُخَآءً\",\"حَيۡثُ\",\"أَصَابَ\"],\"t\":\"So We subjected to him the wind blowing by his command, gently, wherever he directed\",\"pickthall\":\"So We made the wind subservient unto him, setting fair by his command whithersoever he intended\"},{\"a\":37,\"w\":[\"وَٱلشَّيَٰطِينَ\",\"كُلَّ\",\"بَنَّآءٖ\",\"وَغَوَّاصٖ\"],\"t\":\"And [also] the devils [of jinn] - every builder and diver\",\"pickthall\":\"And the unruly, every builder and diver (made We subservient)\"},{\"a\":38,\"w\":[\"وَءَاخَرِينَ\",\"مُقَرَّنِينَ\",\"فِي\",\"ٱلۡأَصۡفَادِ\"],\"t\":\"And others bound together in shackles\",\"pickthall\":\"And others linked together in chains\"},{\"a\":39,\"w\":[\"هَٰذَا\",\"عَطَآؤُنَا\",\"فَٱمۡنُنۡ\",\"أَوۡ\",\"أَمۡسِكۡ\",\"بِغَيۡرِ\",\"حِسَابٖ\"],\"t\":\"[We said], \\\"This is Our gift, so grant or withhold without account\",\"pickthall\":\"(Saying): This is Our gift, so bestow thou, or withhold, without reckoning\"},{\"a\":40,\"w\":[\"وَإِنَّ\",\"لَهُۥ\",\"عِندَنَا\",\"لَزُلۡفَىٰ\",\"وَحُسۡنَ\",\"مَـَٔابٖ\"],\"t\":\"And indeed, for him is nearness to Us and a good place of return\",\"pickthall\":\"And lo! he hath favour with Us, and a happy journey's end\"},{\"a\":41,\"w\":[\"وَٱذۡكُرۡ\",\"عَبۡدَنَآ\",\"أَيُّوبَ\",\"إِذۡ\",\"نَادَىٰ\",\"رَبَّهُۥٓ\",\"أَنِّي\",\"مَسَّنِيَ\",\"ٱلشَّيۡطَٰنُ\",\"بِنُصۡبٖ\",\"وَعَذَابٍ\"],\"t\":\"And remember Our servant Job, when he called to his Lord, \\\"Indeed, Satan has touched me with hardship and torment\",\"pickthall\":\"And make mention (O Muhammad) of Our bondman Job, when he cried unto his Lord (saying): Lo! the devil doth afflict me with distress and torment\"},{\"a\":42,\"w\":[\"ٱرۡكُضۡ\",\"بِرِجۡلِكَۖ\",\"هَٰذَا\",\"مُغۡتَسَلُۢ\",\"بَارِدٞ\",\"وَشَرَابٞ\"],\"t\":\"[So he was told], \\\"Strike [the ground] with your foot; this is a :\"And indeed they are, to Us, among the chosen and outstanding\",\"pickthall\":\"Lo! in Our sight they are verily of the elect, the excellent\"},{\"a\":48,\"w\":[\"وَٱذۡكُرۡ\",\"إِسۡمَٰعِيلَ\",\"وَٱلۡيَسَعَ\",\"وَذَا\",\"ٱلۡكِفۡلِۖ\",\"وَكُلّٞ\",\"مِّنَ\",\"ٱلۡأَخۡيَارِ\"],\"t\":\"And remember Ishmael, Elisha and Dhul-Kifl, and all are among the outstanding\",\"pickthall\":\"And make mention of Ishmael and Elisha and Dhu'l-Kifl. All are of the chosen\"},{\"a\":49,\"w\":[\"هَٰذَا\",\"ذِكۡرٞۚ\",\"وَإِنَّ\",\"لِلۡمُتَّقِينَ\",\"لَحُسۡنَ\",\"مَـَٔابٖ\"],\"t\":\"This is a reminder. And indeed, for the righteous is a good place of return\",\"pickthall\":\"This is a reminder. And lo! for those who ward off (evil) is a happy journey's end\"},{\"a\":50,\"w\":[\"جَنَّـٰتِ\",\"عَدۡنٖ\",\"مُّفَتَّحَةٗ\",\"لَّهُمُ\",\"ٱلۡأَبۡوَٰبُ\"],\"t\":\"Gardens of perpetual residence, whose doors will be opened to them\",\"pickthall\":\"Gardens of Eden, whereof the gates are opened for them\"},{\"a\":51,\"w\":[\"مُتَّكِـِٔينَ\",\"فِيهَا\",\"يَدۡعُونَ\",\"فِيهَا\",\"بِفَٰكِهَةٖ\",\"كَثِيرَةٖ\",\"وَشَرَابٖ\"],\"t\":\"Reclining within them, they will call therein for abundant fruit and drink\",\"pickthall\":\"Wherein, reclining, they call for plenteous fruit and cool drink (that is) therein\"},{\"a\":52,\"w\":[\"۞وَعِندَهُمۡ\",\"قَٰصِرَٰتُ\",\"ٱلطَّرۡفِ\",\"أَتۡرَابٌ\"],\"t\":\"And with them will be women limiting [their] glances and of equal age\",\"pickthall\":\"And with them are those of modest gaze, companions\"},{\"a\":53,\"w\":[\"هَٰذَا\",\"مَا\",\"تُوعَدُونَ\",\"لِيَوۡمِ\",\"ٱلۡحِسَابِ\"],\"t\":\"This is what you, [the righteous], are promised for the Day of Account\",\"pickthall\":\"This it is that ye are promised for the Day of Reckoning\"},{\"a\":54,\"w\":[\"إِنَّ\",\"هَٰذَا\",\"لَرِزۡقُنَا\",\"مَا\",\"لَهُۥ\",\"مِن\",\"نَّفَادٍ\"],\"t\":\"Indeed, this is Our provision; for it there is no depletion\",\"pickthall\":\"Lo! this in truth is Our provision, which will never waste away\"},{\"a\":55,\"w\":[\"هَٰذَاۚ\",\"وَإِنَّ\",\"لِلطَّـٰغِينَ\",\"لَشَرَّ\",\"مَـَٔابٖ\"],\"t\":\"This [is so]. But indeed, for the transgressors is an evil place of return\",\"pickthall\":\"This (is for the righteous). And lo! for the transgressors there with be an evil journey's end\"},{\"a\":56,\"w\":[\"جَهَنَّمَ\",\"يَصۡلَوۡنَهَا\",\"فَبِئۡسَ\",\"ٱلۡمِهَادُ\"],\"t\":\"Hell, which they will [enter to] burn, and wretched is the resting place\",\"pickthall\":\"Hell, where they will burn, an evil resting-place\"},{\"a\":57,\"w\":[\"هَٰذَا\",\"فَلۡيَذُوقُوهُ\",\"حَمِيمٞ\",\"وَغَسَّاقٞ\"],\"t\":\"This - so let them taste it - is scalding water and [foul] purulence\",\"pickthall\":\"Here is a boiling and an ice-cold draught, so let them taste it\"},{\"a\":58,\"w\":[\"وَءَاخَرُ\",\"مِن\",\"شَكۡلِهِۦٓ\",\"أَزۡوَٰجٌ\"],\"t\":\"And other [punishments] of its type [in various] kinds\",\"pickthall\":\"And other (torment) of the kind in pairs (the two extremes)\"},{\"a\":59,\"w\":[\"هَٰذَا\",\"فَوۡجٞ\",\"مُّقۡتَحِمٞ\",\"مَّعَكُمۡ\",\"لَا\",\"مَرۡحَبَۢا\",\"بِهِمۡۚ\",\"إِنَّهُمۡ\",\"صَالُواْ\",\"ٱلنَّارِ\"],\"t\":\"[Its inhabitants will say], \\\"This is a company bursting in with you. No welcome for them. Indeed, they will burn in the Fire\",\"pickthall\":\"Here is an army rushing blindly with you. (Those who are already in the Fire say): No word of welcome for them. Lo! they will roast at the Fire\"},{\"a\":60,\"w\":[\"قَالُواْ\",\"بَلۡ\",\"أَنتُمۡ\",\"لَا\",\"مَرۡحَبَۢا\",\"بِكُمۡۖ\",\"أَنتُمۡ\",\"قَدَّمۡتُمُوهُ\",\"لَنَاۖ\",\"فَبِئۡسَ\",\"ٱلۡقَرَارُ\"],\"t\":\"They will say, \\\"Nor you! No welcome for you. You, [our leaders], brought this upon us, and wretched is the settlement\",\"pickthall\":\"They say: Nay, but you (misleaders), for you there is no word of welcome. Ye prepared this for us (by your misleading). Now hapless is the plight\"},{\"a\":61,\"w\":[\"قَالُواْ\",\"رَبَّنَا\",\"مَن\",\"قَدَّمَ\",\"لَنَا\",\"هَٰذَا\",\"فَزِدۡهُ\",\"عَذَابٗا\",\"ضِعۡفٗا\",\"فِي\",\"ٱلنَّ
