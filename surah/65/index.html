ll,{\"className\":\"mt-8\",\"children\":[\"$\",\"$17\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"text-center text-sm text-muted\",\"children\":\"Loading verses…\"}],\"children\":[\"$\",\"$L1d\",null,{\"surahMeta\":{\"n\":65,\"nameAr\":\"الطلاق\",\"nameEn\":\"The Divorce\",\"translit\":\"At-Talaq\",\"type\":\"medinan\",\"ayahs\":12},\"verses\":[{\"a\":1,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلنَّبِيُّ\",\"إِذَا\",\"طَلَّقۡتُمُ\",\"ٱلنِّسَآءَ\",\"فَطَلِّقُوهُنَّ\",\"لِعِدَّتِهِنَّ\",\"وَأَحۡصُواْ\",\"ٱلۡعِدَّةَۖ\",\"وَٱتَّقُواْ\",\"ٱللَّهَ\",\"رَبَّكُمۡۖ\",\"لَا\",\"تُخۡرِجُوهُنَّ\",\"مِنۢ\",\"بُيُوتِهِنَّ\",\"وَلَا\",\"يَخۡرُجۡنَ\",\"إِلَّآ\",\"أَن\",\"يَأۡتِينَ\",\"بِفَٰحِشَةٖ\",\"مُّبَيِّنَةٖۚ\",\"وَتِلۡكَ\",\"حُدُودُ\",\"ٱللَّهِۚ\",\"وَمَن\",\"يَتَعَدَّ\",\"حُدُودَ\",\"ٱللَّهِ\",\"فَقَدۡ\",\"ظَلَمَ\",\"نَفۡسَهُۥۚ\",\"لَا\",\"تَدۡرِي\",\"لَعَلَّ\",\"ٱللَّهَ\",\"يُحۡدِثُ\",\"بَعۡدَ\",\"ذَٰلِكَ\",\"أَمۡرٗا\"],\"t\":\"O Prophet, when you [Muslims] divorce women, divorce them for [the commencement of] their waiting period and keep count of the waiting period, and fear Allah, your Lord. Do not turn them out of their [husbands'] houses, nor should they [themselves] leave [during that period] unless they are committing a clear immorality. And those are the limits [set by] Allah. And whoever transgresses the limits of Allah has certainly wronged himself. You know not; perhaps Allah will bring about after that a [different] matter\",\"pickthall\":\"O Prophet! When ye (men) put away women, put them away for their (legal) period and reckon the period, and keep your duty to Allah, your Lord. Expel them not from their houses nor let them go forth unless they commit open immorality. Such are the limits (imposed by) Allah; and whoso transgresseth Allah's limits, he verily wrongeth his soul. Thou knowest not: it may be that Allah will afterward bring some new thing to pass\"},{\"a\":2,\"w\":[\"فَإِذَا\",\"بَلَغۡنَ\",\"أَجَلَهُنَّ\",\"فَأَمۡسِكُوهُنَّ\",\"بِمَعۡرُوفٍ\",\"أَوۡ\",\"فَارِقُوهُنَّ\",\"بِمَعۡرُوفٖ\",\"وَأَشۡهِدُواْ\",\"ذَوَيۡ\",\"عَدۡلٖ\",\"مِّنكُمۡ\",\"وَأَقِيمُواْ\",\"ٱلشَّهَٰدَةَ\",\"لِلَّهِۚ\",\"ذَٰلِكُمۡ\",\"يُوعَظُ\",\"بِهِۦ\",\"مَن\",\"كَانَ\",\"يُؤۡمِنُ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِۚ\",\"وَمَن\",\"يَتَّقِ\",\"ٱللَّهَ\",\"يَجۡعَل\",\"لَّهُۥ\",\"مَخۡرَجٗا\"],\"t\":\"And when they have [nearly] fulfilled their term, either retain them according to acceptable terms or part with them according to acceptable terms. And bring to witness two just men from among you and establish the testimony for [the acceptance of] Allah. That is instructed to whoever should believe in Allah and the Last day. And whoever fears Allah - He will make for him a way out\",\"pickthall\":\"Then, when they have reached their term, take them back in kindness or part from them in kindness, and call to witness two just men among you, and keep your testimony upright for Allah. Whoso believeth in Allah and the Last Day is exhorted to act thus. And whosoever keepeth his duty to Allah, Allah will appoint a way out for him\"},{\"a\":3,\"w\":[\"وَيَرۡزُقۡهُ\",\"مِنۡ\",\"حَيۡثُ\",\"لَا\",\"يَحۡتَسِبُۚ\",\"وَمَن\",\"يَتَوَكَّلۡ\",\"عَلَى\",\"ٱللَّهِ\",\"فَهُوَ\",\"حَسۡبُهُۥٓۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"بَٰلِغُ\",\"أَمۡرِهِۦۚ\",\"قَدۡ\",\"جَعَلَ\",\"ٱللَّهُ\",\"لِكُلِّ\",\"شَيۡءٖ\",\"قَدۡرٗا\"],\"t\":\"And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent\",\"pickthall\":\"And will provide for him from (a quarter) whence he hath no expectation. And whosoever putteth his trust in Allah, He will suffice him. Lo! Allah bringeth His command to pass. Allah hath set a measure for all things\"},{\"a\":4,\"w\":[\"وَٱلَّـٰٓـِٔي\",\"يَئِسۡنَ\",\"مِنَ\",\"ٱلۡمَحِيضِ\",\"مِن\",\"نِّسَآئِكُمۡ\",\"إِنِ\",\"ٱرۡتَبۡتُمۡ\",\"فَعِدَّتُهُنَّ\",\"ثَلَٰثَةُ\",\"أَشۡهُرٖ\",\"وَٱلَّـٰٓـِٔي\",\"لَمۡ\",\"يَحِضۡنَۚ\",\"وَأُوْلَٰتُ\",\"ٱلۡأَحۡمَالِ\",\"أَجَلُهُنَّ\",\"أَن\",\"يَضَعۡنَ\",\"حَمۡلَهُنَّۚ\",\"وَمَن\",\"يَتَّقِ\",\"ٱللَّهَ\",\"يَجۡعَل\",\"لَّهُۥ\",\"مِنۡ\",\"أَمۡرِهِۦ\",\"يُسۡرٗا\"],\"t\":\"And those who no longer expect menstruation among your women - if you doubt, then their period is three months, and [also for] those who have not menstruated. And for those who are pregnant, their term is until they give birth. And whoever fears Allah - He will make for him of his matter ease\",\"pickthall\":\"And for such of your women as despair of menstruation, if ye doubt, their period (of waiting) shall be three months, along with those who have it not. And for those with child, their period shall be till they bring forth their burden. And whosoever keepeth his duty to Allah, He maketh his course easy for him\"},{\"a\":5,\"w\":[\"ذَٰلِكَ\",\"أَمۡرُ\",\"ٱللَّهِ\",\"أَنزَلَهُۥٓ\",\"إِلَيۡكُمۡۚ\",\"وَمَن\",\"يَتَّقِ\",\"ٱللَّهَ\",\"يُكَفِّرۡ\",\"عَنۡهُ\",\"سَيِّـَٔاتِهِۦ\",\"وَيُعۡظِمۡ\",\"لَهُۥٓ\",\"أَجۡرًا\"],\"t\":\"That is the command of Allah, which He has sent down to you; and whoever fears Allah - He will remove for him his misdeeds and make great for him his reward\",\"pickthall\":\"That is the commandment of Allah which He revealeth unto you. And whoso keepeth his duty to Allah, He will remit from him his evil deeds and magnify reward for him\"},{\"a\":6,\"w\":[\"أَسۡكِنُوهُنَّ\",\"مِنۡ\",\"حَيۡثُ\",\"سَكَنتُم\",\"مِّن\",\"وُجۡدِكُمۡ\",\"وَلَا\",\"تُضَآرُّوهُنَّ\",\"لِتُضَيِّقُواْ\",\"عَلَيۡهِنَّۚ\",\"وَإِن\",\"كُنَّ\",\"أُوْلَٰتِ\",\"حَمۡلٖ\",\"فَأَنفِقُواْ\",\"عَلَيۡهِنَّ\",\"حَتَّىٰ\",\"يَضَعۡنَ\",\"حَمۡلَهُنَّۚ\",\"فَإِنۡ\",\"أَرۡضَعۡنَ\",\"لَكُمۡ\",\"فَـَٔاتُوهُنَّ\",\"أُجُورَهُنَّ\",\"وَأۡتَمِرُواْ\",\"بَيۡنَكُم\",\"بِمَعۡرُوفٖۖ\",\"وَإِن\",\"تَعَاسَرۡتُمۡ\",\"فَسَتُرۡضِعُ\",\"لَهُۥٓ\",\"أُخۡرَىٰ\"],\"t\":\"Lodge them [in a section] of where you dwell out of your means and do not harm them in order to oppress them. And if they should be pregnant, then spend on them until they give birth. And if they breastfeed for you, then give them their payment and confer among yourselves in the acceptable way; but if you are in discord, then there may breastfeed for the father another woman\",\"pickthall\":\"Lodge them where ye dwell, according to your wealth, and harass them not so as to straiten life for them. And if they are with child, then spend for them till they bring forth their burden. Then, if they give suck for you, give them their due payment and consult together in kindness; but if ye make difficulties for one another, then let some other woman give suck for him (the father of the child)\"},{\"a\":7,\"w\":[\"لِيُنفِقۡ\",\"ذُو\",\"سَعَةٖ\",\"مِّن\",\"سَعَتِهِۦۖ\",\"وَمَن\",\"قُدِرَ\",\"عَلَيۡهِ\",\"رِزۡقُهُۥ\",\"فَلۡيُنفِقۡ\",\"مِمَّآ\",\"ءَاتَىٰهُ\",\"ٱللَّهُۚ\",\"لَا\",\"يُكَلِّفُ\",\"ٱللَّهُ\",\"نَفۡسًا\",\"إِلَّا\",\"مَآ\",\"ءَاتَىٰهَاۚ\",\"سَيَجۡعَلُ\",\"ٱللَّهُ\",\"بَعۡدَ\",\"عُسۡرٖ\",\"يُسۡرٗا\"],\"t\":\"Let a man of wealth spend from his wealth, and he whose provision is restricted - let him spend from what Allah has given him. Allah does not charge a soul except [according to] what He has given it. Allah will bring about, after hardship, ease\",\"pickthall\":\"Let him who hath abundance spend of his abundance, and he whose provision is measured, let him spend of that which Allah hath given him. Allah asketh naught of any soul save that which He hath given it. Allah will vouchsafe, after hardship, ease\"},{\"a\":8,\"w\":[\"وَكَأَيِّن\",\"مِّن\",\"قَرۡيَةٍ\",\"عَتَتۡ\",\"عَنۡ\",\"أَمۡرِ\",\"رَبِّهَا\",\"وَرُسُلِهِۦ\",\"فَحَاسَبۡنَٰهَا\",\"حِسَابٗا\",\"شَدِيدٗا\",\"وَعَذَّبۡنَٰهَا\",\"عَذَابٗا\",\"نُّكۡرٗا\"],\"t\":\"And how many a city was insolent toward the command of its Lord and His messengers, so We took it to severe account and punished it with a terrible punishment\",\"pickthall\":\"And how many a community revolted against the ordinance of its Lord and His messengers, and We called it to a stern account and punished it with dire punishment\"},{\"a\":9,\"w\":[\"فَذَاقَتۡ\",\"وَبَالَ\",\"أَمۡرِهَا\",\"وَكَانَ\",\"عَٰقِبَةُ\",\"أَمۡرِهَا\",\"خُسۡرًا\"],\"t\":\"And it tasted the bad consequence of its affair, and the outcome of its affair was loss\",\"pickthall\":\"So that it tasted the ill-effects of its conduct, and the consequence of its conduct was loss\"},{\"a\":10,\"w\":[\"أَعَدَّ\",\"ٱللَّهُ\",\"لَهُمۡ\",\"عَذَابٗا\",\"شَدِيدٗاۖ\",\"فَٱتَّقُواْ\",\"ٱللَّهَ\",\"يَـٰٓأُوْلِي\",\"ٱلۡأَلۡبَٰبِ\",\"ٱلَّذِينَ\",\"ءَامَنُواْۚ\",\"قَدۡ\",\"أَنزَلَ\",\"ٱللَّهُ\",\"إِلَيۡكُمۡ\",\"ذِكۡرٗا\"],\"t\":\"Allah has prepared for them a severe punishment; so fear Allah, O you of understanding who have believed. Allah has sent down to you the Qur'an\",\"pickthall\":\"Allah hath prepared for them stern punishment; so keep your duty to Allah, O men of understanding! O ye who believe! Now Allah hath sent down unto you a reminder\"},{\"a\":11,\"w\":[\"رَّسُولٗا\",\"يَتۡلُواْ\",\"عَلَيۡكُمۡ\",\"ءَايَٰتِ\",\"ٱللَّهِ\",\"مُبَيِّنَٰتٖ\",\"لِّيُخۡرِجَ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"مِنَ\",\"ٱلظُّلُمَٰتِ\",\"إِلَى\",\"ٱلنُّورِۚ\",\"وَمَن\",\"يُؤۡمِنۢ\",\"بِٱللَّهِ\",\"وَيَعۡمَلۡ\",\"صَٰلِحٗا\",\"يُدۡخِلۡهُ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَآ\",\"أَبَدٗاۖ\",\"قَدۡ\",\"أَحۡسَنَ\",\"ٱللَّهُ\",\"لَهُۥ\",\"رِزۡقًا\"],\"t\":\"[He sent] a Messenger [Muhammad] reciting to you the distinct verses of Allah that He may bring out those who believe and do righteous deeds from darknesses into the light. And whoever believes in Allah and does righteousness - He will admit him into gardens beneath which rivers flow to abide therein forever. Allah will have perfected for him a provision\",\"pickthall\":\"A messenger reciting unto you the revelations of Allah made plain, that He may bring forth those who believe and do good works from darkness unto light. And whosoever believeth in Allah and doeth right, He will bring him into Gardens underneath which rivers flow, therein to abide for ever. Allah hath made good provision for him\"},{\"a\":12,\"w\":[\"ٱللَّهُ\",\"ٱلَّذِي\",\"خَلَقَ\",\"سَبۡعَ\",\"سَمَٰوَٰتٖ\",\"وَمِنَ\",\"ٱلۡأَرۡضِ\",\"مِثۡلَهُنَّۖ\",\"يَتَنَزَّلُ\",\"ٱلۡأَمۡرُ\",\"بَيۡنَهُنَّ\",\"لِتَعۡلَمُوٓاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٞ\",\"وَأَنَّ\",\"ٱللَّهَ\",\"قَدۡ\",\"أَحَاطَ\",\"بِكُلِّ\",\"شَيۡءٍ\",\"عِلۡمَۢا\"],\"t\":\"It is Allah who has created seven heavens and of the earth, the like of them. [His] command descends among them so you may know that Allah is over all things competent and that Allah has encompassed all things in knowledge\",\"pickthall\":\"Allah it is who hath created seven heavens, and of the earth the like thereof. The commandment cometh down among them slowly, that ye may know that Allah is Able to do all things, and that Allah surroundeth all things in knowledge\"}]}]}]}]]}]\n1a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1e:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n18:null\n1c:[[\"$\",\"title\",\"0\",{\"children\":\"At-Talaq — Surah 65 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"
