نِعۡمَتَهُۥ\",\"عَلَيۡكَ\",\"وَيَهۡدِيَكَ\",\"صِرَٰطٗا\",\"مُّسۡتَقِيمٗا\"],\"t\":\"That Allah may forgive for you what preceded of your sin and what will follow and complete His favor upon you and guide you to a straight path\"},{\"a\":3,\"w\":[\"وَيَنصُرَكَ\",\"ٱللَّهُ\",\"نَصۡرًا\",\"عَزِيزًا\"],\"t\":\"And [that] Allah may aid you with a mighty victory\"},{\"a\":4,\"w\":[\"هُوَ\",\"ٱلَّذِيٓ\",\"أَنزَلَ\",\"ٱلسَّكِينَةَ\",\"فِي\",\"قُلُوبِ\",\"ٱلۡمُؤۡمِنِينَ\",\"لِيَزۡدَادُوٓاْ\",\"إِيمَٰنٗا\",\"مَّعَ\",\"إِيمَٰنِهِمۡۗ\",\"وَلِلَّهِ\",\"جُنُودُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۚ\",\"وَكَانَ\",\"ٱللَّهُ\",\"عَلِيمًا\",\"حَكِيمٗا\"],\"t\":\"It is He who sent down tranquillity into the hearts of the believers that they would increase in faith along with their [present] faith. And to Allah belong the soldiers of the heavens and the earth, and ever is Allah Knowing and Wise\"},{\"a\":5,\"w\":[\"لِّيُدۡخِلَ\",\"ٱلۡمُؤۡمِنِينَ\",\"وَٱلۡمُؤۡمِنَٰتِ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَا\",\"وَيُكَفِّرَ\",\"عَنۡهُمۡ\",\"سَيِّـَٔاتِهِمۡۚ\",\"وَكَانَ\",\"ذَٰلِكَ\",\"عِندَ\",\"ٱللَّهِ\",\"فَوۡزًا\",\"عَظِيمٗا\"],\"t\":\"[And] that He may admit the believing men and the believing women to gardens beneath which rivers flow to abide therein eternally and remove from them their misdeeds - and ever is that, in the sight of Allah, a great attainment\"},{\"a\":6,\"w\":[\"وَيُعَذِّبَ\",\"ٱلۡمُنَٰفِقِينَ\",\"وَٱلۡمُنَٰفِقَٰتِ\",\"وَٱلۡمُشۡرِكِينَ\",\"وَٱلۡمُشۡرِكَٰتِ\",\"ٱلظَّآنِّينَ\",\"بِٱللَّهِ\",\"ظَنَّ\",\"ٱلسَّوۡءِۚ\",\"عَلَيۡهِمۡ\",\"دَآئِرَةُ\",\"ٱلسَّوۡءِۖ\",\"وَغَضِبَ\",\"ٱللَّهُ\",\"عَلَيۡهِمۡ\",\"وَلَعَنَهُمۡ\",\"وَأَعَدَّ\",\"لَهُمۡ\",\"جَهَنَّمَۖ\",\"وَسَآءَتۡ\",\"مَصِيرٗا\"],\"t\":\"And [that] He may punish the hypocrite men and hypocrite women, and the polytheist men and polytheist women - those who assume about Allah an assumption of evil nature. Upon them is a misfortune of evil nature; and Allah has become angry with them and has cursed them and prepared for them Hell, and evil it is as a destination\"},{\"a\":7,\"w\":[\"وَلِلَّهِ\",\"جُنُودُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۚ\",\"وَكَانَ\",\"ٱللَّهُ\",\"عَزِيزًا\",\"حَكِيمًا\"],\"t\":\"And to Allah belong the soldiers of the heavens and the earth. And ever is Allah Exalted in Might and Wise\"},{\"a\":8,\"w\":[\"إِنَّآ\",\"أَرۡسَلۡنَٰكَ\",\"شَٰهِدٗا\",\"وَمُبَشِّرٗا\",\"وَنَذِيرٗا\"],\"t\":\"Indeed, We have sent you as a witness and a bringer of good tidings and a warner\"},{\"a\":9,\"w\":[\"لِّتُؤۡمِنُواْ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦ\",\"وَتُعَزِّرُوهُ\",\"وَتُوَقِّرُوهُۚ\",\"وَتُسَبِّحُوهُ\",\"بُكۡرَةٗ\",\"وَأَصِيلًا\"],\"t\":\"That you [people] may believe in Allah and His Messenger and honor him and respect the Prophet and exalt Allah morning and afternoon\"},{\"a\":10,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"يُبَايِعُونَكَ\",\"إِنَّمَا\",\"يُبَايِعُونَ\",\"ٱللَّهَ\",\"يَدُ\",\"ٱللَّهِ\",\"فَوۡقَ\",\"أَيۡدِيهِمۡۚ\",\"فَمَن\",\"نَّكَثَ\",\"فَإِنَّمَا\",\"يَنكُثُ\",\"عَلَىٰ\",\"نَفۡسِهِۦۖ\",\"وَمَنۡ\",\"أَوۡفَىٰ\",\"بِمَا\",\"عَٰهَدَ\",\"عَلَيۡهُ\",\"ٱللَّهَ\",\"فَسَيُؤۡتِيهِ\",\"أَجۡرًا\",\"عَظِيمٗا\"],\"t\":\"Indeed, those who pledge allegiance to you, [O Muhammad] - they are actually pledging allegiance to Allah. The hand of Allah is over their hands. So he who breaks his word only breaks it to the detriment of himself. And he who fulfills that which he has promised Allah - He will give him a great reward\"},{\"a\":11,\"w\":[\"سَيَقُولُ\",\"لَكَ\",\"ٱلۡمُخَلَّفُونَ\",\"مِنَ\",\"ٱلۡأَعۡرَابِ\",\"شَغَلَتۡنَآ\",\"أَمۡوَٰلُنَا\",\"وَأَهۡلُونَا\",\"فَٱسۡتَغۡفِرۡ\",\"لَنَاۚ\",\"يَقُولُونَ\",\"بِأَلۡسِنَتِهِم\",\"مَّا\",\"لَيۡسَ\",\"فِي\",\"قُلُوبِهِمۡۚ\",\"قُلۡ\",\"فَمَن\",\"يَمۡلِكُ\",\"لَكُم\",\"مِّنَ\",\"ٱللَّهِ\",\"شَيۡـًٔا\",\"إِنۡ\",\"أَرَادَ\",\"بِكُمۡ\",\"ضَرًّا\",\"أَوۡ\",\"أَرَادَ\",\"بِكُمۡ\",\"نَفۡعَۢاۚ\",\"بَلۡ\",\"كَانَ\",\"ٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"خَبِيرَۢا\"],\"t\":\"Those who remained behind of the bedouins will say to you, \\\"Our properties and our families occupied us, so ask forgiveness for us.\\\" They say with their tongues what is not within their hearts. Say, \\\"Then who could prevent Allah at all if He intended for you harm or intended for you benefit? Rather, ever is Allah, with what you do, Acquainted\"},{\"a\":12,\"w\":[\"بَلۡ\",\"ظَنَنتُمۡ\",\"أَن\",\"لَّن\",\"يَنقَلِبَ\",\"ٱلرَّسُولُ\",\"وَٱلۡمُؤۡمِنُونَ\",\"إِلَىٰٓ\",\"أَهۡلِيهِمۡ\",\"أَبَدٗا\",\"وَزُيِّنَ\",\"ذَٰلِكَ\",\"فِي\",\"قُلُوبِكُمۡ\",\"وَظَنَنتُمۡ\",\"ظَنَّ\",\"ٱلسَّوۡءِ\",\"وَكُنتُمۡ\",\"قَوۡمَۢا\",\"بُورٗا\"],\"t\":\"But you thought that the Messenger and the believers would never return to their families, ever, and that was made pleasing in your hearts. And you assumed an assumption of evil and became a people ruined\"},{\"a\":13,\"w\":[\"وَمَن\",\"لَّمۡ\",\"يُؤۡمِنۢ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦ\",\"فَإِنَّآ\",\"أَعۡتَدۡنَا\",\"لِلۡكَٰفِرِينَ\",\"سَعِيرٗا\"],\"t\":\"And whoever has not believed in Allah and His Messenger - then indeed, We have prepared for the disbelievers a Blaze\"},{\"a\":14,\"w\":[\"وَلِلَّهِ\",\"مُلۡكُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۚ\",\"يَغۡفِرُ\",\"لِمَن\",\"يَشَآءُ\",\"وَيُعَذِّبُ\",\"مَن\",\"يَشَآءُۚ\",\"وَكَانَ\",\"ٱللَّهُ\",\"غَفُورٗا\",\"رَّحِيمٗا\"],\"t\":\"And to Allah belongs the dominion of the heavens and the earth. He forgives whom He wills and punishes whom He wills. And ever is Allah Forgiving and Merciful\"},{\"a\":15,\"w\":[\"سَيَقُولُ\",\"ٱلۡمُخَلَّفُونَ\",\"إِذَا\",\"ٱنطَلَقۡتُمۡ\",\"إِلَىٰ\",\"مَغَانِمَ\",\"لِتَأۡخُذُوهَا\",\"ذَرُونَا\",\"نَتَّبِعۡكُمۡۖ\",\"يُرِيدُونَ\",\"أَن\",\"يُبَدِّلُواْ\",\"كَلَٰمَ\",\"ٱللَّهِۚ\",\"قُل\",\"لَّن\",\"تَتَّبِعُونَا\",\"كَذَٰلِكُمۡ\",\"قَالَ\",\"ٱللَّهُ\",\"مِن\",\"قَبۡلُۖ\",\"فَسَيَقُولُونَ\",\"بَلۡ\",\"تَحۡسُدُونَنَاۚ\",\"بَلۡ\",\"كَانُواْ\",\"لَا\",\"يَفۡقَهُونَ\",\"إِلَّا\",\"قَلِيلٗا\"],\"t\":\"Those who remained behind will say when you set out toward the war booty to take it, \\\"Let us follow you.\\\" They wish to change the words of Allah. Say, \\\"Never will you follow us. Thus did Allah say before.\\\" So they will say, \\\"Rather, you envy us.\\\" But [in fact] they were not understanding except a little\"},{\"a\":16,\"w\":[\"قُل\",\"لِّلۡمُخَلَّفِينَ\",\"مِنَ\",\"ٱلۡأَعۡرَابِ\",\"سَتُدۡعَوۡنَ\",\"إِلَىٰ\",\"قَوۡمٍ\",\"أُوْلِي\",\"بَأۡسٖ\",\"شَدِيدٖ\",\"تُقَٰتِلُونَهُمۡ\",\"أَوۡ\",\"يُسۡلِمُونَۖ\",\"فَإِن\",\"تُطِيعُواْ\",\"يُؤۡتِكُمُ\",\"ٱللَّهُ\",\"أَجۡرًا\",\"حَسَنٗاۖ\",\"وَإِن\",\"تَتَوَلَّوۡاْ\",\"كَمَا\",\"تَوَلَّيۡتُم\",\"مِّن\",\"قَبۡلُ\",\"يُعَذِّبۡكُمۡ\",\"عَذَابًا\",\"أَلِيمٗا\"],\"t\":\"Say to those who remained behind of the bedouins, \\\"You will be called to [face] a people of great military might; you may fight them, or they will submit. So if you obey, Allah will give you a good reward; but if you turn away as you turned away before, He will punish you with a painful punishment\"},{\"a\":17,\"w\":[\"لَّيۡسَ\",\"عَلَى\",\"ٱلۡأَعۡمَىٰ\",\"حَرَجٞ\",\"وَلَا\",\"عَلَى\",\"ٱلۡأَعۡرَجِ\",\"حَرَجٞ\",\"وَلَا\",\"عَلَى\",\"ٱلۡمَرِيضِ\",\"حَرَجٞۗ\",\"وَمَن\",\"يُطِعِ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥ\",\"يُدۡخِلۡهُ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُۖ\",\"وَمَن\",\"يَتَوَلَّ\",\"يُعَذِّبۡهُ\",\"عَذَابًا\",\"أَلِيمٗا\"],\"t\":\"There is not upon the blind any guilt or upon the lame any guilt or upon the ill any guilt [for remaining behind]. And whoever obeys Allah and His Messenger - He will admit him to gardens beneath which rivers flow; but whoever turns away - He will punish him with a painful punishment\"},{\"a\":18,\"w\":[\"۞لَّقَدۡ\",\"رَضِيَ\",\"ٱللَّهُ\",\"عَنِ\",\"ٱلۡمُؤۡمِنِينَ\",\"إِذۡ\",\"يُبَايِعُونَكَ\",\"تَحۡتَ\",\"ٱلشَّجَرَةِ\",\"فَعَلِمَ\",\"مَا\",\"فِي\",\"قُلُوبِهِمۡ\",\"فَأَنزَلَ\",\"ٱلسَّكِينَةَ\",\"عَلَيۡهِمۡ\",\"وَأَثَٰبَهُمۡ\",\"فَتۡحٗا\",\"قَرِيبٗا\"],\"t\":\"Certainly was Allah pleased with the believers when they pledged allegiance to you, [O Muhammad], under the tree, and He knew what was in their hearts, so He sent down tranquillity upon them and rewarded them with an imminent conquest\"},{\"a\":19,\"w\":[\"وَمَغَانِمَ\",\"كَثِيرَةٗ\",\"يَأۡخُذُونَهَاۗ\",\"وَكَانَ\",\"ٱللَّهُ\",\"عَزِيزًا\",\"حَكِيمٗا\"],\"t\":\"And much war booty which they will take. And ever is Allah Exalted in Might and Wise\"},{\"a\":20,\"w\":[\"وَعَدَكُمُ\",\"ٱللَّهُ\",\"مَغَانِمَ\",\"كَثِيرَةٗ\",\"تَأۡخُذُونَهَا\",\"فَعَجَّلَ\",\"لَكُمۡ\",\"هَٰذِهِۦ\",\"وَكَفَّ\",\"أَيۡدِيَ\",\"ٱلنَّاسِ\",\"عَنكُمۡ\",\"وَلِتَكُونَ\",\"ءَايَةٗ\",\"لِّلۡمُؤۡمِنِينَ\",\"وَيَهۡدِيَكُمۡ\",\"صِرَٰطٗا\",\"مُّسۡتَقِيمٗا\"],\"t\":\"Allah has promised you much booty that you will take [in the future] and has hastened for you this [victory] and withheld the hands of people from you - that it may be a sign for the believers and [that] He may guide you to a straight path\"},{\"a\":21,\"w\":[\"وَأُخۡرَىٰ\",\"لَمۡ\",\"تَقۡدِرُواْ\",\"عَلَيۡهَا\",\"قَدۡ\",\"أَحَاطَ\",\"ٱللَّهُ\",\"بِهَاۚ\",\"وَكَانَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٗا\"],\"t\":\"And [He promises] other [victories] that you were [so far] unable to [realize] which Allah has already encompassed. And ever is Allah, over all things, competent\"},{\"a\":22,\"w\":[\"وَلَوۡ\",\"قَٰتَلَكُمُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لَوَلَّوُاْ\",\"ٱلۡأَدۡبَٰرَ\",\"ثُمَّ\",\"لَا\",\"يَجِدُونَ\",\"وَلِيّٗا\",\"وَلَا\",\"نَصِيرٗا\"],\"t\":\"And if those [Makkans] who disbelieve had fought you, they would have turned their backs [in flight]. Then they would not find a protector or a helper\"},{\"a\":23,\"w\":[\"سُنَّةَ\",\"ٱللَّهِ\",\"ٱلَّتِي\",\"قَدۡ\",\"خَلَتۡ\",\"مِن\",\"قَبۡلُۖ\",\"وَلَن\",\"تَجِدَ\",\"لِسُنَّةِ\",\"ٱللَّهِ\",\"تَبۡدِيلٗا\"],\"t\":\"[This is] the established way of Allah which has occurred before. And never will you find in the way of Allah any change\"},{\"a\":24,\"w\":[\"وَهُوَ\",\"ٱلَّذِي\",\"كَفَّ\",\"أَيۡدِيَهُمۡ\",\"عَنكُمۡ\",\"وَأَيۡدِيَكُمۡ\",\"عَنۡهُم\",\"بِبَطۡنِ\",\"مَكَّةَ\",\"مِنۢ\",\"بَعۡدِ\",\"أَنۡ\",\"أَظۡفَرَكُمۡ\",\"عَلَيۡهِمۡۚ\",\"وَكَانَ\",\"ٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"بَصِيرًا\"],\"t\":\"And it is He who withheld their hands from you and your hands from them within [the area of] Makkah after He caused you to overcome them. And ever is Allah of what you do, Seeing\"},{\"a\":25,\"w\":[\"هُمُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَصَدُّوكُمۡ\",\"عَنِ\",\"ٱلۡمَسۡجِدِ\",\"ٱلۡحَرَامِ\",\"وَٱلۡهَدۡيَ\",\"مَعۡكُوفًا\",\"أَن\",\"يَبۡلُغَ\",\"مَحِلَّهُۥۚ\",\"وَلَوۡلَا\",\"رِجَالٞ\",\"مُّؤۡمِنُونَ\",\"وَنِسَآءٞ\",\"مُّؤۡمِنَٰتٞ\",\"لَّمۡ\",\"تَعۡلَمُوهُمۡ\",\"أَن\",\"تَطَـُٔوهُمۡ\",\"فَتُصِيبَكُم\",\"مِّنۡهُم\",\"مَّعَرَّةُۢ\",\"بِغَيۡرِ\",\"عِلۡمٖۖ\",\"لِّيُدۡخِلَ\",\"ٱللَّهُ\",\"فِي\",\"رَحۡمَتِهِۦ\",\"مَن\",\"يَشَآءُۚ\",\"لَوۡ\",\"تَزَيَّلُواْ\",\"لَعَذَّبۡنَا\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"مِنۡهُمۡ\",\"عَذَابًا\",\"أَلِيمًا\"],\"t\":\"They are the ones who disbelieved and obstructed you from al-Masjid al-Haram while the offering was prevented from reaching its place of sacrifice. And if not for believing men and believing women whom you did not know - that you might trample them and there would befall you because of them dishonor without [your] knowledge - [you would have been permitted to enter Makkah]. [This was so] that Allah might admit to His mercy whom He willed. If they had been apart [from them], We would have punished those who disbelieved among them with painful punishment\"},{\"a\":26,\"w\":[\"إِذۡ\",\"جَعَلَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"فِي\",\"قُلُوبِهِمُ\",\"ٱلۡحَمِيَّةَ\",\"حَمِيَّةَ\",\"ٱلۡجَٰهِلِيَّةِ\",\"فَأَنزَلَ\",\"ٱللَّهُ\",\"سَكِينَتَهُۥ\",\"عَلَىٰ\",\"رَسُولِهِۦ\",\"وَعَلَى\",\"ٱلۡمُؤۡمِنِينَ\",\"وَأَلۡزَمَهُمۡ\",\"كَلِمَةَ\",\"ٱلتَّقۡوَىٰ\",\"وَكَانُوٓاْ\",\"أَحَقَّ\",\"بِهَا\",\"وَأَهۡلَهَاۚ\",\"وَكَانَ\",\"ٱللَّهُ\",\"بِكُلِّ\",\"شَيۡءٍ\",\"عَلِيمٗا\"],\"t\":\"When those who disbelieved had put into their hearts chauvinism - the chauvinism of the time of ignorance. But Allah sent down His tranquillity upon His Messenger and upon the believers and imposed upon them the word of righteousness, and they were more deserving of it and worthy of it. And ever is Allah, of all things, Knowing\"},{\"a\":27,\"w\":[\"لَّقَدۡ\",\"صَدَقَ\",\"ٱللَّهُ\",\"رَسُولَهُ\",\"ٱلرُّءۡيَا\",\"بِٱلۡحَقِّۖ\",\"لَتَدۡخُلُنَّ\",\"ٱلۡمَسۡجِدَ\",\"ٱلۡحَرَامَ\",\"إِن\",\"شَآءَ\",\"ٱللَّهُ\",\"ءَامِنِينَ\",\"مُحَلِّقِينَ\",\"رُءُوسَكُمۡ\",\"وَمُقَصِّرِينَ\",\"لَا\",\"تَخَافُونَۖ\",\"فَعَلِمَ\",\"مَا\",\"لَمۡ\",\"تَعۡلَمُواْ\",\"فَجَعَلَ\",\"مِن\",\"دُونِ\",\"ذَٰلِكَ\",\"فَتۡحٗا\",\"قَرِيبًا\"],\"t\":\"Certainly has Allah showed to His Messenger the vision in truth. You will surely enter al-Masjid al-Haram, if Allah wills, in safety, with your heads shaved and [hair] shortened, not fearing [anyone]. He knew what you did not know and has arranged before that a conquest near [at hand]\"},{\"a\":28,\"w\":[\"هُوَ\",\"ٱلَّذِيٓ\",\"أَرۡسَلَ\",\"رَسُولَهُۥ\",\"بِٱلۡهُدَىٰ\",\"وَدِينِ\",\"ٱلۡحَقِّ\",\"لِيُظۡهِرَهُۥ\",\"عَلَى\",\"ٱلدِّينِ\",\"كُلِّهِۦۚ\",\"وَكَفَىٰ\",\"بِٱللَّهِ\",\"شَهِيدٗا\"],\"t\":\"It is He who sent His Messenger with guidance and the religion of truth to manifest it over all religion. And sufficient is Allah as Witness\"},{\"a\":29,\"w\":[\"مُّحَمَّدٞ\",\"رَّسُولُ\",\"ٱللَّهِۚ\",\"وَٱلَّذِينَ\",\"مَعَهُۥٓ\",\"أَشِدَّآءُ\",\"عَلَى\",\"ٱلۡكُفَّارِ\",\"رُحَمَآءُ\",\"بَيۡنَهُمۡۖ\",\"تَرَىٰهُمۡ\",\"رُكَّعٗا\",\"سُجَّدٗا\",\"يَبۡتَغُونَ\",\"فَضۡلٗا\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرِضۡوَٰنٗاۖ\",\"سِيمَاهُمۡ\",\"فِي\",\"وُجُوهِهِم\",\"مِّنۡ\",\"أَثَرِ\",\"ٱلسُّجُودِۚ\",\"ذَٰلِكَ\",\"مَثَلُهُمۡ\",\"فِي\",\"ٱلتَّوۡرَىٰةِۚ\",\"وَمَثَلُهُمۡ\",\"فِي\",\"ٱلۡإِنجِيلِ\",\"كَزَرۡعٍ\",\"أَخۡرَجَ\",\"شَطۡـَٔهُۥ\",\"فَـَٔازَرَهُۥ\",\"فَٱسۡتَغۡلَظَ\",\"فَٱسۡتَوَىٰ\",\"عَلَىٰ\",\"سُوقِهِۦ\",\"يُعۡجِبُ\",\"ٱلزُّرَّاعَ\",\"لِيَغِيظَ\",\"بِهِمُ\",\"ٱلۡكُفَّارَۗ\",\"وَعَدَ\",\"ٱللَّهُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"مِنۡهُم\",\"مَّغۡفِرَةٗ\",\"وَأَجۡرًا\",\"عَظِيمَۢا\"],\"t\":\"Muhammad is the Messenger of Allah; and those with him are forceful against the disbelievers, merciful among themselves. You see them bowing and prostrating [in prayer], seeking bounty from Allah and [His] pleasure. Their mark is on their faces from the trace of prostration. That is their description in the Torah. And their description in the Gospel is as a plant which produces its offshoots and strengthens them so they grow firm and stand upon their stalks, delighting the sowers - so that Allah may enrage by them the disbelievers. Allah has promised those who believe and do righteous deeds among them forgiveness and a great reward\"}]}]}]}]]}]\n18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1c:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n16:null\n1a:[[\"$\",\"title\",\"0\",{\"children\":\"Al-Fath — Surah 48 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quran Roots\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Holy-Qur-
