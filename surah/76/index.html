 wish for no reward nor thanks from you\"},{\"a\":10,\"w\":[\"إِنَّا\",\"نَخَافُ\",\"مِن\",\"رَّبِّنَا\",\"يَوۡمًا\",\"عَبُوسٗا\",\"قَمۡطَرِيرٗا\"],\"t\":\"Indeed, We fear from our Lord a Day austere and distressful\",\"pickthall\":\"Lo! we fear from our Lord a day of frowning and of fate\"},{\"a\":11,\"w\":[\"فَوَقَىٰهُمُ\",\"ٱللَّهُ\",\"شَرَّ\",\"ذَٰلِكَ\",\"ٱلۡيَوۡمِ\",\"وَلَقَّىٰهُمۡ\",\"نَضۡرَةٗ\",\"وَسُرُورٗا\"],\"t\":\"So Allah will protect them from the evil of that Day and give them radiance and happiness\",\"pickthall\":\"Therefor Allah hath warded off from them the evil of that day, and hath made them find brightness and joy\"},{\"a\":12,\"w\":[\"وَجَزَىٰهُم\",\"بِمَا\",\"صَبَرُواْ\",\"جَنَّةٗ\",\"وَحَرِيرٗا\"],\"t\":\"And will reward them for what they patiently endured [with] a garden [in Paradise] and silk [garments]\",\"pickthall\":\"And hath awarded them for all that they endured, a Garden and silk attire\"},{\"a\":13,\"w\":[\"مُّتَّكِـِٔينَ\",\"فِيهَا\",\"عَلَى\",\"ٱلۡأَرَآئِكِۖ\",\"لَا\",\"يَرَوۡنَ\",\"فِيهَا\",\"شَمۡسٗا\",\"وَلَا\",\"زَمۡهَرِيرٗا\"],\"t\":\"[They will be] reclining therein on adorned couches. They will not see therein any [burning] sun or [freezing] cold\",\"pickthall\":\"Reclining therein upon couches, they will find there neither (heat of) a sun nor bitter cold\"},{\"a\":14,\"w\":[\"وَدَانِيَةً\",\"عَلَيۡهِمۡ\",\"ظِلَٰلُهَا\",\"وَذُلِّلَتۡ\",\"قُطُوفُهَا\",\"تَذۡلِيلٗا\"],\"t\":\"And near above them are its shades, and its [fruit] to be picked will be lowered in compliance\",\"pickthall\":\"The shade thereof is close upon them and the clustered fruits thereof bow down\"},{\"a\":15,\"w\":[\"وَيُطَافُ\",\"عَلَيۡهِم\",\"بِـَٔانِيَةٖ\",\"مِّن\",\"فِضَّةٖ\",\"وَأَكۡوَابٖ\",\"كَانَتۡ\",\"قَوَارِيرَا۠\"],\"t\":\"And there will be circulated among them vessels of silver and cups having been [created] clear [as glass]\",\"pickthall\":\"Goblets of silver are brought round for them, and beakers (as) of glass\"},{\"a\":16,\"w\":[\"قَوَارِيرَاْ\",\"مِن\",\"فِضَّةٖ\",\"قَدَّرُوهَا\",\"تَقۡدِيرٗا\"],\"t\":\"Clear glasses [made] from silver of which they have determined the measure\",\"pickthall\":\"(Bright as) glass but (made) of silver, which they (themselves) have measured to the measure (of their deeds)\"},{\"a\":17,\"w\":[\"وَيُسۡقَوۡنَ\",\"فِيهَا\",\"كَأۡسٗا\",\"كَانَ\",\"مِزَاجُهَا\",\"زَنجَبِيلًا\"],\"t\":\"And they will be given to drink a cup [of wine] whose mixture is of ginger\",\"pickthall\":\"There are they watered with a cup whereof the mixture is of Zanjabil\"},{\"a\":18,\"w\":[\"عَيۡنٗا\",\"فِيهَا\",\"تُسَمَّىٰ\",\"سَلۡسَبِيلٗا\"],\"t\":\"[From] a fountain within Paradise named Salsabeel\",\"pickthall\":\"(The water of) a spring therein, named Salsabil\"},{\"a\":19,\"w\":[\"۞وَيَطُوفُ\",\"عَلَيۡهِمۡ\",\"وِلۡدَٰنٞ\",\"مُّخَلَّدُونَ\",\"إِذَا\",\"رَأَيۡتَهُمۡ\",\"حَسِبۡتَهُمۡ\",\"لُؤۡلُؤٗا\",\"مَّنثُورٗا\"],\"t\":\"There will circulate among them young boys made eternal. When you see them, you would think them [as beautiful as] scattered pearls\",\"pickthall\":\"There wait on them immortal youths, whom, when thou seest, thou wouldst take for scattered pearls\"},{\"a\":20,\"w\":[\"وَإِذَا\",\"رَأَيۡتَ\",\"ثَمَّ\",\"رَأَيۡتَ\",\"نَعِيمٗا\",\"وَمُلۡكٗا\",\"كَبِيرًا\"],\"t\":\"And when you look there [in Paradise], you will see pleasure and great dominion\",\"pickthall\":\"When thou seest, thou wilt see there bliss and high estate\"},{\"a\":21,\"w\":[\"عَٰلِيَهُمۡ\",\"ثِيَابُ\",\"سُندُسٍ\",\"خُضۡرٞ\",\"وَإِسۡتَبۡرَقٞۖ\",\"وَحُلُّوٓاْ\",\"أَسَاوِرَ\",\"مِن\",\"فِضَّةٖ\",\"وَسَقَىٰهُمۡ\",\"رَبُّهُمۡ\",\"شَرَابٗا\",\"طَهُورًا\"],\"t\":\"Upon the inhabitants will be green garments of fine silk and brocade. And they will be adorned with bracelets of silver, and their Lord will give them a purifying drink\",\"pickthall\":\"Their raiment will be fine green silk and gold embroidery. Bracelets of silver will they wear. Their Lord will slake their thirst with a pure drink\"},{\"a\":22,\"w\":[\"إِنَّ\",\"هَٰذَا\",\"كَانَ\",\"لَكُمۡ\",\"جَزَآءٗ\",\"وَكَانَ\",\"سَعۡيُكُم\",\"مَّشۡكُورًا\"],\"t\":\"[And it will be said], \\\"Indeed, this is for you a reward, and your effort has been appreciated\",\"pickthall\":\"(And it will be said unto them): Lo! this is a reward for you. Your endeavour (upon earth) hath found acceptance\"},{\"a\":23,\"w\":[\"إِنَّا\",\"نَحۡنُ\",\"نَزَّلۡنَا\",\"عَلَيۡكَ\",\"ٱلۡقُرۡءَانَ\",\"تَنزِيلٗا\"],\"t\":\"Indeed, it is We who have sent down to you, [O Muhammad], the Qur'an progressively\",\"pickthall\":\"Lo! We, even We, have revealed unto thee the Qur'an, a revelation\"},{\"a\":24,\"w\":[\"فَٱصۡبِرۡ\",\"لِحُكۡمِ\",\"رَبِّكَ\",\"وَلَا\",\"تُطِعۡ\",\"مِنۡهُمۡ\",\"ءَاثِمًا\",\"أَوۡ\",\"كَفُورٗا\"],\"t\":\"So be patient for the decision of your Lord and do not obey from among them a sinner or ungrateful [disbeliever]\",\"pickthall\":\"So submit patiently to thy Lord's command, and obey not of them any guilty one or disbeliever\"},{\"a\":25,\"w\":[\"وَٱذۡكُرِ\",\"ٱسۡمَ\",\"رَبِّكَ\",\"بُكۡرَةٗ\",\"وَأَصِيلٗا\"],\"t\":\"And mention the name of your Lord [in prayer] morning and evening\",\"pickthall\":\"Remember the name of thy Lord at morn and evening\"},{\"a\":26,\"w\":[\"وَمِنَ\",\"ٱلَّيۡلِ\",\"فَٱسۡجُدۡ\",\"لَهُۥ\",\"وَسَبِّحۡهُ\",\"لَيۡلٗا\",\"طَوِيلًا\"],\"t\":\"And during the night prostrate to Him and exalt Him a long [part of the] night\",\"pickthall\":\"And worship Him (a portion) of the night. And glorify Him through the livelong night\"},{\"a\":27,\"w\":[\"إِنَّ\",\"هَـٰٓؤُلَآءِ\",\"يُحِبُّونَ\",\"ٱلۡعَاجِلَةَ\",\"وَيَذَرُونَ\",\"وَرَآءَهُمۡ\",\"يَوۡمٗا\",\"ثَقِيلٗا\"],\"t\":\"Indeed, these [disbelievers] love the immediate and leave behind them a grave Day\",\"pickthall\":\"Lo! these love fleeting life, and put behind them (the remembrance of) a grievous day\"},{\"a\":28,\"w\":[\"نَّحۡنُ\",\"خَلَقۡنَٰهُمۡ\",\"وَشَدَدۡنَآ\",\"أَسۡرَهُمۡۖ\",\"وَإِذَا\",\"شِئۡنَا\",\"بَدَّلۡنَآ\",\"أَمۡثَٰلَهُمۡ\",\"تَبۡدِيلًا\"],\"t\":\"We have crea
