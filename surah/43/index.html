"pickthall\":\"Who made the earth a resting-place for you, and placed roads for you therein, that haply ye may find your way\"},{\"a\":11,\"w\":[\"وَٱلَّذِي\",\"نَزَّلَ\",\"مِنَ\",\"ٱلسَّمَآءِ\",\"مَآءَۢ\",\"بِقَدَرٖ\",\"فَأَنشَرۡنَا\",\"بِهِۦ\",\"بَلۡدَةٗ\",\"مَّيۡتٗاۚ\",\"كَذَٰلِكَ\",\"تُخۡرَجُونَ\"],\"t\":\"And who sends down rain from the sky in measured amounts, and We revive thereby a dead land - thus will you be brought forth\",\"pickthall\":\"And Who sendeth down water from the sky in (due) measure, and We revive a dead land therewith. Even so will ye be brought forth\"},{\"a\":12,\"w\":[\"وَٱلَّذِي\",\"خَلَقَ\",\"ٱلۡأَزۡوَٰجَ\",\"كُلَّهَا\",\"وَجَعَلَ\",\"لَكُم\",\"مِّنَ\",\"ٱلۡفُلۡكِ\",\"وَٱلۡأَنۡعَٰمِ\",\"مَا\",\"تَرۡكَبُونَ\"],\"t\":\"And who created the species, all of them, and has made for you of ships and animals those which you mount\",\"pickthall\":\"He Who created all the pairs, and appointed for you ships and cattle whereupon ye ride\"},{\"a\":13,\"w\":[\"لِتَسۡتَوُۥاْ\",\"عَلَىٰ\",\"ظُهُورِهِۦ\",\"ثُمَّ\",\"تَذۡكُرُواْ\",\"نِعۡمَةَ\",\"رَبِّكُمۡ\",\"إِذَا\",\"ٱسۡتَوَيۡتُمۡ\",\"عَلَيۡهِ\",\"وَتَقُولُواْ\",\"سُبۡحَٰنَ\",\"ٱلَّذِي\",\"سَخَّرَ\",\"لَنَا\",\"هَٰذَا\",\"وَمَا\",\"كُنَّا\",\"لَهُۥ\",\"مُقۡرِنِينَ\"],\"t\":\"That you may settle yourselves upon their backs and then remember the favor of your Lord when you have settled upon them and say. \\\"Exalted is He who has subjected this to us, and we could not have [otherwise] subdued it\",\"pickthall\":\"That ye may mount upon their backs, and may remember your Lord's favour when ye mount thereon, and may say: Glorified be He Who hath subdued these unto us, and we were not capable (of subduing them)\"},{\"a\":14,\"w\":[\"وَإِنَّآ\",\"إِلَىٰ\",\"رَبِّنَا\",\"لَمُنقَلِبُونَ\"],\"t\":\"And indeed we, to our Lord, will [surely] return\",\"pickthall\":\"And lo! unto our Lord we surely are returning\"},{\"a\":15,\"w\":[\"وَجَعَلُواْ\",\"لَهُۥ\",\"مِنۡ\",\"عِبَادِهِۦ\",\"جُزۡءًاۚ\",\"إِنَّ\",\"ٱلۡإِنسَٰنَ\",\"لَكَفُورٞ\",\"مُّبِينٌ\"],\"t\":\"But they have attributed to Him from His servants a portion. Indeed, man is clearly ungrateful\",\"pickthall\":\"And they allot to Him a portion of His bondmen! Lo! man is verily a mere ingrate\"},{\"a\":16,\"w\":[\"أَمِ\",\"ٱتَّخَذَ\",\"مِمَّا\",\"يَخۡلُقُ\",\"بَنَاتٖ\",\"وَأَصۡفَىٰكُم\",\"بِٱلۡبَنِينَ\"],\"t\":\"Or has He taken, out of what He has created, daughters and chosen you for [having] sons\",\"pickthall\":\"Or chooseth He daughters of all that He hath created, and honoureth He you with sons\"},{\"a\":17,\"w\":[\"وَإِذَا\",\"بُشِّرَ\",\"أَحَدُهُم\",\"بِمَا\",\"ضَرَبَ\",\"لِلرَّحۡمَٰنِ\",\"مَثَلٗا\",\"ظَلَّ\",\"وَجۡهُهُۥ\",\"مُسۡوَدّٗا\",\"وَهُوَ\",\"كَظِيمٌ\"],\"t\":\"And when one of them is given good tidings of that which he attributes to the Most Merciful in comparison, his face becomes dark, and he suppresses grief\",\"pickthall\":\"And if one of them hath tidings of that which he likeneth to the Beneficent One, his countenance becometh black and he is full of inward rage\"},{\"a\":18,\"w\":[\"أَوَمَن\",\"يُنَشَّؤُاْ\",\"فِي\",\"ٱلۡحِلۡيَةِ\",\"وَهُوَ\",\"فِي\",\"ٱلۡخِصَامِ\",\"غَيۡرُ\",\"مُبِينٖ\"],\"t\":\"So is one brought up in ornaments while being during conflict unevident [attributed to Allah]\",\"pickthall\":\"(Liken they then to Allah) that which is bred up in outward show, and in dispute cannot make itself plain\"},{\"a\":19,\"w\":[\"وَجَعَلُواْ\",\"ٱلۡمَلَـٰٓئِكَةَ\",\"ٱلَّذِينَ\",\"هُمۡ\",\"عِبَٰدُ\",\"ٱلرَّحۡمَٰنِ\",\"إِنَٰثًاۚ\",\"أَشَهِدُواْ\",\"خَلۡقَهُمۡۚ\",\"سَتُكۡتَبُ\",\"شَهَٰدَتُهُمۡ\",\"وَيُسۡـَٔلُونَ\"],\"t\":\"And they have made the angels, who are servants of the Most Merciful, females. Did they witness their creation? Their testimony will be recorded, and they will be questioned\",\"pickthall\":\"And they make the angels, who are the slaves of the Beneficent, females. Did they witness their creation? Their testimony will be recorded and they will be questioned\"},{\"a\":20,\"w\":[\"وَقَالُواْ\",\"لَوۡ\",\"شَآءَ\",\"ٱلرَّحۡمَٰنُ\",\"مَا\",\"عَبَدۡنَٰهُمۗ\",\"مَّا\",\"لَهُم\",\"بِذَٰلِكَ\",\"مِنۡ\",\"عِلۡمٍۖ\",\"إِنۡ\",\"هُمۡ\",\"إِلَّا\",\"يَخۡرُصُونَ\"],\"t\":\"And they said, \\\"If the Most Merciful had willed, we would not have worshipped them.\\\" They have of that no knowledge. They are not but falsifying\",\"pickthall\":\"And they say: If the Beneficent One had (so) willed, we should not have worshipped them. They have no knowledge whatsoever of that. They do but guess\"},{\"a\":21,\"w\":[\"أَمۡ\",\"ءَاتَيۡنَٰهُمۡ\",\"كِتَٰبٗا\",\"مِّن\",\"قَبۡلِهِۦ\",\"فَهُم\",\"بِهِۦ\",\"مُسۡتَمۡسِكُونَ\"],\"t\":\"Or have We given them a book before the Qur'an to which they are adhering\",\"pickthall\":\"Or have We given them any scripture before (this Qur'an) so that they are holding fast thereto\"},{\"a\":22,\"w\":[\"بَلۡ\",\"قَالُوٓاْ\",\"إِنَّا\",\"وَجَدۡنَآ\",\"ءَابَآءَنَا\",\"عَلَىٰٓ\",\"أُمَّةٖ\",\"وَإِنَّا\",\"عَلَىٰٓ\",\"ءَاثَٰرِهِم\",\"مُّهۡتَدُونَ\"],\"t\":\"Rather, they say, \\\"Indeed, we found our fathers upon a religion, and we are in their footsteps [rightly] guided\",\"pickthall\":\"Nay, for they say only: Lo! we found our fathers following a religion, and we are guided by their footprints\"},{\"a\":23,\"w\":[\"وَكَذَٰلِكَ\",\"مَآ\",\"أَرۡسَلۡنَا\",\"مِن\",\"قَبۡلِكَ\",\"فِي\",\"قَرۡيَةٖ\",\"مِّن\",\"نَّذِيرٍ\",\"إِلَّا\",\"قَالَ\",\"مُتۡرَفُوهَآ\",\"إِنَّا\",\"وَجَدۡنَآ\",\"ءَابَآءَنَا\",\"عَلَىٰٓ\",\"أُمَّةٖ\",\"وَإِنَّا\",\"عَلَىٰٓ\",\"ءَاثَٰرِهِم\",\"مُّقۡتَدُونَ\"],\"t\":\"And similarly, We did not send before you any warner into a city except that its affluent said, \\\"Indeed, we found our fathers upon a religion, and we are, in their footsteps, following\",\"pickthall\":\"And even so We sent not a warner before thee (Muhammad) into any township but its luxurious ones said: Lo! we found our fathers following a religion, and we are following their footprints\"},{\"a\":24,\"w\":[\"۞قَٰلَ\",\"أَوَلَوۡ\",\"جِئۡتُكُم\",\"بِأَهۡدَىٰ\",\"مِمَّا\",\"وَجَدتُّمۡ\",\"عَلَيۡهِ\",\"ءَابَآءَكُمۡۖ\",\"قَالُوٓاْ\",\"إِنَّا\",\"بِمَآ\",\"أُرۡسِلۡتُم\",\"بِهِۦ\",\"كَٰفِرُونَ\"],\"t\":\"[Each warner] said, \\\"Even if I brought you better guidance than that [religion] upon which you found your fathers?\\\" They said, \\\"Indeed we, in that with which you were sent, are disbelievers\",\"pickthall\":\"(And the warner) said: What! Even though I bring you better guidance than that ye found your fathers following? They answered: Lo! in what ye bring we are disbelievers\"},{\"a\":25,\"w\":[\"فَٱنتَقَمۡنَا\",\"مِنۡهُمۡۖ\",\"فَٱنظُرۡ\",\"كَيۡفَ\",\"كَانَ\",\"عَٰقِبَةُ\",\"ٱلۡمُكَذِّبِينَ\"],\"t\":\"So we took retribution from them; then see how was the end of the deniers\",\"pickthall\":\"So We requited them. Then see the nature of the consequence for the rejecters\"},{\"a\":26,\"w\":[\"وَإِذۡ\",\"قَالَ\",\"إِبۡرَٰهِيمُ\",\"لِأَبِيهِ\",\"وَقَوۡمِهِۦٓ\",\"إِنَّنِي\",\"بَرَآءٞ\",\"مِّمَّا\",\"تَعۡبُدُونَ\"],\"t\":\"And [mention, O Muhammad], when Abraham said to his father and his people, \\\"Indeed, I am disassociated from that which you worship\",\"pickthall\":\"And when Abraham said unto his father and his folk: Lo! I am innocent of what ye worship\"},{\"a\":27,\"w\":[\"إِلَّا\",\"ٱلَّذِي\",\"فَطَرَنِي\",\"فَإِنَّهُۥ\",\"سَيَهۡدِينِ\"],\"t\":\"Except for He who created me; and indeed, He will guide me\",\"pickthall\":\"Save Him Who did create me, for He will surely guide me\"},{\"a\":28,\"w\":[\"وَجَعَلَهَا\",\"كَلِمَةَۢ\",\"بَاقِيَةٗ\",\"فِي\",\"عَقِبِهِۦ\",\"لَعَلَّهُمۡ\",\"يَرۡجِعُونَ\"],\"t\":\"And he made it a word remaining among his descendants that they might return [to it]\",\"pickthall\":\"And he made it a word enduring among his seed, that haply they might return\"},{\"a\":29,\"w\":[\"بَلۡ\",\"مَتَّعۡتُ\",\"هَـٰٓؤُلَآءِ\",\"وَءَابَآءَهُمۡ\",\"حَتَّىٰ\",\"جَآءَهُمُ\",\"ٱلۡحَقُّ\",\"وَرَسُولٞ\",\"مُّبِينٞ\"],\"t\":\"However, I gave enjoyment to these [people of Makkah] and their fathers until there came to them the truth and a clear Messenger\",\"pickthall\":\"Nay, but I let these and their fathers enjoy life (only) till there should come unto them the Truth and a messenger making plain\"},{\"a\":30,\"w\":[\"وَلَمَّا\",\"جَآءَهُمُ\",\"ٱلۡحَقُّ\",\"قَالُواْ\",\"هَٰذَا\",\"سِحۡرٞ\",\"وَإِنَّا\",\"بِهِۦ\",\"كَٰفِرُونَ\"],\"t\":\"But when the truth came to them, they said, \\\"This is magic, and indeed we are, concerning it, disbelievers\",\"pickthall\":\"And now that the Truth hath come unto them they say: This is mere magic, and lo! we are disbelievers therein\"},{\"a\":31,\"w\":[\"وَقَالُواْ\",\"لَوۡلَا\",\"نُزِّلَ\",\"هَٰذَا\",\"ٱلۡقُرۡءَانُ\",\"عَلَىٰ\",\"رَجُلٖ\",\"مِّنَ\",\"ٱلۡقَرۡيَتَيۡنِ\",\"عَظِيمٍ\"],\"t\":\"And they said, \\\"Why was this Qur'an not sent down upon a great man from [one of] the two cities\",\"pickthall\":\"And they say: If only this Qur'an had been revealed to some great man of the two towns\"},{\"a\":32,\"w\":[\"أَهُمۡ\",\"يَقۡسِمُونَ\",\"رَحۡمَتَ\",\"رَبِّكَۚ\",\"نَحۡنُ\",\"قَسَمۡنَا\",\"بَيۡنَهُم\",\"مَّعِيشَتَهُمۡ\",\"فِي\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَاۚ\",\"وَرَفَعۡنَا\",\"بَعۡضَهُمۡ\",\"فَوۡقَ\",\"بَعۡضٖ\",\"دَرَجَٰتٖ\",\"لِّيَتَّخِذَ\",\"بَعۡضُهُم\",\"بَعۡضٗا\",\"سُخۡرِيّٗاۗ\",\"وَرَحۡمَتُ\",\"رَبِّكَ\",\"خَيۡرٞ\",\"مِّمَّا\",\"يَجۡمَعُونَ\"],\"t\":\"Do they distribute the mercy of your Lord? It is We who have apportioned among them their livelihood in the life of this world and have raised some of them above others in degrees [of rank] that they may make use of one another for service. But the mercy of your Lord is better than whatever they accumulate\",\"pickthall\":\"Is it they who apportion thy Lord's mercy? We have apportioned among them their livelihood in the life of the world, and raised some of them above others in rank that some of them may take labour from others; and the mercy of thy Lord is better than (the wealth) that they amass\"},{\"a\":33,\"w\":[\"وَلَوۡلَآ\",\"أَن\",\"يَكُونَ\",\"ٱلنَّاسُ\",\"أُمَّةٗ\",\"وَ eve\",\"pickthall\":\"O My slaves! For you there is no fear this day, nor is it ye who grieve\"},{\"a\":69,\"w\":[\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"بِـَٔايَٰتِنَا\",\"وَكَانُواْ\",\"مُسۡلِمِينَ\"],\"t\":\"[You] who believed in Our verses and were Muslims\",\"pickthall\":\"(Ye) who believed Our revelations and were self-surrendered\"},{\"a\":70,\"w\":[\"ٱدۡخُلُواْ\",\"ٱلۡجَنَّةَ\",\"أَنتُمۡ\",\"وَأَزۡوَٰجُكُمۡ\",\"تُحۡبَرُونَ\"],\"t\":\"Enter Paradise, you and your kinds, delighted\",\"pickthall\":\"Enter the Garden, ye and your wives, to be made glad\"},{\"a\":71,\"w\":[\"يُطَافُ\",\"عَلَيۡهِم\",\"بِصِحَافٖ\",\"مِّن\",\"ذَهَبٖ\",\"وَأَكۡوَابٖۖ\",\"وَفِيهَا\",\"مَا\",\"تَشۡتَهِيهِ\",\"ٱلۡأَنفُسُ\",\"وَتَلَذُّ\",\"ٱلۡأَعۡيُنُۖ\",\"وَأَنتُمۡ\",\"فِيهَا\",\"خَٰلِدُونَ\"],\"t\":\"Circulated among them will be plates and vessels of gold. And therein is whatever the souls desire and [what] delights the eyes, and you will abide therein eternally\",\"pickthall\":\"Therein are brought round for them trays of gold and goblets, and therein is all that souls desire and eyes find sweet. And ye are immortal therein\"},{\"a\":72,\"w\":[\"وَتِلۡكَ\",\"ٱلۡجَنَّةُ\",\"ٱلَّتِيٓ\",\"أُورِثۡتُمُوهَا\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"And that is Paradise which you are made to inherit for what you used to do\",\"pickthall\":\"This is the Garden which ye are made to inherit because of what ye used to do\"},{\"a\":73,\"w\":[\"لَكُمۡ\",\"فِيهَا\",\"فَٰكِهَةٞ\",\"كَثِيرَةٞ\",\"مِّنۡهَا\",\"تَأۡكُلُونَ\"],\"t\":\"For you therein is much fruit from which you will eat\",\"pickthall\":\"Therein for you is fruit in plenty whence to eat\"},{\"a\":74,\"w\":[\"إِنَّ\",\"ٱلۡمُجۡرِمِينَ\",\"فِي\",\"عَذَابِ\",\"جَهَنَّمَ\",\"خَٰلِدُونَ\"],\"t\":\"Indeed, the criminals will be in the punishment of Hell, abiding eternally\",\"pickthall\":\"Lo! the guilty are immortal in hell's torment\"},{\"a\":75,\"w\":[\"لَا\",\"يُفَتَّرُ\",\"عَنۡهُمۡ\",\"وَهُمۡ\",\"فِيهِ\",\"مُبۡلِسُونَ\"],\"t\":\"It will no
