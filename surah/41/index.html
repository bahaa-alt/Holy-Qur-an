e who believe and do righteous deeds - for them is a reward uninterrupted\",\"pickthall\":\"Lo! as for those who believe and do good works, for them is a reward enduring\"},{\"a\":9,\"w\":[\"۞قُلۡ\",\"أَئِنَّكُمۡ\",\"لَتَكۡفُرُونَ\",\"بِٱلَّذِي\",\"خَلَقَ\",\"ٱلۡأَرۡضَ\",\"فِي\",\"يَوۡمَيۡنِ\",\"وَتَجۡعَلُونَ\",\"لَهُۥٓ\",\"أَندَادٗاۚ\",\"ذَٰلِكَ\",\"رَبُّ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"Say, \\\"Do you indeed disbelieve in He who created the earth in two days and attribute to Him equals? That is the Lord of the worlds\",\"pickthall\":\"Say (O Muhammad, unto the idolaters): Disbelieve ye verily in Him Who created the earth in two Days, and ascribe ye unto Him rivals? He (and none else) is the Lord of the Worlds\"},{\"a\":10,\"w\":[\"وَجَعَلَ\",\"فِيهَا\",\"رَوَٰسِيَ\",\"مِن\",\"فَوۡقِهَا\",\"وَبَٰرَكَ\",\"فِيهَا\",\"وَقَدَّرَ\",\"فِيهَآ\",\"أَقۡوَٰتَهَا\",\"فِيٓ\",\"أَرۡبَعَةِ\",\"أَيَّامٖ\",\"سَوَآءٗ\",\"لِّلسَّآئِلِينَ\"],\"t\":\"And He placed on the earth firmly set mountains over its surface, and He blessed it and determined therein its [creatures'] sustenance in four days without distinction - for [the information] of those who ask\",\"pickthall\":\"He placed therein firm hills rising above it, and blessed it and measured therein its sustenance in four Days, alike for (all) who ask\"},{\"a\":11,\"w\":[\"ثُمَّ\",\"ٱسۡتَوَىٰٓ\",\"إِلَى\",\"ٱلسَّمَآءِ\",\"وَهِيَ\",\"دُخَانٞ\",\"فَقَالَ\",\"لَهَا\",\"وَلِلۡأَرۡضِ\",\"ٱئۡتِيَا\",\"طَوۡعًا\",\"أَوۡ\",\"كَرۡهٗا\",\"قَالَتَآ\",\"أَتَيۡنَا\",\"طَآئِعِينَ\"],\"t\":\"Then He directed Himself to the heaven while it was smoke and said to it and to the earth, \\\"Come [into being], willingly or by compulsion.\\\" They said, \\\"We have come willingly\",\"pickthall\":\"Then turned He to the heaven when it was smoke, and said unto it and unto the earth: Come both of you, willingly or loth. They said: We come, obedient\"},{\"a\":12,\"w\":[\"فَقَضَىٰهُنَّ\",\"سَبۡعَ\",\"سَمَٰوَاتٖ\",\"فِي\",\"يَوۡمَيۡنِ\",\"وَأَوۡحَىٰ\",\"فِي\",\"كُلِّ\",\"سَمَآءٍ\",\"أَمۡرَهَاۚ\",\"وَزَيَّنَّا\",\"ٱلسَّمَآءَ\",\"ٱلدُّنۡيَا\",\"بِمَصَٰبِيحَ\",\"وَحِفۡظٗاۚ\",\"ذَٰلِكَ\",\"تَقۡدِيرُ\",\"ٱلۡعَزِيزِ\",\"ٱلۡعَلِيمِ\"],\"t\":\"And He completed them as seven heavens within two days and inspired in each heaven its command. And We adorned the nearest heaven with lamps and as protection. That is the determination of the Exalted in Might, the Knowing\",\"pickthall\":\"Then He ordained them seven heavens in two Days and inspired in each heaven its mandate; and We decked the nether heaven with lamps, and rendered it inviolable. That is the measuring of the Mighty, the Knower\"},{\"a\":13,\"w\":[\"فَإِنۡ\",\"أَعۡرَضُواْ\",\"فَقُلۡ\",\"أَنذَرۡتُكُمۡ\",\"صَٰعِقَةٗ\",\"مِّثۡلَ\",\"صَٰعِقَةِ\",\"عَادٖ\",\"وَثَمُودَ\"],\"t\":\"But if they turn away, then say, \\\"I have warned you of a thunderbolt like the thunderbolt [that struck] 'Aad and Thamud\",\"pickthall\":\"But if they turn away, then say: I warn you of a thunderbolt like the thunderbolt (which fell of old upon the tribes) of A'ad and Thamud\"},{\"a\":14,\"w\":[\"إِذۡ\",\"جَآءَتۡهُمُ\",\"ٱلرُّسُلُ\",\"مِنۢ\",\"بَيۡنِ\",\"أَيۡدِيهِمۡ\",\"وَمِنۡ\",\"خَلۡفِهِمۡ\",\"أَلَّا\",\"تَعۡبُدُوٓاْ\",\"إِلَّا\",\"ٱللَّهَۖ\",\"قَالُواْ\",\"لَوۡ\",\"شَآءَ\",\"رَبُّنَا\",\"لَأَنزَلَ\",\"مَلَـٰٓئِكَةٗ\",\"فَإِنَّا\",\"بِمَآ\",\"أُرۡسِلۡتُم\",\"بِهِۦ\",\"كَٰفِرُونَ\"],\"t\":\"[That occurred] when the messengers had come to them before them and after them, [saying], \\\"Worship not except Allah.\\\" They said, \\\"If our Lord had willed, He would have sent down the angels, so indeed we, in that with which you have been sent, are disbelievers\",\"pickthall\":\"When their messengers came unto them from before them and behind them, saying: Worship none but Allah! they said: If our Lord had willed, He surely would have sent down angels (unto us), so lo! we are disbelievers in that wherewith ye have been sent\"},{\"a\":15,\"w\":[\"فَأَمَّا\",\"عَادٞ\",\"فَٱسۡتَكۡبَرُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"بِغَيۡرِ\",\"ٱلۡحَقِّ\",\"وَقَالُواْ\",\"مَنۡ\",\"أَشَدُّ\",\"مِنَّا\",\"قُوَّةًۖ\",\"أَوَلَمۡ\",\"يَرَوۡاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"ٱلَّذِي\",\"خَلَقَهُمۡ\",\"هُوَ\",\"أَشَدُّ\",\"مِنۡهُمۡ\",\"قُوَّةٗۖ\",\"وَكَانُواْ\",\"بِـَٔايَٰتِنَا\",\"يَجۡحَدُونَ\"],\"t\":\"As for 'Aad, they were arrogant upon the earth without right and said, \\\"Who is greater than us in strength?\\\" Did they not consider that Allah who created them was greater than them in strength? But they were rejecting Our signs\",\"pickthall\":\"As for A'ad, they were arrogant in the land without right, and they said: Who is mightier than us in power? Could they not see that Allah Who created them, He was mightier than them in power? And they denied Our revelations\"},{\"a\":16,\"w\":[\"فَأَرۡسَلۡنَا\",\"عَلَيۡهِمۡ\",\"رِيحٗا\",\"صَرۡصَرٗا\",\"فِيٓ\",\"أَيَّامٖ\",\"نَّحِسَاتٖ\",\"لِّنُذِيقَهُمۡ\",\"عَذَابَ\",\"ٱلۡخِزۡيِ\",\"فِي\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَاۖ\",\"وَلَعَذَابُ\",\"ٱلۡأٓخِرَةِ\",\"أَخۡزَىٰۖ\",\"وَهُمۡ\",\"لَا\",\"يُنصَرُونَ\"],\"t\":\"So We sent upon them a screaming wind during days of misfortune to make them taste the punishment of disgrace in the worldly life; but the punishment of the Hereafter is more disgracing, and they will not be helped\",\"pickthall\":\"Therefor We let loose on them a raging wind in evil days, that We might make them taste the torment of disgrace in the life of the world. And verily the doom of the Hereafter will be more shameful, and they will not be helped\"},{\"a\":17,\"w\":[\"وَأَمَّا\",\"ثَمُودُ\",\"فَهَدَيۡنَٰهُمۡ\",\"فَٱسۡتَحَبُّواْ\",\"ٱلۡعَمَىٰ\",\"عَلَى\",\"ٱلۡهُدَىٰ\",\"فَأَخَذَتۡهُمۡ\",\"صَٰعِقَةُ\",\"ٱلۡعَذَابِ\",\"ٱلۡهُونِ\",\"بِمَا\",\"كَانُواْ\",\"يَكۡسِبُونَ\"],\"t\":\"And as for Thamud, We guided them, but they preferred blindness over guidance, so the thunderbolt of humiliating punishment seized them for what they used to earn\",\"pickthall\":\"And as for Thamud, We gave them guidance, but they preferred blindness to the guidance, so the bolt of the doom of humiliation overtook them because of what they used to earn\"},{\"a\":18,\"w\":[\"وَنَجَّيۡنَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَكَانُواْ\",\"يَتَّقُونَ\"],\"t\":\"And We saved those who believed and used to fear Allah\",\"pickthall\":\"And We delivered those who believed and used to keep their duty to Allah\"},{\"a\":19,\"w\":[\"وَيَوۡمَ\",\"يُحۡشَرُ\",\"أَعۡدَآءُ\",\"ٱللَّهِ\",\"إِلَى\",\"ٱلنَّارِ\",\"فَهُمۡ\",\"يُوزَعُونَ\"],\"t\":\"And [mention, O Muhammad], the Day when the enemies of Allah will be gathered to the Fire while they are [driven] assembled in rows\",\"pickthall\":\"And (make mention of) the day when the enemies of Allah are gathered unto the Fire, they are driven on\"},{\"a\":20,\"w\":[\"حَتَّىٰٓ\",\"إِذَا\",\"مَا\",\"جَآءُوهَا\",\"شَهِدَ\",\"عَلَيۡهِمۡ\",\"سَمۡعُهُمۡ\",\"وَأَبۡصَٰرُهُمۡ\",\"وَجُلُودُهُم\",\"بِمَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"Until, when they reach it, their hearing and their eyes and their skins will testify against them of what they used to do\",\"pickthall\":\"Till, when they reach it, their ears and their eyes and their skins testify against them as to what they used to do\"},{\"a\":21,\"w\":[\"وَقَالُواْ\",\"لِجُلُودِهِمۡ\",\"لِمَ\",\"شَهِدتُّمۡ\",\"عَلَيۡنَاۖ\",\"قَالُوٓاْ\",\"أَنطَقَنَا\",\"ٱللَّهُ\",\"ٱلَّذِيٓ\",\"أَنطَقَ\",\"كُلَّ\",\"شَيۡءٖۚ\",\"وَهُوَ\",\"خَلَقَكُمۡ\",\"أَوَّلَ\",\"مَرَّةٖ\",\"وَإِلَيۡهِ\",\"تُرۡجَعُونَ\"],\"t\":\"And they will say to their skins, \\\"Why have you testified against us?\\\" They will say, \\\"We were made to speak by Allah, who has made everything speak; and He created you the first time, and to Him you are returned\",\"pickthall\":\"And they say unto their skins: Why testify ye against us? They say: Allah hath given us speech Who giveth speech to all things, and Who created you at the first, and unto Whom ye are returned\"},{\"a\":22,\"w\":[\"وَمَا\",\"كُنتُمۡ\",\"تَسۡتَتِرُونَ\",\"أَن\",\"يَشۡهَدَ\",\"عَلَيۡكُمۡ\",\"سَمۡعُكُمۡ\",\"وَلَآ\",\"أَبۡصَٰرُكُمۡ\",\"وَلَا\",\"جُلُودُكُمۡ\",\"وَلَٰكِن\",\"ظَنَنتُمۡ\",\"أَنَّ\",\"ٱللَّهَ\",\"لَا\",\"يَعۡلَمُ\",\"كَثِيرٗا\",\"مِّمَّا\",\"تَعۡمَلُونَ\"],\"t\":\"And you were not covering yourselves, lest your hearing testify against you or your sight or your skins, but you assumed that Allah does not know much of what you do\",\"pickthall\":\"Ye did not hide yourselves lest your ears and your eyes and your skins should testify against you, but ye deemed that Allah knew not much of what ye did\"},{\"a\":23,\"w\":[\"وَذَٰلِكُمۡ\",\"ظَنُّكُمُ\",\"ٱلَّذِي\",\"ظَنَنتُم\",\"بِرَبِّكُمۡ\",\"أَرۡدَىٰكُمۡ\",\"فَأَصۡبَحۡتُم\",\"مِّنَ\",\"ٱلۡخَٰسِرِينَ\"],\"t\":\"And that was your assumption which you assumed about your Lord. It has brought you to ruin, and you have become among the losers\",\"pickthall\":\"That, your thought which ye did think about your Lord, hath ruined you; and ye find yourselves (this day) among the lost\"},{\"a\":24,\"w\":[\"فَإِن\",\"يَصۡبِرُواْ\",\"فَٱلنَّارُ\",\"مَثۡوٗى\",\"لَّهُمۡۖ\",\"وَإِن\",\"يَسۡتَعۡتِبُواْ\",\"فَمَا\",\"هُم\",\"مِّنَ\",\"ٱلۡمُعۡتَبِينَ\"],\"t\":\"So [even] if they are patient, the Fire is a residence for them; and if they ask to appease [Allah], they will not be of those who are allowed to appease\",\"pickthall\":\"And though they are resigned, yet the Fire is still their home; and if they ask for favour, yet they are not of those unto whom favour can be shown\"},{\"a\":25,\"w\":[\"۞وَقَيَّضۡنَا\",\"لَهُمۡ\",\"قُرَنَآءَ\",\"فَزَيَّنُواْ\",\"لَهُم\",\"مَّا\",\"بَيۡنَ\",\"أَيۡدِيهِمۡ\",\"وَمَا\",\"خَلۡفَهُمۡ\",\"وَحَقَّ\",\"عَلَيۡهِمُ\",\"ٱلۡقَوۡلُ\",\"فِيٓ\",\"أُمَمٖ\",\"قَدۡ\",\"خَلَتۡ\",\"مِن\",\"قَبۡلِهِم\",\"مِّنَ\",\"ٱلۡجِنِّ\",\"وَٱلۡإِنسِۖ\",\"إِنَّهُمۡ\",\"كَانُواْ\",\"خَٰسِرِينَ\"],\"t\":\"And We appointed for them companions who made attractive to them what was before them and what was behind them [of sin], and the word has come into effect upon them among nations which had passed on before them of jinn and men. Indeed, they [all] were losers\",\"pickthall\":\"And We assigned them comrades (in the world), who made their present and their past fairseeming unto them. And the Word concerning nations of the jinn and humankind who passed away before them hath effect for them. Lo! they were ever losers\"},{\"a\":26,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لَا\",\"تَسۡمَعُواْ\",\"لِهَٰذَا\",\"ٱلۡقُرۡءَانِ\",\"وَٱلۡغَوۡاْ\",\"فِيهِ\",\"لَعَلَّكُمۡ\",\"تَغۡلِبُونَ\"],\"t\":\"And those who disbelieve say, \\\"Do not listen to this Qur'an and speak noisily during [the recitation of] it that perhaps you will overcome\",\"pickthall\":\"Those who disbelieve say: Heed not this Qur'an, and drown the hearing of it; haply ye may conquer\"},{\"a\":27,\"w\":[\"فَلَنُذِيقَنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"عَذَابٗا\",\"شَدِيدٗا\",\"وَلَنَجۡزِيَنَّهُمۡ\",\"أَسۡوَأَ\",\"ٱلَّذِي\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"But We will surely cause those who disbelieve to taste a severe punishment, and We will surely recompense them for the worst of what they had been doing\",\"pickthall\":\"But verily We shall cause those who disbelieve to taste an awful doom, and verily We shall requite them the worst of what they used to do\"},{\"a\":28,\"w\":[\"ذَٰلِكَ\",\"جَزَآءُ\",\"أَعۡدَآءِ\",\"ٱللَّهِ\",\"ٱلنَّارُۖ\",\"لَهُمۡ\",\"فِيهَا\",\"دَارُ\",\"ٱلۡخُلۡدِ\",\"جَزَآءَۢ\",\"بِمَا\",\"كَانُواْ\",\"بِـَٔايَٰتِنَا\",\"يَجۡحَدُونَ\"],\"t\":\"That is the recompense of the enemies of Allah - the Fire. For them therein is the home of eternity as recompense for what they, of Our verses, were rejecting\",\"pickthall\":\"That is the reward of Allah's enemies: the Fire. Therein is their immortal home, payment forasmuch as they denied Our revelations\"},{\"a\":29,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"رَبَّنَآ\",\"أَرِنَا\",\"ٱلَّذَيۡنِ\",\"أَضَلَّانَا\",\"مِنَ\",\"ٱلۡجِنِّ\",\"وَٱلۡإِنسِ\",\"نَجۡعَلۡهُمَا\",\"تَحۡتَ\",\"أَقۡدَامِنَا\",\"لِيَكُونَا\",\"مِنَ\",\"ٱلۡأَسۡفَلِينَ\"],\"t\":\"And those who disbelieved will [then] say, \\\"Our Lord, show us those who misled us of the jinn and men [so] we may put them under our feet that they will be among the lowest\",\"pickthall\":\"And those who disbelieve will say: Our Lord! Show us those who beguiled us of the jinn and humankind. We will place them underneath our feet that they may be among the nethermost\"},{\"a\":30,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"قَالُواْ\",\"رَبُّنَا\",\"ٱللَّهُ\",\"ثُمَّ\",\"ٱسۡتَقَٰمُواْ\",\"تَتَنَزَّلُ\",\"عَلَيۡهِمُ\",\"ٱلۡمَلَـٰٓئِكَةُ\",\"أَلَّا\",\"تَخَافُواْ\",\"وَلَا\",\"تَحۡزَنُواْ\",\"وَأَبۡشِرُواْ\",\"بِٱلۡجَنَّةِ\",\"ٱلَّتِي\",\"كُنتُمۡ\",\"تُوعَدُونَ\"],\"t\":\"Indeed, those who have said, \\\"Our Lord is Allah \\\" and then remained on a right course - the angels will descend upon them, [saying], \\\"Do not fear and do not grieve but receive good tidings of Paradise, which you were promised\",\"pickthall\":\"Lo! those who say: Our Lord is Allah, and afterward are upright, the angels descend upon them, saying: Fear not nor grieve, but hear good tidings of the paradise which ye are promised\"},{\"a\":31,\"w\":[\"نَحۡنُ\",\"أَوۡلِيَآؤُكُمۡ\",\"فِي\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَا\",\"وَفِي\",\"ٱلۡأٓخِرَةِۖ\",\"وَلَكُمۡ\",\"فِيهَا\",\"مَا\",\"تَشۡتَهِيٓ\",\"أَنفُسُكُمۡ\",\"وَلَكُمۡ\",\"فِيهَا\",\"مَا\",\"تَدَّعُونَ\"],\"t\":\"We [angels] were your allies in worldly life and [are so] in the Hereafter. And you will have therein whatever your souls desire, and you will have therein whatever you request [or wish]\",\"pickthall\":\"We are your protecting friends in the life of the world and in the Hereafter. There ye will have (all) that your souls desire, and there ye will have (all) for which ye pray\"},{\"a\":32,\"w\":[\"نُزُلٗا\",\"مِّنۡ\",\"غَفُورٖ\",\"رَّحِيمٖ\"],\"t\":\"As accommodation from a [Lord who is] Forgiving and Merciful\",\"pickthall\":\"A gift of welcome from One Forgiving, Merciful\"},{\"a\":33,\"w\":[\"وَمَنۡ\",\"أَحۡسَنُ\",\"قَوۡلٗا\",\"مِّمَّن\",\"دَعَآ\",\"إِلَى\",\"ٱللَّهِ\",\"وَعَمِلَ\",\"صَٰلِحٗا\",\"وَقَالَ\",\"إِنَّنِي\",\"مِنَ\",\"ٱلۡمُسۡلِمِينَ\"],\"t\":\"And who is better in speech than one who invites to Allah and does righteousness and says, \\\"Indeed, I am of the Muslims\",\"pickthall\":\"And who is better in speech than him who prayeth unto his Lord and doeth right, and saith: Lo! I am of those who are muslims (surrender unto Him)\"},{\"a\":34,\"w\":[\"وَلَا\",\"تَسۡتَوِي\",\"ٱلۡحَسَنَةُ\",\"وَلَا\",\"ٱلسَّيِّئَةُۚ\",\"ٱدۡفَعۡ\",\"بِٱلَّتِي\",\"هِيَ\",\"أَحۡسَنُ\",\"فَإِذَا\",\"ٱلَّذِي\",\"بَيۡنَكَ\",\"وَبَيۡنَهُۥ\",\"عَدَٰوَةٞ\",\"كَأَنَّهُۥ\",\"وَلِيٌّ\",\"حَمِيمٞ\"],\"t\":\"And not equal are the good deed and the bad. Repel [evil] by that [deed] which is better; and thereupon the one whom between you and him is enmity [will become] as though he was a devoted friend\",\"pickthall\":\"The good deed and the evil deed are not alike. Repel the evil deed with one which is better, then lo! he, between whom and thee there was enmity (will become) as though he was a bosom friend\"},{\"a\":35,\"w\":[\"وَمَا\",\"يُلَقَّىٰهَآ\",\"إِلَّا\",\"ٱلَّذِينَ\",\"صَبَرُواْ\",\"وَمَا\",\"يُلَقَّىٰهَآ\",\"إِلَّا\",\"ذُو\",\"حَظٍّ\",\"عَظِيمٖ\"],\"t\":\"But none is granted it except those who are patient, and none is granted it except one having a great portion [of good]\",\"pickthall\":\"But none is granted it save those who are steadfast, and none is granted it save the owner of great happiness\"},{\"a\":36,\"w\":[\"وَإِمَّا\",\"يَنزَغَنَّكَ\",\"مِنَ\",\"ٱلشَّيۡطَٰنِ\",\"نَزۡغٞ\",\"فَٱسۡتَعِذۡ\",\"بِٱللَّهِۖ\",\"إِنَّهُۥ\",\"هُوَ\",\"ٱلسَّمِيعُ\",\"ٱلۡعَلِيمُ\"],\"t\":\"And if there comes to you from Satan an evil suggestion, then seek refuge in Allah. Indeed, He is the Hearing, the Knowing\",\"pickthall\":\"And if a whisper from the devil reach thee (O Muhammad) then seek refuge in Allah. Lo! He is the Hearer, the Knower\"},{\"a\":37,\"w\":[\"وَمِنۡ\",\"ءَايَٰتِهِ\",\"ٱلَّيۡلُ\",\"وَٱلنَّهَارُ\",\"وَٱلشَّمۡسُ\",\"وَٱلۡقَمَرُۚ\",\"لَا\",\"تَسۡجُدُواْ\",\"لِلشَّمۡسِ\",\"وَلَا\",\"لِلۡقَمَرِ\",\"وَٱسۡجُدُواْۤ\",\"لِلَّهِۤ\",\"ٱلَّذِي\",\"خَلَقَهُنَّ\",\"إِن\",\"كُنتُمۡ\",\"إِيَّاهُ\",\"تَعۡبُدُونَ\"],\"t\":\"And of His signs are the night and day and the sun and moon. Do not prostrate to the sun or to the moon, but prostate to Allah, who created them, if it should be Him that you worship\",\"pickthall\":\"And of His portents are the night and the day and the sun and the moon. Do not prostrate to the sun or the moon; but prostrate to Allah Who created them, if it is in truth Him Whom ye worship\"},{\"a\":38,\"w\":[\"فَإِنِ\",\"ٱسۡتَكۡبَرُواْ\",\"فَٱلَّذِينَ\",\"عِندَ\",\"رَبِّكَ\",\"يُسَبِّحُونَ\",\"لَهُۥ\",\"بِٱلَّيۡلِ\",\"وَٱلنَّهَارِ\",\"وَهُمۡ\",\"لَا\",\"يَسۡـَٔمُونَ۩\"],\"t\":\"But if they are arrogant - then those who are near your Lord exalt Him by night and by day, and they do not become weary\",\"pickthall\":\"But if they are too proud - still those who are with thy Lord glorify Him night and day, and tire not\"},{\"a\":39,\"w\":[\"وَمِنۡ\",\"ءَايَٰتِهِۦٓ\",\"أَنَّكَ\",\"تَرَى\",\"ٱلۡأَرۡضَ\",\"خَٰشِعَةٗ\",\"فَإِذَآ\",\"أَنزَلۡنَا\",\"عَلَيۡهَا\",\"ٱلۡمَآءَ\",\"ٱهۡتَزَّتۡ\",\"وَرَبَتۡۚ\",\"إِنَّ\",\"ٱلَّذِيٓ\",\"أَحۡيَاهَا\",\"لَمُحۡيِ\",\"ٱلۡمَوۡتَىٰٓۚ\",\"إِنَّهُۥ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٌ\"],\"t\":\"And of His signs is that you see the earth stilled, but when We send down upon it rain, it quivers and grows. Indeed, He who has given it life is the Giver of Life to the dead. Indeed, He is over all things competent\",\"pickthall\":\"And of His portents (is this): that thou seest the earth lowly, but when We send down water thereon it thrilleth and groweth. Lo! He Who quickeneth it is verily the Quickener of the Dead. Lo! He is Able to do all things\"},{\"a\":40,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"يُلۡحِدُونَ\",\"فِيٓ\",\"ءَايَٰتِنَا\",\"لَا\",\"يَخۡفَوۡنَ\",\"عَلَيۡنَآۗ\",\"أَفَمَن\",\"يُلۡقَىٰ\",\"فِي\",\"ٱلنَّارِ\",\"خَيۡرٌ\",\"أَم\",\"مَّن\",\"يَأۡتِيٓ\",\"ءَامِنٗا\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِۚ\",\"ٱعۡمَلُواْ\",\"مَا\",\"شِئۡتُمۡ\",\"إِنَّهُۥ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"بَصِيرٌ\"],\"t\":\"Indeed, those who inject deviation into Our verses are not concealed from Us. So, is he who is cast into the Fire better or he who comes secure on the Day of Resurrection? Do whatever you will; indeed, He is Seeing of what you do\",\"pickthall\":\"Lo! those who distort Our revelations are not hid from Us. Is he who is hurled into the Fire better, or he who cometh secure on the Day of Resurrection? Do what ye will. Lo! He is Seer of what ye do\"},{\"a\":41,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"بِٱلذِّكۡرِ\",\"لَمَّا\",\"جَآءَهُمۡۖ\",\"وَإِنَّهُۥ\",\"لَكِتَٰبٌ\",\"عَزِيزٞ\"],\"t\":\"Indeed, those who disbelieve in the message after it has come to them... And indeed, it is a mighty Book\",\"pickthall\":\"Lo! those who disbelieve in the Reminder when it cometh unto them (are guilty), for lo! it is an unassailable Scripture\"},{\"a\":42,\"w\":[\"لَّا\",\"يَأۡتِيهِ\",\"ٱلۡبَٰطِلُ\",\"مِنۢ\",\"بَيۡنِ\",\"يَدَيۡهِ\",\"وَلَا\",\"مِنۡ\",\"خَلۡفِهِۦۖ\",\"تَنزِيلٞ\",\"مِّنۡ\",\"حَكِيمٍ\",\"حَمِيدٖ\"],\"t\":\"Falsehood cannot approach it from before it or from behind it; [it is] a revelation from a [Lord who is] Wise and Praiseworthy\",\"pickthall\":\"Falsehood cannot come at it from before it or from behind it. (It is) a revelation from the Wise, the Owner of Praise\"},{\"a\":43,\"w\":[\"مَّا\",\"يُقَالُ\",\"لَكَ\",\"إِلَّا\",\"مَا\",\"قَدۡ\",\"قِيلَ\",\"لِلرُّسُلِ\",\"مِن\",\"قَبۡلِكَۚ\",\"إِنَّ\",\"رَبَّكَ\",\"لَذُو\",\"مَغۡفِرَةٖ\",\"وَذُو\",\"عِقَابٍ\",\"أَلِيمٖ\"],\"t\":\"Nothing is said to you, [O Muhammad], except what was already said to the messengers before you. Indeed, your Lord is a possessor of forgiveness and a possessor of painful penalty\",\"pickthall\":\"Naught is said unto thee (Muhammad) save what was said unto the messengers before thee. Lo! thy Lord is owner of forgiveness, and owner (also) of dire punishment\"},{\"a\":44,\"w\":[\"وَلَوۡ\",\"جَعَلۡنَٰهُ\",\"قُرۡءَانًا\",\"أَعۡجَمِيّٗا\",\"لَّقَالُواْ\",\"لَوۡلَا\",\"فُصِّلَتۡ\",\"ءَايَٰتُهُۥٓۖ\",\"ءَا۬عۡجَمِيّٞ\",\"وَعَرَبِيّٞۗ\",\"قُلۡ\",\"هُوَ\",\"لِلَّذِينَ\",\"ءَامَنُواْ\",\"هُدٗى\",\"وَشِفَآءٞۚ\",\"وَٱلَّذِينَ\",\"لَا\",\"يُؤۡمِنُونَ\",\"فِيٓ\",\"ءَاذَانِهِمۡ\",\"وَقۡرٞ\",\"وَهُوَ\",\"عَلَيۡهِمۡ\",\"عَمًىۚ\",\"أُوْلَـٰٓئِكَ\",\"يُنَادَوۡنَ\",\"مِن\",\"مَّكَانِۭ\",\"بَعِيدٖ\"],\"t\":\"And if We had made it a non-Arabic Qur'an, they would have said, \\\"Why are its verses not explained in detail [in our language]? Is it a foreign [recitation] and an Arab [messenger]?\\\" Say, \\\"It is, for those who believe, a guidance and cure.\\\" And those who do not believe - in their ears is deafness, and it is upon them blindness. Those are being called from a distant place\",\"pickthall\":\"And if We had appointed it a Lecture in a foreign tongue they would assuredly have said: If only its verses were expounded (so that we might understand)? What! A foreign tongue and an Arab? - Say unto them (O Muhammad): For those who believe it is a guidance and a healing; and as for those who disbelieve, there is a deafness in their ears, and it is blindness for them. Such are called to from afar\"},{\"a\":45,\"w\":[\"وَلَقَدۡ\",\"ءَاتَيۡنَا\",\"مُوسَى\",\"ٱلۡكِتَٰبَ\",\"فَٱخۡتُلِفَ\",\"فِيهِۚ\",\"وَلَوۡلَا\",\"كَلِمَةٞ\",\"سَبَقَتۡ\",\"مِن\",\"رَّبِّكَ\",\"لَقُضِيَ\",\"بَيۡنَهُمۡۚ\",\"وَإِنَّهُمۡ\",\"لَفِي\",\"شَكّٖ\",\"مِّنۡهُ\",\"مُرِيبٖ\"],\"t\":\"And We had already given Moses the Scripture, but it came under disagreement. And if not for a word that preceded from your Lord, it would have been concluded between them. And indeed they are, concerning the Qur'an, in disquieting doubt\",\"pickthall\":\"And We verily gave Moses the Scripture, but there hath been dispute concerning it; and but for a Word that had already gone forth from thy Lord, it would ere now have been judged between them; but lo! they are in hopeless doubt concerning it\"},{\"a\":46,\"w\":[\"مَّنۡ\",\"عَمِلَ\",\"صَٰلِحٗا\",\"فَلِنَفۡسِهِۦۖ\",\"وَمَنۡ\",\"أَسَآءَ\",\"فَعَلَيۡهَاۗ\",\"وَمَا\",\"رَبُّكَ\",\"بِظَلَّـٰمٖ\",\"لِّلۡعَبِيدِ\"],\"t\":\"Whoever does righteousness - it is for his [own] soul; and whoever does evil [does so] against it. And your Lord is not ever unjust to [His] servants\",\"pickthall\":\"Whoso doeth right it is for his soul, and whoso doeth wrong it is against it. And thy Lord is not at all a tyrant to His slaves\"},{\"a\":47,\"w\":[\"إِلَيْهِ\",\"يُرَدُّ\",\"عِلْمُ\",\"ٱلسَّاعَةِ\",\"وَمَا\",\"تَخْرُجُ\",\"مِن\",\"ثَمَرَٰتٍ\",\"مِّنْ\",\"أَكْمَامِهَا\",\"وَمَا\",\"تَحْمِلُ\",\"مِنْ\",\"أُنثَىٰ\",\"وَلَا\",\"تَضَعُ\",\"إِلَّا\",\"بِعِلْمِهِۦ\",\"وَيَوْمَ\",\"يُنَادِيهِمْ\",\"أَيْنَ\",\"شُرَكَآءِى\",\"قَالُوٓا۟\",\"ءَاذَنَّٰكَ\",\"مَا\",\"مِنَّا\",\"مِن\",\"شَهِيدٍ\"],\"t\":\"To him [alone] is attributed knowledge of the Hour. And fruits emerge not from their coverings nor does a female conceive or give birth except with His knowledge. And the Day He will call to them, \\\"Where are My 'partners'?\\\" they will say, \\\"We announce to You that there is [no longer] among us any witness [to that]\",\"m\":1,\"pickthall\":\"Unto Him is referred (all) knowledge of the Hour. And no fruits burst forth from their sheaths, and no female carrieth or bringeth forth but with His knowledge. And on the day when He calleth unto them: Where are now My partners? they will say: We confess unto Thee, not one of us is a witness (for them)\"},{\"a\":48,\"w\":[\"وَضَلَّ\",\"عَنۡهُم\",\"مَّا\",\"كَانُواْ\",\"يَدۡعُونَ\",\"مِن\",\"قَبۡلُۖ\",\"وَظَنُّواْ\",\"مَا\",\"لَهُم\",\"مِّن\",\"مَّحِيصٖ\"],\"t\":\"And lost from them will be those they were invoking before, and they will be certain that they have no place of escape\",\"pickthall\":\"And those to whom they used to cry of old have failed them, and they perceive they have no place of refuge\"},{\"a\":49,\"w\":[\"لَّا\",\"يَسۡـَٔمُ\",\"ٱلۡإِنسَٰنُ\",\"مِن\",\"دُعَآءِ\",\"ٱلۡخَيۡرِ\",\"وَإِن\",\"مَّسَّهُ\",\"ٱلشَّرُّ\",\"فَيَـُٔوسٞ\",\"قَنُوطٞ\"],\"t\":\"Man is not weary of supplication for good [things], but if evil touches him, he is hopeless and despairing\",\"pickthall\":\"Man tireth not of praying for good, and if ill toucheth him, then he is disheartened, desperate\"},{\"a\":50,\"w\":[\"وَلَئِنۡ\",\"أَذَقۡنَٰهُ\",\"رَحۡمَةٗ\",\"مِّنَّا\",\"مِنۢ\",\"بَعۡدِ\",\"ضَرَّآءَ\",\"مَسَّتۡهُ\",\"لَيَقُولَنَّ\",\"هَٰذَا\",\"لِي\",\"وَمَآ\",\"أَظُنُّ\",\"ٱلسَّاعَةَ\",\"قَآئِمَةٗ\",\"وَلَئِن\",\"رُّجِعۡتُ\",\"إِلَىٰ\",\"رَبِّيٓ\",\"إِنَّ\",\"لِي\",\"عِندَهُۥ\",\"لَلۡحُسۡنَىٰۚ\",\"فَلَنُنَبِّئَنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"بِمَا\",\"عَمِلُواْ\",\"وَلَنُذِيقَنَّهُم\",\"مِّنۡ\",\"عَذَابٍ\",\"غَلِيظٖ\"],\"t\":\"And if We let him taste mercy from Us after an adversity which has touched him, he will surely say, \\\"This is [due] to me, and I do not think the Hour will occur; and [even] if I should be returned to my Lord, indeed, for me there will be with Him the best.\\\" But We will surely inform those who disbelieved about what they did, and We will surely make them taste a massive punishment\",\"pickthall\":\"And verily, if We cause him to taste mercy after some hurt that hath touched him, he will say: This is my own; and I deem not that the Hour will ever rise, and if I am brought back to my Lord, I surely shall be better off with Him - But We verily shall tell those who disbelieve (all) that they did, and We verily shall make them taste hard punishment\"},{\"a\":51,\"w\":[\"وَإِذَآ\",\"أَنۡعَمۡنَا\",\"عَلَى\",\"ٱلۡإِنسَٰنِ\",\"أَعۡرَضَ\",\"وَنَـَٔا\",\"بِجَانِبِهِۦ\",\"وَإِذَا\",\"مَسَّهُ\",\"ٱلشَّرُّ\",\"فَذُو\",\"دُعَآءٍ\",\"عَرِيضٖ\"],\"t\":\"And when We bestow favor upon man, he turns away and distances himself; but when evil touches him, then he is full of extensive supplication\",\"pickthall\":\"When We show favour unto man, he withdraweth and turneth aside, but when ill toucheth him then he aboundeth in prayer\"},{\"a\":52,\"w\":[\"قُلۡ\",\"أَرَءَيۡتُمۡ\",\"إِن\",\"كَانَ\",\"مِنۡ\",\"عِندِ\",\"ٱللَّهِ\",\"ثُمَّ\",\"كَفَرۡتُم\",\"بِهِۦ\",\"مَنۡ\",\"أَضَلُّ\",\"مِمَّنۡ\",\"هُوَ\",\"فِي\",\"شِقَاقِۭ\",\"بَعِيدٖ\"],\"t\":\"Say, \\\"Have you considered: if the Qur'an is from Allah and you disbelieved in it, who would be more astray than one who is in extreme dissension\",\"pickthall\":\"Bethink you: If it is from Allah and ye reject it - Who is further astray than one who is at open feud (with Allah)\"},{\"a\":53,\"w\":[\"سَنُرِيهِمۡ\",\"ءَايَٰتِنَا\",\"فِي\",\"ٱلۡأٓفَاقِ\",\"وَفِيٓ\",\"أَنفُسِهِمۡ\",\"حَتَّىٰ\",\"يَتَبَيَّنَ\",\"لَهُمۡ\",\"أَنَّهُ\",\"ٱلۡحَقُّۗ\",\"أَوَلَمۡ\",\"يَكۡفِ\",\"بِرَبِّكَ\",\"أَنَّهُۥ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"شَهِيدٌ\"],\"t\":\"We will show them Our signs in the horizons and within themselves until it becomes clear to them that it is the truth. But is it not sufficient concerning your Lord that He is, over all things, a Witness\",\"pickthall\":\"We shall show them Our portents on the horizons and within themselves until it will be manifest unto them that it is the Truth. Doth not thy Lord suffice, since He is Witness over all things\"},{\"a\":54,\"w\":[\"أَلَآ\",\"إِنَّهُمۡ\",\"فِي\",\"مِرۡيَةٖ\",\"مِّن\",\"لِّقَآءِ\",\"رَبِّهِمۡۗ\",\"أَلَآ\",\"إِنَّهُۥ\",\"بِكُلِّ\",\"شَيۡءٖ\",\"مُّحِيطُۢ\"],\"t\":\"Unquestionably, they are in doubt about the meeting with their Lord. Unquestionably He is, of all things, encompassing\",\"pickthall\":\"How! Are they still in doubt about the meeting with their Lord? Lo! Is not He surrounding all things\"}]}]}]}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[81329,[\"/Holy-Qur
