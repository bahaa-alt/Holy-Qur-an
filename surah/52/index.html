 frequented House\"},{\"a\":5,\"w\":[\"وَٱلسَّقۡفِ\",\"ٱلۡمَرۡفُوعِ\"],\"t\":\"And [by] the heaven raised high\"},{\"a\":6,\"w\":[\"وَٱلۡبَحۡرِ\",\"ٱلۡمَسۡجُورِ\"],\"t\":\"And [by] the sea filled [with fire]\"},{\"a\":7,\"w\":[\"إِنَّ\",\"عَذَابَ\",\"رَبِّكَ\",\"لَوَٰقِعٞ\"],\"t\":\"Indeed, the punishment of your Lord will occur\"},{\"a\":8,\"w\":[\"مَّا\",\"لَهُۥ\",\"مِن\",\"دَافِعٖ\"],\"t\":\"Of it there is no preventer\"},{\"a\":9,\"w\":[\"يَوۡمَ\",\"تَمُورُ\",\"ٱلسَّمَآءُ\",\"مَوۡرٗا\"],\"t\":\"On the Day the heaven will sway with circular motion\"},{\"a\":10,\"w\":[\"وَتَسِيرُ\",\"ٱلۡجِبَالُ\",\"سَيۡرٗا\"],\"t\":\"And the mountains will pass on, departing\"},{\"a\":11,\"w\":[\"فَوَيۡلٞ\",\"يَوۡمَئِذٖ\",\"لِّلۡمُكَذِّبِينَ\"],\"t\":\"Then woe, that Day, to the deniers\"},{\"a\":12,\"w\":[\"ٱلَّذِينَ\",\"هُمۡ\",\"فِي\",\"خَوۡضٖ\",\"يَلۡعَبُونَ\"],\"t\":\"Who are in [empty] discourse amusing themselves\"},{\"a\":13,\"w\":[\"يَوۡمَ\",\"يُدَعُّونَ\",\"إِلَىٰ\",\"نَارِ\",\"جَهَنَّمَ\",\"دَعًّا\"],\"t\":\"The Day they are thrust toward the fire of Hell with a [violent] thrust, [its angels will say]\"},{\"a\":14,\"w\":[\"هَٰذِهِ\",\"ٱلنَّارُ\",\"ٱلَّتِي\",\"كُنتُم\",\"بِهَا\",\"تُكَذِّبُونَ\"],\"t\":\"This is the Fire which you used to deny\"},{\"a\":15,\"w\":[\"أَفَسِحۡرٌ\",\"هَٰذَآ\",\"أَمۡ\",\"أَنتُمۡ\",\"لَا\",\"تُبۡصِرُونَ\"],\"t\":\"Then is this magic, or do you not see\"},{\"a\":16,\"w\":[\"ٱصۡلَوۡهَا\",\"فَٱصۡبِرُوٓاْ\",\"أَوۡ\",\"لَا\",\"تَصۡبِرُواْ\",\"سَوَآءٌ\",\"عَلَيۡكُمۡۖ\",\"إِنَّمَا\",\"تُجۡزَوۡنَ\",\"مَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"[Enter to] burn therein; then be patient or impatient - it is all the same for you. You are only being recompensed [for] what you used to do\"},{\"a\":17,\"w\":[\"إِنَّ\",\"ٱلۡمُتَّقِينَ\",\"فِي\",\"جَنَّـٰتٖ\",\"وَنَعِيمٖ\"],\"t\":\"Indeed, the righteous will be in gardens and pleasure\"},{\"a\":18,\"w\":[\"فَٰكِهِينَ\",\"بِمَآ\",\"ءَاتَىٰهُمۡ\",\"رَبُّهُمۡ\",\"وَوَقَىٰهُمۡ\",\"رَبُّهُمۡ\",\"عَذَابَ\",\"ٱلۡجَحِيمِ\"],\"t\":\"Enjoying what their Lord has given them, and their Lord protected them from the punishment of Hellfire\"},{\"a\":19,\"w\":[\"كُلُواْ\",\"وَٱشۡرَبُواْ\",\"هَنِيٓـَٔۢا\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"[They will be told], \\\"Eat and drink in satisfaction for what you used to do\"},{\"a\":20,\"w\":[\"مُتَّكِـِٔينَ\",\"عَلَىٰ\",\"سُرُرٖ\",\"مَّصۡفُوفَةٖۖ\",\"وَزَوَّجۡنَٰهُم\",\"بِحُورٍ\",\"عِينٖ\"],\"t\":\"They will be reclining on thrones lined up, and We will marry them to fair women with large, [beautiful] eyes\"},{\"a\":21,\"w\":[\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَٱتَّبَعَتۡهُمۡ\",\"ذُرِّيَّتُهُم\",\"بِإِيمَٰنٍ\",\"أَلۡحَقۡنَا\",\"بِهِمۡ\",\"ذُرِّيَّتَهُمۡ\",\"وَمَآ\",\"أَلَتۡنَٰهُم\",\"مِّنۡ\",\"عَمَلِهِم\",\"مِّن\",\"شَيۡءٖۚ\",\"كُلُّ\",\"ٱمۡرِيِٕۭ\",\"بِمَا\",\"كَسَبَ\",\"رَهِينٞ\"],\"t\":\"And those who believed and whose descendants followed them in faith - We will join with them their descendants, and We will not deprive them of anything of their deeds. Every person, for what he earned, is retained\"},{\"a\":22,\"w\":[\"وَأَمۡدَدۡنَٰهُم\",\"بِفَٰكِهَةٖ\",\"وَلَحۡمٖ\",\"مِّمَّا\",\"يَشۡتَهُونَ\"],\"t\":\"And We will provide them with fruit and meat from whatever they desire\"},{\"a\":23,\"w\":[\"يَتَنَٰزَعُونَ\",\"فِيهَا\",\"كَأۡسٗا\",\"لَّا\",\"لَغۡوٞ\",\"فِيهَا\",\"وَلَا\",\"تَأۡثِيمٞ\"],\"t\":\"They will exchange with one another a cup [of wine] wherein [results] no ill speech or commission of sin\"},{\"a\":24,\"w\":[\"۞وَيَطُوفُ\",\"عَلَيۡهِمۡ\",\"غِلۡمَانٞ\",\"لَّهُمۡ\",\"كَأَنَّهُمۡ\",\"لُؤۡلُؤٞ\",\"مَّكۡنُونٞ\"],\"t\":\"There will circulate among them [servant] boys [especially] for them, as if they were pearls well-protected\"},{\"a\":25,\"w\":[\"وَأَقۡبَلَ\",\"بَعۡضُهُمۡ\",\"عَلَىٰ\",\"بَعۡضٖ\",\"يَتَسَآءَلُونَ\"],\"t\":\"And they will approach one another, inquiring of each other\"},{\"a\":26,\"w\":[\"قَالُوٓاْ\",\"إِنَّا\",\"كُنَّا\",\"قَبۡلُ\",\"فِيٓ\",\"أَهۡلِنَا\",\"مُشۡفِقِينَ\"],\"t\":\"They will say, \\\"Indeed, we were previously among our people fearful [of displeasing Allah]\"},{\"a\":27,\"w\":[\"فَمَنَّ\",\"ٱللَّهُ\",\"عَلَيۡنَا\",\"وَوَقَىٰنَا\",\"عَذَابَ\",\"ٱلسَّمُومِ\"],\"t\":\"So Allah conferred favor upon us and protected us from the punishment of the Scorching Fire\"},{\"a\":28,\"w\":[\"إِنَّا\",\"كُنَّا\",\"مِن\",\"قَبۡلُ\",\"نَدۡعُوهُۖ\",\"إِنَّهُۥ\",\"هُوَ\",\"ٱلۡبَرُّ\",\"ٱلرَّحِيمُ\"],\"t\":\"Indeed, we used to supplicate Him before. Indeed, it is He who is the Beneficent, the Merciful\"},{\"a\":29,\"w\":[\"فَذَكِّرۡ\",\"فَمَآ\",\"أَنتَ\",\"بِنِعۡمَتِ\",\"رَبِّكَ\",\"بِكَاهِنٖ\",\"وَلَا\",\"مَجۡنُونٍ\"],\"t\":\"So remind [O Muhammad], for you are not, by the favor of your Lord, a soothsayer or a madman\"},{\"a\":30,\"w\":[\"أَمۡ\",\"يَقُولُونَ\",\"شَاعِرٞ\",\"نَّتَرَبَّصُ\",\"بِهِۦ\",\"رَيۡبَ\",\"ٱلۡمَنُونِ\"],\"t\":\"Or do they say [of you], \\\"A poet for whom we await a misfortune of time\"},{\"a\":31,\"w\":[\"قُلۡ\",\"تَرَبَّصُواْ\",\"فَإِنِّي\",\"مَعَكُم\",\"مِّنَ\",\"ٱلۡمُتَرَبِّصِينَ\"],\"t\":\"Say, \\\"Wait, for indeed I am, with you, among the waiters\"},{\"a\":32,\"w\":[\"أَمۡ\",\"تَأۡمُرُهُمۡ\",\"أَحۡلَٰمُهُم\",\"بِهَٰذَآۚ\",\"أَمۡ\",\"هُمۡ\",\"قَوۡمٞ\",\"طَاغُونَ\"],\"t\":\"Or do their minds command them to [say] this, or are they a transgressing people\"},{\"a\":33,\"w\":[\"أَمۡ\",\"يَقُولُونَ\",\"تَقَوَّلَهُۥۚ\",\"بَل\",\"لَّا\",\"يُؤۡمِنُونَ\"],\"t\":\"Or do they say, \\\"He has made it up\\\"? Rather, they do not believe\"},{\"a\":34,\"w\":[\"فَلۡيَأۡتُواْ\",\"بِحَدِيثٖ\",\"مِّثۡلِهِۦٓ\",\"إِن\",\"كَانُواْ\",\"صَٰدِقِينَ\"],\"t\":\"Then let them produce a statement like it, if they should be truthful\"},{\"a\":35,\"w\":[\"أَمۡ\",\"خُلِقُواْ\",\"مِنۡ\",\"غَيۡرِ\",\"شَيۡءٍ\",\"أَمۡ\",\"هُمُ\",\"ٱلۡخَٰلِقُونَ\"],\"t\":\"Or were they created by nothing, or were they the creators [of themselves]\"},{\"a\":36,\"w\":[\"أَمۡ\",\"خَلَقُواْ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضَۚ\",\"بَل\",\"لَّا\",\"يُوقِنُونَ\"],\"t\":\"Or did they create the heaven
