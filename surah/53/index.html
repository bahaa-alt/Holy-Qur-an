َىٰ\"],\"t\":\"One of soundness. And he rose to [his] true form\"},{\"a\":7,\"w\":[\"وَهُوَ\",\"بِٱلۡأُفُقِ\",\"ٱلۡأَعۡلَىٰ\"],\"t\":\"While he was in the higher [part of the] horizon\"},{\"a\":8,\"w\":[\"ثُمَّ\",\"دَنَا\",\"فَتَدَلَّىٰ\"],\"t\":\"Then he approached and descended\"},{\"a\":9,\"w\":[\"فَكَانَ\",\"قَابَ\",\"قَوۡسَيۡنِ\",\"أَوۡ\",\"أَدۡنَىٰ\"],\"t\":\"And was at a distance of two bow lengths or nearer\"},{\"a\":10,\"w\":[\"فَأَوۡحَىٰٓ\",\"إِلَىٰ\",\"عَبۡدِهِۦ\",\"مَآ\",\"أَوۡحَىٰ\"],\"t\":\"And he revealed to His Servant what he revealed\"},{\"a\":11,\"w\":[\"مَا\",\"كَذَبَ\",\"ٱلۡفُؤَادُ\",\"مَا\",\"رَأَىٰٓ\"],\"t\":\"The heart did not lie [about] what it saw\"},{\"a\":12,\"w\":[\"أَفَتُمَٰرُونَهُۥ\",\"عَلَىٰ\",\"مَا\",\"يَرَىٰ\"],\"t\":\"So will you dispute with him over what he saw\"},{\"a\":13,\"w\":[\"وَلَقَدۡ\",\"رَءَاهُ\",\"نَزۡلَةً\",\"أُخۡرَىٰ\"],\"t\":\"And he certainly saw him in another descent\"},{\"a\":14,\"w\":[\"عِندَ\",\"سِدۡرَةِ\",\"ٱلۡمُنتَهَىٰ\"],\"t\":\"At the Lote Tree of the Utmost Boundary\"},{\"a\":15,\"w\":[\"عِندَهَا\",\"جَنَّةُ\",\"ٱلۡمَأۡوَىٰٓ\"],\"t\":\"Near it is the Garden of Refuge\"},{\"a\":16,\"w\":[\"إِذۡ\",\"يَغۡشَى\",\"ٱلسِّدۡرَةَ\",\"مَا\",\"يَغۡشَىٰ\"],\"t\":\"When there covered the Lote Tree that which covered [it]\"},{\"a\":17,\"w\":[\"مَا\",\"زَاغَ\",\"ٱلۡبَصَرُ\",\"وَمَا\",\"طَغَىٰ\"],\"t\":\"The sight [of the Prophet] did not swerve, nor did it transgress [its limit]\"},{\"a\":18,\"w\":[\"لَقَدۡ\",\"رَأَىٰ\",\"مِنۡ\",\"ءَايَٰتِ\",\"رَبِّهِ\",\"ٱلۡكُبۡرَىٰٓ\"],\"t\":\"He certainly saw of the greatest signs of his Lord\"},{\"a\":19,\"w\":[\"أَفَرَءَيۡتُمُ\",\"ٱللَّـٰتَ\",\"وَٱلۡعُزَّىٰ\"],\"t\":\"So have you considered al-Lat and al-'Uzza\"},{\"a\":20,\"w\":[\"وَمَنَوٰةَ\",\"ٱلثَّالِثَةَ\",\"ٱلۡأُخۡرَىٰٓ\"],\"t\":\"And Manat, the third - the other one\"},{\"a\":21,\"w\":[\"أَلَكُمُ\",\"ٱلذَّكَرُ\",\"وَلَهُ\",\"ٱلۡأُنثَىٰ\"],\"t\":\"Is the male for you and for Him the female\"},{\"a\":22,\"w\":[\"تِلۡكَ\",\"إِذٗا\",\"قِسۡمَةٞ\",\"ضِيزَىٰٓ\"],\"t\":\"That, then, is an unjust division\"},{\"a\":23,\"w\":[\"إِنۡ\",\"هِيَ\",\"إِلَّآ\",\"أَسۡمَآءٞ\",\"سَمَّيۡتُمُوهَآ\",\"أَنتُمۡ\",\"وَءَابَآؤُكُم\",\"مَّآ\",\"أَنزَلَ\",\"ٱللَّهُ\",\"بِهَا\",\"مِن\",\"سُلۡطَٰنٍۚ\",\"إِن\",\"يَتَّبِعُونَ\",\"إِلَّا\",\"ٱلظَّنَّ\",\"وَمَا\",\"تَهۡوَى\",\"ٱلۡأَنفُسُۖ\",\"وَلَقَدۡ\",\"جَآءَهُم\",\"مِّن\",\"رَّبِّهِمُ\",\"ٱلۡهُدَىٰٓ\"],\"t\":\"They are not but [mere] names you have named them - you and your forefathers - for which Allah has sent down no authority. They follow not except assumption and what [their] souls desire, and there has already come to them from their Lord guidance\"},{\"a\":24,\"w\":[\"أَمۡ\",\"لِلۡإِنسَٰنِ\",\"مَا\",\"تَمَنَّىٰ\"],\"t\":\"Or is there for man whatever he wishes\"},{\"a\":25,\"w\":[\"فَلِلَّهِ\",\"ٱلۡأٓخِرَةُ\",\"وَٱلۡأُولَىٰ\"],\"t\":\"Rather, to Allah belongs the Hereafter and the first [life]\"},{\"a\":26,\"w\":[\"۞وَكَم\",\"مِّن\",\"مَّلَكٖ\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"لَا\",\"تُغۡنِي\",\"شَفَٰعَتُهُمۡ\",\"شَيۡـًٔا\",\"إِلَّا\",\"مِنۢ\",\"بَعۡدِ\",\"أَن\",\"يَأۡذَنَ\",\"ٱللَّهُ\",\"لِمَن\",\"يَشَآءُ\",\"وَيَرۡضَىٰٓ\"],\"t\":\"And how many angels there are in the heavens whose intercession will not avail at all except [only] after Allah has permitted [it] to whom He wills and approves\"},{\"a\":27,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"لَا\",\"يُؤۡمِنُونَ\",\"بِٱلۡأٓخِرَةِ\",\"لَيُسَمُّونَ\",\"ٱلۡمَلَـٰٓئِكَةَ\",\"تَسۡمِيَةَ\",\"ٱلۡأُنثَىٰ\"],\"t\":\"Indeed, those who do not believe in the Hereafter name the angels female names\"},{\"a\":28,\"w\":[\"وَمَا\",\"لَهُم\",\"بِهِۦ\",\"مِنۡ\",\"عِلۡمٍۖ\",\"إِن\",\"يَتَّبِعُونَ\",\"إِلَّا\",\"ٱلظَّنَّۖ\",\"وَإِنَّ\",\"ٱلظَّنَّ\",\"لَا\",\"يُغۡنِي\",\"مِنَ\",\"ٱلۡحَقِّ\",\"شَيۡـٔٗا\"],\"t\":\"And they have thereof no knowledge. They follow not except assumption, and indeed, assumption avails not against the truth at all\"},{\"a\":29,\"w\":[\"فَأَعۡرِضۡ\",\"عَن\",\"مَّن\",\"تَوَلَّىٰ\",\"عَن\",\"ذِكۡرِنَا\",\"وَلَمۡ\",\"يُرِدۡ\",\"إِلَّا\",\"ٱلۡحَيَوٰةَ\",\"ٱلدُّنۡيَا\"],\"t\":\"So turn away from whoever turns his back on Our message and desires not except the worldly life\"},{\"a\":30,\"w\":[\"ذَٰلِكَ\",\"مَبۡلَغُهُم\",\"مِّنَ\",\"ٱلۡعِلۡمِۚ\",\"إِنَّ\",\"رَبَّكَ\",\"هُوَ\",\"أَعۡلَمُ\",\"بِمَن\",\"ضَلَّ\",\"عَن\",\"سَبِيلِهِۦ\",\"وَهُوَ\",\"أَعۡلَمُ\",\"بِمَنِ\",\"ٱهۡتَدَىٰ\"],\"t\":\"That is their sum of knowledge. Indeed, your Lord is most knowing of who strays from His way, and He is most knowing of who is guided\"},{\"a\":31,\"w\":[\"وَلِلَّهِ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَمَا\",\"فِي\",\"ٱلۡأَرۡضِ\",\"لِيَجۡزِيَ\",\"ٱلَّذِينَ\",\"أَسَـٰٓـُٔواْ\",\"بِمَا\",\"عَمِلُواْ\",\"وَيَجۡزِيَ\",\"ٱلَّذِينَ\",\"أَحۡسَنُواْ\",\"بِٱلۡحُسۡنَى\"],\"t\":\"And to Allah belongs whatever is in the heavens and whatever is in the earth - that He may recompense those who do evil with [the penalty of] what they have done and recompense those who do good with the best [reward]\"},{\"a\":32,\"w\":[\"ٱلَّذِينَ\",\"يَجۡتَنِبُونَ\",\"كَبَـٰٓئِرَ\",\"ٱلۡإِثۡمِ\",\"وَٱلۡفَوَٰحِشَ\",\"إِلَّا\",\"ٱللَّمَمَۚ\",\"إِنَّ\",\"رَبَّكَ\",\"وَٰسِعُ\",\"ٱلۡمَغۡفِرَةِۚ\",\"هُوَ\",\"أَعۡلَمُ\",\"بِكُمۡ\",\"إِذۡ\",\"أَنشَأَكُم\",\"مِّنَ\",\"ٱلۡأَرۡضِ\",\"وَإِذۡ\",\"أَنتُمۡ\",\"أَجِنَّةٞ\",\"فِي\",\"بُطُونِ\",\"أُمَّهَٰتِكُمۡۖ\",\"فَلَا\",\"تُزَكُّوٓاْ\",\"أَنفُسَكُمۡۖ\",\"هُوَ\",\"أَعۡلَمُ\",\"بِمَنِ\",\"ٱتَّقَىٰٓ\"],\"t\":\"Those who avoid the major sins and immoralities, only [committing] slight ones. Indeed, your Lord is vast in forgiveness. He was most knowing of you when He produced you from the earth and when you were fetuses in the wombs of your mothers. So do not claim yourselves to be pure; He is most knowing of who fears Him\"},{\"a\":33,\"w\":[\"أَفَرَءَيۡتَ\",\"ٱلَّذِي\",\"تَوَلَّىٰ\"],\"t\":\"Have you seen the one who turned away\"},{\"a\":34,\"w\":[\"وَأَعۡطَىٰ\",\"قَلِيلٗا\",\"وَأَكۡدَىٰٓ\"],\"t\":\"And gave a little and [then] refrained\"},{\"a\":35,\"w\":[\"أَعِندَهُۥ\",\"عِلۡمُ\",\"ٱلۡغَيۡبِ\",\"فَهُوَ\",\"يَرَىٰٓ\"],\"t\":\"Does he have knowledge of the unseen, so he sees\"},{\"a\":36,\"w\":[\"أَمۡ\",\"لَمۡ\",\"يُنَبَّأۡ\",\"بِمَا\",\"فِي\",\"صُحُفِ\",\"مُوسَىٰ\"],\"t\":\"Or has he not been informed of what was in the scriptures of Moses\"},{\"a\":37,\"w\":[\"وَإِبۡرَٰهِيمَ\",\"ٱلَّذِي\",\"وَفَّىٰٓ\"],\"t\":\"And [of] Abraham, who fulfilled [his obligations]\"},{\"a\":38,\"w\":[\"أَلَّا\",\"تَزِرُ\",\"وَازِرَةٞ\",\"وِزۡرَ\",\"أُخۡرَىٰ\"],\"t\":\"That no bearer of burdens will bear the burden of another\"},{\"a\":39,\"w\":[\"وَأَن\",\"لَّيۡسَ\",\"لِلۡإِنسَٰنِ\",\"إِلَّا\",\"مَا\",\"سَعَىٰ\"],\"t\":\"And that there is not for man except that [good] for which he strives\"},{\"a\":40,\"w\":[\"وَأَنَّ\",\"سَعۡيَهُۥ\",\"سَوۡفَ\",\"يُرَىٰ\"],\"t\":\"And that his effort is going to be seen\"},{\"a\":41,\"w\":[\"ثُمَّ\",\"يُجۡزَىٰهُ\",\"ٱلۡجَزَآءَ\",\"ٱلۡأَوۡفَىٰ\"],\"t\":\"Then he will be recompensed for it with the fullest recompense\"},{\"a\":42,\"w\":[\"وَأَنَّ\",\"إِلَىٰ\",\"رَبِّكَ\",\"ٱلۡمُنتَهَىٰ\"],\"t\":\"And that to your Lord is the finality\"},{\"a\":43,\"w\":[\"وَأَنَّهُۥ\",\"هُوَ\",\"أَضۡحَكَ\",\"وَأَبۡكَىٰ\"],\"t\":\"And that it is He who makes [one] laugh and weep\"},{\"a\":44,\"w\":[\"وَأَنَّهُۥ\",\"هُوَ\",\"أَمَاتَ\",\"وَأَحۡيَا\"],\"t\":\"And that it is He who causes death and gives life\"},{\"a\":45,\"w\":[\"وَأَنَّهُۥ\",\"خَلَقَ\",\"ٱلزَّوۡجَيۡنِ\",\"ٱلذَّكَرَ\",\"وَٱلۡأُنثَىٰ\"],\"t\":\"And that He creates the two mates - the male and female\"},{\"a\":46,\"w\":[\"مِن\",\"نُّطۡفَةٍ\",\"إِذَا\",\"تُمۡنَىٰ\"],\"t\":\"From a sperm-drop when it is emitted\"},{\"a\":47,\"w\":[\"وَأَنَّ\",\"عَلَيۡهِ\",\"ٱلنَّشۡأَةَ\",\"ٱلۡأُخۡرَىٰ\"],\"t\":\"And that [incumbent] upon Him is the next creation\"},{\"a\":48,\"w\":[\"وَأَنَّهُۥ\",\"هُوَ\",\"أَغۡنَىٰ\",\"وَأَقۡنَىٰ\"],\"t\":\"And that it is He who enriches and suffices\"},{\"a\":49,\"w\":[\"وَأَنَّهُۥ\",\"هُوَ\",\"رَبُّ\",\"ٱلشِّعۡرَىٰ\"],\"t\":\"And that it is He who is the Lord of Sirius\"},{\"a\":50,\"w\":[\"وَأَنَّهُۥٓ\",\"أَهۡلَكَ\",\"عَادًا\",\"ٱلۡأُولَىٰ\"],\"t\":\"And that He destroyed the first [people of] 'Aad\"},{\"a\":51,\"w\":[\"وَثَمُودَاْ\",\"فَمَآ\",\"أَبۡقَىٰ\"],\"t\":\"And Thamud - and He did not spare [them]\"},{\"a\":52,\"w\":[\"وَقَوۡمَ\",\"نُوحٖ\",\"مِّن\",\"قَبۡلُۖ\",\"إِنَّهُمۡ\",\"كَانُواْ\",\"هُمۡ\",\"أَظۡلَمَ\",\"وَأَطۡغَىٰ\"],\"t\":\"And the people of Noah before. Indeed, it was they who were [even] more unjust and oppressing\"},{\"a\":53,\"w\":[\"وَٱلۡمُؤۡتَفِكَةَ\",\"أَهۡوَىٰ\"],\"t\":\"And the overturned towns He hurled down\"},{\"a\":54,\"w\":[\"فَغَشَّىٰهَا\",\"مَا\",\"غَشَّىٰ\"],\"t\":\"And covered them by that which He covered\"},{\"a\":55,\"w\":[\"فَبِأَيِّ\",\"ءَالَآءِ\",\"رَبِّكَ\",\"تَتَمَارَىٰ\"],\"t\":\"Then which of the favors of your Lord do you doubt\"},{\"a\":56,\"w\":[\"هَٰذَا\",\"نَذِيرٞ\",\"مِّنَ\",\"ٱلنُّذُرِ\",\"ٱلۡأُولَىٰٓ\"],\"t\":\"This [Prophet] is a warner like the former warners\"},{\"a\":57,\"w\":[\"أَزِفَتِ\",\"ٱلۡأٓزِفَةُ\"],\"t\":\"The Approaching Day has approached\"},{\"a\":58,\"w\":[\"لَيۡسَ\",\"لَهَا\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"كَاشِفَةٌ\"],\"t\":\"Of it, [from those] besides Allah, there is no remover\"},{\"a\":59,\"w\":[\"أَفَمِنۡ\",\"هَٰذَا\",\"ٱلۡحَدِيثِ\",\"تَعۡجَبُونَ\"],\"t\":\"Then at this statement do you wonder\"},{\"a\":60,\"w\":[\"وَتَضۡحَكُونَ\",\"وَلَا\",\"تَبۡكُونَ\"],\"t\":\"And you laugh and do not weep\"},{\"a\":61,\"w\":[\"وَأَنتُمۡ\",\"سَٰمِدُونَ\"],\"t\":\"While you are proudly sporting\"},{\"a\":62,\"w\":[\"فَٱسۡجُدُواْۤ\",\"لِلَّهِۤ\",\"وَٱعۡبُدُواْ۩\"],\"t\":\"So prostrate to Allah and worship [Him]\"}]}]}]}]]}]\n16:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a
