"$\",\"div\",null,{\"className\":\"mt-8\",\"children\":[\"$\",\"$17\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"text-center text-sm text-muted\",\"children\":\"Loading verses…\"}],\"children\":[\"$\",\"$L1d\",null,{\"surahMeta\":{\"n\":56,\"nameAr\":\"الواقعة\",\"nameEn\":\"The Inevitable\",\"translit\":\"Al-Waqi'ah\",\"type\":\"meccan\",\"ayahs\":96},\"verses\":[{\"a\":1,\"w\":[\"إِذَا\",\"وَقَعَتِ\",\"ٱلۡوَاقِعَةُ\"],\"t\":\"When the Occurrence occurs\"},{\"a\":2,\"w\":[\"لَيۡسَ\",\"لِوَقۡعَتِهَا\",\"كَاذِبَةٌ\"],\"t\":\"There is, at its occurrence, no denial\"},{\"a\":3,\"w\":[\"خَافِضَةٞ\",\"رَّافِعَةٌ\"],\"t\":\"It will bring down [some] and raise up [others]\"},{\"a\":4,\"w\":[\"إِذَا\",\"رُجَّتِ\",\"ٱلۡأَرۡضُ\",\"رَجّٗا\"],\"t\":\"When the earth is shaken with convulsion\"},{\"a\":5,\"w\":[\"وَبُسَّتِ\",\"ٱلۡجِبَالُ\",\"بَسّٗا\"],\"t\":\"And the mountains are broken down, crumbling\"},{\"a\":6,\"w\":[\"فَكَانَتۡ\",\"هَبَآءٗ\",\"مُّنۢبَثّٗا\"],\"t\":\"And become dust dispersing\"},{\"a\":7,\"w\":[\"وَكُنتُمۡ\",\"أَزۡوَٰجٗا\",\"ثَلَٰثَةٗ\"],\"t\":\"And you become [of] three kinds\"},{\"a\":8,\"w\":[\"فَأَصۡحَٰبُ\",\"ٱلۡمَيۡمَنَةِ\",\"مَآ\",\"أَصۡحَٰبُ\",\"ٱلۡمَيۡمَنَةِ\"],\"t\":\"Then the companions of the right - what are the companions of the right\"},{\"a\":9,\"w\":[\"وَأَصۡحَٰبُ\",\"ٱلۡمَشۡـَٔمَةِ\",\"مَآ\",\"أَصۡحَٰبُ\",\"ٱلۡمَشۡـَٔمَةِ\"],\"t\":\"And the companions of the left - what are the companions of the left\"},{\"a\":10,\"w\":[\"وَٱلسَّـٰبِقُونَ\",\"ٱلسَّـٰبِقُونَ\"],\"t\":\"And the forerunners, the forerunners\"},{\"a\":11,\"w\":[\"أُوْلَـٰٓئِكَ\",\"ٱلۡمُقَرَّبُونَ\"],\"t\":\"Those are the ones brought near [to Allah]\"},{\"a\":12,\"w\":[\"فِي\",\"جَنَّـٰتِ\",\"ٱلنَّعِيمِ\"],\"t\":\"In the Gardens of Pleasure\"},{\"a\":13,\"w\":[\"ثُلَّةٞ\",\"مِّنَ\",\"ٱلۡأَوَّلِينَ\"],\"t\":\"A [large] company of the former peoples\"},{\"a\":14,\"w\":[\"وَقَلِيلٞ\",\"مِّنَ\",\"ٱلۡأٓخِرِينَ\"],\"t\":\"And a few of the later peoples\"},{\"a\":15,\"w\":[\"عَلَىٰ\",\"سُرُرٖ\",\"مَّوۡضُونَةٖ\"],\"t\":\"On thrones woven [with ornament]\"},{\"a\":16,\"w\":[\"مُّتَّكِـِٔينَ\",\"عَلَيۡهَا\",\"مُتَقَٰبِلِينَ\"],\"t\":\"Reclining on them, facing each other\"},{\"a\":17,\"w\":[\"يَطُوفُ\",\"عَلَيۡهِمۡ\",\"وِلۡدَٰنٞ\",\"مُّخَلَّدُونَ\"],\"t\":\"There will circulate among them young boys made eternal\"},{\"a\":18,\"w\":[\"بِأَكۡوَابٖ\",\"وَأَبَارِيقَ\",\"وَكَأۡسٖ\",\"مِّن\",\"مَّعِينٖ\"],\"t\":\"With vessels, pitchers and a cup [of wine] from a flowing spring\"},{\"a\":19,\"w\":[\"لَّا\",\"يُصَدَّعُونَ\",\"عَنۡهَا\",\"وَلَا\",\"يُنزِفُونَ\"],\"t\":\"No headache will they have therefrom, nor will they be intoxicated\"},{\"a\":20,\"w\":[\"وَفَٰكِهَةٖ\",\"مِّمَّا\",\"يَتَخَيَّرُونَ\"],\"t\":\"And fruit of what they select\"},{\"a\":21,\"w\":[\"وَلَحۡمِ\",\"طَيۡرٖ\",\"مِّمَّا\",\"يَشۡتَهُونَ\"],\"t\":\"And the meat of fowl, from whatever they desire\"},{\"a\":22,\"w\":[\"وَحُورٌ\",\"عِينٞ\"],\"t\":\"And [for them are] fair women with large, [beautiful] eyes\"},{\"a\":23,\"w\":[\"كَأَمۡثَٰلِ\",\"ٱللُّؤۡلُوِٕ\",\"ٱلۡمَكۡنُونِ\"],\"t\":\"The likenesses of pearls well-protected\"},{\"a\":24,\"w\":[\"جَزَآءَۢ\",\"بِمَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"As reward for what they used to do\"},{\"a\":25,\"w\":[\"لَا\",\"يَسۡمَعُونَ\",\"فِيهَا\",\"لَغۡوٗا\",\"وَلَا\",\"تَأۡثِيمًا\"],\"t\":\"They will not hear therein ill speech or commission of sin\"},{\"a\":26,\"w\":[\"إِلَّا\",\"قِيلٗا\",\"سَلَٰمٗا\",\"سَلَٰمٗا\"],\"t\":\"Only a saying: \\\"Peace, peace\"},{\"a\":27,\"w\":[\"وَأَصۡحَٰبُ\",\"ٱلۡيَمِينِ\",\"مَآ\",\"أَصۡحَٰبُ\",\"ٱلۡيَمِينِ\"],\"t\":\"The companions of the right - what are the companions of the right\"},{\"a\":28,\"w\":[\"فِي\",\"سِدۡرٖ\",\"مَّخۡضُودٖ\"],\"t\":\"[They will be] among lote trees with thorns removed\"},{\"a\":29,\"w\":[\"وَطَلۡحٖ\",\"مَّنضُودٖ\"],\"t\":\"And [banana] trees layered [with fruit]\"},{\"a\":30,\"w\":[\"وَظِلّٖ\",\"مَّمۡدُودٖ\"],\"t\":\"And shade extended\"},{\"a\":31,\"w\":[\"وَمَآءٖ\",\"مَّسۡكُوبٖ\"],\"t\":\"And water poured out\"},{\"a\":32,\"w\":[\"وَفَٰكِهَةٖ\",\"كَثِيرَةٖ\"],\"t\":\"And fruit, abundant [and varied]\"},{\"a\":33,\"w\":[\"لَّا\",\"مَقۡطُوعَةٖ\",\"وَلَا\",\"مَمۡنُوعَةٖ\"],\"t\":\"Neither limited [to season] nor forbidden\"},{\"a\":34,\"w\":[\"وَفُرُشٖ\",\"مَّرۡفُوعَةٍ\"],\"t\":\"And [upon] beds raised high\"},{\"a\":35,\"w\":[\"إِنَّآ\",\"أَنشَأۡنَٰهُنَّ\",\"إِنشَآءٗ\"],\"t\":\"Indeed, We have produced the women of Paradise in a [new] creation\"},{\"a\":36,\"w\":[\"فَجَعَلۡنَٰهُنَّ\",\"أَبۡكَارًا\"],\"t\":\"And made them virgins\"},{\"a\":37,\"w\":[\"عُرُبًا\",\"أَتۡرَابٗا\"],\"t\":\"Devoted [to their husbands] and of equal age\"},{\"a\":38,\"w\":[\"لِّأَصۡحَٰبِ\",\"ٱلۡيَمِينِ\"],\"t\":\"For the companions of the right [who are]\"},{\"a\":39,\"w\":[\"ثُلَّةٞ\",\"مِّنَ\",\"ٱلۡأَوَّلِينَ\"],\"t\":\"A company of the former peoples\"},{\"a\":40,\"w\":[\"وَثُلَّةٞ\",\"مِّنَ\",\"ٱلۡأٓخِرِينَ\"],\"t\":\"And a company of the later peoples\"},{\"a\":41,\"w\":[\"وَأَصۡحَٰبُ\",\"ٱلشِّمَالِ\",\"مَآ\",\"أَصۡحَٰبُ\",\"ٱلشِّمَالِ\"],\"t\":\"And the companions of the left - what are the companions of the left\"},{\"a\":42,\"w\":[\"فِي\",\"سَمُومٖ\",\"وَحَمِيمٖ\"],\"t\":\"[They will be] in scorching fire and scalding water\"},{\"a\":43,\"w\":[\"وَظِلّٖ\",\"مِّن\",\"يَحۡمُومٖ\"],\"t\":\"And a shade of black smoke\"},{\"a\":44,\"w\":[\"لَّا\",\"بَارِدٖ\",\"وَلَا\",\"كَرِيمٍ\"],\"t\":\"Neither cool nor beneficial\"},{\"a\":45,\"w\":[\"إِنَّهُمۡ\",\"كَانُواْ\",\"قَبۡلَ\",\"ذَٰلِكَ\",\"مُتۡرَفِينَ\"],\"t\":\"Indeed they were, before that, indulging in affluence\"},{\"a\":46,\"w\":[\"وَكَانُواْ\",\"يُصِرُّونَ\",\"عَلَى\",\"ٱلۡحِنثِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"And they used to persist in the great violation\"},{\"a\":47,\"w\":[\"وَكَانُواْ\",\"يَقُولُونَ\",\"أَئِذَا\",\"مِتۡنَا\",\"وَكُنَّا\",\"تُرَابٗا\",\"وَعِظَٰمًا\",\"أَءِنَّا\",\"لَمَبۡعُوثُونَ\"],\"t\":\"And they used to say, \\\"When we die and become dust and bones, are we indeed to be resurrected\"},{\"a\":48,\"w\":[\"أَوَءَابَآؤُنَا\",\"ٱلۡأَوَّلُونَ\"],\"t\":\"And our forefathers [as well]\"},{\"a\":49,\"w\":[\"قُلۡ\",\"إِنَّ\",\"ٱلۡأَوَّلِينَ\",\"وَٱلۡأٓخِرِينَ\"],\"t\":\"Say, [O Muhammad], \\\"Indeed, the former and the later peoples\"},{\"a\":50,\"w\":[\"لَمَجۡمُوعُونَ\",\"إِلَىٰ\",\"مِيقَٰتِ\",\"يَوۡمٖ\",\"مَّعۡلُومٖ\"],\"t\":\"Are to be gathered together for the appointment of a known Day\"},{\"a\":51,\"w\":[\"ثُمَّ\",\"إِنَّكُمۡ\",\"أَيُّهَا\",\"ٱلضَّآلُّونَ\",\"ٱلۡمُكَذِّبُونَ\"],\"t\":\"Then indeed you, O those astray [who are] deniers\"},{\"a\":52,\"w\":[\"لَأٓكِلُونَ\",\"مِن\",\"شَجَرٖ\",\"مِّن\",\"زَقُّومٖ\"],\"t\":\"Will be eating from trees of zaqqum\"},{\"a\":53,\"w\":[\"فَمَالِـُٔونَ\",\"مِنۡهَا\",\"ٱلۡبُطُونَ\"],\"t\":\"And filling with it your bellies\"},{\"a\":54,\"w\":[\"فَشَٰرِبُونَ\",\"عَلَيۡهِ\",\"مِنَ\",\"ٱلۡحَمِيمِ\"],\"t\":\"And drinking on top of it from scalding water\"},{\"a\":55,\"w\":[\"فَشَٰرِبُونَ\",\"شُرۡبَ\",\"ٱلۡهِيمِ\"],\"t\":\"And will drink as the drinking of thirsty camels\"},{\"a\":56,\"w\":[\"هَٰذَا\",\"نُزُلُهُمۡ\",\"يَوۡمَ\",\"ٱلدِّينِ\"],\"t\":\"That is their accommodation on the Day of Recompense\"},{\"a\":57,\"w\":[\"نَحۡنُ\",\"خَلَقۡنَٰكُمۡ\",\"فَلَوۡلَا\",\"تُصَدِّقُونَ\"],\"t\":\"We have created you, so why do you not believe\"},{\"a\":58,\"w\":[\"أَفَرَءَيۡتُم\",\"مَّا\",\"تُمۡنُونَ\"],\"t\":\"Have you seen that which you emit\"},{\"a\":59,\"w\":[\"ءَأَنتُمۡ\",\"تَخۡلُقُونَهُۥٓ\",\"أَمۡ\",\"نَحۡنُ\",\"ٱلۡخَٰلِقُونَ\"],\"t\":\"Is it you who creates it, or are We the Creator\"},{\"a\":60,\"w\":[\"نَحۡنُ\",\"قَدَّرۡنَا\",\"بَيۡنَكُمُ\",\"ٱلۡمَوۡتَ\",\"وَمَا\",\"نَحۡنُ\",\"بِمَسۡبُوقِينَ\"],\"t\":\"We have decreed death among you, and We are not to be outdone\"},{\"a\":61,\"w\":[\"عَلَىٰٓ\",\"أَن\",\"نُّبَدِّلَ\",\"أَمۡثَٰلَكُمۡ\",\"وَنُنشِئَكُمۡ\",\"فِي\",\"مَا\",\"لَا\",\"تَعۡلَمُونَ\"],\"t\":\"In that We will change your likenesses and produce you in that [form] which you do not know\"},{\"a\":62,\"w\":[\"وَلَقَدۡ\",\"عَلِمۡتُمُ\",\"ٱلنَّشۡأَةَ\",\"ٱلۡأُولَىٰ\",\"فَلَوۡلَا\",\"تَذَكَّرُونَ\"],\"t\":\"And you have already known the first creation, so will you not remember\"},{\"a\":63,\"w\":[\"أَفَرَءَيۡتُم\",\"مَّا\",\"تَحۡرُثُونَ\"],\"t\":\"And have you seen that [seed] which you sow\"},{\"a\":64,\"w\":[\"ءَأَنتُمۡ\",\"تَزۡرَعُونَهُۥٓ\",\"أَمۡ\",\"نَحۡنُ\",\"ٱلزَّـٰرِعُونَ\"],\"t\":\"Is it you who makes it grow, or are We the grower\"},{\"a\":65,\"w\":[\"لَوۡ\",\"نَشَآءُ\",\"لَجَعَلۡنَٰهُ\",\"حُطَٰمٗا\",\"فَظَلۡتُمۡ\",\"تَفَكَّهُونَ\"],\"t\":\"If We willed, We could make it [dry] debris, and you would remain in wonder\"},{\"a\":66,\"w\":[\"إِنَّا\",\"لَمُغۡرَمُونَ\"],\"t\":\"[Saying], \\\"Indeed, we are [now] in debt\"},{\"a\":67,\"w\":[\"بَلۡ\",\"نَحۡنُ\",\"مَحۡرُومُونَ\"],\"t\":\"Rather, we have been deprived\"},{\"a\":68,\"w\":[\"أَفَرَءَيۡتُمُ\",\"ٱلۡمَآءَ\",\"ٱلَّذِي\",\"تَشۡرَبُونَ\"],\"t\":\"And have you seen the water that you drink\"},{\"a\":69,\"w\":[\"ءَأَنتُمۡ\",\"أَنزَلۡتُمُوهُ\",\"مِنَ\",\"ٱلۡمُزۡنِ\",\"أَمۡ\",\"نَحۡنُ\",\"ٱلۡمُنزِلُونَ\"],\"t\":\"Is it you who brought it down from the clouds, or is it We who bring it down\"},{\"a\":70,\"w\":[\"لَوۡ\",\"نَشَآءُ\",\"جَعَلۡنَٰهُ\",\"أُجَاجٗا\",\"فَلَوۡلَا\",\"تَشۡكُرُونَ\"],\"t\":\"If We willed, We could make it bitter, so why are you not grateful\"},{\"a\":71,\"w\":[\"أَفَرَءَيۡتُمُ\",\"ٱلنَّارَ\",\"ٱلَّتِي\",\"تُورُونَ\"],\"t\":\"And have you seen the fire that you ignite\"},{\"a\":72,\"w\":[\"ءَأَنتُمۡ\",\"أَنشَأۡتُمۡ\",\"شَجَرَتَهَآ\",\"أَمۡ\",\"نَحۡنُ\",\"ٱلۡمُنشِـُٔونَ\"],\"t\":\"Is it you who produced its tree, or are We the producer\"},{\"a\":73,\"w\":[\"نَحۡنُ\",\"جَعَلۡنَٰهَا\",\"تَذۡكِرَةٗ\",\"وَمَتَٰعٗا\",\"لِّلۡمُقۡوِينَ\"],\"t\":\"We have made it a reminder and provision for the travelers\"},{\"a\":74,\"w\":[\"فَسَبِّحۡ\",\"بِٱسۡمِ\",\"رَبِّكَ\",\"ٱلۡعَظِيمِ\"],\"t\":\"So exalt the name of your Lord, the Most Great\"},{\"a\":75,\"w\":[\"۞فَلَآ\",\"أُقۡسِمُ\",\"بِمَوَٰقِعِ\",\"ٱلن ۡ\",\"أَصۡحَٰبِ\",\"ٱلۡيَمِينِ\"],\"t\":\"And if he was of the companions of the right\"},{\"a\":91,\"w\":[\"فَسَلَٰمٞ\",\"لَّكَ\",\"مِنۡ\",\"أَصۡحَٰبِ\",\"ٱلۡيَمِينِ\"],\"t\":\"Then [the angels will say], \\\"Peace for you; [you are] from the companions of the right\"},{\"a\":92,\"w\":[\"وَأَمَّآ\",\"إِن\",\"كَانَ\",\"مِنَ\",\"ٱلۡمُكَذِّبِينَ\",\"ٱلضَّآلِّينَ\"],\"t\":\"But if he was of the deniers [who were] astray\"},{\"a\":93,\"w\":[\"فَنُزُلٞ\",\"مِّنۡ\",\"حَمِيمٖ\"],\"t\":\"Then [for him is] accommodation of scalding water\"},{\"a\":94,\"w\":[\"وَتَصۡلِيَةُ\",\"جَحِيمٍ\"],\"t\":\"And burning in Hellfire\"},{\"a\":95,\"w\":[\"إِنَّ\",\"هَٰذَا\",\"لَهُوَ\",\"حَقُّ\",\"ٱلۡيَقِينِ\"],\"t\":\"Indeed, this is the true certainty\"},{\"a\":96,\"w\":[\"فَسَبِّحۡ\",\"بِٱسۡمِ\",\"رَبِّكَ\",\"ٱلۡعَظِيمِ\"],\"t\":\"So exalt the name of your Lord, the Most Great\"}]}]}]}]]}]\n1a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1e:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n18:null\n1c:[[\"$\",\"title\",\"0\",{\"children\":\"Al-Waqi'ah — Surah 56 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes
