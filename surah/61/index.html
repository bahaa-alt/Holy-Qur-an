them with clear evidences, they said, \\\"This is obvious magic\",\"pickthall\":\"And when Jesus son of Mary said: O Children of Israel! Lo! I am the messenger of Allah unto you, confirming that which was (revealed) before me in the Torah, and bringing good tidings of a messenger who cometh after me, whose name is the Praised One. Yet when he hath come unto them with clear proofs, they say: This is mere magic\"},{\"a\":7,\"w\":[\"وَمَنۡ\",\"أَظۡلَمُ\",\"مِمَّنِ\",\"ٱفۡتَرَىٰ\",\"عَلَى\",\"ٱللَّهِ\",\"ٱلۡكَذِبَ\",\"وَهُوَ\",\"يُدۡعَىٰٓ\",\"إِلَى\",\"ٱلۡإِسۡلَٰمِۚ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"And who is more unjust than one who invents about Allah untruth while he is being invited to Islam. And Allah does not guide the wrongdoing people\",\"pickthall\":\"And who doeth greater wrong than he who inventeth a lie against Allah when he is summoned unto Al-Islam? And Allah guideth not wrongdoing folk\"},{\"a\":8,\"w\":[\"يُرِيدُونَ\",\"لِيُطۡفِـُٔواْ\",\"نُورَ\",\"ٱللَّهِ\",\"بِأَفۡوَٰهِهِمۡ\",\"وَٱللَّهُ\",\"مُتِمُّ\",\"نُورِهِۦ\",\"وَلَوۡ\",\"كَرِهَ\",\"ٱلۡكَٰفِرُونَ\"],\"t\":\"They want to extinguish the light of Allah with their mouths, but Allah will perfect His light, although the disbelievers dislike it\",\"pickthall\":\"Fain would they put out the light of Allah with their mouths, but Allah will perfect His light however much the disbelievers are averse\"},{\"a\":9,\"w\":[\"هُوَ\",\"ٱلَّذِيٓ\",\"أَرۡسَلَ\",\"رَسُولَهُۥ\",\"بِٱلۡهُدَىٰ\",\"وَدِينِ\",\"ٱلۡحَقِّ\",\"لِيُظۡهِرَهُۥ\",\"عَلَى\",\"ٱلدِّينِ\",\"كُلِّهِۦ\",\"وَلَوۡ\",\"كَرِهَ\",\"ٱلۡمُشۡرِكُونَ\"],\"t\":\"It is He who sent His Messenger with guidance and the religion of truth to manifest it over all religion, although those who associate others with Allah dislike it\",\"pickthall\":\"He it is Who hath sent His messenger with the guidance and the religion of truth, that He may make it conqueror of all religion however much idolaters may be averse\"},{\"a\":10,\
