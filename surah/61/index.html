ment\"},{\"a\":11,\"w\":[\"تُؤۡمِنُونَ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦ\",\"وَتُجَٰهِدُونَ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"بِأَمۡوَٰلِكُمۡ\",\"وَأَنفُسِكُمۡۚ\",\"ذَٰلِكُمۡ\",\"خَيۡرٞ\",\"لَّكُمۡ\",\"إِن\",\"كُنتُمۡ\",\"تَعۡلَمُونَ\"],\"t\":\"[It is that] you believe in Allah and His Messenger and strive in the cause of Allah with your wealth and your lives. That is best for you, if you should know\"},{\"a\":12,\"w\":[\"يَغۡفِرۡ\",\"لَكُمۡ\",\"ذُنُوبَكُمۡ\",\"وَيُدۡخِلۡكُمۡ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"وَمَسَٰكِنَ\",\"طَيِّبَةٗ\",\"فِي\",\"جَنَّـٰتِ\",\"عَدۡنٖۚ\",\"ذَٰلِكَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"He will forgive for you your sins and admit you to gardens beneath which rivers flow and pleasant dwellings in gardens of perpetual residence. That is the great attainment\"},{\"a\":13,\"w\":[\"وَأُخۡرَىٰ\",\"تُحِبُّونَهَاۖ\",\"نَصۡرٞ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَفَتۡحٞ\",\"قَرِيبٞۗ\",\"وَبَشِّرِ\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"And [you will obtain] another [favor] that you love - victory from Allah and an imminent conquest; and give good tidings to the believers\"},{\"a\":14,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"كُونُوٓاْ\",\"أَنصَارَ\",\"ٱللَّهِ\",\"كَمَا\",\"قَالَ\",\"عِيسَى\",\"ٱبۡنُ\",\"مَرۡيَمَ\",\"لِلۡحَوَارِيِّـۧنَ\",\"مَنۡ\",\"أَنصَارِيٓ\",\"إِلَى\",\"ٱللَّهِۖ\",\"قَالَ\",\"ٱلۡحَوَارِيُّونَ\",\"نَحۡنُ\",\"أَنصَارُ\",\"ٱللَّهِۖ\",\"فَـَٔامَنَت\",\"طَّآئِفَةٞ\",\"مِّنۢ\",\"بَنِيٓ\",\"إِسۡرَـٰٓءِيلَ\",\"وَكَفَرَت\",\"طَّآئِفَةٞۖ\",\"فَأَيَّدۡنَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"عَلَىٰ\",\"عَدُوِّهِمۡ\",\"فَأَصۡبَحُواْ\",\"ظَٰهِرِينَ\"],\"t\":\"O you who have believed, be supporters of Allah, as when Jesus, the son of Mary, said to the disciples, \\\"Who are my supporters for Allah?\\\" The disciples said, \\\"We are supporters of Allah.\\\" And a faction of the Children of Israel believed and a faction disbelieved. So We supported those who believed against their enemy, and they became dominant\
