"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"The example of those who were entrusted with the Torah and then did not take it on is like that of a donkey who carries volumes [of books]. Wretched is the example of the people who deny the signs of Allah. And Allah does not guide the wrongdoing people\"},{\"a\":6,\"w\":[\"قُلۡ\",\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"هَادُوٓاْ\",\"إِن\",\"زَعَمۡتُمۡ\",\"أَنَّكُمۡ\",\"أَوۡلِيَآءُ\",\"لِلَّهِ\",\"مِن\",\"دُونِ\",\"ٱلنَّاسِ\",\"فَتَمَنَّوُاْ\",\"ٱلۡمَوۡتَ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"Say, \\\"O you who are Jews, if you claim that you are allies of Allah, excluding the [other] people, then wish for death, if you should be truthful\"},{\"a\":7,\"w\":[\"وَلَا\",\"يَتَمَنَّوۡنَهُۥٓ\",\"أَبَدَۢا\",\"بِمَا\",\"قَدَّمَتۡ\",\"أَيۡدِيهِمۡۚ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِٱلظَّـٰلِمِينَ\"],\"t\":\"But they will not wish for it, ever, because of what their hands have put forth. And Allah is Knowing of the wrongdoers\"},{\"a\":8,\"w\":[\"قُلۡ\",\"إِنَّ\",\"ٱلۡمَوۡتَ\",\"ٱلَّذِي\",\"تَفِرُّونَ\",\"مِنۡهُ\",\"فَإِنَّهُۥ\",\"مُلَٰقِيكُمۡۖ\",\"ثُمَّ\",\"تُرَدُّونَ\",\"إِلَىٰ\",\"عَٰلِمِ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِ\",\"فَيُنَبِّئُكُم\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"Say, \\\"Indeed, the death from which you flee - indeed, it will meet you. Then you will be returned to the Knower of the unseen and the witnessed, and He will inform you about what you used to do\"},{\"a\":9,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِذَا\",\"نُودِيَ\",\"لِلصَّلَوٰةِ\",\"مِن\",\"يَوۡمِ\",\"ٱلۡجُمُعَةِ\",\"فَٱسۡعَوۡاْ\",\"إِلَىٰ\",\"ذِكۡرِ\",\"ٱللَّهِ\",\"وَذَرُواْ\",\"ٱلۡبَيۡعَۚ\",\"ذَٰلِكُمۡ\",\"خَيۡرٞ\",\"لَّكُمۡ\",\"إِن\",\"كُنتُمۡ\",\"تَعۡلَمُونَ\"],\"t\":\"O you who have believed, when [the adhan] is called for the prayer on the day of Jumu'ah [Friday], then proceed to the remembrance of Allah and leave trade. That is better for you, if you only knew\"},{\"a\":10,\"w\":[\"فَإِذَا\",\"قُضِيَتِ\",\"ٱ
