 Allah. And Allah guideth not wrongdoing folk\"},{\"a\":6,\"w\":[\"قُلۡ\",\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"هَادُوٓاْ\",\"إِن\",\"زَعَمۡتُمۡ\",\"أَنَّكُمۡ\",\"أَوۡلِيَآءُ\",\"لِلَّهِ\",\"مِن\",\"دُونِ\",\"ٱلنَّاسِ\",\"فَتَمَنَّوُاْ\",\"ٱلۡمَوۡتَ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"Say, \\\"O you who are Jews, if you claim that you are allies of Allah, excluding the [other] people, then wish for death, if you should be truthful\",\"pickthall\":\"Say (O Muhammad): O ye who are Jews! If ye claim that ye are favoured of Allah apart from (all) mankind, then long for death if ye are truthful\"},{\"a\":7,\"w\":[\"وَلَا\",\"يَتَمَنَّوۡنَهُۥٓ\",\"أَبَدَۢا\",\"بِمَا\",\"قَدَّمَتۡ\",\"أَيۡدِيهِمۡۚ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِٱلظَّـٰلِمِينَ\"],\"t\":\"But they will not wish for it, ever, because of what their hands have put forth. And Allah is Knowing of the wrongdoers\",\"pickthall\":\"But they will never long for it because of all that their own hands have sent before, and Allah is Aware of evil-doers\"},{\"a\":8,\"w\":[\"قُلۡ\",\"إِنَّ\",\"ٱلۡمَوۡتَ\",\"ٱلَّذِي\",\"تَفِرُّونَ\",\"مِنۡهُ\",\"فَإِنَّهُۥ\",\"مُلَٰقِيكُمۡۖ\",\"ثُمَّ\",\"تُرَدُّونَ\",\"إِلَىٰ\",\"عَٰلِمِ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِ\",\"فَيُنَبِّئُكُم\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"Say, \\\"Indeed, the death from which you flee - indeed, it will meet you. Then you will be returned to the Knower of the unseen and the witnessed, and He will inform you about what you used to do\",\"pickthall\":\"Say (unto them, O Muhammad): Lo! the death from which ye shrink will surely meet you, and afterward ye will be returned unto the Knower of the Invisible and the Visible, and He will tell you what ye used to do\"},{\"a\":9,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِذَا\",\"نُودِيَ\",\"لِلصَّلَوٰةِ\",\"مِن\",\"يَوۡمِ\",\"ٱلۡجُمُعَةِ\",\"فَٱسۡعَوۡاْ\",\"إِلَىٰ\",\"ذِكۡرِ\",\"ٱللَّهِ\",\"وَذَرُواْ\",\"ٱلۡبَيۡعَۚ\",\"ذَٰلِكُمۡ\",\"خَيۡرٞ\",\"لَّكُمۡ\",\"إِن\",\"كُنتُمۡ\",\"تَع
