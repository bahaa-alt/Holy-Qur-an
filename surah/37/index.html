ks\"]}]]}],[\"$\",\"div\",null,{\"className\":\"mt-8\",\"children\":[\"$\",\"$17\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"text-center text-sm text-muted\",\"children\":\"Loading verses…\"}],\"children\":[\"$\",\"$L1d\",null,{\"surahMeta\":{\"n\":37,\"nameAr\":\"الصافات\",\"nameEn\":\"Those who set the Ranks\",\"translit\":\"As-Saffat\",\"type\":\"meccan\",\"ayahs\":182},\"verses\":[{\"a\":1,\"w\":[\"وَٱلصَّـٰٓفَّـٰتِ\",\"صَفّٗا\"],\"t\":\"By those [angels] lined up in rows\"},{\"a\":2,\"w\":[\"فَٱلزَّـٰجِرَٰتِ\",\"زَجۡرٗا\"],\"t\":\"And those who drive [the clouds]\"},{\"a\":3,\"w\":[\"فَٱلتَّـٰلِيَٰتِ\",\"ذِكۡرًا\"],\"t\":\"And those who recite the message\"},{\"a\":4,\"w\":[\"إِنَّ\",\"إِلَٰهَكُمۡ\",\"لَوَٰحِدٞ\"],\"t\":\"Indeed, your God is One\"},{\"a\":5,\"w\":[\"رَّبُّ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"وَمَا\",\"بَيۡنَهُمَا\",\"وَرَبُّ\",\"ٱلۡمَشَٰرِقِ\"],\"t\":\"Lord of the heavens and the earth and that between them and Lord of the sunrises\"},{\"a\":6,\"w\":[\"إِنَّا\",\"زَيَّنَّا\",\"ٱلسَّمَآءَ\",\"ٱلدُّنۡيَا\",\"بِزِينَةٍ\",\"ٱلۡكَوَاكِبِ\"],\"t\":\"Indeed, We have adorned the nearest heaven with an adornment of stars\"},{\"a\":7,\"w\":[\"وَحِفۡظٗا\",\"مِّن\",\"كُلِّ\",\"شَيۡطَٰنٖ\",\"مَّارِدٖ\"],\"t\":\"And as protection against every rebellious devil\"},{\"a\":8,\"w\":[\"لَّا\",\"يَسَّمَّعُونَ\",\"إِلَى\",\"ٱلۡمَلَإِ\",\"ٱلۡأَعۡلَىٰ\",\"وَيُقۡذَفُونَ\",\"مِن\",\"كُلِّ\",\"جَانِبٖ\"],\"t\":\"[So] they may not listen to the exalted assembly [of angels] and are pelted from every side\"},{\"a\":9,\"w\":[\"دُحُورٗاۖ\",\"وَلَهُمۡ\",\"عَذَابٞ\",\"وَاصِبٌ\"],\"t\":\"Repelled; and for them is a constant punishment\"},{\"a\":10,\"w\":[\"إِلَّا\",\"مَنۡ\",\"خَطِفَ\",\"ٱلۡخَطۡفَةَ\",\"فَأَتۡبَعَهُۥ\",\"شِهَابٞ\",\"ثَاقِبٞ\"],\"t\":\"Except one who snatches [some words] by theft, but they are pursued by a burning flame, piercing [in brightness]\"},{\"a\":11,\"w\":[\"فَٱسۡتَفۡتِهِمۡ\",\"أَهُمۡ\",\"أَشَدُّ\",\"خَلۡقًا\",\"أَم\",\"مَّنۡ\",\"خَلَقۡنَآۚ\",\"إِنَّا\",\"خَلَقۡنَٰهُم\",\"مِّن\",\"طِينٖ\",\"لَّازِبِۭ\"],\"t\":\"Then inquire of them, [O Muhammad], \\\"Are they a stronger [or more difficult] creation or those [others] We have created?\\\" Indeed, We created men from sticky clay\"},{\"a\":12,\"w\":[\"بَلۡ\",\"عَجِبۡتَ\",\"وَيَسۡخَرُونَ\"],\"t\":\"But you wonder, while they mock\"},{\"a\":13,\"w\":[\"وَإِذَا\",\"ذُكِّرُواْ\",\"لَا\",\"يَذۡكُرُونَ\"],\"t\":\"And when they are reminded, they remember not\"},{\"a\":14,\"w\":[\"وَإِذَا\",\"رَأَوۡاْ\",\"ءَايَةٗ\",\"يَسۡتَسۡخِرُونَ\"],\"t\":\"And when they see a sign, they ridicule\"},{\"a\":15,\"w\":[\"وَقَالُوٓاْ\",\"إِنۡ\",\"هَٰذَآ\",\"إِلَّا\",\"سِحۡرٞ\",\"مُّبِينٌ\"],\"t\":\"And say, \\\"This is not but obvious magic\"},{\"a\":16,\"w\":[\"أَءِذَا\",\"مِتۡنَا\",\"وَكُنَّا\",\"تُرَابٗا\",\"وَعِظَٰمًا\",\"أَءِنَّا\",\"لَمَبۡعُوثُونَ\"],\"t\":\"When we have died and become dust and bones, are we indeed to be resurrected\"},{\"a\":17,\"w\":[\"أَوَءَابَآؤُنَا\",\"ٱلۡأَوَّلُونَ\"],\"t\":\"And our forefathers [as well]\"},{\"a\":18,\"w\":[\"قُلۡ\",\"نَعَمۡ\",\"وَأَنتُمۡ\",\"دَٰخِرُونَ\"],\"t\":\"Say, \\\"Yes, and you will be [rendered] contemptible\"},{\"a\":19,\"w\":[\"فَإِنَّمَا\",\"هِيَ\",\"زَجۡرَةٞ\",\"وَٰحِدَةٞ\",\"فَإِذَا\",\"هُمۡ\",\"يَنظُرُونَ\"],\"t\":\"It will be only one shout, and at once they will be observing\"},{\"a\":20,\"w\":[\"وَقَالُواْ\",\"يَٰوَيۡلَنَا\",\"هَٰذَا\",\"يَوۡمُ\",\"ٱلدِّينِ\"],\"t\":\"They will say, \\\"O woe to us! This is the Day of Recompense\"},{\"a\":21,\"w\":[\"هَٰذَا\",\"يَوۡمُ\",\"ٱلۡفَصۡلِ\",\"ٱلَّذِي\",\"كُنتُم\",\"بِهِۦ\",\"تُكَذِّبُونَ\"],\"t\":\"[They will be told], \\\"This is the Day of Judgement which you used to deny\"},{\"a\":22,\"w\":[\"۞ٱحۡشُرُواْ\",\"ٱلَّذِينَ\",\"ظَلَمُواْ\",\"وَأَزۡوَٰجَهُمۡ\",\"وَمَا\",\"كَانُواْ\",\"يَعۡبُدُونَ\"],\"t\":\"[The angels will be ordered], \\\"Gather those who committed wrong, their kinds, and what they used to worship\"},{\"a\":23,\"w\":[\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"فَٱهۡدُوهُمۡ\",\"إِلَىٰ\",\"صِرَٰطِ\",\"ٱلۡجَحِيمِ\"],\"t\":\"Other than Allah, and guide them to the path of Hellfire\"},{\"a\":24,\"w\":[\"وَقِفُوهُمۡۖ\",\"إِنَّهُم\",\"مَّسۡـُٔولُونَ\"],\"t\":\"And stop them; indeed, they are to be questioned\"},{\"a\":25,\"w\":[\"مَا\",\"لَكُمۡ\",\"لَا\",\"تَنَاصَرُونَ\"],\"t\":\"[They will be asked], \\\"What is [wrong] with you? Why do you not help each other\"},{\"a\":26,\"w\":[\"بَلۡ\",\"هُمُ\",\"ٱلۡيَوۡمَ\",\"مُسۡتَسۡلِمُونَ\"],\"t\":\"But they, that Day, are in surrender\"},{\"a\":27,\"w\":[\"وَأَقۡبَلَ\",\"بَعۡضُهُمۡ\",\"عَلَىٰ\",\"بَعۡضٖ\",\"يَتَسَآءَلُونَ\"],\"t\":\"And they will approach one another blaming each other\"},{\"a\":28,\"w\":[\"قَالُوٓاْ\",\"إِنَّكُمۡ\",\"كُنتُمۡ\",\"تَأۡتُونَنَا\",\"عَنِ\",\"ٱلۡيَمِينِ\"],\"t\":\"They will say, \\\"Indeed, you used to come at us from the right\"},{\"a\":29,\"w\":[\"قَالُواْ\",\"بَل\",\"لَّمۡ\",\"تَكُونُواْ\",\"مُؤۡمِنِينَ\"],\"t\":\"The oppressors will say, \\\"Rather, you [yourselves] were not believers\"},{\"a\":30,\"w\":[\"وَمَا\",\"كَانَ\",\"لَنَا\",\"عَلَيۡكُم\",\"مِّن\",\"سُلۡطَٰنِۭۖ\",\"بَلۡ\",\"كُنتُمۡ\",\"قَوۡمٗا\",\"طَٰغِينَ\"],\"t\":\"And we had over you no authority, but you were a transgressing people\"},{\"a\":31,\"w\":[\"فَحَقَّ\",\"عَلَيۡنَا\",\"قَوۡلُ\",\"رَبِّنَآۖ\",\"إِنَّا\",\"لَذَآئِقُونَ\"],\"t\":\"So the word of our Lord has come into effect upon us; indeed, we will taste [punishment]\"},{\"a\":32,\"w\":[\"فَأَغۡوَيۡنَٰكُمۡ\",\"إِنَّا\",\"كُنَّا\",\"غَٰوِينَ\"],\"t\":\"And we led you to deviation; indeed, we were deviators\"},{\"a\":33,\"w\":[\"فَإِنَّهُمۡ\",\"يَوۡمَئِذٖ\",\"فِي\",\"ٱلۡعَذَابِ\",\"مُشۡتَرِكُونَ\"],\"t\":\"So indeed they, that Day, will be sharing in the punishment\"},{\"a\":34,\"w\":[\"إِنَّا\",\"كَذَٰلِكَ\",\"نَفۡعَلُ\",\"بِٱلۡمُجۡرِمِينَ\"],\"t\":\"Indeed, that is how We deal with the criminals\"},{\"a\":35,\"w\":[\"إِنَّهُمۡ\",\"كَانُوٓاْ\",\"إِذَا\",\"قِيلَ\",\"لَهُمۡ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"ٱللَّهُ\",\"يَسۡتَكۡبِرُونَ\"],\"t\":\"Indeed they, when it was said to them, \\\"There is no deity but Allah,\\\" were arrogant\"},{\"a\":36,\"w\":[\"وَيَقُولُونَ\",\"أَئِنَّا\",\"لَتَارِكُوٓاْ\",\"ءَالِهَتِنَا\",\"لِشَاعِرٖ\",\"مَّجۡنُونِۭ\"],\"t\":\"And were saying, \\\"Are we to leave our gods for a mad poet\"},{\"a\":37,\"w\":[\"بَلۡ\",\"جَآءَ\",\"بِٱلۡحَقِّ\",\"وَصَدَّقَ\",\"ٱلۡمُرۡسَلِينَ\"],\"t\":\"Rather, the Prophet has come with the truth and confirmed the [previous] messengers\"},{\"a\":38,\"w\":[\"إِنَّكُمۡ\",\"لَذَآئِقُواْ\",\"ٱلۡعَذَابِ\",\"ٱلۡأَلِيمِ\"],\"t\":\"Indeed, you [disbelievers] will be tasters of the painful punishment\"},{\"a\":39,\"w\":[\"وَمَا\",\"تُجۡزَوۡنَ\",\"إِلَّا\",\"مَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"And you will not be recompensed except for what you used to do\"},{\"a\":40,\"w\":[\"إِلَّا\",\"عِبَادَ\",\"ٱللَّهِ\",\"ٱلۡمُخۡلَصِينَ\"],\"t\":\"But not the chosen servants of Allah\"},{\"a\":41,\"w\":[\"أُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"رِزۡقٞ\",\"مَّعۡلُومٞ\"],\"t\":\"Those will have a provision determined\"},{\"a\":42,\"w\":[\"فَوَٰكِهُ\",\"وَهُم\",\"مُّكۡرَمُونَ\"],\"t\":\"Fruits; and they will be honored\"},{\"a\":43,\"w\":[\"فِي\",\"جَنَّـٰتِ\",\"ٱلنَّعِيمِ\"],\"t\":\"In gardens of pleasure\"},{\"a\":44,\"w\":[\"عَلَىٰ\",\"سُرُرٖ\",\"مُّتَقَٰبِلِينَ\"],\"t\":\"On thrones facing one another\"},{\"a\":45,\"w\":[\"يُطَافُ\",\"عَلَيۡهِم\",\"بِكَأۡسٖ\",\"مِّن\",\"مَّعِينِۭ\"],\"t\":\"There will be circulated among them a cup [of wine] from a flowing spring\"},{\"a\":46,\"w\":[\"بَيۡضَآءَ\",\"لَذَّةٖ\",\"لِّلشَّـٰرِبِينَ\"],\"t\":\"White and delicious to the drinkers\"},{\"a\":47,\"w\":[\"لَا\",\"فِيهَا\",\"غَوۡلٞ\",\"وَلَا\",\"هُمۡ\",\"عَنۡهَا\",\"يُنزَفُونَ\"],\"t\":\"No bad effect is there in it, nor from it will they be intoxicated\"},{\"a\":48,\"w\":[\"وَعِندَهُمۡ\",\"قَٰصِرَٰتُ\",\"ٱلطَّرۡفِ\",\"عِينٞ\"],\"t\":\"And with them will be women limiting [their] glances, with large, [beautiful] eyes\"},{\"a\":49,\"w\":[\"كَأَنَّهُنَّ\",\"بَيۡضٞ\",\"مَّكۡنُونٞ\"],\"t\":\"As if they were [delicate] eggs, well-protected\"},{\"a\":50,\"w\":[\"فَأَقۡبَلَ\",\"بَعۡضُهُمۡ\",\"عَلَىٰ\",\"بَعۡضٖ\",\"يَتَسَآءَلُونَ\"],\"t\":\"And they will approach one another, inquiring of each other\"},{\"a\":51,\"w\":[\"قَالَ\",\"قَآئِلٞ\",\"مِّنۡهُمۡ\",\"إِنِّي\",\"كَانَ\",\"لِي\",\"قَرِينٞ\"],\"t\":\"A speaker among them will say, \\\"Indeed, I had a companion [on earth]\"},{\"a\":52,\"w\":[\"يَقُولُ\",\"أَءِنَّكَ\",\"لَمِنَ\",\"ٱلۡمُصَدِّقِينَ\"],\"t\":\"Who would say, 'Are you indeed of those who believe\"},{\"a\":53,\"w\":[\"أَءِذَا\",\"مِتۡنَا\",\"وَكُنَّا\",\"تُرَابٗا\",\"وَعِظَٰمًا\",\"أَءِنَّا\",\"لَمَدِينُونَ\"],\"t\":\"That when we have died and become dust and bones, we will indeed be recompensed\"},{\"a\":54,\"w\":[\"قَالَ\",\"هَلۡ\",\"أَنتُم\",\"مُّطَّلِعُونَ\"],\"t\":\"He will say, \\\"Would you [care to] look\"},{\"a\":55,\"w\":[\"فَٱطَّلَعَ\",\"فَرَءَاهُ\",\"فِي\",\"سَوَآءِ\",\"ٱلۡجَحِيمِ\"],\"t\":\"And he will look and see him in the midst of the Hellfire\"},{\"a\":56,\"w\":[\"قَالَ\",\"تَٱللَّهِ\",\"إِن\",\"كِدتَّ\",\"لَتُرۡدِينِ\"],\"t\":\"He will say, \\\"By Allah, you almost ruined me\"},{\"a\":57,\"w\":[\"وَلَوۡلَا\",\"نِعۡمَةُ\",\"رَبِّي\",\"لَكُنتُ\",\"مِنَ\",\"ٱلۡمُحۡضَرِينَ\"],\"t\":\"If not for the favor of my Lord, I would have been of those brought in [to Hell]\"},{\"a\":58,\"w\":[\"أَفَمَا\",\"نَحۡنُ\",\"بِمَيِّتِينَ\"],\"t\":\"Then, are we not to die\"},{\"a\":59,\"w\":[\"إِلَّا\",\"مَوۡتَتَنَا\",\"ٱلۡأُولَىٰ\",\"وَمَا\",\"نَحۡنُ\",\"بِمُعَذَّبِينَ\"],\"t\":\"Except for our first death, and we will not be punished\"},{\"a\":60,\"w\":[\"إِنَّ\",\"هَٰذَا\",\"لَهُوَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"Indeed, this is the great attainment\"},{\"a\":61,\"w\":[\"لِمِثۡلِ\",\"هَٰذَا\",\"فَلۡيَعۡمَلِ\",\"ٱلۡعَٰمِلُونَ\"],\"t\":\"For the like of this let the workers [on earth] work\"},{\"a\":62,\"w\":[\"أَذَٰلِكَ\",\"خَيۡرٞ\",\"نُّزُلًا\",\"أَمۡ\",\"شَجَرَةُ\",\"ٱلزَّقُّومِ\"],\"t\":\"Is Paradise a better accommodation or the tree of zaqqum\"},{\"a\":63,\"w\":[\"إِنَّا\",\"جَعَلۡنَٰهَا\",\"فِتۡنَةٗ\",\"لِّلظَّـٰلِمِينَ\"],\"t\":\"Indeed, We have made it a torment for the wrongdoers\"},{\"a\":64,\"w\":[\"إِنَّهَا\",\"شَجَرَةٞ\",\"تَخۡرُجُ\",\"فِيٓ\",\"أَصۡلِ\",\"ٱلۡجَحِيمِ\"],\"t\":\"Indeed, it is a tree issuing from the bottom of the Hellfire\"},{\"a\":65,\"w\":[\"طَلۡعُهَا\",\"كَأَنَّهُۥ\",\"رُءُوسُ\",\"ٱلشَّيَٰطِينِ\"],\"t\":\"Its emerging fruit as if it was heads of the devils\"},{\"a\":66,\"w\":[\"فَإِنَّهُمۡ\",\"لَأٓكِلُونَ\",\"مِنۡهَا\",\"فَمَالِـُٔونَ\",\"مِنۡهَا\",\"ٱلۡبُطُونَ\"],\"t\":\"And indeed, they will eat from it and fill with it their bellies\"},{\"a\":67,\"w\":[\"ثُمَّ\",\"إِنَّ\",\"لَهُمۡ\",\"عَلَيۡهَا\",\"لَشَوۡبٗا\",\"مِّنۡ\",\"حَمِيمٖ\"],\"t\":\"Then indeed, they will have after it a mixture of scalding water\"},{\"a\":68,\"w\":[\"ثُمَّ\",\"إِنَّ\",\"مَرۡجِعَهُمۡ\",\"لَإِلَى\",\"ٱلۡجَحِيمِ\"],\"t\":\"Then indeed, their return will be to the Hellfire\"},{\"a\":69,\"w\":[\"إِنَّهُمۡ\",\"أَلۡفَوۡاْ\",\"ءَابَآءَهُمۡ\",\"ضَآلِّينَ\"],\"t\":\"Indeed they found their fathers astray\"},{\"a\":70,\"w\":[\"فَهُمۡ\",\"عَلَىٰٓ\",\"ءَاثَٰرِهِمۡ\",\"يُهۡرَعُونَ\"],\"t\":\"So they hastened [to follow] in their footsteps\"},{\"a\":71,\"w\":[\"وَلَقَدۡ\",\"ضَلَّ\",\"قَبۡلَهُمۡ\",\"أَكۡثَرُ\",\"ٱلۡأَوَّلِينَ\"],\"t\":\"And there had already strayed before them most of the former peoples\"},{\"a\":72,\"w\":[\"وَلَقَدۡ\",\"أَرۡسَلۡنَا\",\"فِيهِم\",\"مُّنذِرِينَ\"],\"t\":\"And We had already sent among them warners\"},{\"a\":73,\"w\":[\"فَٱنظُرۡ\",\"كَيۡفَ\",\"كَانَ\",\"عَٰقِبَةُ\",\"ٱلۡمُنذَرِينَ\"],\"t\":\"Then look how was the end of those who were warned\"},{\"a\":74,\"w\":[\"إِلَّا\",\"عِبَادَ\",\"ٱللَّهِ\",\"ٱلۡمُخۡلَصِينَ\"],\"t\":\"But not the chosen servants of Allah\"},{\"a\":75,\"w\":[\"وَلَقَدۡ\",\"نَادَىٰنَا\",\"نُوحٞ\",\"فَلَنِعۡمَ\",\"ٱلۡمُجِيبُونَ\"],\"t\":\"And Noah had certainly called Us, and [We are] the best of responders\"},{\"a\":76,\"w\":[\"وَنَجَّيۡنَٰهُ\",\"وَأَهۡلَهُۥ\",\"مِنَ\",\"ٱلۡكَرۡبِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"And We saved him and his family from the great affliction\"},{\"a\":77,\"w\":[\"وَجَعَلۡنَا\",\"ذُرِّيَّتَهُۥ\",\"هُمُ\",\"ٱلۡبَاقِينَ\"],\"t\":\"And We made his descendants those remaining [on the earth]\"},{\"a\":78,\"w\":[\"وَتَرَكۡنَا\",\"عَلَيۡهِ\",\"فِي\",\"ٱلۡأٓخِرِينَ\"],\"t\":\"And left for him [favorable mention] among later generations\"},{\"a\":79,\"w\":[\"سَلَٰمٌ\",\"عَلَىٰ\",\"نُوحٖ\",\"فِي\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"Peace upon Noah among the worlds\"},{\"a\":80,\"w\":[\"إِنَّا\",\"كَذَٰلِكَ\",\"نَجۡزِي\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"Indeed, We thus reward the doers of good\"},{\"a\":81,\"w\":[\"إِنَّهُۥ\",\"مِنۡ\",\"عِبَادِنَا\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"Indeed, he was of Our believing servants\"},{\"a\":82,\"w\":[\"ثُمَّ\",\"أَغۡرَقۡنَا\",\"ٱلۡأٓخَرِينَ\"],\"t\":\"Then We drowned the disbelievers\"},{\"a\":83,\"w\":[\"۞وَإِنَّ\",\"مِن\",\"شِيعَتِهِۦ\",\"لَإِبۡرَٰهِيمَ\"],\"t\":\"And indeed, among his kind was Abraham\"},{\"a\":84,\"w\":[\"إِذۡ\",\"جَآءَ\",\"رَبَّهُۥ\",\"بِقَلۡبٖ\",\"سَلِيمٍ\"],\"t\":\"When he came to his Lord with a sound heart\"},{\"a\":85,\"w\":[\"إِذۡ\",\"قَالَ\",\"لِأَبِيهِ\",\"وَقَوۡمِهِۦ\",\"مَاذَا\",\"تَعۡبُدُونَ\"],\"t\":\"[And] when he said to his father and his people, \\\"What do you worship\"},{\"a\":86,\"w\":[\"أَئِفۡكًا\",\"ءَالِهَةٗ\",\"دُونَ\",\"ٱللَّهِ\",\"تُرِيدُونَ\"],\"t\":\"Is it falsehood [as] gods other than Allah you desire\"},{\"a\":87,\"w\":[\"فَمَا\",\"ظَنُّكُم\",\"بِرَبِّ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"Then what is your thought about the Lord of the worlds\"},{\"a\":88,\"w\":[\"فَنَظَرَ\",\"نَظۡرَةٗ\",\"فِي\",\"ٱلنُّجُومِ\"],\"t\":\"And he cast a look at the stars\"},{\"a\":89,\"w\":[\"فَقَالَ\",\"إِنِّي\",\"سَقِيمٞ\"],\"t\":\"And said, \\\"Indeed, I am [about to be] ill\"},{\"a\":90,\"w\":[\"فَتَوَلَّوۡاْ\",\"عَنۡهُ\",\"مُدۡبِرِينَ\"],\"t\":\"So they turned away from him, departing\"},{\"a\":91,\"w\":[\"فَرَاغَ\",\"إِلَىٰٓ\",\"ءَالِهَتِهِمۡ\",\"فَقَالَ\",\"أَلَا\",\"تَأۡكُلُونَ\"],\"t\":\"Then he turned to their gods and said, \\\"Do you not eat\"},{\"a\":92,\"w\":[\"مَا\",\"لَكُمۡ\",\"لَا\",\"تَنطِقُونَ\"],\"t\":\"What is [wrong] with you that you do not speak\"},{\"a\":93,\"w\":[\"فَرَاغَ\",\"عَلَيۡهِمۡ\",\"ضَرۡبَۢا\",\"بِٱلۡيَمِينِ\"],\"t\":\"And he turned upon them a blow with [his] right hand\"},{\"a\":94,\"w\":[\"فَأَقۡبَلُوٓاْ\",\"إِلَيۡهِ\",\"يَزِفُّونَ\"],\"t\":\"Then the people came toward him, hastening\"},{\"a\":95,\"w\":[\"قَالَ\",\"أَتَعۡبُدُونَ\",\"مَا\",\"تَنۡحِتُونَ\"],\"t\":\"He said, \\\"Do you worship that which you [yourselves] carve\"},{\"a\":96,\"w\":[\"وَٱللَّهُ\",\"خَلَقَكُمۡ\",\"وَمَا\",\"تَعۡمَلُونَ\"],\"t\":\"While Allah created you and that which you do\"},{\"a\":97,\"w\":[\"قَالُواْ\",\"ٱبۡنُواْ\",\"لَهُۥ\",\"بُنۡيَٰنٗا\",\"فَأَلۡقُوهُ\",\"فِي\",\"ٱلۡجَحِيمِ\"],\"t\":\"They said, \\\"Construct for him a furnace and throw him into the burning fire\"},{\"a\":98,\"w\":[\"فَأَرَادُواْ\",\"بِهِۦ\",\"كَيۡدٗا\",\"فَجَعَلۡنَٰهُمُ\",\"ٱلۡأَسۡفَلِينَ\"],\"t\":\"And they intended for him a plan, but We made them the most debased\"},{\"a\":99,\"w\":[\"وَقَالَ\",\"إِنِّي\",\"ذَاهِبٌ\",\"إِلَىٰ\",\"رَبِّي\",\"سَيَهۡدِينِ\"],\"t\":\"And [then] he said, \\\"Indeed, I will go to [where I am ordered by] my Lord; He will guide me\"},{\"a\":100,\"w\":[\"رَبِّ\",\"هَبۡ\",\"لِي\",\"مِنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"My Lord, grant me [a child] from among the righteous\"},{\"a\":101,\"w\":[\"فَبَشَّرۡنَٰهُ\",\"بِغُلَٰمٍ\",\"حَلِيمٖ\"],\"t\":\"So We gave him good tidings of a forbearing boy\"},{\"a\":102,\"w\":[\"فَلَمَّا\",\"بَلَغَ\",\"مَعَهُ\",\"ٱلسَّعۡيَ\",\"قَالَ\",\"يَٰبُنَيَّ\",\"إِنِّيٓ\",\"أَرَىٰ\",\"فِي\",\"ٱلۡمَنَامِ\",\"أَنِّيٓ\",\"أَذۡبَحُكَ\",\"فَٱنظُرۡ\",\"مَاذَا\",\"تَرَىٰۚ\",\"قَالَ\",\"يَـٰٓأَبَتِ\",\"ٱفۡعَلۡ\",\"مَا\",\"تُؤۡمَرُۖ\",\"سَتَجِدُنِيٓ\",\"إِن\",\"شَآءَ\",\"ٱللَّهُ\",\"مِنَ\",\"ٱلصَّـٰبِرِينَ\"],\"t\":\"And when he reached with him [the age of] exertion, he said, \\\"O my son, indeed I have seen in a dream that I [must] sacrifice you, so see what you think.\\\" He said, \\\"O my father, do as you are commanded. You will find me, if Allah wills, of the steadfast\"},{\"a\":103,\"w\":[\"فَلَمَّآ\",\"أَسۡلَمَا\",\"وَتَلَّهُۥ\",\"لِلۡجَبِينِ\"],\"t\":\"And when they had both submitted and he put him down upon his forehead\"},{\"a\":104,\"w\":[\"وَنَٰدَيۡنَٰهُ\",\"أَن\",\"يَـٰٓإِبۡرَٰهِيمُ\"],\"t\":\"We called to him, \\\"O Abraham\"},{\"a\":105,\"w\":[\"قَدۡ\",\"صَدَّقۡتَ\",\"ٱلرُّءۡيَآۚ\",\"إِنَّا\",\"كَذَٰلِكَ\",\"نَجۡزِي\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"You have fulfilled the vision.\\\" Indeed, We thus reward the doers of good\"},{\"a\":106,\"w\":[\"إِنَّ\",\"هَٰذَا\",\"لَهُوَ\",\"ٱلۡبَلَـٰٓؤُاْ\",\"ٱلۡمُبِينُ\"],\"t\":\"Indeed, this was the clear trial\"},{\"a\":107,\"w\":[\"وَفَدَيۡنَٰهُ\",\"بِذِبۡحٍ\",\"عَظِيمٖ\"],\"t\":\"And We ransomed him with a great sacrifice\"},{\"a\":108,\"w\":[\"وَتَرَكۡنَا\",\"عَلَيۡهِ\",\"فِي\",\"ٱلۡأٓخِرِينَ\"],\"t\":\"And We left for him [favorable mention] among later generations\"},{\"a\":109,\"w\":[\"سَلَٰمٌ\",\"عَلَىٰٓ\",\"إِبۡرَٰهِيمَ\"],\"t\":\"Peace upon Abraham\"},{\"a\":110,\"w\":[\"كَذَٰلِكَ\",\"نَجۡزِي\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"Indeed, We thus reward the doers of good\"},{\"a\":111,\"w\":[\"إِنَّهُۥ\",\"مِنۡ\",\"عِبَادِنَا\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"Indeed, he was of Our believing servants\"},{\"a\":112,\"w\":[\"وَبَشَّرۡنَٰهُ\",\"بِإِسۡحَٰقَ\",\"نَبِيّٗا\",\"مِّنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"And We gave him good tidings of Isaac, a prophet from among the righteous\"},{\"a\":113,\"w\":[\"وَبَٰرَكۡنَا\",\"عَلَيۡهِ\",\"وَعَلَىٰٓ\",\"إِسۡحَٰقَۚ\",\"وَمِن\",\"ذُرِّيَّتِهِمَا\",\"مُحۡسِنٞ\",\"وَظَالِمٞ\",\"لِّنَفۡسِهِۦ\",\"مُبِينٞ\"],\"t\":\"And We blessed him and Isaac. But among their descendants is the doer of good and the clearly unjust to himself\"},{\"a\":114,\"w\":[\"وَلَقَدۡ\",\"مَنَنَّا\",\"عَلَىٰ\",\"مُوسَىٰ\",\"وَهَٰرُونَ\"],\"t\":\"And We did certainly confer favor upon Moses and Aaron\"},{\"a\":115,\"w\":[\"وَنَجَّيۡنَٰهُمَا\",\"وَقَوۡمَهُمَا\",\"مِنَ\",\"ٱلۡكَرۡبِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"And We saved them and their people from the great affliction\"},{\"a\":116,\"w\":[\"وَنَصَرۡنَٰهُمۡ\",\"فَكَانُواْ\",\"هُمُ\",\"ٱلۡغَٰلِبِينَ\"],\"t\":\"And We supported them so it was they who overcame\"},{\"a\":117,\"w\":[\"وَءَاتَيۡنَٰهُمَا\",\"ٱلۡكِتَٰبَ\",\"ٱلۡمُسۡتَبِينَ\"],\"t\":\"And We gave them the explicit Scripture\"},{\"a\":118,\"w\":[\"وَهَدَيۡنَٰهُمَا\",\"ٱلصِّرَٰطَ\",\"ٱلۡمُسۡتَقِيمَ\"],\"t\":\"And We guided them on the straight path\"},{\"a\":119,\"w\":[\"وَتَرَكۡنَا\",\"عَلَيۡهِمَا\",\"فِي\",\"ٱلۡأٓخِرِينَ\"],\"t\":\"And We left for them [favorable mention] among later generations\"},{\"a\":120,\"w\":[\"سَلَٰمٌ\",\"عَلَىٰ\",\"مُوسَىٰ\",\"وَهَٰرُونَ\"],\"t\":\"Peace upon Moses and Aaron\"},{\"a\":121,\"w\":[\"إِنَّا\",\"كَذَٰلِكَ\",\"نَجۡزِي\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"Indeed, We thus reward the doers of good\"},{\"a\":122,\"w\":[\"إِنَّهُمَا\",\"مِنۡ\",\"عِبَادِنَا\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"Indeed, they were of Our believing servants\"},{\"a\":123,\"w\":[\"وَإِنَّ\",\"إِلۡيَاسَ\",\"لَمِنَ\",\"ٱلۡمُرۡسَلِينَ\"],\"t\":\"And indeed, Elias was from among the messengers\"},{\"a\":124,\"w\":[\"إِذۡ\",\"قَالَ\",\"لِقَوۡمِهِۦٓ\",\"أَلَا\",\"تَتَّقُونَ\"],\"t\":\"When he said to his people, \\\"Will you not fear Allah\"},{\"a\":125,\"w\":[\"أَتَدۡعُونَ\",\"بَعۡلٗا\",\"وَتَذَرُونَ\",\"أَحۡسَنَ\",\"ٱلۡخَٰلِقِينَ\"],\"t\":\"Do you call upon Ba'l and leave the best of creators\"},{\"a\":126,\"w\":[\"ٱللَّهَ\",\"رَبَّكُمۡ\",\"وَرَبَّ\",\"ءَابَآئِكُمُ\",\"ٱلۡأَوَّلِينَ\"],\"t\":\"Allah, your Lord and the Lord of your first forefathers\"},{\"a\":127,\"w\":[\"فَكَذَّبُوهُ\",\"فَإِنَّهُمۡ\",\"لَمُحۡضَرُونَ\"],\"t\":\"And they denied him, so indeed, they will be brought [for punishment]\"},{\"a\":128,\"w\":[\"إِلَّا\",\"عِبَادَ\",\"ٱللَّهِ\",\"ٱلۡمُخۡلَصِينَ\"],\"t\":\"Except the chosen servants of Allah\"},{\"a\":129,\"w\":[\"وَتَرَكۡنَا\",\"عَلَيۡهِ\",\"فِي\",\"ٱلۡأٓخِرِينَ\"],\"t\":\"And We left for him [favorable mention] among later generations\"},{\"a\":130,\"w\":[\"سَلَٰمٌ\",\"عَلَىٰٓ\",\"إِلْ يَاسِينَ\"],\"t\":\"Peace upon Elias\",\"m\":1},{\"a\":131,\"w\":[\"إِنَّا\",\"كَذَٰلِكَ\",\"نَجۡزِي\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"Indeed, We thus reward the doers of good\"},{\"a\":132,\"w\":[\"إِنَّهُۥ\",\"مِنۡ\",\"عِبَادِنَا\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"Indeed, he was of Our believing servants\"},{\"a\":133,\"w\":[\"وَإِنَّ\",\"لُوطٗا\",\"لَّمِنَ\",\"ٱلۡمُرۡسَلِينَ\"],\"t\":\"And indeed, Lot was among the messengers\"},{\"a\":134,\"w\":[\"إِذۡ\",\"نَجَّيۡنَٰهُ\",\"وَأَهۡلَهُۥٓ\",\"أَجۡمَعِينَ\"],\"t\":\"[So mention] when We saved him and his family, all\"},{\"a\":135,\"w\":[\"إِلَّا\",\"عَجُوزٗا\",\"فِي\",\"ٱلۡغَٰبِرِينَ\"],\"t\":\"Except his wife among those who remained [with the evildoers]\"},{\"a\":136,\"w\":[\"ثُمَّ\",\"دَمَّرۡنَا\",\"ٱلۡأٓخَرِينَ\"],\"t\":\"Then We destroyed the others\"},{\"a\":137,\"w\":[\"وَإِنَّكُمۡ\",\"لَتَمُرُّونَ\",\"عَلَيۡهِم\",\"مُّصۡبِحِينَ\"],\"t\":\"And indeed, you pass by them in the morning\"},{\"a\":138,\"w\":[\"وَبِٱلَّيۡلِۚ\",\"أَفَلَا\",\"تَعۡقِلُونَ\"],\"t\":\"And at night. Then will you not use reason\"},{\"a\":139,\"w\":[\"وَإِنَّ\",\"يُونُسَ\",\"لَمِنَ\",\"ٱلۡمُرۡسَلِينَ\"],\"t\":\"And indeed, Jonah was among the messengers\"},{\"a\":140,\"w\":[\"إِذۡ\",\"أَبَقَ\",\"إِلَى\",\"ٱلۡفُلۡكِ\",\"ٱلۡمَشۡحُونِ\"],\"t\":\"[Mention] when he ran away to the laden ship\"},{\"a\":141,\"w\":[\"فَسَاهَمَ\",\"فَكَانَ\",\"مِنَ\",\"ٱلۡمُدۡحَضِينَ\"],\"t\":\"And he drew lots and was among the losers\"},{\"a\":142,\"w\":[\"فَٱلۡتَقَمَهُ\",\"ٱلۡحُوتُ\",\"وَهُوَ\",\"مُلِيمٞ\"],\"t\":\"Then the fish swallowed him, while he was blameworthy\"},{\"a\":143,\"w\":[\"فَلَوۡلَآ\",\"أَنَّهُۥ\",\"كَانَ\",\"مِنَ\",\"ٱلۡمُسَبِّحِينَ\"],\"t\":\"And had he not been of those who exalt Allah\"},{\"a\":144,\"w\":[\"لَلَبِثَ\",\"فِي\",\"بَطۡنِهِۦٓ\",\"إِلَىٰ\",\"يَوۡمِ\",\"يُبۡعَثُونَ\"],\"t\":\"He would have remained inside its belly until the Day they are resurrected\"},{\"a\":145,\"w\":[\"۞فَنَبَذۡنَٰهُ\",\"بِٱلۡعَرَآءِ\",\"وَهُوَ\",\"سَقِيمٞ\"],\"t\":\"But We threw him onto the open shore while he was ill\"},{\"a\":146,\"w\":[\"وَأَنۢبَتۡنَا\",\"عَلَيۡهِ\",\"شَجَرَةٗ\",\"مِّن\",\"يَقۡطِينٖ\"],\"t\":\"And We caused to grow over him a gourd vine\"},{\"a\":147,\"w\":[\"وَأَرۡسَلۡنَٰهُ\",\"إِلَىٰ\",\"مِاْئَةِ\",\"أَلۡفٍ\",\"أَوۡ\",\"يَزِيدُونَ\"],\"t\":\"And We sent him to [his people of] a hundred thousand or more\"},{\"a\":148,\"w\":[\"فَـَٔامَنُواْ\",\"فَمَتَّعۡنَٰهُمۡ\",\"إِلَىٰ\",\"حِينٖ\"],\"t\":\"And they believed, so We gave them enjoyment [of life] for a time\"},{\"a\":149,\"w\":[\"فَٱسۡتَفۡتِهِمۡ\",\"أَلِرَبِّكَ\",\"ٱلۡبَنَاتُ\",\"وَلَهُمُ\",\"ٱلۡبَنُونَ\"],\"t\":\"So inquire of them, [O Muhammad], \\\"Does your Lord have daughters while they have sons\"},{\"a\":150,\"w\":[\"أَمۡ\",\"خَلَقۡنَا\",\"ٱلۡمَلَـٰٓئِكَةَ\",\"إِنَٰثٗا\",\"وَهُمۡ\",\"شَٰهِدُونَ\"],\"t\":\"Or did We create the angels as females while they were witnesses\"},{\"a\":151,\"w\":[\"أَلَآ\",\"إِنَّهُم\",\"مِّنۡ\",\"إِفۡكِهِمۡ\",\"لَيَقُولُونَ\"],\"t\":\"Unquestionably, it is out of their [invented] falsehood that they say\"},{\"a\":152,\"w\":[\"وَلَدَ\",\"ٱللَّهُ\",\"وَإِنَّهُمۡ\",\"لَكَٰذِبُونَ\"],\"t\":\"Allah has begotten,\\\" and indeed, they are liars\"},{\"a\":153,\"w\":[\"أَصۡطَفَى\",\"ٱلۡبَنَاتِ\",\"عَلَى\",\"ٱلۡبَنِينَ\"],\"t\":\"Has He chosen daughters over sons\"},{\"a\":154,\"w\":[\"مَا\",\"لَكُمۡ\",\"كَيۡفَ\",\"تَحۡكُمُونَ\"],\"t\":\"What is [wrong] with you? How do you make judgement\"},{\"a\":155,\"w\":[\"أَفَلَا\",\"تَذَكَّرُونَ\"],\"t\":\"Then will you not be reminded\"},{\"a\":156,\"w\":[\"أَمۡ\",\"لَكُمۡ\",\"سُلۡطَٰنٞ\",\"مُّبِينٞ\"],\"t\":\"Or do you have a clear authority\"},{\"a\":157,\"w\":[\"فَأۡتُواْ\",\"بِكِتَٰبِكُمۡ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"Then produce your scripture, if you should be truthful\"},{\"a\":158,\"w\":[\"وَجَعَلُواْ\",\"بَيۡنَهُۥ\",\"وَبَيۡنَ\",\"ٱلۡجِنَّةِ\",\"نَسَبٗاۚ\",\"وَلَقَدۡ\",\"عَلِمَتِ\",\"ٱلۡجِنَّةُ\",\"إِنَّهُمۡ\",\"لَمُحۡضَرُونَ\"],\"t\":\"And they have claimed between Him and the jinn a lineage, but the jinn have already known that they [who made such claims] will be brought to [punishment]\"},{\"a\":159,\"w\":[\"سُبۡحَٰنَ\",\"ٱللَّهِ\",\"عَمَّا\",\"يَصِفُونَ\"],\"t\":\"Exalted is Allah above what they describe\"},{\"a\":160,\"w\":[\"إِلَّا\",\"عِبَادَ\",\"ٱللَّهِ\",\"ٱلۡمُخۡلَصِينَ\"],\"t\":\"Except the chosen servants of Allah [who do not share in that sin]\"},{\"a\":161,\"w\":[\"فَإِنَّكُمۡ\",\"وَمَا\",\"تَعۡبُدُونَ\"],\"t\":\"So indeed, you [disbelievers] and whatever you worship\"},{\"a\":162,\"w\":[\"مَآ\",\"أَنتُمۡ\",\"عَلَيۡهِ\",\"بِفَٰتِنِينَ\"],\"t\":\"You cannot tempt [anyone] away from Him\"},{\"a\":163,\"w\":[\"إِلَّا\",\"مَنۡ\",\"هُوَ\",\"صَالِ\",\"ٱلۡجَحِيمِ\"],\"t\":\"Except he who is to [enter and] burn in the Hellfire\"},{\"a\":164,\"w\":[\"وَمَا\",\"مِنَّآ\",\"إِلَّا\",\"لَهُۥ\",\"مَقَامٌ\",\"مَّعْلُومٌ\"],\"t\":\"[The angels say], \\\"There is not among us any except that he has a known position\",\"m\":1},{\"a\":165,\"w\":[\"وَإِنَّا\",\"لَنَحۡنُ\",\"ٱلصَّآفُّونَ\"],\"t\":\"And indeed, we are those who line up [for prayer]\"},{\"a\":166,\"w\":[\"وَإِنَّا\",\"لَنَحۡنُ\",\"ٱلۡمُسَبِّحُونَ\"],\"t\":\"And indeed, we are those who exalt Allah\"},{\"a\":167,\"w\":[\"وَإِن\",\"كَانُواْ\",\"لَيَقُولُونَ\"],\"t\":\"And indeed, the disbelievers used to say\"},{\"a\":168,\"w\":[\"لَوۡ\",\"أَنَّ\",\"عِندَنَا\",\"ذِكۡرٗا\",\"مِّنَ\",\"ٱلۡأَوَّلِينَ\"],\"t\":\"If we had a message from [those of] the former peoples\"},{\"a\":169,\"w\":[\"لَكُنَّا\",\"عِبَادَ\",\"ٱللَّهِ\",\"ٱلۡمُخۡلَصِينَ\"],\"t\":\"We would have been the chosen servants of Allah\"},{\"a\":170,\"w\":[\"فَكَفَرُواْ\",\"بِهِۦۖ\",\"فَسَوۡفَ\",\"يَعۡلَمُونَ\"],\"t\":\"But they disbelieved in it, so they are going to know\"},{\"a\":171,\"w\":[\"وَلَقَدۡ\",\"سَبَقَتۡ\",\"كَلِمَتُنَا\",\"لِعِبَادِنَا\",\"ٱلۡمُرۡسَلِينَ\"],\"t\":\"And Our word has already preceded for Our servants, the messengers\"},{\"a\":172,\"w\":[\"إِنَّهُمۡ\",\"لَهُمُ\",\"ٱلۡمَنصُورُونَ\"],\"t\":\"[That] indeed, they would be those given victory\"},{\"a\":173,\"w\":[\"وَإِنَّ\",\"جُندَنَا\",\"لَهُمُ\",\"ٱلۡغَٰلِبُونَ\"],\"t\":\"And [that] indeed, Our soldiers will be those who overcome\"},{\"a\":174,\"w\":[\"فَتَوَلَّ\",\"عَنۡهُمۡ\",\"حَتَّىٰ\",\"حِينٖ\"],\"t\":\"So, [O Muhammad], leave them for a time\"},{\"a\":175,\"w\":[\"وَأَبۡصِرۡهُمۡ\",\"فَسَوۡفَ\",\"يُبۡصِرُونَ\"],\"t\":\"And see [what will befall] them, for they are going to see\"},{\"a\":176,\"w\":[\"أَفَبِعَذَابِنَا\",\"يَسۡتَعۡجِلُونَ\"],\"t\":\"Then for Our punishment are they impatient\"},{\"a\":177,\"w\":[\"فَإِذَا\",\"نَزَلَ\",\"بِسَاحَتِهِمۡ\",\"فَسَآءَ\",\"صَبَاحُ\",\"ٱلۡمُنذَرِينَ\"],\"t\":\"But when it descends in their territory, then evil is the morning of those who were warned\"},{\"a\":178,\"w\":[\"وَتَوَلَّ\",\"عَنۡهُمۡ\",\"حَتَّىٰ\",\"حِينٖ\"],\"t\":\"And leave them for a time\"},{\"a\":179,\"w\":[\"وَأَبۡصِرۡ\",\"فَسَوۡفَ\",\"يُبۡصِرُونَ\"],\"t\":\"And see, for they are going to see\"},{\"a\":180,\"w\":[\"سُبۡحَٰنَ\",\"رَبِّكَ\",\"رَبِّ\",\"ٱلۡعِزَّةِ\",\"عَمَّا\",\"يَصِفُونَ\"],\"t\":\"Exalted is your Lord, the Lord of might, above what they describe\"},{\"a\":181,\"w\":[\"وَسَلَٰمٌ\",\"عَلَى\",\"ٱلۡمُرۡسَلِينَ\"],\"t\":\"And peace upon the messengers\"},{\"a\":182,\"w\":[\"وَٱلۡحَمۡدُ\",\"لِلَّهِ\",\"رَبِّ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"And praise to Allah, Lord of the worlds\"}]}]}]}]]}]\n1a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1e:I[
