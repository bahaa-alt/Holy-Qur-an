:\"So he will be in a pleasant life\"},{\"a\":22,\"w\":[\"فِي\",\"جَنَّةٍ\",\"عَالِيَةٖ\"],\"t\":\"In an elevated garden\"},{\"a\":23,\"w\":[\"قُطُوفُهَا\",\"دَانِيَةٞ\"],\"t\":\"Its [fruit] to be picked hanging near\"},{\"a\":24,\"w\":[\"كُلُواْ\",\"وَٱشۡرَبُواْ\",\"هَنِيٓـَٔۢا\",\"بِمَآ\",\"أَسۡلَفۡتُمۡ\",\"فِي\",\"ٱلۡأَيَّامِ\",\"ٱلۡخَالِيَةِ\"],\"t\":\"[They will be told], \\\"Eat and drink in satisfaction for what you put forth in the days past\"},{\"a\":25,\"w\":[\"وَأَمَّا\",\"مَنۡ\",\"أُوتِيَ\",\"كِتَٰبَهُۥ\",\"بِشِمَالِهِۦ\",\"فَيَقُولُ\",\"يَٰلَيۡتَنِي\",\"لَمۡ\",\"أُوتَ\",\"كِتَٰبِيَهۡ\"],\"t\":\"But as for he who is given his record in his left hand, he will say, \\\"Oh, I wish I had not been given my record\"},{\"a\":26,\"w\":[\"وَلَمۡ\",\"أَدۡرِ\",\"مَا\",\"حِسَابِيَهۡ\"],\"t\":\"And had not known what is my account\"},{\"a\":27,\"w\":[\"يَٰلَيۡتَهَا\",\"كَانَتِ\",\"ٱلۡقَاضِيَةَ\"],\"t\":\"I wish my death had been the decisive one\"},{\"a\":28,\"w\":[\"مَآ\",\"أَغۡنَىٰ\",\"عَنِّي\",\"مَالِيَهۡۜ\"],\"t\":\"My wealth has not availed me\"},{\"a\":29,\"w\":[\"هَلَكَ\",\"عَنِّي\",\"سُلۡطَٰنِيَهۡ\"],\"t\":\"Gone from me is my authority\"},{\"a\":30,\"w\":[\"خُذُوهُ\",\"فَغُلُّوهُ\"],\"t\":\"[Allah will say], \\\"Seize him and shackle him\"},{\"a\":31,\"w\":[\"ثُمَّ\",\"ٱلۡجَحِيمَ\",\"صَلُّوهُ\"],\"t\":\"Then into Hellfire drive him\"},{\"a\":32,\"w\":[\"ثُمَّ\",\"فِي\",\"سِلۡسِلَةٖ\",\"ذَرۡعُهَا\",\"سَبۡعُونَ\",\"ذِرَاعٗا\",\"فَٱسۡلُكُوهُ\"],\"t\":\"Then into a chain whose length is seventy cubits insert him\"},{\"a\":33,\"w\":[\"إِنَّهُۥ\",\"كَانَ\",\"لَا\",\"يُؤۡمِنُ\",\"بِٱللَّهِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"Indeed, he did not used to believe in Allah, the Most Great\"},{\"a\":34,\"w\":[\"وَلَا\",\"يَحُضُّ\",\"عَلَىٰ\",\"طَعَامِ\",\"ٱلۡمِسۡكِينِ\"],\"t\":\"Nor did he encourage the feeding of the poor\"},{\"a\":35,\"w\":[\"فَلَيۡسَ\",\"لَهُ\",\"ٱلۡيَوۡمَ\",\"هَٰهُنَا\",\"حَمِيمٞ\"],\"t\":\"So there is not for him here this Day any devoted friend\"},{\"a\":3
