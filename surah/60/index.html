eved, do not take My enemies and your enemies as allies, extending to them affection while they have disbelieved in what came to you of the truth, having driven out the Prophet and yourselves [only] because you believe in Allah, your Lord. If you have come out for jihad in My cause and seeking means to My approval, [take them not as friends]. You confide to them affection, but I am most knowing of what you have concealed and what you have declared. And whoever does it among you has certainly strayed from the soundness of the way\",\"pickthall\":\"O ye who believe! Choose not My enemy and your enemy for allies. Do ye give them friendship when they disbelieve in that truth which hath come unto you, driving out the messenger and you because ye believe in Allah, your Lord? If ye have come forth to strive in My way and seeking My good pleasure, (show them not friendship). Do ye show friendship unto them in secret, when I am Best Aware of what ye hide and what ye proclaim? And whosoever doeth it among you, he verily hath strayed from the right way\"},{\"a\":2,\"w\":[\"إِن\",\"يَثۡقَفُوكُمۡ\",\"يَكُونُواْ\",\"لَكُمۡ\",\"أَعۡدَآءٗ\",\"وَيَبۡسُطُوٓاْ\",\"إِلَيۡكُمۡ\",\"أَيۡدِيَهُمۡ\",\"وَأَلۡسِنَتَهُم\",\"بِٱلسُّوٓءِ\",\"وَوَدُّواْ\",\"لَوۡ\",\"تَكۡفُرُونَ\"],\"t\":\"If they gain dominance over you, they would be to you as enemies and extend against you their hands and their tongues with evil, and they wish you would disbelieve\",\"pickthall\":\"If they have the upper hand of you, they will be your foes, and will stretch out their hands and their tongues toward you with evil (intent), and they long for you to disbelieve\"},{\"a\":3,\"w\":[\"لَن\",\"تَنفَعَكُمۡ\",\"أَرۡحَامُكُمۡ\",\"وَلَآ\",\"أَوۡلَٰدُكُمۡۚ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِ\",\"يَفۡصِلُ\",\"بَيۡنَكُمۡۚ\",\"وَٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"بَصِيرٞ\"],\"t\":\"Never will your relatives or your children benefit you; the Day of Resurrection He will judge between you. And Allah, of what you do, is Seeing\",\"pickthall\":\"Your ties of kindred and your children will avail you naught upon the Day of Resurrection. He will part you. Allah is Seer of what ye do\"},{\"a\":4,\"w\":[\"قَدۡ\",\"كَانَتۡ\",\"لَكُمۡ\",\"أُسۡوَةٌ\",\"حَسَنَةٞ\",\"فِيٓ\",\"إِبۡرَٰهِيمَ\",\"وَٱلَّذِينَ\",\"مَعَهُۥٓ\",\"إِذۡ\",\"قَالُواْ\",\"لِقَوۡمِهِمۡ\",\"إِنَّا\",\"بُرَءَـٰٓؤُاْ\",\"مِنكُمۡ\",\"وَمِمَّا\",\"تَعۡبُدُونَ\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"كَفَرۡنَا\",\"بِكُمۡ\",\"وَبَدَا\",\"بَيۡنَنَا\",\"وَبَيۡنَكُمُ\",\"ٱلۡعَدَٰوَةُ\",\"وَٱلۡبَغۡضَآءُ\",\"أَبَدًا\",\"حَتَّىٰ\",\"تُؤۡمِنُواْ\",\"بِٱللَّهِ\",\"وَحۡدَهُۥٓ\",\"إِلَّا\",\"قَوۡلَ\",\"إِبۡرَٰهِيمَ\",\"لِأَبِيهِ\",\"لَأَسۡتَغۡفِرَنَّ\",\"لَكَ\",\"وَمَآ\",\"أَمۡلِكُ\",\"لَكَ\",\"مِنَ\",\"ٱللَّهِ\",\"مِن\",\"شَيۡءٖۖ\",\"رَّبَّنَا\",\"عَلَيۡكَ\",\"تَوَكَّلۡنَا\",\"وَإِلَيۡكَ\",\"أَنَبۡنَا\",\"وَإِلَيۡكَ\",\"ٱلۡمَصِيرُ\"],\"t\":\"There has already been for you an excellent pattern in Abraham and those with him, when they said to their people, \\\"Indeed, we are disassociated from you and from whatever you worship other than Allah. We have denied you, and there has appeared between us and you animosity and hatred forever until you believe in Allah alone\\\" except for the saying of Abraham to his father, \\\"I will surely ask forgiveness for you, but I have not [power to do] for you anything against Allah. Our Lord, upon You we have relied, and to You we have returned, and to You is the destination\",\"pickthall\":\"There is a goodly pattern for you in Abraham and those with him, when they told their folk: Lo! we are guiltless of you and all that ye worship beside Allah. We have done with you. And there hath arisen between us and you hostility and hate for ever until ye believe in Allah only - save that which Abraham promised his father (when he said): I will ask forgiveness for thee, though I own nothing for thee from Allah - Our Lord! In Thee we put our trust, and unto Thee we turn repentant, and unto Thee is the journeying\"},{\"a\":5,\"w\":[\"رَبَّنَا\",\"لَا\",\"تَجۡعَلۡنَا\",\"فِتۡنَةٗ\",\"لِّلَّذِينَ\",\"كَفَرُواْ\",\"وَٱغۡفِرۡ\",\"لَنَا\",\"رَبَّنَآۖ\",\"إِنَّكَ\",\"أَنتَ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"Our Lord, make us not [objects of] torment for the disbelievers and forgive us, our Lord. Indeed, it is You who is the Exalted in Might, the Wise\",\"pickthall\":\"Our Lord! Make us not a prey for those who disbelieve, and forgive us, our Lord! Lo! Thou, only Thou, are the Mighty, the Wise\"},{\"a\":6,\"w\":[\"لَقَدۡ\",\"كَانَ\",\"لَكُمۡ\",\"فِيهِمۡ\",\"أُسۡوَةٌ\",\"حَسَنَةٞ\",\"لِّمَن\",\"كَانَ\",\"يَرۡجُواْ\",\"ٱللَّهَ\",\"وَٱلۡيَوۡمَ\",\"ٱلۡأٓخِرَۚ\",\"وَمَن\",\"يَتَوَلَّ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"هُوَ\",\"ٱلۡغَنِيُّ\",\"ٱلۡحَمِيدُ\"],\"t\":\"There has certainly been for you in them an excellent pattern for anyone whose hope is in Allah and the Last Day. And whoever turns away - then indeed, Allah is the Free of need, the Praiseworthy\",\"pickthall\":\"Verily ye have in them a goodly pattern for everyone who looketh to Allah and the Last Day. And whosoever may turn away, lo! still Allah, He is the Absolute, the Owner of Praise\"},{\"a\":7,\"w\":[\"۞عَسَى\",\"ٱللَّهُ\",\"أَن\",\"يَجۡعَلَ\",\"بَيۡنَكُمۡ\",\"وَبَيۡنَ\",\"ٱلَّذِينَ\",\"عَادَيۡتُم\",\"مِّنۡهُم\",\"مَّوَدَّةٗۚ\",\"وَٱللَّهُ\",\"قَدِيرٞۚ\",\"وَٱللَّهُ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"Perhaps Allah will put, between you and those to whom you have been enemies among them, affection. And Allah is competent, and Allah is Forgiving and Merciful\",\"pickthall\":\"It may be that Allah will ordain love between you and those of them with whom ye are at enmity. Allah is Mighty, and Allah is Forgiving, Merciful\"},{\"a\":8,\"w\":[\"لَّا\",\"يَنۡهَىٰكُمُ\",\"ٱللَّهُ\",\"عَنِ\",\"ٱلَّذِينَ\",\"لَمۡ\",\"يُقَٰتِلُوكُمۡ\",\"فِي\",\"ٱلدِّينِ\",\"وَلَمۡ\",\"يُخۡرِجُوكُم\",\"مِّن\",\"دِيَٰرِكُمۡ\",\"أَن\",\"تَبَرُّوهُمۡ\",\"وَتُقۡسِطُوٓاْ\",\"إِلَيۡهِمۡۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"يُحِبُّ\",\"ٱلۡمُقۡسِطِينَ\"],\"t\":\"Allah does not forbid you from those who do not fight you because of religion and do not expel you from your homes - from being righteous toward them and acting justly toward them. Indeed, Allah loves those who act justly\",\"pickthall\":\"Allah forbiddeth you not those who warred not against you on account of religion and drove you not out from your homes, that ye should show them kindness and deal justly with them. Lo! Allah loveth the just dealers\"},{\"a\":9,\"w\":[\"إِنَّمَا\",\"يَنۡهَىٰكُمُ\",\"ٱللَّهُ\",\"عَنِ\",\"ٱلَّذِينَ\",\"قَٰتَلُوكُمۡ\",\"فِي\",\"ٱلدِّينِ\",\"وَأَخۡرَجُوكُم\",\"مِّن\",\"دِيَٰرِكُمۡ\",\"وَظَٰهَرُواْ\",\"عَلَىٰٓ\",\"إِخۡرَاجِكُمۡ\",\"أَن\",\"تَوَلَّوۡهُمۡۚ\",\"وَمَن\",\"يَتَوَلَّهُمۡ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلظَّـٰلِمُونَ\"],\"t\":\"Allah only forbids you from those who fight you because of religion and expel you from your homes and aid in your expulsion - [forbids] that you make allies of them. And whoever makes allies of them, then it is those who are the wrongdoers\",\"pickthall\":\"Allah forbiddeth you only those who warred against you on account of religion and have driven you out from your homes and helped to drive you out, that ye make friends of them. Whosoever maketh friends of them - (All) such are wrong-doers\"},{\"a\":10,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِذَا\",\"جَآءَكُمُ\",\"ٱلۡمُؤۡمِنَٰتُ\",\"مُهَٰجِرَٰتٖ\",\"فَٱمۡتَحِنُوهُنَّۖ\",\"ٱللَّهُ\",\"أَعۡلَمُ\",\"بِإِيمَٰنِهِنَّۖ\",\"فَإِنۡ\",\"عَلِمۡتُمُوهُنَّ\",\"مُؤۡمِنَٰتٖ\",\"فَلَا\",\"تَرۡجِعُوهُنَّ\",\"إِلَى\",\"ٱلۡكُفَّارِۖ\",\"لَا\",\"هُنَّ\",\"حِلّٞ\",\"لَّهُمۡ\",\"وَلَا\",\"هُمۡ\",\"يَحِلُّونَ\",\"لَهُنَّۖ\",\"وَءَاتُوهُم\",\"مَّآ\",\"أَنفَقُواْۚ\",\"وَلَا\",\"جُنَاحَ\",\"عَلَيۡكُمۡ\",\"أَن\",\"تَنكِحُوهُنَّ\",\"إِذَآ\",\"ءَاتَيۡتُمُوهُنَّ\",\"أُجُورَهُنَّۚ\",\"وَلَا\",\"تُمۡسِكُواْ\",\"بِعِصَمِ\",\"ٱلۡكَوَافِرِ\",\"وَسۡـَٔلُواْ\",\"مَآ\",\"أَنفَقۡتُمۡ\",\"وَلۡيَسۡـَٔلُواْ\",\"مَآ\",\"أَنفَقُواْۚ\",\"ذَٰلِكُمۡ\",\"حُكۡمُ\",\"ٱللَّهِ\",\"يَحۡكُمُ\",\"بَيۡنَكُمۡۖ\",\"وَٱللَّهُ\",\"عَلِيمٌ\",\"حَكِيمٞ\"],\"t\":\"O you who have believed, when the believing women come to you as emigrants, examine them. Allah is most knowing as to their faith. And if you know them to be believers, then do not return them to the disbelievers; they are not lawful [wives] for them, nor are they lawful [husbands] for them. But give the disbelievers what they have spent. And there is no blame upon you if you marry them when you have given them their due compensation. And hold not to marriage bonds with disbelieving women, but ask for what you have spent and let them ask for what they have spent. That is the judgement of Allah; He judges between you. And Allah is Knowing and Wise\",\"pickthall\":\"O ye who believe! When believing women come unto you as fugitives, examine them. Allah is Best Aware of their faith. Then, if ye know them for true believers, send them not back unto the disbelievers. They are not lawful for them (the disbelievers), nor are they (the disbelievers) lawful for them. And give them (the disbelievers) that which they have spent (upon them). And it is no sin for you to marry such women when ye have given them their dues. And hold not to the ties of disbelieving women; and ask for (the return of) that which ye have spent; and let them (the disbelievers) ask for that which they have spent. That is the judgment of Allah. He judgeth between you. Allah is Knower, Wise\"},{\"a\":11,\"w\":[\"وَإِن\",\"فَاتَكُمۡ\",\"شَيۡءٞ\",\"مِّنۡ\",\"أَزۡوَٰجِكُمۡ\",\"إِلَى\",\"ٱلۡكُفَّارِ\",\"فَعَاقَبۡتُمۡ\",\"فَـَٔاتُواْ\",\"ٱلَّذِينَ\",\"ذَهَبَتۡ\",\"أَزۡوَٰجُهُم\",\"مِّثۡلَ\",\"مَآ\",\"أَنفَقُواْۚ\",\"وَٱتَّقُواْ\",\"ٱللَّهَ\",\"ٱلَّذِيٓ\",\"أَنتُم\",\"بِهِۦ\",\"مُؤۡمِنُونَ\"],\"t\":\"And if you have lost any of your wives to the disbelievers and you subsequently obtain [something], then give those whose wives have gone the equivalent of what they had spent. And fear Allah, in whom you are believers\",\"pickthall\":\"And if any of your wives have gone from you unto the disbelievers and afterward ye have your turn (of triumph), then give unto those whose wives have gone the like of that which they have spent, and keep your duty to Allah in Whom ye are believers\"},{\"a\":12,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلنَّبِيُّ\",\"إِذَا\",\"جَآءَكَ\",\"ٱلۡمُؤۡمِنَٰتُ\",\"يُبَايِعۡنَكَ\",\"عَلَىٰٓ\",\"أَن\",\"لَّا\",\"يُشۡرِكۡنَ\",\"بِٱللَّهِ\",\"شَيۡـٔٗا\",\"وَلَا\",\"يَسۡرِقۡنَ\",\"وَلَا\",\"يَزۡنِينَ\",\"وَلَا\",\"يَقۡتُلۡنَ\",\"أَوۡلَٰدَهُنَّ\",\"وَلَا\",\"يَأۡتِينَ\",\"بِبُهۡتَٰنٖ\",\"يَفۡتَرِينَهُۥ\",\"بَيۡنَ\",\"أَيۡدِيهِنَّ\",\"وَأَرۡجُلِهِنَّ\",\"وَلَا\",\"يَعۡصِينَكَ\",\"فِي\",\"مَعۡرُوفٖ\",\"فَبَايِعۡهُنَّ\",\"وَٱسۡتَغۡفِرۡ\",\"لَهُنَّ\",\"ٱللَّهَۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"O Prophet, when the believing women come to you pledging to you that they will not associate anything with Allah, nor will they steal, nor will they commit unlawful sexual intercourse, nor will they kill their children, nor will they bring forth a slander they have invented between their arms and legs, nor will they disobey you in what is right - then accept their pledge and ask forgiveness for them of Allah. Indeed, Allah is Forgiving and Merciful\",\"pickthall\":\"O Prophet! If believing women come unto thee, taking oath of allegiance unto thee that they will ascribe no thing as partner unto Allah, and will neither steal nor commit adultery nor kill their children, nor produce any lie that they have devised between their hands and feet, nor disobey thee in what is right, then accept their allegiance and ask Allah to forgive them. Lo! Allah is Forgiving, Merciful\"},{\"a\":13,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَا\",\"تَتَوَلَّوۡاْ\",\"قَوۡمًا\",\"غَضِبَ\",\"ٱللَّهُ\",\"عَلَيۡهِمۡ\",\"قَدۡ\",\"يَئِسُواْ\",\"مِنَ\",\"ٱلۡأٓخِرَةِ\",\"كَمَا\",\"يَئِسَ\",\"ٱلۡكُفَّارُ\",\"مِنۡ\",\"أَصۡحَٰبِ\",\"ٱلۡقُبُورِ\"],\"t\":\"O you who have believed, do not make allies of a people with whom Allah has become angry. They have despaired of [reward in] the Hereafter just as the disbelievers have despaired of [meeting] the inhabitants of the graves\",\"pickthall\":\"O ye who believe! Be not friendly with a folk with whom Allah is wroth, (a folk) who have despaired of the Hereafter as the disbelievers despair of those who are in the graves\"}]}]}]}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[81329,[\"/Holy-Qur-an/_next/static/chunks/2ivmqwi0--m-o.js\",\"/Holy-Qur-an/_next/static/chunks/3carqqy-2sdbp.js\"],\"IconMark\"]\nd:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Al-Mumtahanah — Surah 60 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quran Roots\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Holy-Qur-an/icon.svg?icon.0k8xndm1lskh_.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Holy-Qur-an/apple-icon.png?apple-icon.1aiq4_oo29pdu.png\",\"sizes\"
