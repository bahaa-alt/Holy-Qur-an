",null,{\"className\":\"mt-8\",\"children\":[\"$\",\"$17\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"text-center text-sm text-muted\",\"children\":\"Loading verses…\"}],\"children\":[\"$\",\"$L1d\",null,{\"surahMeta\":{\"n\":9,\"nameAr\":\"التوبة\",\"nameEn\":\"The Repentance\",\"translit\":\"At-Tawbah\",\"type\":\"medinan\",\"ayahs\":129},\"verses\":[{\"a\":1,\"w\":[\"بَرَآءَةٞ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرَسُولِهِۦٓ\",\"إِلَى\",\"ٱلَّذِينَ\",\"عَٰهَدتُّم\",\"مِّنَ\",\"ٱلۡمُشۡرِكِينَ\"],\"t\":\"[This is a declaration of] disassociation, from Allah and His Messenger, to those with whom you had made a treaty among the polytheists\"},{\"a\":2,\"w\":[\"فَسِيحُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"أَرۡبَعَةَ\",\"أَشۡهُرٖ\",\"وَٱعۡلَمُوٓاْ\",\"أَنَّكُمۡ\",\"غَيۡرُ\",\"مُعۡجِزِي\",\"ٱللَّهِ\",\"وَأَنَّ\",\"ٱللَّهَ\",\"مُخۡزِي\",\"ٱلۡكَٰفِرِينَ\"],\"t\":\"So travel freely, [O disbelievers], throughout the land [during] four months but know that you cannot cause failure to Allah and that Allah will disgrace the disbelievers\"},{\"a\":3,\"w\":[\"وَأَذَٰنٞ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرَسُولِهِۦٓ\",\"إِلَى\",\"ٱلنَّاسِ\",\"يَوۡمَ\",\"ٱلۡحَجِّ\",\"ٱلۡأَكۡبَرِ\",\"أَنَّ\",\"ٱللَّهَ\",\"بَرِيٓءٞ\",\"مِّنَ\",\"ٱلۡمُشۡرِكِينَ\",\"وَرَسُولُهُۥۚ\",\"فَإِن\",\"تُبۡتُمۡ\",\"فَهُوَ\",\"خَيۡرٞ\",\"لَّكُمۡۖ\",\"وَإِن\",\"تَوَلَّيۡتُمۡ\",\"فَٱعۡلَمُوٓاْ\",\"أَنَّكُمۡ\",\"غَيۡرُ\",\"مُعۡجِزِي\",\"ٱللَّهِۗ\",\"وَبَشِّرِ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"بِعَذَابٍ\",\"أَلِيمٍ\"],\"t\":\"And [it is] an announcement from Allah and His Messenger to the people on the day of the greater pilgrimage that Allah is disassociated from the disbelievers, and [so is] His Messenger. So if you repent, that is best for you; but if you turn away - then know that you will not cause failure to Allah. And give tidings to those who disbelieve of a painful punishment\"},{\"a\":4,\"w\":[\"إِلَّا\",\"ٱلَّذِينَ\",\"عَٰهَدتُّم\",\"مِّنَ\",\"ٱلۡمُشۡرِكِينَ\",\"ثُمَّ\",\"لَمۡ\",\"يَنقُصُوكُمۡ\",\"شَيۡـٔٗا\",\"وَلَمۡ\",\"يُظَٰهِرُواْ\",\"عَلَيۡكُمۡ\",\"أَحَدٗا\",\"فَأَتِمُّوٓاْ\",\"إِلَيۡهِمۡ\",\"عَهۡدَهُمۡ\",\"إِلَىٰ\",\"مُدَّتِهِمۡۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"يُحِبُّ\",\"ٱلۡمُتَّقِينَ\"],\"t\":\"Excepted are those with whom you made a treaty among the polytheists and then they have not been deficient toward you in anything or supported anyone against you; so complete for them their treaty until their term [has ended]. Indeed, Allah loves the righteous [who fear Him]\"},{\"a\":5,\"w\":[\"فَإِذَا\",\"ٱنسَلَخَ\",\"ٱلۡأَشۡهُرُ\",\"ٱلۡحُرُمُ\",\"فَٱقۡتُلُواْ\",\"ٱلۡمُشۡرِكِينَ\",\"حَيۡثُ\",\"وَجَدتُّمُوهُمۡ\",\"وَخُذُوهُمۡ\",\"وَٱحۡصُرُوهُمۡ\",\"وَٱقۡعُدُواْ\",\"لَهُمۡ\",\"كُلَّ\",\"مَرۡصَدٖۚ\",\"فَإِن\",\"تَابُواْ\",\"وَأَقَامُواْ\",\"ٱلصَّلَوٰةَ\",\"وَءَاتَوُاْ\",\"ٱلزَّكَوٰةَ\",\"فَخَلُّواْ\",\"سَبِيلَهُمۡۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"And when the sacred months have passed, then kill the polytheists wherever you find them and capture them and besiege them and sit in wait for them at every place of ambush. But if they should repent, establish prayer, and give zakah, let them [go] on their way. Indeed, Allah is Forgiving and Merciful\"},{\"a\":6,\"w\":[\"وَإِنۡ\",\"أَحَدٞ\",\"مِّنَ\",\"ٱلۡمُشۡرِكِينَ\",\"ٱسۡتَجَارَكَ\",\"فَأَجِرۡهُ\",\"حَتَّىٰ\",\"يَسۡمَعَ\",\"كَلَٰمَ\",\"ٱللَّهِ\",\"ثُمَّ\",\"أَبۡلِغۡهُ\",\"مَأۡمَنَهُۥۚ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَوۡمٞ\",\"لَّا\",\"يَعۡلَمُونَ\"],\"t\":\"And if any one of the polytheists seeks your protection, then grant him protection so that he may hear the words of Allah. Then deliver him to his place of safety. That is because they are a people who do not know\"},{\"a\":7,\"w\":[\"كَيۡفَ\",\"يَكُونُ\",\"لِلۡمُشۡرِكِينَ\",\"عَهۡدٌ\",\"عِندَ\",\"ٱللَّهِ\",\"وَعِندَ\",\"رَسُولِهِۦٓ\",\"إِلَّا\",\"ٱلَّذِينَ\",\"عَٰهَدتُّمۡ\",\"عِندَ\",\"ٱلۡمَسۡجِدِ\",\"ٱلۡحَرَامِۖ\",\"فَمَا\",\"ٱسۡتَقَٰمُواْ\",\"لَكُمۡ\",\"فَٱسۡتَقِيمُواْ\",\"لَهُمۡۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"يُحِبُّ\",\"ٱلۡمُتَّقِينَ\"],\"t\":\"How can there be for the polytheists a treaty in the sight of Allah and with His Messenger, except for those with whom you made a treaty at al-Masjid al-Haram? So as long as they are upright toward you, be upright toward them. Indeed, Allah loves the righteous [who fear Him]\"},{\"a\":8,\"w\":[\"كَيۡفَ\",\"وَإِن\",\"يَظۡهَرُواْ\",\"عَلَيۡكُمۡ\",\"لَا\",\"يَرۡقُبُواْ\",\"فِيكُمۡ\",\"إِلّٗا\",\"وَلَا\",\"ذِمَّةٗۚ\",\"يُرۡضُونَكُم\",\"بِأَفۡوَٰهِهِمۡ\",\"وَتَأۡبَىٰ\",\"قُلُوبُهُمۡ\",\"وَأَكۡثَرُهُمۡ\",\"فَٰسِقُونَ\"],\"t\":\"How [can there be a treaty] while, if they gain dominance over you, they do not observe concerning you any pact of kinship or covenant of protection? They satisfy you with their mouths, but their hearts refuse [compliance], and most of them are defiantly disobedient\"},{\"a\":9,\"w\":[\"ٱشۡتَرَوۡاْ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"ثَمَنٗا\",\"قَلِيلٗا\",\"فَصَدُّواْ\",\"عَن\",\"سَبِيلِهِۦٓۚ\",\"إِنَّهُمۡ\",\"سَآءَ\",\"مَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"They have exchanged the signs of Allah for a small price and averted [people] from His way. Indeed, it was evil that they were doing\"},{\"a\":10,\"w\":[\"لَا\",\"يَرۡقُبُونَ\",\"فِي\",\"مُؤۡمِنٍ\",\"إِلّٗا\",\"وَلَا\",\"ذِمَّةٗۚ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡمُعۡتَدُونَ\"],\"t\":\"They do not observe toward a believer any pact of kinship or covenant of protection. And it is they who are the transgressors\"},{\"a\":11,\"w\":[\"فَإِن\",\"تَابُواْ\",\"وَأَقَامُواْ\",\"ٱلصَّلَوٰةَ\",\"وَءَاتَوُاْ\",\"ٱلزَّكَوٰةَ\",\"فَإِخۡوَٰنُكُمۡ\",\"فِي\",\"ٱلدِّينِۗ\",\"وَنُفَصِّلُ\",\"ٱلۡأٓيَٰتِ\",\"لِقَوۡمٖ\",\"يَعۡلَمُونَ\"],\"t\":\"But if they repent, establish prayer, and give zakah, then they are your brothers in religion; and We detail the verses for a people who know\"},{\"a\":12,\"w\":[\"وَإِن\",\"نَّكَثُوٓاْ\",\"أَيۡمَٰنَهُم\",\"مِّنۢ\",\"بَعۡدِ\",\"عَهۡدِهِمۡ\",\"وَطَعَنُواْ\",\"فِي\",\"دِينِكُمۡ\",\"فَقَٰتِلُوٓاْ\",\"أَئِمَّةَ\",\"ٱلۡكُفۡرِ\",\"إِنَّهُمۡ\",\"لَآ\",\"أَيۡمَٰنَ\",\"لَهُمۡ\",\"لَعَلَّهُمۡ\",\"يَنتَهُونَ\"],\"t\":\"And if they break their oaths after their treaty and defame your religion, then fight the leaders of disbelief, for indeed, there are no oaths [sacred] to them; [fight them that] they might cease\"},{\"a\":13,\"w\":[\"أَلَا\",\"تُقَٰتِلُونَ\",\"قَوۡمٗا\",\"نَّكَثُوٓاْ\",\"أَيۡمَٰنَهُمۡ\",\"وَهَمُّواْ\",\"بِإِخۡرَاجِ\",\"ٱلرَّسُولِ\",\"وَهُم\",\"بَدَءُوكُمۡ\",\"أَوَّلَ\",\"مَرَّةٍۚ\",\"أَتَخۡشَوۡنَهُمۡۚ\",\"فَٱللَّهُ\",\"أَحَقُّ\",\"أَن\",\"تَخۡشَوۡهُ\",\"إِن\",\"كُنتُم\",\"مُّؤۡمِنِينَ\"],\"t\":\"Would you not fight a people who broke their oaths and determined to expel the Messenger, and they had begun [the attack upon] you the first time? Do you fear them? But Allah has more right that you should fear Him, if you are [truly] believers\"},{\"a\":14,\"w\":[\"قَٰتِلُوهُمۡ\",\"يُعَذِّبۡهُمُ\",\"ٱللَّهُ\",\"بِأَيۡدِيكُمۡ\",\"وَيُخۡزِهِمۡ\",\"وَيَنصُرۡكُمۡ\",\"عَلَيۡهِمۡ\",\"وَيَشۡفِ\",\"صُدُورَ\",\"قَوۡمٖ\",\"مُّؤۡمِنِينَ\"],\"t\":\"Fight them; Allah will punish them by your hands and will disgrace them and give you victory over them and satisfy the breasts of a believing people\"},{\"a\":15,\"w\":[\"وَيُذۡهِبۡ\",\"غَيۡظَ\",\"قُلُوبِهِمۡۗ\",\"وَيَتُوبُ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"مَن\",\"يَشَآءُۗ\",\"وَٱللَّهُ\",\"عَلِيمٌ\",\"حَكِيمٌ\"],\"t\":\"And remove the fury in the believers' hearts. And Allah turns in forgiveness to whom He wills; and Allah is Knowing and Wise\"},{\"a\":16,\"w\":[\"أَمۡ\",\"حَسِبۡتُمۡ\",\"أَن\",\"تُتۡرَكُواْ\",\"وَلَمَّا\",\"يَعۡلَمِ\",\"ٱللَّهُ\",\"ٱلَّذِينَ\",\"جَٰهَدُواْ\",\"مِنكُمۡ\",\"وَلَمۡ\",\"يَتَّخِذُواْ\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"وَلَا\",\"رَسُولِهِۦ\",\"وَلَا\",\"ٱلۡمُؤۡمِنِينَ\",\"وَلِيجَةٗۚ\",\"وَٱللَّهُ\",\"خَبِيرُۢ\",\"بِمَا\",\"تَعۡمَلُونَ\"],\"t\":\"Do you think that you will be left [as you are] while Allah has not yet made evident those among you who strive [for His cause] and do not take other than Allah, His Messenger and the believers as intimates? And Allah is Acquainted with what you do\"},{\"a\":17,\"w\":[\"مَا\",\"كَانَ\",\"لِلۡمُشۡرِكِينَ\",\"أَن\",\"يَعۡمُرُواْ\",\"مَسَٰجِدَ\",\"ٱللَّهِ\",\"شَٰهِدِينَ\",\"عَلَىٰٓ\",\"أَنفُسِهِم\",\"بِٱلۡكُفۡرِۚ\",\"أُوْلَـٰٓئِكَ\",\"حَبِطَتۡ\",\"أَعۡمَٰلُهُمۡ\",\"وَفِي\",\"ٱلنَّارِ\",\"هُمۡ\",\"خَٰلِدُونَ\"],\"t\":\"It is not for the polytheists to maintain the mosques of Allah [while] witnessing against themselves with disbelief. [For] those, their deeds have become worthless, and in the Fire they will abide eternally\"},{\"a\":18,\"w\":[\"إِنَّمَا\",\"يَعۡمُرُ\",\"مَسَٰجِدَ\",\"ٱللَّهِ\",\"مَنۡ\",\"ءَامَنَ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"وَأَقَامَ\",\"ٱلصَّلَوٰةَ\",\"وَءَاتَى\",\"ٱلزَّكَوٰةَ\",\"وَلَمۡ\",\"يَخۡشَ\",\"إِلَّا\",\"ٱللَّهَۖ\",\"فَعَسَىٰٓ\",\"أُوْلَـٰٓئِكَ\",\"أَن\",\"يَكُونُواْ\",\"مِنَ\",\"ٱلۡمُهۡتَدِينَ\"],\"t\":\"The mosques of Allah are only to be maintained by those who believe in Allah and the Last Day and establish prayer and give zakah and do not fear except Allah, for it is expected that those will be of the [rightly] guided\"},{\"a\":19,\"w\":[\"۞أَجَعَلۡتُمۡ\",\"سِقَايَةَ\",\"ٱلۡحَآجِّ\",\"وَعِمَارَةَ\",\"ٱلۡمَسۡجِدِ\",\"ٱلۡحَرَامِ\",\"كَمَنۡ\",\"ءَامَنَ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"وَجَٰهَدَ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِۚ\",\"لَا\",\"يَسۡتَوُۥنَ\",\"عِندَ\",\"ٱللَّهِۗ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"Have you made the providing of water for the pilgrim and the maintenance of al-Masjid al-Haram equal to [the deeds of] one who believes in Allah and the Last Day and strives in the cause of Allah? They are not equal in the sight of Allah. And Allah does not guide the wrongdoing people\"},{\"a\":20,\"w\":[\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَهَاجَرُواْ\",\"وَجَٰهَدُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"بِأَمۡوَٰلِهِمۡ\",\"وَأَنفُسِهِمۡ\",\"أَعۡظَمُ\",\"دَرَجَةً\",\"عِندَ\",\"ٱللَّهِۚ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡفَآئِزُونَ\"],\"t\":\"The ones who have believed, emigrated and striven in the cause of Allah with their wealth and their lives are greater in rank in the sight of Allah. And it is those who are the attainers [of success]\"},{\"a\":21,\"w\":[\"يُبَشِّرُهُمۡ\",\"رَبُّهُم\",\"بِرَحۡمَةٖ\",\"مِّنۡهُ\",\"وَرِضۡوَٰنٖ\",\"وَجَنَّـٰتٖ\",\"لَّهُمۡ\",\"فِيهَا\",\"نَعِيمٞ\",\"مُّقِيمٌ\"],\"t\":\"Their Lord gives them good tidings of mercy from Him and approval and of gardens for them wherein is enduring pleasure\"},{\"a\":22,\"w\":[\"خَٰلِدِينَ\",\"فِيهَآ\",\"أَبَدًاۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"عِندَهُۥٓ\",\"أَجۡرٌ\",\"عَظِيمٞ\"],\"t\":\"[They will be] abiding therein forever. Indeed, Allah has with Him a great reward\"},{\"a\":23,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَا\",\"تَتَّخِذُوٓاْ\",\"ءَابَآءَكُمۡ\",\"وَإِخۡوَٰنَكُمۡ\",\"أَوۡلِيَآءَ\",\"إِنِ\",\"ٱسۡتَحَبُّواْ\",\"ٱلۡكُفۡرَ\",\"عَلَى\",\"ٱلۡإِيمَٰنِۚ\",\"وَمَن\",\"يَتَوَلَّهُم\",\"مِّنكُمۡ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلظَّـٰلِمُونَ\"],\"t\":\"O you who have believed, do not take your fathers or your brothers as allies if they have preferred disbelief over belief. And whoever does so among you - then it is those who are the wrongdoers\"},{\"a\":24,\"w\":[\"قُلۡ\",\"إِن\",\"كَانَ\",\"ءَابَآؤُكُمۡ\",\"وَأَبۡنَآؤُكُمۡ\",\"وَإِخۡوَٰنُكُمۡ\",\"وَأَزۡوَٰجُكُمۡ\",\"وَعَشِيرَتُكُمۡ\",\"وَأَمۡوَٰلٌ\",\"ٱقۡتَرَفۡتُمُوهَا\",\"وَتِجَٰرَةٞ\",\"تَخۡشَوۡنَ\",\"كَسَادَهَا\",\"وَمَسَٰكِنُ\",\"تَرۡضَوۡنَهَآ\",\"أَحَبَّ\",\"إِلَيۡكُم\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرَسُولِهِۦ\",\"وَجِهَادٖ\",\"فِي\",\"سَبِيلِهِۦ\",\"فَتَرَبَّصُواْ\",\"حَتَّىٰ\",\"يَأۡتِيَ\",\"ٱللَّهُ\",\"بِأَمۡرِهِۦۗ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلۡفَٰسِقِينَ\"],\"t\":\"Say, [O Muhammad], \\\"If your fathers, your sons, your brothers, your wives, your relatives, wealth which you have obtained, commerce wherein you fear decline, and dwellings with which you are pleased are more beloved to you than Allah and His Messenger and jihad in His cause, then wait until Allah executes His command. And Allah does not guide the defiantly disobedient people\"},{\"a\":25,\"w\":[\"لَقَدۡ\",\"نَصَرَكُمُ\",\"ٱللَّهُ\",\"فِي\",\"مَوَاطِنَ\",\"كَثِيرَةٖ\",\"وَيَوۡمَ\",\"حُنَيۡنٍ\",\"إِذۡ\",\"أَعۡجَبَتۡكُمۡ\",\"كَثۡرَتُكُمۡ\",\"فَلَمۡ\",\"تُغۡنِ\",\"عَنكُمۡ\",\"شَيۡـٔٗا\",\"وَضَاقَتۡ\",\"عَلَيۡكُمُ\",\"ٱلۡأَرۡضُ\",\"بِمَا\",\"رَحُبَتۡ\",\"ثُمَّ\",\"وَلَّيۡتُم\",\"مُّدۡبِرِينَ\"],\"t\":\"Allah has already given you victory in many regions and [even] on the day of Hunayn, when your great number pleased you, but it did not avail you at all, and the earth was confining for you with its vastness; then you turned back, fleeing\"},{\"a\":26,\"w\":[\"ثُمَّ\",\"أَنزَلَ\",\"ٱللَّهُ\",\"سَكِينَتَهُۥ\",\"عَلَىٰ\",\"رَسُولِهِۦ\",\"وَعَلَى\",\"ٱلۡمُؤۡمِنِينَ\",\"وَأَنزَلَ\",\"جُنُودٗا\",\"لَّمۡ\",\"تَرَوۡهَا\",\"وَعَذَّبَ\",\"ٱلَّذِينَ\",\"كَفَرُواْۚ\",\"وَذَٰلِكَ\",\"جَزَآءُ\",\"ٱلۡكَٰفِرِينَ\"],\"t\":\"Then Allah sent down His tranquillity upon His Messenger and upon the believers and sent down soldiers angels whom you did not see and punished those who disbelieved. And that is the recompense of the disbelievers\"},{\"a\":27,\"w\":[\"ثُمَّ\",\"يَتُوبُ\",\"ٱللَّهُ\",\"مِنۢ\",\"بَعۡدِ\",\"ذَٰلِكَ\",\"عَلَىٰ\",\"مَن\",\"يَشَآءُۗ\",\"وَٱللَّهُ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"Then Allah will accept repentance after that for whom He wills; and Allah is Forgiving and Merciful\"},{\"a\":28,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِنَّمَا\",\"ٱلۡمُشۡرِكُونَ\",\"نَجَسٞ\",\"فَلَا\",\"يَقۡرَبُواْ\",\"ٱلۡمَسۡجِدَ\",\"ٱلۡحَرَامَ\",\"بَعۡدَ\",\"عَامِهِمۡ\",\"هَٰذَاۚ\",\"وَإِنۡ\",\"خِفۡتُمۡ\",\"عَيۡلَةٗ\",\"فَسَوۡفَ\",\"يُغۡنِيكُمُ\",\"ٱللَّهُ\",\"مِن\",\"فَضۡلِهِۦٓ\",\"إِن\",\"شَآءَۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"عَلِيمٌ\",\"حَكِيمٞ\"],\"t\":\"O you who have believed, indeed the polytheists are unclean, so let them not approach al-Masjid al-Haram after this, their [final] year. And if you fear privation, Allah will enrich you from His bounty if He wills. Indeed, Allah is Knowing and Wise\"},{\"a\":29,\"w\":[\"قَٰتِلُواْ\",\"ٱلَّذِينَ\",\"لَا\",\"يُؤۡمِنُونَ\",\"بِٱللَّهِ\",\"وَلَا\",\"بِٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"وَلَا\",\"يُحَرِّمُونَ\",\"مَا\",\"حَرَّمَ\",\"ٱللَّهُ\",\"وَرَسُولُهُۥ\",\"وَلَا\",\"يَدِينُونَ\",\"دِينَ\",\"ٱلۡحَقِّ\",\"مِنَ\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"حَتَّىٰ\",\"يُعۡطُواْ\",\"ٱلۡجِزۡيَةَ\",\"عَن\",\"يَدٖ\",\"وَهُمۡ\",\"صَٰغِرُونَ\"],\"t\":\"Fight those who do not believe in Allah or in the Last Day and who do not consider unlawful what Allah and His Messenger have made unlawful and who do not adopt the religion of truth from those who were given the Scripture - [fight] until they give the jizyah willingly while they are humbled\"},{\"a\":30,\"w\":[\"وَقَالَتِ\",\"ٱلۡيَهُودُ\",\"عُزَيۡرٌ\",\"ٱبۡنُ\",\"ٱللَّهِ\",\"وَقَالَتِ\",\"ٱلنَّصَٰرَى\",\"ٱلۡمَسِيحُ\",\"ٱبۡنُ\",\"ٱللَّهِۖ\",\"ذَٰلِكَ\",\"قَوۡلُهُم\",\"بِأَفۡوَٰهِهِمۡۖ\",\"يُضَٰهِـُٔونَ\",\"قَوۡلَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"مِن\",\"قَبۡلُۚ\",\"قَٰتَلَهُمُ\",\"ٱللَّهُۖ\",\"أَنَّىٰ\",\"يُؤۡفَكُونَ\"],\"t\":\"The Jews say, \\\"Ezra is the son of Allah \\\"; and the Christians say, \\\"The Messiah is the son of Allah.\\\" That is their statement from their mouths; they imitate the saying of those who disbelieved [before them]. May Allah destroy them; how are they deluded\"},{\"a\":31,\"w\":[\"ٱتَّخَذُوٓاْ\",\"أَحۡبَارَهُمۡ\",\"وَرُهۡبَٰنَهُمۡ\",\"أَرۡبَابٗا\",\"مِّن\",\"دُونِ\",\"ٱللَّهِ\",\"وَٱلۡمَسِيحَ\",\"ٱبۡنَ\",\"مَرۡيَمَ\",\"وَمَآ\",\"أُمِرُوٓاْ\",\"إِلَّا\",\"لِيَعۡبُدُوٓاْ\",\"إِلَٰهٗا\",\"وَٰحِدٗاۖ\",\"لَّآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَۚ\",\"سُبۡحَٰنَهُۥ\",\"عَمَّا\",\"يُشۡرِكُونَ\"],\"t\":\"They have taken their scholars and monks as lords besides Allah, and [also] the Messiah, the son of Mary. And they were not commanded except to worship one God; there is no deity except Him. Exalted is He above whatever they associate with Him\"},{\"a\":32,\"w\":[\"يُرِيدُونَ\",\"أَن\",\"يُطۡفِـُٔواْ\",\"نُورَ\",\"ٱللَّهِ\",\"بِأَفۡوَٰهِهِمۡ\",\"وَيَأۡبَى\",\"ٱللَّهُ\",\"إِلَّآ\",\"أَن\",\"يُتِمَّ\",\"نُورَهُۥ\",\"وَلَوۡ\",\"كَرِهَ\",\"ٱلۡكَٰفِرُونَ\"],\"t\":\"They want to extinguish the light of Allah with their mouths, but Allah refuses except to perfect His light, although the disbelievers dislike it\"},{\"a\":33,\"w\":[\"هُوَ\",\"ٱلَّذِيٓ\",\"أَرۡسَلَ\",\"رَسُولَهُۥ\",\"بِٱلۡهُدَىٰ\",\"وَدِينِ\",\"ٱلۡحَقِّ\",\"لِيُظۡهِرَهُۥ\",\"عَلَى\",\"ٱلدِّينِ\",\"كُلِّهِۦ\",\"وَلَوۡ\",\"كَرِهَ\",\"ٱلۡمُشۡرِكُونَ\"],\"t\":\"It is He who has sent His Messenger with guidance and the religion of truth to manifest it over all religion, although they who associate others with Allah dislike it\"},{\"a\":34,\"w\":[\"۞يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِنَّ\",\"كَثِيرٗا\",\"مِّنَ\",\"ٱلۡأَحۡبَارِ\",\"وَٱلرُّهۡبَانِ\",\"لَيَأۡكُلُونَ\",\"أَمۡوَٰلَ\",\"ٱلنَّاسِ\",\"بِٱلۡبَٰطِلِ\",\"وَيَصُدُّونَ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِۗ\",\"وَٱلَّذِينَ\",\"يَكۡنِزُونَ\",\"ٱلذَّهَبَ\",\"وَٱلۡفِضَّةَ\",\"وَلَا\",\"يُنفِقُونَهَا\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"فَبَشِّرۡهُم\",\"بِعَذَابٍ\",\"أَلِيمٖ\"],\"t\":\"O you who have believed, indeed many of the scholars and the monks devour the wealth of people unjustly and avert [them] from the way of Allah. And those who hoard gold and silver and spend it not in the way of Allah - give them tidings of a painful punishment\"},{\"a\":35,\"w\":[\"يَوۡمَ\",\"يُحۡمَىٰ\",\"عَلَيۡهَا\",\"فِي\",\"نَارِ\",\"جَهَنَّمَ\",\"فَتُكۡوَىٰ\",\"بِهَا\",\"جِبَاهُهُمۡ\",\"وَجُنُوبُهُمۡ\",\"وَظُهُورُهُمۡۖ\",\"هَٰذَا\",\"مَا\",\"كَنَزۡتُمۡ\",\"لِأَنفُسِكُمۡ\",\"فَذُوقُواْ\",\"مَا\",\"كُنتُمۡ\",\"تَكۡنِزُونَ\"],\"t\":\"The Day when it will be heated in the fire of Hell and seared therewith will be their foreheads, their flanks, and their backs, [it will be said], \\\"This is what you hoarded for yourselves, so taste what you used to hoard\"},{\"a\":36,\"w\":[\"إِنَّ\",\"عِدَّةَ\",\"ٱلشُّهُورِ\",\"عِندَ\",\"ٱللَّهِ\",\"ٱثۡنَا\",\"عَشَرَ\",\"شَهۡرٗا\",\"فِي\",\"كِتَٰبِ\",\"ٱللَّهِ\",\"يَوۡمَ\",\"خَلَقَ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضَ\",\"مِنۡهَآ\",\"أَرۡبَعَةٌ\",\"حُرُمٞۚ\",\"ذَٰلِكَ\",\"ٱلدِّينُ\",\"ٱلۡقَيِّمُۚ\",\"فَلَا\",\"تَظۡلِمُواْ\",\"فِيهِنَّ\",\"أَنفُسَكُمۡۚ\",\"وَقَٰتِلُواْ\",\"ٱلۡمُشۡرِكِينَ\",\"كَآفَّةٗ\",\"كَمَا\",\"يُقَٰتِلُونَكُمۡ\",\"كَآفَّةٗۚ\",\"وَٱعۡلَمُوٓاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"مَعَ\",\"ٱلۡمُتَّقِينَ\"],\"t\":\"Indeed, the number of months with Allah is twelve [lunar] months in the register of Allah [from] the day He created the heavens and the earth; of these, four are sacred. That is the correct religion, so do not wrong yourselves during them. And fight against the disbelievers collectively as they fight against you collectively. And know that Allah is with the righteous [who fear Him]\"},{\"a\":37,\"w\":[\"إِنَّمَا\",\"ٱلنَّسِيٓءُ\",\"زِيَادَةٞ\",\"فِي\",\"ٱلۡكُفۡرِۖ\",\"يُضَلُّ\",\"بِهِ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"يُحِلُّونَهُۥ\",\"عَامٗا\",\"وَيُحَرِّمُونَهُۥ\",\"عَامٗا\",\"لِّيُوَاطِـُٔواْ\",\"عِدَّةَ\",\"مَا\",\"حَرَّمَ\",\"ٱللَّهُ\",\"فَيُحِلُّواْ\",\"مَا\",\"حَرَّمَ\",\"ٱللَّهُۚ\",\"زُيِّنَ\",\"لَهُمۡ\",\"سُوٓءُ\",\"أَعۡمَٰلِهِمۡۗ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلۡكَٰفِرِينَ\"],\"t\":\"Indeed, the postponing [of restriction within sacred months] is an increase in disbelief by which those who have disbelieved are led [further] astray. They make it lawful one year and unlawful another year to correspond to the number made unlawful by Allah and [thus] make lawful what Allah has made unlawful. Made pleasing to them is the evil of their deeds; and Allah does not guide the disbelieving people\"},{\"a\":38,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"مَا\",\"لَكُمۡ\",\"إِذَا\",\"قِيلَ\",\"لَكُمُ\",\"ٱنفِرُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"ٱثَّاقَلۡتُمۡ\",\"إِلَى\",\"ٱلۡأَرۡضِۚ\",\"أَرَضِيتُم\",\"بِٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَا\",\"مِنَ\",\"ٱلۡأٓخِرَةِۚ\",\"فَمَا\",\"مَتَٰعُ\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَا\",\"فِي\",\"ٱلۡأٓخِرَةِ\",\"إِلَّا\",\"قَلِيلٌ\"],\"t\":\"O you who have believed, what is [the matter] with you that, when you are told to go forth in the cause of Allah, you adhere heavily to the earth? Are you satisfied with the life of this world rather than the Hereafter? But what is the enjoyment of worldly life compared to the Hereafter except a [very] little\"},{\"a\":39,\"w\":[\"إِلَّا\",\"تَنفِرُواْ\",\"يُعَذِّبۡكُمۡ\",\"عَذَابًا\",\"أَلِيمٗا\",\"وَيَسۡتَبۡدِلۡ\",\"قَوۡمًا\",\"غَيۡرَكُمۡ\",\"وَلَا\",\"تَضُرُّوهُ\",\"شَيۡـٔٗاۗ\",\"وَٱللَّهُ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٌ\"],\"t\":\"If you do not go forth, He will punish you with a painful punishment and will replace you with another people, and you will not harm Him at all. And Allah is over all things competent\"},{\"a\":40,\"w\":[\"إِلَّا\",\"تَنصُرُوهُ\",\"فَقَدۡ\",\"نَصَرَهُ\",\"ٱللَّهُ\",\"إِذۡ\",\"أَخۡرَجَهُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"ثَانِيَ\",\"ٱثۡنَيۡنِ\",\"إِذۡ\",\"هُمَا\",\"فِي\",\"ٱلۡغَارِ\",\"إِذۡ\",\"يَقُولُ\",\"لِصَٰحِبِهِۦ\",\"لَا\",\"تَحۡزَنۡ\",\"إِنَّ\",\"ٱللَّهَ\",\"مَعَنَاۖ\",\"فَأَنزَلَ\",\"ٱللَّهُ\",\"سَكِينَتَهُۥ\",\"عَلَيۡهِ\",\"وَأَيَّدَهُۥ\",\"بِجُنُودٖ\",\"لَّمۡ\",\"تَرَوۡهَا\",\"وَجَعَلَ\",\"كَلِمَةَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"ٱلسُّفۡلَىٰۗ\",\"وَكَلِمَةُ\",\"ٱللَّهِ\",\"هِيَ\",\"ٱلۡعُلۡيَاۗ\",\"وَٱللَّهُ\",\"عَزِيزٌ\",\"حَكِيمٌ\"],\"t\":\"If you do not aid the Prophet - Allah has already aided him when those who disbelieved had driven him out [of Makkah] as one of two, when they were in the cave and he said to his companion, \\\"Do not grieve; indeed Allah is with us.\\\" And Allah sent down his tranquillity upon him and supported him with angels you did not see and made the word of those who disbelieved the lowest, while the word of Allah - that is the highest. And Allah is Exalted in Might and Wise\"},{\"a\":41,\"w\":[\"ٱنفِرُواْ\",\"خِفَافٗا\",\"وَثِقَالٗا\",\"وَجَٰهِدُواْ\",\"بِأَمۡوَٰلِكُمۡ\",\"وَأَنفُسِكُمۡ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِۚ\",\"ذَٰلِكُمۡ\",\"خَيۡرٞ\",\"لَّكُمۡ\",\"إِن\",\"كُنتُمۡ\",\"تَعۡلَمُونَ\"],\"t\":\"Go forth, whether light or heavy, and strive with your wealth and your lives in the cause of Allah. That is better for you, if you only knew\"},{\"a\":42,\"w\":[\"لَوۡ\",\"كَانَ\",\"عَرَضٗا\",\"قَرِيبٗا\",\"وَسَفَرٗا\",\"قَاصِدٗا\",\"لَّٱتَّبَعُوكَ\",\"وَلَٰكِنۢ\",\"بَعُدَتۡ\",\"عَلَيۡهِمُ\",\"ٱلشُّقَّةُۚ\",\"وَسَيَحۡلِفُونَ\",\"بِٱللَّهِ\",\"لَوِ\",\"ٱسۡتَطَعۡنَا\",\"لَخَرَجۡنَا\",\"مَعَكُمۡ\",\"يُهۡلِكُونَ\",\"أَنفُسَهُمۡ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"إِنَّهُمۡ\",\"لَكَٰذِبُونَ\"],\"t\":\"Had it been an easy gain and a moderate trip, the hypocrites would have followed you, but distant to them was the journey. And they will swear by Allah, \\\"If we were able, we would have gone forth with you,\\\" destroying themselves [through false oaths], and Allah knows that indeed they are liars\"},{\"a\":43,\"w\":[\"عَفَا\",\"ٱللَّهُ\",\"عَنكَ\",\"لِمَ\",\"أَذِنتَ\",\"لَهُمۡ\",\"حَتَّىٰ\",\"يَتَبَيَّنَ\",\"لَكَ\",\"ٱلَّذِينَ\",\"صَدَقُواْ\",\"وَتَعۡلَمَ\",\"ٱلۡكَٰذِبِينَ\"],\"t\":\"May Allah pardon you, [O Muhammad]; why did you give them permission [to remain behind]? [You should not have] until it was evident to you who were truthful and you knew [who were] the liars\"},{\"a\":44,\"w\":[\"لَا\",\"يَسۡتَـٔۡذِنُكَ\",\"ٱلَّذِينَ\",\"يُؤۡمِنُونَ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"أَن\",\"يُجَٰهِدُواْ\",\"بِأَمۡوَٰلِهِمۡ\",\"وَأَنفُسِهِمۡۗ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِٱلۡمُتَّقِينَ\"],\"t\":\"Those who believe in Allah and the Last Day would not ask permission of you to be excused from striving with their wealth and their lives. And Allah is Knowing of those who fear Him\"},{\"a\":45,\"w\":[\"إِنَّمَا\",\"يَسۡتَـٔۡذِنُكَ\",\"ٱلَّذِينَ\",\"لَا\",\"يُؤۡمِنُونَ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"وَٱرۡتَابَتۡ\",\"قُلُوبُهُمۡ\",\"فَهُمۡ\",\"فِي\",\"رَيۡبِهِمۡ\",\"يَتَرَدَّدُونَ\"],\"t\":\"Only those would ask permission of you who do not believe in Allah and the Last Day and whose hearts have doubted, and they, in their doubt, are hesitating\"},{\"a\":46,\"w\":[\"۞وَلَوۡ\",\"أَرَادُواْ\",\"ٱلۡخُرُوجَ\",\"لَأَعَدُّواْ\",\"لَهُۥ\",\"عُدَّةٗ\",\"وَلَٰكِن\",\"كَرِهَ\",\"ٱللَّهُ\",\"ٱنۢبِعَاثَهُمۡ\",\"فَثَبَّطَهُمۡ\",\"وَقِيلَ\",\"ٱقۡعُدُواْ\",\"مَعَ\",\"ٱلۡقَٰعِدِينَ\"],\"t\":\"And if they had intended to go forth, they would have prepared for it [some] preparation. But Allah disliked their being sent, so He kept them back, and they were told, \\\"Remain [behind] with those who remain\"},{\"a\":47,\"w\":[\"لَوۡ\",\"خَرَجُواْ\",\"فِيكُم\",\"مَّا\",\"زَادُوكُمۡ\",\"إِلَّا\",\"خَبَالٗا\",\"وَلَأَوۡضَعُواْ\",\"خِلَٰلَكُمۡ\",\"يَبۡغُونَكُمُ\",\"ٱلۡفِتۡنَةَ\",\"وَفِيكُمۡ\",\"سَمَّـٰعُونَ\",\"لَهُمۡۗ\",\"وَٱللَّهُ\",\"عَلِيمُۢ\",\"بِٱلظَّـٰلِمِينَ\"],\"t\":\"Had they gone forth with you, they would not have increased you except in confusion, and they would have been active among you, seeking [to cause] you fitnah. And among you are avid listeners to them. And Allah is Knowing of the wrongdoers\"},{\"a\":48,\"w\":[\"لَقَدِ\",\"ٱبۡتَغَوُاْ\",\"ٱلۡفِتۡنَةَ\",\"مِن\",\"قَبۡلُ\",\"وَقَلَّبُواْ\",\"لَكَ\",\"ٱلۡأُمُورَ\",\"حَتَّىٰ\",\"جَآءَ\",\"ٱلۡحَقُّ\",\"وَظَهَرَ\",\"أَمۡرُ\",\"ٱللَّهِ\",\"وَهُمۡ\",\"كَٰرِهُونَ\"],\"t\":\"They had already desired dissension before and had upset matters for you until the truth came and the ordinance of Allah appeared, while they were averse\"},{\"a\":49,\"w\":[\"وَمِنۡهُم\",\"مَّن\",\"يَقُولُ\",\"ٱئۡذَن\",\"لِّي\",\"وَلَا\",\"تَفۡتِنِّيٓۚ\",\"أَلَا\",\"فِي\",\"ٱلۡفِتۡنَةِ\",\"سَقَطُواْۗ\",\"وَإِنَّ\",\"جَهَنَّمَ\",\"لَمُحِيطَةُۢ\",\"بِٱلۡكَٰفِرِينَ\"],\"t\":\"And among them is he who says, \\\"Permit me [to remain at home] and do not put me to trial.\\\" Unquestionably, into trial they have fallen. And indeed, Hell will encompass the disbelievers\"},{\"a\":50,\"w\":[\"إِن\",\"تُصِبۡكَ\",\"حَسَنَةٞ\",\"تَسُؤۡهُمۡۖ\",\"وَإِن\",\"تُصِبۡكَ\",\"مُصِيبَةٞ\",\"يَقُولُواْ\",\"قَدۡ\",\"أَخَذۡنَآ\",\"أَمۡرَنَا\",\"مِن\",\"قَبۡلُ\",\"وَيَتَوَلَّواْ\",\"وَّهُمۡ\",\"فَرِحُونَ\"],\"t\":\"If good befalls you, it distresses them; but if disaster strikes you, they say, \\\"We took our matter [in hand] before,\\\" and turn away while they are rejoicing\"},{\"a\":51,\"w\":[\"قُل\",\"لَّن\",\"يُصِيبَنَآ\",\"إِلَّا\",\"مَا\",\"كَتَبَ\",\"ٱللَّهُ\",\"لَنَا\",\"هُوَ\",\"مَوۡلَىٰنَاۚ\",\"وَعَلَى\",\"ٱللَّهِ\",\"فَلۡيَتَوَكَّلِ\",\"ٱلۡمُؤۡمِنُونَ\"],\"t\":\"Say, \\\"Never will we be struck except by what Allah has decreed for us; He is our protector.\\\" And upon Allah let the believers rely\"},{\"a\":52,\"w\":[\"قُلۡ\",\"هَلۡ\",\"تَرَبَّصُونَ\",\"بِنَآ\",\"إِلَّآ\",\"إِحۡدَى\",\"ٱلۡحُسۡنَيَيۡنِۖ\",\"وَنَحۡنُ\",\"نَتَرَبَّصُ\",\"بِكُمۡ\",\"أَن\",\"يُصِيبَكُمُ\",\"ٱللَّهُ\",\"بِعَذَابٖ\",\"مِّنۡ\",\"عِندِهِۦٓ\",\"أَوۡ\",\"بِأَيۡدِينَاۖ\",\"فَتَرَبَّصُوٓاْ\",\"إِنَّا\",\"مَعَكُم\",\"مُّتَرَبِّصُونَ\"],\"t\":\"Say, \\\"Do you await for us except one of the two best things while we await for you that Allah will afflict you with punishment from Himself or at our hands? So wait; indeed we, along with you, are waiting\"},{\"a\":53,\"w\":[\"قُلۡ\",\"أَنفِقُواْ\",\"طَوۡعًا\",\"أَوۡ\",\"كَرۡهٗا\",\"لَّن\",\"يُتَقَبَّلَ\",\"مِنكُمۡ\",\"إِنَّكُمۡ\",\"كُنتُمۡ\",\"قَوۡمٗا\",\"فَٰسِقِينَ\"],\"t\":\"Say, \\\"Spend willingly or unwillingly; never will it be accepted from you. Indeed, you have been a defiantly disobedient people\"},{\"a\":54,\"w\":[\"وَمَا\",\"مَنَعَهُمۡ\",\"أَن\",\"تُقۡبَلَ\",\"مِنۡهُمۡ\",\"نَفَقَٰتُهُمۡ\",\"إِلَّآ\",\"أَنَّهُمۡ\",\"كَفَرُواْ\",\"بِٱللَّهِ\",\"وَبِرَسُولِهِۦ\",\"وَلَا\",\"يَأۡتُونَ\",\"ٱلصَّلَوٰةَ\",\"إِلَّا\",\"وَهُمۡ\",\"كُسَالَىٰ\",\"وَلَا\",\"يُنفِقُونَ\",\"إِلَّا\",\"وَهُمۡ\",\"كَٰرِهُونَ\"],\"t\":\"And what prevents their expenditures from being accepted from them but that they have disbelieved in Allah and in His Messenger and that they come not to prayer except while they are lazy and that they do not spend except while they are unwilling\"},{\"a\":55,\"w\":[\"فَلَا\",\"تُعۡجِبۡكَ\",\"أَمۡوَٰلُهُمۡ\",\"وَلَآ\",\"أَوۡلَٰدُهُمۡۚ\",\"إِنَّمَا\",\"يُرِيدُ\",\"ٱللَّهُ\",\"لِيُعَذِّبَهُم\",\"بِهَا\",\"فِي\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَا\",\"وَتَزۡهَقَ\",\"أَنفُسُهُمۡ\",\"وَهُمۡ\",\"كَٰفِرُونَ\"],\"t\":\"So let not their wealth or their children impress you. Allah only intends to punish them through them in worldly life and that their souls should depart [at death] while they are disbelievers\"},{\"a\":56,\"w\":[\"وَيَحۡلِفُونَ\",\"بِٱللَّهِ\",\"إِنَّهُمۡ\",\"لَمِنكُمۡ\",\"وَمَا\",\"هُم\",\"مِّنكُمۡ\",\"وَلَٰكِنَّهُمۡ\",\"قَوۡمٞ\",\"يَفۡرَقُونَ\"],\"t\":\"And they swear by Allah that they are from among you while they are not from among you; but they are a people who are afraid\"},{\"a\":57,\"w\":[\"لَوۡ\",\"يَجِدُونَ\",\"مَلۡجَـًٔا\",\"أَوۡ\",\"مَغَٰرَٰتٍ\",\"أَوۡ\",\"مُدَّخَلٗا\",\"لَّوَلَّوۡاْ\",\"إِلَيۡهِ\",\"وَهُمۡ\",\"يَجۡمَحُونَ\"],\"t\":\"If they could find a refuge or some caves or any place to enter [and hide], they would turn to it while they run heedlessly\"},{\"a\":58,\"w\":[\"وَمِنۡهُم\",\"مَّن\",\"يَلۡمِزُكَ\",\"فِي\",\"ٱلصَّدَقَٰتِ\",\"فَإِنۡ\",\"أُعۡطُواْ\",\"مِنۡهَا\",\"رَضُواْ\",\"وَإِن\",\"لَّمۡ\",\"يُعۡطَوۡاْ\",\"مِنۡهَآ\",\"إِذَا\",\"هُمۡ\",\"يَسۡخَطُونَ\"],\"t\":\"And among them are some who criticize you concerning the [distribution of] charities. If they are given from them, they approve; but if they are not given from them, at once they become angry\"},{\"a\":59,\"w\":[\"وَلَوۡ\",\"أَنَّهُمۡ\",\"رَضُواْ\",\"مَآ\",\"ءَاتَىٰهُمُ\",\"ٱللَّهُ\",\"وَرَسُولُهُۥ\",\"وَقَالُواْ\",\"حَسۡبُنَا\",\"ٱللَّهُ\",\"سَيُؤۡتِينَا\",\"ٱللَّهُ\",\"مِن\",\"فَضۡلِهِۦ\",\"وَرَسُولُهُۥٓ\",\"إِنَّآ\",\"إِلَى\",\"ٱللَّهِ\",\"رَٰغِبُونَ\"],\"t\":\"If only they had been satisfied with what Allah and His Messenger gave them and said, \\\"Sufficient for us is Allah; Allah will give us of His bounty, and [so will] His Messenger; indeed, we are desirous toward Allah,\\\" [it would have been better for them]\"},{\"a\":60,\"w\":[\"۞إِنَّمَا\",\"ٱلصَّدَقَٰتُ\",\"لِلۡفُقَرَآءِ\",\"وَٱلۡمَسَٰكِينِ\",\"وَٱلۡعَٰمِلِينَ\",\"عَلَيۡهَا\",\"وَٱلۡمُؤَلَّفَةِ\",\"قُلُوبُهُمۡ\",\"وَفِي\",\"ٱلرِّقَابِ\",\"وَٱلۡغَٰرِمِينَ\",\"وَفِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَٱبۡنِ\",\"ٱلسَّبِيلِۖ\",\"فَرِيضَةٗ\",\"مِّنَ\",\"ٱللَّهِۗ\",\"وَٱللَّهُ\",\"عَلِيمٌ\",\"حَكِيمٞ\"],\"t\":\"Zakah expenditures are only for the poor and for the needy and for those employed to collect [zakah] and for bringing hearts together [for Islam] and for freeing captives [or slaves] and for those in debt and for the cause of Allah and for the [stranded] traveler - an obligation [imposed] by Allah. And Allah is Knowing and Wise\"},{\"a\":61,\"w\":[\"وَمِنۡهُمُ\",\"ٱلَّذِينَ\",\"يُؤۡذُونَ\",\"ٱلنَّبِيَّ\",\"وَيَقُولُونَ\",\"هُوَ\",\"أُذُنٞۚ\",\"قُلۡ\",\"أُذُنُ\",\"خَيۡرٖ\",\"لَّكُمۡ\",\"يُؤۡمِنُ\",\"بِٱللَّهِ\",\"وَيُؤۡمِنُ\",\"لِلۡمُؤۡمِنِينَ\",\"وَرَحۡمَةٞ\",\"لِّلَّذِينَ\",\"ءَامَنُواْ\",\"مِنكُمۡۚ\",\"وَٱلَّذِينَ\",\"يُؤۡذُونَ\",\"رَسُولَ\",\"ٱللَّهِ\",\"لَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"And among them are those who abuse the Prophet and say, \\\"He is an ear.\\\" Say, \\\"[It is] an ear of goodness for you that believes in Allah and believes the believers and [is] a mercy to those who believe among you.\\\" And those who abuse the Messenger of Allah - for them is a painful punishment\"},{\"a\":62,\"w\":[\"يَحۡلِفُونَ\",\"بِٱللَّهِ\",\"لَكُمۡ\",\"لِيُرۡضُوكُمۡ\",\"وَٱللَّهُ\",\"وَرَسُولُهُۥٓ\",\"أَحَقُّ\",\"أَن\",\"يُرۡضُوهُ\",\"إِن\",\"كَانُواْ\",\"مُؤۡمِنِينَ\"],\"t\":\"They swear by Allah to you [Muslims] to satisfy you. But Allah and His Messenger are more worthy for them to satisfy, if they should be believers\"},{\"a\":63,\"w\":[\"أَلَمۡ\",\"يَعۡلَمُوٓاْ\",\"أَنَّهُۥ\",\"مَن\",\"يُحَادِدِ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥ\",\"فَأَنَّ\",\"لَهُۥ\",\"نَارَ\",\"جَهَنَّمَ\",\"خَٰلِدٗا\",\"فِيهَاۚ\",\"ذَٰلِكَ\",\"ٱلۡخِزۡيُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"Do they not know that whoever opposes Allah and His Messenger - that for him is the fire of Hell, wherein he will abide eternally? That is the great disgrace\"},{\"a\":64,\"w\":[\"يَحۡذَرُ\",\"ٱلۡمُنَٰفِقُونَ\",\"أَن\",\"تُنَزَّلَ\",\"عَلَيۡهِمۡ\",\"سُورَةٞ\",\"تُنَبِّئُهُم\",\"بِمَا\",\"فِي\",\"قُلُوبِهِمۡۚ\",\"قُلِ\",\"ٱسۡتَهۡزِءُوٓاْ\",\"إِنَّ\",\"ٱللَّهَ\",\"مُخۡرِجٞ\",\"مَّا\",\"تَحۡذَرُونَ\"],\"t\":\"They hypocrites are apprehensive lest a surah be revealed about them, informing them of what is in their hearts. Say, \\\"Mock [as you wish]; indeed, Allah will expose that which you fear\"},{\"a\":65,\"w\":[\"وَلَئِن\",\"سَأَلۡتَهُمۡ\",\"لَيَقُولُنَّ\",\"إِنَّمَا\",\"كُنَّا\",\"نَخُوضُ\",\"وَنَلۡعَبُۚ\",\"قُلۡ\",\"أَبِٱللَّهِ\",\"وَءَايَٰتِهِۦ\",\"وَرَسُولِهِۦ\",\"كُنتُمۡ\",\"تَسۡتَهۡزِءُونَ\"],\"t\":\"And if you ask them, they will surely say, \\\"We were only conversing and playing.\\\" Say, \\\"Is it Allah and His verses and His Messenger that you were mocking\"},{\"a\":66,\"w\":[\"لَا\",\"تَعۡتَذِرُواْ\",\"قَدۡ\",\"كَفَرۡتُم\",\"بَعۡدَ\",\"إِيمَٰنِكُمۡۚ\",\"إِن\",\"نَّعۡفُ\",\"عَن\",\"طَآئِفَةٖ\",\"مِّنكُمۡ\",\"نُعَذِّبۡ\",\"طَآئِفَةَۢ\",\"بِأَنَّهُمۡ\",\"كَانُواْ\",\"مُجۡرِمِينَ\"],\"t\":\"Make no excuse; you have disbelieved after your belief. If We pardon one faction of you - We will punish another faction because they were criminals\"},{\"a\":67,\"w\":[\"ٱلۡمُنَٰفِقُونَ\",\"وَٱلۡمُنَٰفِقَٰتُ\",\"بَعۡضُهُم\",\"مِّنۢ\",\"بَعۡضٖۚ\",\"يَأۡمُرُونَ\",\"بِٱلۡمُنكَرِ\",\"وَيَنۡهَوۡنَ\",\"عَنِ\",\"ٱلۡمَعۡرُوفِ\",\"وَيَقۡبِضُونَ\",\"أَيۡدِيَهُمۡۚ\",\"نَسُواْ\",\"ٱللَّهَ\",\"فَنَسِيَهُمۡۚ\",\"إِنَّ\",\"ٱلۡمُنَٰفِقِينَ\",\"هُمُ\",\"ٱلۡفَٰسِقُونَ\"],\"t\":\"The hypocrite men and hypocrite women are of one another. They enjoin what is wrong and forbid what is right and close their hands. They have forgotten Allah, so He has forgotten them [accordingly]. Indeed, the hypocrites - it is they who are the defiantly disobedient\"},{\"a\":68,\"w\":[\"وَعَدَ\",\"ٱللَّهُ\",\"ٱلۡمُنَٰفِقِينَ\",\"وَٱلۡمُنَٰفِقَٰتِ\",\"وَٱلۡكُفَّارَ\",\"نَارَ\",\"جَهَنَّمَ\",\"خَٰلِدِينَ\",\"فِيهَاۚ\",\"هِيَ\",\"حَسۡبُهُمۡۚ\",\"وَلَعَنَهُمُ\",\"ٱللَّهُۖ\",\"وَلَهُمۡ\",\"عَذَابٞ\",\"مُّقِيمٞ\"],\"t\":\"Allah has promised the hypocrite men and hypocrite women and the disbelievers the fire of Hell, wherein they will abide eternally. It is sufficient for them. And Allah has cursed them, and for them is an enduring punishment\"},{\"a\":69,\"w\":[\"كَٱلَّذِينَ\",\"مِن\",\"قَبۡلِكُمۡ\",\"كَانُوٓاْ\",\"أَشَدَّ\",\"مِنكُمۡ\",\"قُوَّةٗ\",\"وَأَكۡثَرَ\",\"أَمۡوَٰلٗا\",\"وَأَوۡلَٰدٗا\",\"فَٱسۡتَمۡتَعُواْ\",\"بِخَلَٰقِهِمۡ\",\"فَٱسۡتَمۡتَعۡتُم\",\"بِخَلَٰقِكُمۡ\",\"كَمَا\",\"ٱسۡتَمۡتَعَ\",\"ٱلَّذِينَ\",\"مِن\",\"قَبۡلِكُم\",\"بِخَلَٰقِهِمۡ\",\"وَخُضۡتُمۡ\",\"كَٱلَّذِي\",\"خَاضُوٓاْۚ\",\"أُوْلَـٰٓئِكَ\",\"حَبِطَتۡ\",\"أَعۡمَٰلُهُمۡ\",\"فِي\",\"ٱلدُّنۡيَا\",\"وَٱلۡأٓخِرَةِۖ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡخَٰسِرُونَ\"],\"t\":\"[You disbelievers are] like those before you; they were stronger than you in power and more abundant in wealth and children. They enjoyed their portion [of worldly enjoyment], and you have enjoyed your portion as those before you enjoyed their portion, and you have engaged [in vanities] like that in which they engaged. [It is] those whose deeds have become worthless in this world and in the Hereafter, and it is they who are the losers\"},{\"a\":70,\"w\":[\"أَلَمۡ\",\"يَأۡتِهِمۡ\",\"نَبَأُ\",\"ٱلَّذِينَ\",\"مِن\",\"قَبۡلِهِمۡ\",\"قَوۡمِ\",\"نُوحٖ\",\"وَعَادٖ\",\"وَثَمُودَ\",\"وَقَوۡمِ\",\"إِبۡرَٰهِيمَ\",\"وَأَصۡحَٰبِ\",\"مَدۡيَنَ\",\"وَٱلۡمُؤۡتَفِكَٰتِۚ\",\"أَتَتۡهُمۡ\",\"رُسُلُهُم\",\"بِٱلۡبَيِّنَٰتِۖ\",\"فَمَا\",\"كَانَ\",\"ٱللَّهُ\",\"لِيَظۡلِمَهُمۡ\",\"وَلَٰكِن\",\"كَانُوٓاْ\",\"أَنفُسَهُمۡ\",\"يَظۡلِمُونَ\"],\"t\":\"Has there not reached them the news of those before them - the people of Noah and [the tribes of] 'Aad and Thamud and the people of Abraham and the companions of Madyan and the towns overturned? Their messengers came to them with clear proofs. And Allah would never have wronged them, but they were wronging themselves\"},{\"a\":71,\"w\":[\"وَٱلۡمُؤۡمِنُونَ\",\"وَٱلۡمُؤۡمِنَٰتُ\",\"بَعۡضُهُمۡ\",\"أَوۡلِيَآءُ\",\"بَعۡضٖۚ\",\"يَأۡمُرُونَ\",\"بِٱلۡمَعۡرُوفِ\",\"وَيَنۡهَوۡنَ\",\"عَنِ\",\"ٱلۡمُنكَرِ\",\"وَيُقِيمُونَ\",\"ٱلصَّلَوٰةَ\",\"وَيُؤۡتُونَ\",\"ٱلزَّكَوٰةَ\",\"وَيُطِيعُونَ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥٓۚ\",\"أُوْلَـٰٓئِكَ\",\"سَيَرۡحَمُهُمُ\",\"ٱللَّهُۗ\",\"إِنَّ\",\"ٱللَّهَ\",\"عَزِيزٌ\",\"حَكِيمٞ\"],\"t\":\"The believing men and believing women are allies of one another. They enjoin what is right and forbid what is wrong and establish prayer and give zakah and obey Allah and His Messenger. Those - Allah will have mercy upon them. Indeed, Allah is Exalted in Might and Wise\"},{\"a\":72,\"w\":[\"وَعَدَ\",\"ٱللَّهُ\",\"ٱلۡمُؤۡمِنِينَ\",\"وَٱلۡمُؤۡمِنَٰتِ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَا\",\"وَمَسَٰكِنَ\",\"طَيِّبَةٗ\",\"فِي\",\"جَنَّـٰتِ\",\"عَدۡنٖۚ\",\"وَرِضۡوَٰنٞ\",\"مِّنَ\",\"ٱللَّهِ\",\"أَكۡبَرُۚ\",\"ذَٰلِكَ\",\"هُوَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"Allah has promised the believing men and believing women gardens beneath which rivers flow, wherein they abide eternally, and pleasant dwellings in gardens of perpetual residence; but approval from Allah is greater. It is that which is the great attainment\"},{\"a\":73,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلنَّبِيُّ\",\"جَٰهِدِ\",\"ٱلۡكُفَّارَ\",\"وَٱلۡمُنَٰفِقِينَ\",\"وَٱغۡلُظۡ\",\"عَلَيۡهِمۡۚ\",\"وَمَأۡوَىٰهُمۡ\",\"جَهَنَّمُۖ\",\"وَبِئۡسَ\",\"ٱلۡمَصِيرُ\"],\"t\":\"O Prophet, fight against the disbelievers and the hypocrites and be harsh upon them. And their refuge is Hell, and wretched is the destination\"},{\"a\":74,\"w\":[\"يَحۡلِفُونَ\",\"بِٱللَّهِ\",\"مَا\",\"قَالُواْ\",\"وَلَقَدۡ\",\"قَالُواْ\",\"كَلِمَةَ\",\"ٱلۡكُفۡرِ\",\"وَكَفَرُواْ\",\"بَعۡدَ\",\"إِسۡلَٰمِهِمۡ\",\"وَهَمُّواْ\",\"بِمَا\",\"لَمۡ\",\"يَنَالُواْۚ\",\"وَمَا\",\"نَقَمُوٓاْ\",\"إِلَّآ\",\"أَنۡ\",\"أَغۡنَىٰهُمُ\",\"ٱللَّهُ\",\"وَرَسُولُهُۥ\",\"مِن\",\"فَضۡلِهِۦۚ\",\"فَإِن\",\"يَتُوبُواْ\",\"يَكُ\",\"خَيۡرٗا\",\"لَّهُمۡۖ\",\"وَإِن\",\"يَتَوَلَّوۡاْ\",\"يُعَذِّبۡهُمُ\",\"ٱللَّهُ\",\"عَذَابًا\",\"أَلِيمٗا\",\"فِي\",\"ٱلدُّنۡيَا\",\"وَٱلۡأٓخِرَةِۚ\",\"وَمَا\",\"لَهُمۡ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"مِن\",\"وَلِيّٖ\",\"وَلَا\",\"نَصِيرٖ\"],\"t\":\"They swear by Allah that they did not say [anything against the Prophet] while they had said the word of disbelief and disbelieved after their [pretense of] Islam and planned that which they were not to attain. And they were not resentful except [for the fact] that Allah and His Messenger had enriched them of His bounty. So if they repent, it is better for them; but if they turn away, Allah will punish them with a painful punishment in this world and the Hereafter. And there will not be for them on earth any protector or helper\"},{\"a\":75,\"w\":[\"۞وَمِنۡهُم\",\"مَّنۡ\",\"عَٰهَدَ\",\"ٱللَّهَ\",\"لَئِنۡ\",\"ءَاتَىٰنَا\",\"مِن\",\"فَضۡلِهِۦ\",\"لَنَصَّدَّقَنَّ\",\"وَلَنَكُونَنَّ\",\"مِنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"And among them are those who made a covenant with Allah, [saying], \\\"If He should give us from His bounty, we will surely spend in charity, and we will surely be among the righteous\"},{\"a\":76,\"w\":[\"فَلَمَّآ\",\"ءَاتَىٰهُم\",\"مِّن\",\"فَضۡلِهِۦ\",\"بَخِلُواْ\",\"بِهِۦ\",\"وَتَوَلَّواْ\",\"وَّهُم\",\"مُّعۡرِضُونَ\"],\"t\":\"But when he gave them from His bounty, they were stingy with it and turned away while they refused\"},{\"a\":77,\"w\":[\"فَأَعۡقَبَهُمۡ\",\"نِفَاقٗا\",\"فِي\",\"قُلُوبِهِمۡ\",\"إِلَىٰ\",\"يَوۡمِ\",\"يَلۡقَوۡنَهُۥ\",\"بِمَآ\",\"أَخۡلَفُواْ\",\"ٱللَّهَ\",\"مَا\",\"وَعَدُوهُ\",\"وَبِمَا\",\"كَانُواْ\",\"يَكۡذِبُونَ\"],\"t\":\"So He penalized them with hypocrisy in their hearts until the Day they will meet Him - because they failed Allah in what they promised Him and because they [habitually] used to lie\"},{\"a\":78,\"w\":[\"أَلَمۡ\",\"يَعۡلَمُوٓاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"يَعۡلَمُ\",\"سِرَّهُمۡ\",\"وَنَجۡوَىٰهُمۡ\",\"وَأَنَّ\",\"ٱللَّهَ\",\"عَلَّـٰمُ\",\"ٱلۡغُيُوبِ\"],\"t\":\"Did they not know that Allah knows their secrets and their private conversations and that Allah is the Knower of the unseen\"},{\"a\":79,\"w\":[\"ٱلَّذِينَ\",\"يَلۡمِزُونَ\",\"ٱلۡمُطَّوِّعِينَ\",\"مِنَ\",\"ٱلۡمُؤۡمِنِينَ\",\"فِي\",\"ٱلصَّدَقَٰتِ\",\"وَٱلَّذِينَ\",\"لَا\",\"يَجِدُونَ\",\"إِلَّا\",\"جُهۡدَهُمۡ\",\"فَيَسۡخَرُونَ\",\"مِنۡهُمۡ\",\"سَخِرَ\",\"ٱللَّهُ\",\"مِنۡهُمۡ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٌ\"],\"t\":\"Those who criticize the contributors among the believers concerning [their] charities and [criticize] the ones who find nothing [to spend] except their effort, so they ridicule them - Allah will ridicule them, and they will have a painful punishment\"},{\"a\":80,\"w\":[\"ٱسۡتَغۡفِرۡ\",\"لَهُمۡ\",\"أَوۡ\",\"لَا\",\"تَسۡتَغۡفِرۡ\",\"لَهُمۡ\",\"إِن\",\"تَسۡتَغۡفِرۡ\",\"لَهُمۡ\",\"سَبۡعِينَ\",\"مَرَّةٗ\",\"فَلَن\",\"يَغۡفِرَ\",\"ٱللَّهُ\",\"لَهُمۡۚ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"كَفَرُواْ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦۗ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلۡفَٰسِقِينَ\"],\"t\":\"Ask forgiveness for them, [O Muhammad], or do not ask forgiveness for them. If you should ask forgiveness for them seventy times - never will Allah forgive them. That is because they disbelieved in Allah and His Messenger, and Allah does not guide the defiantly disobedient people\"},{\"a\":81,\"w\":[\"فَرِحَ\",\"ٱلۡمُخَلَّفُونَ\",\"بِمَقۡعَدِهِمۡ\",\"خِلَٰفَ\",\"رَسُولِ\",\"ٱللَّهِ\",\"وَكَرِهُوٓاْ\",\"أَن\",\"يُجَٰهِدُواْ\",\"بِأَمۡوَٰلِهِمۡ\",\"وَأَنفُسِهِمۡ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَقَالُواْ\",\"لَا\",\"تَنفِرُواْ\",\"فِي\",\"ٱلۡحَرِّۗ\",\"قُلۡ\",\"نَارُ\",\"جَهَنَّمَ\",\"أَشَدُّ\",\"حَرّٗاۚ\",\"لَّوۡ\",\"كَانُواْ\",\"يَفۡقَهُونَ\"],\"t\":\"Those who remained behind rejoiced in their staying [at home] after [the departure of] the Messenger of Allah and disliked to strive with their wealth and their lives in the cause of Allah and said, \\\"Do not go forth in the heat.\\\" Say, \\\"The fire of Hell is more intensive in heat\\\" - if they would but understand\"},{\"a\":82,\"w\":[\"فَلۡيَضۡحَكُواْ\",\"قَلِيلٗا\",\"وَلۡيَبۡكُواْ\",\"كَثِيرٗا\",\"جَزَآءَۢ\",\"بِمَا\",\"كَانُواْ\",\"يَكۡسِبُونَ\"],\"t\":\"So let them laugh a little and [then] weep much as recompense for what they used to earn\"},{\"a\":83,\"w\":[\"فَإِن\",\"رَّجَعَكَ\",\"ٱللَّهُ\",\"إِلَىٰ\",\"طَآئِفَةٖ\",\"مِّنۡهُمۡ\",\"فَٱسۡتَـٔۡذَنُوكَ\",\"لِلۡخُرُوجِ\",\"فَقُل\",\"لَّن\",\"تَخۡرُجُواْ\",\"مَعِيَ\",\"أَبَدٗا\",\"وَلَن\",\"تُقَٰتِلُواْ\",\"مَعِيَ\",\"عَدُوًّاۖ\",\"إِنَّكُمۡ\",\"رَضِيتُم\",\"بِٱلۡقُعُودِ\",\"أَوَّلَ\",\"مَرَّةٖ\",\"فَٱقۡعُدُواْ\",\"مَعَ\",\"ٱلۡخَٰلِفِينَ\"],\"t\":\"If Allah should return you to a faction of them [after the expedition] and then they ask your permission to go out [to battle], say, \\\"You will not go out with me, ever, and you will never fight with me an enemy. Indeed, you were satisfied with sitting [at home] the first time, so sit [now] with those who stay behind\"},{\"a\":84,\"w\":[\"وَلَا\",\"تُصَلِّ\",\"عَلَىٰٓ\",\"أَحَدٖ\",\"مِّنۡهُم\",\"مَّاتَ\",\"أَبَدٗا\",\"وَلَا\",\"تَقُمۡ\",\"عَلَىٰ\",\"قَبۡرِهِۦٓۖ\",\"إِنَّهُمۡ\",\"كَفَرُواْ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦ\",\"وَمَاتُواْ\",\"وَهُمۡ\",\"فَٰسِقُونَ\"],\"t\":\"And do not pray [the funeral prayer, O Muhammad], over any of them who has died - ever - or stand at his grave. Indeed, they disbelieved in Allah and His Messenger and died while they were defiantly disobedient\"},{\"a\":85,\"w\":[\"وَلَا\",\"تُعۡجِبۡكَ\",\"أَمۡوَٰلُهُمۡ\",\"وَأَوۡلَٰدُهُمۡۚ\",\"إِنَّمَا\",\"يُرِيدُ\",\"ٱللَّهُ\",\"أَن\",\"يُعَذِّبَهُم\",\"بِهَا\",\"فِي\",\"ٱلدُّنۡيَا\",\"وَتَزۡهَقَ\",\"أَنفُسُهُمۡ\",\"وَهُمۡ\",\"كَٰفِرُونَ\"],\"t\":\"And let not their wealth and their children impress you. Allah only intends to punish them through them in this world and that their souls should depart [at death] while they are disbelievers\"},{\"a\":86,\"w\":[\"وَإِذَآ\",\"أُنزِلَتۡ\",\"سُورَةٌ\",\"أَنۡ\",\"ءَامِنُواْ\",\"بِٱللَّهِ\",\"وَجَٰهِدُواْ\",\"مَعَ\",\"رَسُولِهِ\",\"ٱسۡتَـٔۡذَنَكَ\",\"أُوْلُواْ\",\"ٱلطَّوۡلِ\",\"مِنۡهُمۡ\",\"وَقَالُواْ\",\"ذَرۡنَا\",\"نَكُن\",\"مَّعَ\",\"ٱلۡقَٰعِدِينَ\"],\"t\":\"And when a surah was revealed [enjoining them] to believe in Allah and to fight with His Messenger, those of wealth among them asked your permission [to stay back] and said, \\\"Leave us to be with them who sit [at home]\"},{\"a\":87,\"w\":[\"رَضُواْ\",\"بِأَن\",\"يَكُونُواْ\",\"مَعَ\",\"ٱلۡخَوَالِفِ\",\"وَطُبِعَ\",\"عَلَىٰ\",\"قُلُوبِهِمۡ\",\"فَهُمۡ\",\"لَا\",\"يَفۡقَهُونَ\"],\"t\":\"They were satisfied to be with those who stay behind, and their hearts were sealed over, so they do not understand\"},{\"a\":88,\"w\":[\"لَٰكِنِ\",\"ٱلرَّسُولُ\",\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"مَعَهُۥ\",\"جَٰهَدُواْ\",\"بِأَمۡوَٰلِهِمۡ\",\"وَأَنفُسِهِمۡۚ\",\"وَأُوْلَـٰٓئِكَ\",\"لَهُمُ\",\"ٱلۡخَيۡرَٰتُۖ\",\"وَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡمُفۡلِحُونَ\"],\"t\":\"But the Messenger and those who believed with him fought with their wealth and their lives. Those will have [all that is] good, and it is those who are the successful\"},{\"a\":89,\"w\":[\"أَعَدَّ\",\"ٱللَّهُ\",\"لَهُمۡ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَاۚ\",\"ذَٰلِكَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"Allah has prepared for them gardens beneath which rivers flow, wherein they will abide eternally. That is the great attainment\"},{\"a\":90,\"w\":[\"وَجَآءَ\",\"ٱلۡمُعَذِّرُونَ\",\"مِنَ\",\"ٱلۡأَعۡرَابِ\",\"لِيُؤۡذَنَ\",\"لَهُمۡ\",\"وَقَعَدَ\",\"ٱلَّذِينَ\",\"كَذَبُواْ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥۚ\",\"سَيُصِيبُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"مِنۡهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"And those with excuses among the bedouins came to be permitted [to remain], and they who had lied to Allah and His Messenger sat [at home]. There will strike those who disbelieved among them a painful punishment\"},{\"a\":91,\"w\":[\"لَّيۡسَ\",\"عَلَى\",\"ٱلضُّعَفَآءِ\",\"وَلَا\",\"عَلَى\",\"ٱلۡمَرۡضَىٰ\",\"وَلَا\",\"عَلَى\",\"ٱلَّذِينَ\",\"لَا\",\"يَجِدُونَ\",\"مَا\",\"يُنفِقُونَ\",\"حَرَجٌ\",\"إِذَا\",\"نَصَحُواْ\",\"لِلَّهِ\",\"وَرَسُولِهِۦۚ\",\"مَا\",\"عَلَى\",\"ٱلۡمُحۡسِنِينَ\",\"مِن\",\"سَبِيلٖۚ\",\"وَٱللَّهُ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"There is not upon the weak or upon the ill or upon those who do not find anything to spend any discomfort when they are sincere to Allah and His Messenger. There is not upon the doers of good any cause [for blame]. And Allah is Forgiving and Merciful\"},{\"a\":92,\"w\":[\"وَلَا\",\"عَلَى\",\"ٱلَّذِينَ\",\"إِذَا\",\"مَآ\",\"أَتَوۡكَ\",\"لِتَحۡمِلَهُمۡ\",\"قُلۡتَ\",\"لَآ\",\"أَجِدُ\",\"مَآ\",\"أَحۡمِلُكُمۡ\",\"عَلَيۡهِ\",\"تَوَلَّواْ\",\"وَّأَعۡيُنُهُمۡ\",\"تَفِيضُ\",\"مِنَ\",\"ٱلدَّمۡعِ\",\"حَزَنًا\",\"أَلَّا\",\"يَجِدُواْ\",\"مَا\",\"يُنفِقُونَ\"],\"t\":\"Nor [is there blame] upon those who, when they came to you that you might give them mounts, you said, \\\"I can find nothing for you to ride upon.\\\" They turned back while their eyes overflowed with tears out of grief that they could not find something to spend [for the cause of Allah]\"},{\"a\":93,\"w\":[\"۞إِنَّمَا\",\"ٱلسَّبِيلُ\",\"عَلَى\",\"ٱلَّذِينَ\",\"يَسۡتَـٔۡذِنُونَكَ\",\"وَهُمۡ\",\"أَغۡنِيَآءُۚ\",\"رَضُواْ\",\"بِأَن\",\"يَكُونُواْ\",\"مَعَ\",\"ٱلۡخَوَالِفِ\",\"وَطَبَعَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"قُلُوبِهِمۡ\",\"فَهُمۡ\",\"لَا\",\"يَعۡلَمُونَ\"],\"t\":\"The cause [for blame] is only upon those who ask permission of you while they are rich. They are satisfied to be with those who stay behind, and Allah has sealed over their hearts, so they do not know\"},{\"a\":94,\"w\":[\"يَعۡتَذِرُونَ\",\"إِلَيۡكُمۡ\",\"إِذَا\",\"رَجَعۡتُمۡ\",\"إِلَيۡهِمۡۚ\",\"قُل\",\"لَّا\",\"تَعۡتَذِرُواْ\",\"لَن\",\"نُّؤۡمِنَ\",\"لَكُمۡ\",\"قَدۡ\",\"نَبَّأَنَا\",\"ٱللَّهُ\",\"مِنۡ\",\"أَخۡبَارِكُمۡۚ\",\"وَسَيَرَى\",\"ٱللَّهُ\",\"عَمَلَكُمۡ\",\"وَرَسُولُهُۥ\",\"ثُمَّ\",\"تُرَدُّونَ\",\"إِلَىٰ\",\"عَٰلِمِ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِ\",\"فَيُنَبِّئُكُم\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"They will make excuses to you when you have returned to them. Say, \\\"Make no excuse - never will we believe you. Allah has already informed us of your news. And Allah will observe your deeds, and [so will] His Messenger; then you will be taken back to the Knower of the unseen and the witnessed, and He will inform you of what you used to do\"},{\"a\":95,\"w\":[\"سَيَحۡلِفُونَ\",\"بِٱللَّهِ\",\"لَكُمۡ\",\"إِذَا\",\"ٱنقَلَبۡتُمۡ\",\"إِلَيۡهِمۡ\",\"لِتُعۡرِضُواْ\",\"عَنۡهُمۡۖ\",\"فَأَعۡرِضُواْ\",\"عَنۡهُمۡۖ\",\"إِنَّهُمۡ\",\"رِجۡسٞۖ\",\"وَمَأۡوَىٰهُمۡ\",\"جَهَنَّمُ\",\"جَزَآءَۢ\",\"بِمَا\",\"كَانُواْ\",\"يَكۡسِبُونَ\"],\"t\":\"They will swear by Allah to you when you return to them that you would leave them alone. So leave them alone; indeed they are evil; and their refuge is Hell as recompense for what they had been earning\"},{\"a\":96,\"w\":[\"يَحۡلِفُونَ\",\"لَكُمۡ\",\"لِتَرۡضَوۡاْ\",\"عَنۡهُمۡۖ\",\"فَإِن\",\"تَرۡضَوۡاْ\",\"عَنۡهُمۡ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"لَا\",\"يَرۡضَىٰ\",\"عَنِ\",\"ٱلۡقَوۡمِ\",\"ٱلۡفَٰسِقِينَ\"],\"t\":\"They swear to you so that you might be satisfied with them. But if you should be satisfied with them - indeed, Allah is not satisfied with a defiantly disobedient people\"},{\"a\":97,\"w\":[\"ٱلۡأَعۡرَابُ\",\"أَشَدُّ\",\"كُفۡرٗا\",\"وَنِفَاقٗا\",\"وَأَجۡدَرُ\",\"أَلَّا\",\"يَعۡلَمُواْ\",\"حُدُودَ\",\"مَآ\",\"أَنزَلَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"رَسُولِهِۦۗ\",\"وَٱللَّهُ\",\"عَلِيمٌ\",\"حَكِيمٞ\"],\"t\":\"The bedouins are stronger in disbelief and hypocrisy and more likely not to know the limits of what [laws] Allah has revealed to His Messenger. And Allah is Knowing and Wise\"},{\"a\":98,\"w\":[\"وَمِنَ\",\"ٱلۡأَعۡرَابِ\",\"مَن\",\"يَتَّخِذُ\",\"مَا\",\"يُنفِقُ\",\"مَغۡرَمٗا\",\"وَيَتَرَبَّصُ\",\"بِكُمُ\",\"ٱلدَّوَآئِرَۚ\",\"عَلَيۡهِمۡ\",\"دَآئِرَةُ\",\"ٱلسَّوۡءِۗ\",\"وَٱللَّهُ\",\"سَمِيعٌ\",\"عَلِيمٞ\"],\"t\":\"And among the bedouins are some who consider what they spend as a loss and await for you turns of misfortune. Upon them will be a misfortune of evil. And Allah is Hearing and Knowing\"},{\"a\":99,\"w\":[\"وَمِنَ\",\"ٱلۡأَعۡرَابِ\",\"مَن\",\"يُؤۡمِنُ\",\"بِٱللَّهِ\",\"وَٱلۡيَوۡمِ\",\"ٱلۡأٓخِرِ\",\"وَيَتَّخِذُ\",\"مَا\",\"يُنفِقُ\",\"قُرُبَٰتٍ\",\"عِندَ\",\"ٱللَّهِ\",\"وَصَلَوَٰتِ\",\"ٱلرَّسُولِۚ\",\"أَلَآ\",\"إِنَّهَا\",\"قُرۡبَةٞ\",\"لَّهُمۡۚ\",\"سَيُدۡخِلُهُمُ\",\"ٱللَّهُ\",\"فِي\",\"رَحۡمَتِهِۦٓۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"But among the bedouins are some who believe in Allah and the Last Day and consider what they spend as means of nearness to Allah and of [obtaining] invocations of the Messenger. Unquestionably, it is a means of nearness for them. Allah will admit them to His mercy. Indeed, Allah is Forgiving and Merciful\"},{\"a\":100,\"w\":[\"وَٱلسَّـٰبِقُونَ\",\"ٱلۡأَوَّلُونَ\",\"مِنَ\",\"ٱلۡمُهَٰجِرِينَ\",\"وَٱلۡأَنصَارِ\",\"وَٱلَّذِينَ\",\"ٱتَّبَعُوهُم\",\"بِإِحۡسَٰنٖ\",\"رَّضِيَ\",\"ٱللَّهُ\",\"عَنۡهُمۡ\",\"وَرَضُواْ\",\"عَنۡهُ\",\"وَأَعَدَّ\",\"لَهُمۡ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"تَحۡتَهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَآ\",\"أَبَدٗاۚ\",\"ذَٰلِكَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"And the first forerunners [in the faith] among the Muhajireen and the Ansar and those who followed them with good conduct - Allah is pleased with them and they are pleased with Him, and He has prepared for them gardens beneath which rivers flow, wherein they will abide forever. That is the great attainment\"},{\"a\":101,\"w\":[\"وَمِمَّنۡ\",\"حَوۡلَكُم\",\"مِّنَ\",\"ٱلۡأَعۡرَابِ\",\"مُنَٰفِقُونَۖ\",\"وَمِنۡ\",\"أَهۡلِ\",\"ٱلۡمَدِينَةِ\",\"مَرَدُواْ\",\"عَلَى\",\"ٱلنِّفَاقِ\",\"لَا\",\"تَعۡلَمُهُمۡۖ\",\"نَحۡنُ\",\"نَعۡلَمُهُمۡۚ\",\"سَنُعَذِّبُهُم\",\"مَّرَّتَيۡنِ\",\"ثُمَّ\",\"يُرَدُّونَ\",\"إِلَىٰ\",\"عَذَابٍ\",\"عَظِيمٖ\"],\"t\":\"And among those around you of the bedouins are hypocrites, and [also] from the people of Madinah. They have become accustomed to hypocrisy. You, [O Muhammad], do not know them, [but] We know them. We will punish them twice [in this world]; then they will be returned to a great punishment\"},{\"a\":102,\"w\":[\"وَءَاخَرُونَ\",\"ٱعۡتَرَفُواْ\",\"بِذُنُوبِهِمۡ\",\"خَلَطُواْ\",\"عَمَلٗا\",\"صَٰلِحٗا\",\"وَءَاخَرَ\",\"سَيِّئًا\",\"عَسَى\",\"ٱللَّهُ\",\"أَن\",\"يَتُوبَ\",\"عَلَيۡهِمۡۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"غَفُورٞ\",\"رَّحِيمٌ\"],\"t\":\"And [there are] others who have acknowledged their sins. They had mixed a righteous deed with another that was bad. Perhaps Allah will turn to them in forgiveness. Indeed, Allah is Forgiving and Merciful\"},{\"a\":103,\"w\":[\"خُذۡ\",\"مِنۡ\",\"أَمۡوَٰلِهِمۡ\",\"صَدَقَةٗ\",\"تُطَهِّرُهُمۡ\",\"وَتُزَكِّيهِم\",\"بِهَا\",\"وَصَلِّ\",\"عَلَيۡهِمۡۖ\",\"إِنَّ\",\"صَلَوٰتَكَ\",\"سَكَنٞ\",\"لَّهُمۡۗ\",\"وَٱللَّهُ\",\"سَمِيعٌ\",\"عَلِيمٌ\"],\"t\":\"Take, [O, Muhammad], from their wealth a charity by which you purify them and cause them increase, and invoke [Allah 's blessings] upon them. Indeed, your invocations are reassurance for them. And Allah is Hearing and Knowing\"},{\"a\":104,\"w\":[\"أَلَمۡ\",\"يَعۡلَمُوٓاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"هُوَ\",\"يَقۡبَلُ\",\"ٱلتَّوۡبَةَ\",\"عَنۡ\",\"عِبَادِهِۦ\",\"وَيَأۡخُذُ\",\"ٱلصَّدَقَٰتِ\",\"وَأَنَّ\",\"ٱللَّهَ\",\"هُوَ\",\"ٱلتَّوَّابُ\",\"ٱلرَّحِيمُ\"],\"t\":\"Do they not know that it is Allah who accepts repentance from His servants and receives charities and that it is Allah who is the Accepting of repentance, the Merciful\"},{\"a\":105,\"w\":[\"وَقُلِ\",\"ٱعۡمَلُواْ\",\"فَسَيَرَى\",\"ٱللَّهُ\",\"عَمَلَكُمۡ\",\"وَرَسُولُهُۥ\",\"وَٱلۡمُؤۡمِنُونَۖ\",\"وَسَتُرَدُّونَ\",\"إِلَىٰ\",\"عَٰلِمِ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِ\",\"فَيُنَبِّئُكُم\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"And say, \\\"Do [as you will], for Allah will see your deeds, and [so, will] His Messenger and the believers. And you will be returned to the Knower of the unseen and the witnessed, and He will inform you of what you used to do\"},{\"a\":106,\"w\":[\"وَءَاخَرُونَ\",\"مُرۡجَوۡنَ\",\"لِأَمۡرِ\",\"ٱللَّهِ\",\"إِمَّا\",\"يُعَذِّبُهُمۡ\",\"وَإِمَّا\",\"يَتُوبُ\",\"عَلَيۡهِمۡۗ\",\"وَٱللَّهُ\",\"عَلِيمٌ\",\"حَكِيمٞ\"],\"t\":\"And [there are] others deferred until the command of Allah - whether He will punish them or whether He will forgive them. And Allah is Knowing and Wise\"},{\"a\":107,\"w\":[\"وَٱلَّذِينَ\",\"ٱتَّخَذُواْ\",\"مَسۡجِدٗا\",\"ضِرَارٗا\",\"وَكُفۡرٗا\",\"وَتَفۡرِيقَۢا\",\"بَيۡنَ\",\"ٱلۡمُؤۡمِنِينَ\",\"وَإِرۡصَادٗا\",\"لِّمَنۡ\",\"حَارَبَ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥ\",\"مِن\",\"قَبۡلُۚ\",\"وَلَيَحۡلِفُنَّ\",\"إِنۡ\",\"أَرَدۡنَآ\",\"إِلَّا\",\"ٱلۡحُسۡنَىٰۖ\",\"وَٱللَّهُ\",\"يَشۡهَدُ\",\"إِنَّهُمۡ\",\"لَكَٰذِبُونَ\"],\"t\":\"And [there are] those [hypocrites] who took for themselves a mosque for causing harm and disbelief and division among the believers and as a station for whoever had warred against Allah and His Messenger before. And they will surely swear, \\\"We intended only the best.\\\" And Allah testifies that indeed they are liars\"},{\"a\":108,\"w\":[\"لَا\",\"تَقُمۡ\",\"فِيهِ\",\"أَبَدٗاۚ\",\"لَّمَسۡجِدٌ\",\"أُسِّسَ\",\"عَلَى\",\"ٱلتَّقۡوَىٰ\",\"مِنۡ\",\"أَوَّلِ\",\"يَوۡمٍ\",\"أَحَقُّ\",\"أَن\",\"تَقُومَ\",\"فِيهِۚ\",\"فِيهِ\",\"رِجَالٞ\",\"يُحِبُّونَ\",\"أَن\",\"يَتَطَهَّرُواْۚ\",\"وَٱللَّهُ\",\"يُحِبُّ\",\"ٱلۡمُطَّهِّرِينَ\"],\"t\":\"Do not stand [for prayer] within it - ever. A mosque founded on righteousness from the first day is more worthy for you to stand in. Within it are men who love to purify themselves; and Allah loves those who purify themselves\"},{\"a\":109,\"w\":[\"أَفَمَنۡ\",\"أَسَّسَ\",\"بُنۡيَٰنَهُۥ\",\"عَلَىٰ\",\"تَقۡوَىٰ\",\"مِنَ\",\"ٱللَّهِ\",\"وَرِضۡوَٰنٍ\",\"خَيۡرٌ\",\"أَم\",\"مَّنۡ\",\"أَسَّسَ\",\"بُنۡيَٰنَهُۥ\",\"عَلَىٰ\",\"شَفَا\",\"جُرُفٍ\",\"هَارٖ\",\"فَٱنۡهَارَ\",\"بِهِۦ\",\"فِي\",\"نَارِ\",\"جَهَنَّمَۗ\",\"وَٱللَّهُ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"Then is one who laid the foundation of his building on righteousness [with fear] from Allah and [seeking] His approval better or one who laid the foundation of his building on the edge of a bank about to collapse, so it collapsed with him into the fire of Hell? And Allah does not guide the wrongdoing people\"},{\"a\":110,\"w\":[\"لَا\",\"يَزَالُ\",\"بُنۡيَٰنُهُمُ\",\"ٱلَّذِي\",\"بَنَوۡاْ\",\"رِيبَةٗ\",\"فِي\",\"قُلُوبِهِمۡ\",\"إِلَّآ\",\"أَن\",\"تَقَطَّعَ\",\"قُلُوبُهُمۡۗ\",\"وَٱللَّهُ\",\"عَلِيمٌ\",\"حَكِيمٌ\"],\"t\":\"Their building which they built will not cease to be a [cause of] skepticism in their hearts until their hearts are stopped. And Allah is Knowing and Wise\"},{\"a\":111,\"w\":[\"۞إِنَّ\",\"ٱللَّهَ\",\"ٱشۡتَرَىٰ\",\"مِنَ\",\"ٱلۡمُؤۡمِنِينَ\",\"أَنفُسَهُمۡ\",\"وَأَمۡوَٰلَهُم\",\"بِأَنَّ\",\"لَهُمُ\",\"ٱلۡجَنَّةَۚ\",\"يُقَٰتِلُونَ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"فَيَقۡتُلُونَ\",\"وَيُقۡتَلُونَۖ\",\"وَعۡدًا\",\"عَلَيۡهِ\",\"حَقّٗا\",\"فِي\",\"ٱلتَّوۡرَىٰةِ\",\"وَٱلۡإِنجِيلِ\",\"وَٱلۡقُرۡءَانِۚ\",\"وَمَنۡ\",\"أَوۡفَىٰ\",\"بِعَهۡدِهِۦ\",\"مِنَ\",\"ٱللَّهِۚ\",\"فَٱسۡتَبۡشِرُواْ\",\"بِبَيۡعِكُمُ\",\"ٱلَّذِي\",\"بَايَعۡتُم\",\"بِهِۦۚ\",\"وَذَٰلِكَ\",\"هُوَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"Indeed, Allah has purchased from the believers their lives and their properties [in exchange] for that they will have Paradise. They fight in the cause of Allah, so they kill and are killed. [It is] a true promise [binding] upon Him in the Torah and the Gospel and the Qur'an. And who is truer to his covenant than Allah? So rejoice in your transaction which you have contracted. And it is that which is the great attainment\"},{\"a\":112,\"w\":[\"ٱلتَّـٰٓئِبُونَ\",\"ٱلۡعَٰبِدُونَ\",\"ٱلۡحَٰمِدُونَ\",\"ٱلسَّـٰٓئِحُونَ\",\"ٱلرَّـٰكِعُونَ\",\"ٱلسَّـٰجِدُونَ\",\"ٱلۡأٓمِرُونَ\",\"بِٱلۡمَعۡرُوفِ\",\"وَٱلنَّاهُونَ\",\"عَنِ\",\"ٱلۡمُنكَرِ\",\"وَٱلۡحَٰفِظُونَ\",\"لِحُدُودِ\",\"ٱللَّهِۗ\",\"وَبَشِّرِ\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"[Such believers are] the repentant, the worshippers, the praisers [of Allah], the travelers [for His cause], those who bow and prostrate [in prayer], those who enjoin what is right and forbid what is wrong, and those who observe the limits [set by] Allah. And give good tidings to the believers\"},{\"a\":113,\"w\":[\"مَا\",\"كَانَ\",\"لِلنَّبِيِّ\",\"وَٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"أَن\",\"يَسۡتَغۡفِرُواْ\",\"لِلۡمُشۡرِكِينَ\",\"وَلَوۡ\",\"كَانُوٓاْ\",\"أُوْلِي\",\"قُرۡبَىٰ\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"تَبَيَّنَ\",\"لَهُمۡ\",\"أَنَّهُمۡ\",\"أَصۡحَٰبُ\",\"ٱلۡجَحِيمِ\"],\"t\":\"It is not for the Prophet and those who have believed to ask forgiveness for the polytheists, even if they were relatives, after it has become clear to them that they are companions of Hellfire\"},{\"a\":114,\"w\":[\"وَمَا\",\"كَانَ\",\"ٱسۡتِغۡفَارُ\",\"إِبۡرَٰهِيمَ\",\"لِأَبِيهِ\",\"إِلَّا\",\"عَن\",\"مَّوۡعِدَةٖ\",\"وَعَدَهَآ\",\"إِيَّاهُ\",\"فَلَمَّا\",\"تَبَيَّنَ\",\"لَهُۥٓ\",\"أَنَّهُۥ\",\"عَدُوّٞ\",\"لِّلَّهِ\",\"تَبَرَّأَ\",\"مِنۡهُۚ\",\"إِنَّ\",\"إِبۡرَٰهِيمَ\",\"لَأَوَّـٰهٌ\",\"حَلِيمٞ\"],\"t\":\"And the request of forgiveness of Abraham for his father was only because of a promise he had made to him. But when it became apparent to Abraham that his father was an enemy to Allah, he disassociated himself from him. Indeed was Abraham compassionate and patient\"},{\"a\":115,\"w\":[\"وَمَا\",\"كَانَ\",\"ٱللَّهُ\",\"لِيُضِلَّ\",\"قَوۡمَۢا\",\"بَعۡدَ\",\"إِذۡ\",\"هَدَىٰهُمۡ\",\"حَتَّىٰ\",\"يُبَيِّنَ\",\"لَهُم\",\"مَّا\",\"يَتَّقُونَۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"بِكُلِّ\",\"شَيۡءٍ\",\"عَلِيمٌ\"],\"t\":\"And Allah would not let a people stray after He has guided them until He makes clear to them what they should avoid. Indeed, Allah is Knowing of all things\"},{\"a\":116,\"w\":[\"إِنَّ\",\"ٱللَّهَ\",\"لَهُۥ\",\"مُلۡكُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۖ\",\"يُحۡيِۦ\",\"وَيُمِيتُۚ\",\"وَمَا\",\"لَكُم\",\"مِّن\",\"دُونِ\",\"ٱللَّهِ\",\"مِن\",\"وَلِيّٖ\",\"وَلَا\",\"نَصِيرٖ\"],\"t\":\"Indeed, to Allah belongs the dominion of the heavens and the earth; He gives life and causes death. And you have not besides Allah any protector or any helper\"},{\"a\":117,\"w\":[\"لَّقَد\",\"تَّابَ\",\"ٱللَّهُ\",\"عَلَى\",\"ٱلنَّبِيِّ\",\"وَٱلۡمُهَٰجِرِينَ\",\"وَٱلۡأَنصَارِ\",\"ٱلَّذِينَ\",\"ٱتَّبَعُوهُ\",\"فِي\",\"سَاعَةِ\",\"ٱلۡعُسۡرَةِ\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"كَادَ\",\"يَزِيغُ\",\"قُلُوبُ\",\"فَرِيقٖ\",\"مِّنۡهُمۡ\",\"ثُمَّ\",\"تَابَ\",\"عَلَيۡهِمۡۚ\",\"إِنَّهُۥ\",\"بِهِمۡ\",\"رَءُوفٞ\",\"رَّحِيمٞ\"],\"t\":\"Allah has already forgiven the Prophet and the Muhajireen and the Ansar who followed him in the hour of difficulty after the hearts of a party of them had almost inclined [to doubt], and then He forgave them. Indeed, He was to them Kind and Merciful\"},{\"a\":118,\"w\":[\"وَعَلَى\",\"ٱلثَّلَٰثَةِ\",\"ٱلَّذِينَ\",\"خُلِّفُواْ\",\"حَتَّىٰٓ\",\"إِذَا\",\"ضَاقَتۡ\",\"عَلَيۡهِمُ\",\"ٱلۡأَرۡضُ\",\"بِمَا\",\"رَحُبَتۡ\",\"وَضَاقَتۡ\",\"عَلَيۡهِمۡ\",\"أَنفُسُهُمۡ\",\"وَظَنُّوٓاْ\",\"أَن\",\"لَّا\",\"مَلۡجَأَ\",\"مِنَ\",\"ٱللَّهِ\",\"إِلَّآ\",\"إِلَيۡهِ\",\"ثُمَّ\",\"تَابَ\",\"عَلَيۡهِمۡ\",\"لِيَتُوبُوٓاْۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"هُوَ\",\"ٱلتَّوَّابُ\",\"ٱلرَّحِيمُ\"],\"t\":\"And [He also forgave] the three who were left behind [and regretted their error] to the point that the earth closed in on them in spite of its vastness and their souls confined them and they were certain that there is no refuge from Allah except in Him. Then He turned to them so they could repent. Indeed, Allah is the Accepting of repentance, the Merciful\"},{\"a\":119,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّقُواْ\",\"ٱللَّهَ\",\"وَكُونُواْ\",\"مَعَ\",\"ٱلصَّـٰدِقِينَ\"],\"t\":\"O you who have believed, fear Allah and be with those who are true\"},{\"a\":120,\"w\":[\"مَا\",\"كَانَ\",\"لِأَهۡلِ\",\"ٱلۡمَدِينَةِ\",\"وَمَنۡ\",\"حَوۡلَهُم\",\"مِّنَ\",\"ٱلۡأَعۡرَابِ\",\"أَن\",\"يَتَخَلَّفُواْ\",\"عَن\",\"رَّسُولِ\",\"ٱللَّهِ\",\"وَلَا\",\"يَرۡغَبُواْ\",\"بِأَنفُسِهِمۡ\",\"عَن\",\"نَّفۡسِهِۦۚ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"لَا\",\"يُصِيبُهُمۡ\",\"ظَمَأٞ\",\"وَلَا\",\"نَصَبٞ\",\"وَلَا\",\"مَخۡمَصَةٞ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَلَا\",\"يَطَـُٔونَ\",\"مَوۡطِئٗا\",\"يَغِيظُ\",\"ٱلۡكُفَّارَ\",\"وَلَا\",\"يَنَالُونَ\",\"مِنۡ\",\"عَدُوّٖ\",\"نَّيۡلًا\",\"إِلَّا\",\"كُتِبَ\",\"لَهُم\",\"بِهِۦ\",\"عَمَلٞ\",\"صَٰلِحٌۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"لَا\",\"يُضِيعُ\",\"أَجۡرَ\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"It was not [proper] for the people of Madinah and those surrounding them of the bedouins that they remain behind after [the departure of] the Messenger of Allah or that they prefer themselves over his self. That is because they are not afflicted by thirst or fatigue or hunger in the cause of Allah, nor do they tread on any ground that enrages the disbelievers, nor do they inflict upon an enemy any infliction but that is registered for them as a righteous deed. Indeed, Allah does not allow to be lost the reward of the doers of good\"},{\"a\":121,\"w\":[\"وَلَا\",\"يُنفِقُونَ\",\"نَفَقَةٗ\",\"صَغِيرَةٗ\",\"وَلَا\",\"كَبِيرَةٗ\",\"وَلَا\",\"يَقۡطَعُونَ\",\"وَادِيًا\",\"إِلَّا\",\"كُتِبَ\",\"لَهُمۡ\",\"لِيَجۡزِيَهُمُ\",\"ٱللَّهُ\",\"أَحۡسَنَ\",\"مَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"Nor do they spend an expenditure, small or large, or cross a valley but that it is registered for them that Allah may reward them for the best of what they were doing\"},{\"a\":122,\"w\":[\"۞وَمَا\",\"كَانَ\",\"ٱلۡمُؤۡمِنُونَ\",\"لِيَنفِرُواْ\",\"كَآفَّةٗۚ\",\"فَلَوۡلَا\",\"نَفَرَ\",\"مِن\",\"كُلِّ\",\"فِرۡقَةٖ\",\"مِّنۡهُمۡ\",\"طَآئِفَةٞ\",\"لِّيَتَفَقَّهُواْ\",\"فِي\",\"ٱلدِّينِ\",\"وَلِيُنذِرُواْ\",\"قَوۡمَهُمۡ\",\"إِذَا\",\"رَجَعُوٓاْ\",\"إِلَيۡهِمۡ\",\"لَعَلَّهُمۡ\",\"يَحۡذَرُونَ\"],\"t\":\"And it is not for the believers to go forth [to battle] all at once. For there should separate from every division of them a group [remaining] to obtain understanding in the religion and warn their people when they return to them that they might be cautious\"},{\"a\":123,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"قَٰتِلُواْ\",\"ٱلَّذِينَ\",\"يَلُونَكُم\",\"مِّنَ\",\"ٱلۡكُفَّارِ\",\"وَلۡيَجِدُواْ\",\"فِيكُمۡ\",\"غِلۡظَةٗۚ\",\"وَٱعۡلَمُوٓاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"مَعَ\",\"ٱلۡمُتَّقِينَ\"],\"t\":\"O you who have believed, fight those adjacent to you of the disbelievers and let them find in you harshness. And know that Allah is with the righteous\"},{\"a\":124,\"w\":[\"وَإِذَا\",\"مَآ\",\"أُنزِلَتۡ\",\"سُورَةٞ\",\"فَمِنۡهُم\",\"مَّن\",\"يَقُولُ\",\"أَيُّكُمۡ\",\"زَادَتۡهُ\",\"هَٰذِهِۦٓ\",\"إِيمَٰنٗاۚ\",\"فَأَمَّا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"فَزَادَتۡهُمۡ\",\"إِيمَٰنٗا\",\"وَهُمۡ\",\"يَسۡتَبۡشِرُونَ\"],\"t\":\"And whenever a surah is revealed, there are among the hypocrites those who say, \\\"Which of you has this increased faith?\\\" As for those who believed, it has increased them in faith, while they are rejoicing\"},{\"a\":125,\"w\":[\"وَأَمَّا\",\"ٱلَّذِينَ\",\"فِي\",\"قُلُوبِهِم\",\"مَّرَضٞ\",\"فَزَادَتۡهُمۡ\",\"رِجۡسًا\",\"إِلَىٰ\",\"رِجۡسِهِمۡ\",\"وَمَاتُواْ\",\"وَهُمۡ\",\"كَٰفِرُونَ\"],\"t\":\"But as for those in whose hearts is disease, it has [only] increased them in evil [in addition] to their evil. And they will have died while they are disbelievers\"},{\"a\":126,\"w\":[\"أَوَلَا\",\"يَرَوۡنَ\",\"أَنَّهُمۡ\",\"يُفۡتَنُونَ\",\"فِي\",\"كُلِّ\",\"عَامٖ\",\"مَّرَّةً\",\"أَوۡ\",\"مَرَّتَيۡنِ\",\"ثُمَّ\",\"لَا\",\"يَتُوبُونَ\",\"وَلَا\",\"هُمۡ\",\"يَذَّكَّرُونَ\"],\"t\":\"Do they not see that they are tried every year once or twice but then they do not repent nor do they remember\"},{\"a\":127,\"w\":[\"وَإِذَا\",\"مَآ\",\"أُنزِلَتۡ\",\"سُورَةٞ\",\"نَّظَرَ\",\"بَعۡضُهُمۡ\",\"إِلَىٰ\",\"بَعۡضٍ\",\"هَلۡ\",\"يَرَىٰكُم\",\"مِّنۡ\",\"أَحَدٖ\",\"ثُمَّ\",\"ٱنصَرَفُواْۚ\",\"صَرَفَ\",\"ٱللَّهُ\",\"قُلُوبَهُم\",\"بِأَنَّهُمۡ\",\"قَوۡمٞ\",\"لَّا\",\"يَفۡقَهُونَ\"],\"t\":\"And whenever a surah is revealed, they look at each other, [saying], \\\"Does anyone see you?\\\" and then they dismiss themselves. Allah has dismissed their hearts because they are a people who do not understand\"},{\"a\":128,\"w\":[\"لَقَدۡ\",\"جَآءَكُمۡ\",\"رَسُولٞ\",\"مِّنۡ\",\"أَنفُسِكُمۡ\",\"عَزِيزٌ\",\"عَلَيۡهِ\",\"مَا\",\"عَنِتُّمۡ\",\"حَرِيصٌ\",\"عَلَيۡكُم\",\"بِٱلۡمُؤۡمِنِينَ\",\"رَءُوفٞ\",\"رَّحِيمٞ\"],\"t\":\"There has certainly come to you a Messenger from among yourselves. Grievous to him is what you suffer; [he is] concerned over you and to the believers is kind and merciful\"},{\"a\":129,\"w\":[\"فَإِن\",\"تَوَلَّوۡاْ\",\"فَقُلۡ\",\"حَسۡبِيَ\",\"ٱللَّهُ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَۖ\",\"عَلَيۡهِ\",\"تَوَكَّلۡتُۖ\",\"وَهُوَ\",\"رَبُّ\",\"ٱلۡعَرۡشِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"But if they turn away, [O Muhammad], say, \\\"Sufficient for me is Allah; there is no deity except Him. On Him I have relied, and He is the Lord of the Great Throne\"}]}]}]}]]}]\n1e:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n1a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n18:null\n1c:[[\"$\",\"title\",\"0\",{\"children\":\"At-Tawbah — Surah 9 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quran Roots\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Holy-Qur-an/icon.svg?icon.0k8xndm1lskh_.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Holy-Qur-an/apple-icon.png?apple-icon.1aiq4_oo29pdu.png\",\"sizes\":\"180x
