َّـٰلِحَٰتِ\",\"وَءَامَنُواْ\",\"بِمَا\",\"نُزِّلَ\",\"عَلَىٰ\",\"مُحَمَّدٖ\",\"وَهُوَ\",\"ٱلۡحَقُّ\",\"مِن\",\"رَّبِّهِمۡ\",\"كَفَّرَ\",\"عَنۡهُمۡ\",\"سَيِّـَٔاتِهِمۡ\",\"وَأَصۡلَحَ\",\"بَالَهُمۡ\"],\"t\":\"And those who believe and do righteous deeds and believe in what has been sent down upon Muhammad - and it is the truth from their Lord - He will remove from them their misdeeds and amend their condition\"},{\"a\":3,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"ٱتَّبَعُواْ\",\"ٱلۡبَٰطِلَ\",\"وَأَنَّ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّبَعُواْ\",\"ٱلۡحَقَّ\",\"مِن\",\"رَّبِّهِمۡۚ\",\"كَذَٰلِكَ\",\"يَضۡرِبُ\",\"ٱللَّهُ\",\"لِلنَّاسِ\",\"أَمۡثَٰلَهُمۡ\"],\"t\":\"That is because those who disbelieve follow falsehood, and those who believe follow the truth from their Lord. Thus does Allah present to the people their comparisons\"},{\"a\":4,\"w\":[\"فَإِذَا\",\"لَقِيتُمُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"فَضَرۡبَ\",\"ٱلرِّقَابِ\",\"حَتَّىٰٓ\",\"إِذَآ\",\"أَثۡخَنتُمُوهُمۡ\",\"فَشُدُّواْ\",\"ٱلۡوَثَاقَ\",\"فَإِمَّا\",\"مَنَّۢا\",\"بَعۡدُ\",\"وَإِمَّا\",\"فِدَآءً\",\"حَتَّىٰ\",\"تَضَعَ\",\"ٱلۡحَرۡبُ\",\"أَوۡزَارَهَاۚ\",\"ذَٰلِكَۖ\",\"وَلَوۡ\",\"يَشَآءُ\",\"ٱللَّهُ\",\"لَٱنتَصَرَ\",\"مِنۡهُمۡ\",\"وَلَٰكِن\",\"لِّيَبۡلُوَاْ\",\"بَعۡضَكُم\",\"بِبَعۡضٖۗ\",\"وَٱلَّذِينَ\",\"قُتِلُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"فَلَن\",\"يُضِلَّ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"So when you meet those who disbelieve [in battle], strike [their] necks until, when you have inflicted slaughter upon them, then secure their bonds, and either [confer] favor afterwards or ransom [them] until the war lays down its burdens. That [is the command]. And if Allah had willed, He could have taken vengeance upon them [Himself], but [He ordered armed struggle] to test some of you by means of others. And those who are killed in the cause of Allah - never will He waste their deeds\"},{\"a\":5,\"w\":[\"سَيَهۡدِيهِمۡ\",\"وَيُصۡلِحُ\",\"بَالَهُمۡ\"],\"t\":\"He will guide them and amend their condition\"},{\"a\":6,\"w\":[\"وَيُدۡخِلُهُمُ\",\"ٱلۡجَنَّةَ\",\"عَرَّفَهَا\",\"لَهُمۡ\"],\"t\":\"And admit them to Paradise, which He has made known to them\"},{\"a\":7,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِن\",\"تَنصُرُواْ\",\"ٱللَّهَ\",\"يَنصُرۡكُمۡ\",\"وَيُثَبِّتۡ\",\"أَقۡدَامَكُمۡ\"],\"t\":\"O you who have believed, if you support Allah, He will support you and plant firmly your feet\"},{\"a\":8,\"w\":[\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"فَتَعۡسٗا\",\"لَّهُمۡ\",\"وَأَضَلَّ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"But those who disbelieve - for them is misery, and He will waste their deeds\"},{\"a\":9,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"كَرِهُواْ\",\"مَآ\",\"أَنزَلَ\",\"ٱللَّهُ\",\"فَأَحۡبَطَ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"That is because they disliked what Allah revealed, so He rendered worthless their deeds\"},{\"a\":10,\"w\":[\"۞أَفَلَمۡ\",\"يَسِيرُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"فَيَنظُرُواْ\",\"كَيۡفَ\",\"كَانَ\",\"عَٰقِبَةُ\",\"ٱلَّذِينَ\",\"مِن\",\"قَبۡلِهِمۡۖ\",\"دَمَّرَ\",\"ٱللَّهُ\",\"عَلَيۡهِمۡۖ\",\"وَلِلۡكَٰفِرِينَ\",\"أَمۡثَٰلُهَا\"],\"t\":\"Have they not traveled through the land and seen how was the end of those before them? Allah destroyed [everything] over them, and for the disbelievers is something comparable\"},{\"a\":11,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّ\",\"ٱللَّهَ\",\"مَوۡلَى\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَأَنَّ\",\"ٱلۡكَٰفِرِينَ\",\"لَا\",\"مَوۡلَىٰ\",\"لَهُمۡ\"],\"t\":\"That is because Allah is the protector of those who have believed and because the disbelievers have no protector\"},{\"a\":12,\"w\":[\"إِنَّ\",\"ٱللَّهَ\",\"يُدۡخِلُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُۖ\",\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"يَتَمَتَّعُونَ\",\"وَيَأۡكُلُونَ\",\"كَمَا\",\"تَأۡكُلُ\",\"ٱلۡأَنۡعَٰمُ\",\"وَٱلنَّارُ\",\"مَثۡوٗى\",\"لَّهُمۡ\"],\"t\":\"Indeed, Allah will admit those who have believed and done righteous deeds to gardens beneath which rivers flow, but those who disbelieve enjoy themselves and eat as grazing livestock eat, and the Fire will be a residence for them\"},{\"a\":13,\"w\":[\"وَكَأَيِّن\",\"مِّن\",\"قَرۡيَةٍ\",\"هِيَ\",\"أَشَدُّ\",\"قُوَّةٗ\",\"مِّن\",\"قَرۡيَتِكَ\",\"ٱلَّتِيٓ\",\"أَخۡرَجَتۡكَ\",\"أَهۡلَكۡنَٰهُمۡ\",\"فَلَا\",\"نَاصِرَ\",\"لَهُمۡ\"],\"t\":\"And how many a city was stronger than your city [Makkah] which drove you out? We destroyed them; and there was no helper for them\"},{\"a\":14,\"w\":[\"أَفَمَن\",\"كَانَ\",\"عَلَىٰ\",\"بَيِّنَةٖ\",\"مِّن\",\"رَّبِّهِۦ\",\"كَمَن\",\"زُيِّنَ\",\"لَهُۥ\",\"سُوٓءُ\",\"عَمَلِهِۦ\",\"وَٱتَّبَعُوٓاْ\",\"أَهۡوَآءَهُم\"],\"t\":\"So is he who is on clear evidence from his Lord like him to whom the evil of his work has been made attractive and they follow their [own] desires\"},{\"a\":15,\"w\":[\"مَّثَلُ\",\"ٱلۡجَنَّةِ\",\"ٱلَّتِي\",\"وُعِدَ\",\"ٱلۡمُتَّقُونَۖ\",\"فِيهَآ\",\"أَنۡهَٰرٞ\",\"مِّن\",\"مَّآءٍ\",\"غَيۡرِ\",\"ءَاسِنٖ\",\"وَأَنۡهَٰرٞ\",\"مِّن\",\"لَّبَنٖ\",\"لَّمۡ\",\"يَتَغَيَّرۡ\",\"طَعۡمُهُۥ\",\"وَأَنۡهَٰرٞ\",\"مِّنۡ\",\"خَمۡرٖ\",\"لَّذَّةٖ\",\"لِّلشَّـٰرِبِينَ\",\"وَأَنۡهَٰرٞ\",\"مِّنۡ\",\"عَسَلٖ\",\"مُّصَفّٗىۖ\",\"وَلَهُمۡ\",\"فِيهَا\",\"مِن\",\"كُلِّ\",\"ٱلثَّمَرَٰتِ\",\"وَمَغۡفِرَةٞ\",\"مِّن\",\"رَّبِّهِمۡۖ\",\"كَمَنۡ\",\"هُوَ\",\"خَٰلِدٞ\",\"فِي\",\"ٱلنَّارِ\",\"وَسُقُواْ\",\"مَآءً\",\"حَمِيمٗا\",\"فَقَطَّعَ\",\"أَمۡعَآءَهُمۡ\"],\"t\":\"Is the description of Paradise, which the righteous are promised, wherein are rivers of water unaltered, rivers of milk the taste of which never changes, rivers of wine delicious to those who drink, and rivers of purified honey, in which they will have from all [kinds of] fruits and forgiveness from their Lord, like [that of] those who abide eternally in the Fire and are given to drink scalding water that will sever their intestines\"},{\"a\":16,\"w\":[\"وَمِنۡهُم\",\"مَّن\",\"يَسۡتَمِعُ\",\"إِلَيۡكَ\",\"حَتَّىٰٓ\",\"إِذَا\",\"خَرَجُواْ\",\"مِنۡ\",\"عِندِكَ\",\"قَالُواْ\",\"لِلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡعِلۡمَ\",\"مَاذَا\",\"قَالَ\",\"ءَانِفًاۚ\",\"أُوْلَـٰٓئِكَ\",\"ٱلَّذِينَ\",\"طَبَعَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"قُلُوبِهِمۡ\",\"وَٱتَّبَعُوٓاْ\",\"أَهۡوَآءَهُمۡ\"],\"t\":\"And among them, [O Muhammad], are those who listen to you, until when they depart from you, they say to those who were given knowledge, \\\"What has he said just now?\\\" Those are the ones of whom Allah has sealed over their hearts and who have followed their [own] desires\"},{\"a\":17,\"w\":[\"وَٱلَّذِينَ\",\"ٱهۡتَدَوۡاْ\",\"زَادَهُمۡ\",\"هُدٗى\",\"وَءَاتَىٰهُمۡ\",\"تَقۡوَىٰهُمۡ\"],\"t\":\"And those who are guided - He increases them in guidance and gives them their righteousness\"},{\"a\":18,\"w\":[\"فَهَلۡ\",\"يَنظُرُونَ\",\"إِلَّا\",\"ٱلسَّاعَةَ\",\"أَن\",\"تَأۡتِيَهُم\",\"بَغۡتَةٗۖ\",\"فَقَدۡ\",\"جَآءَ\",\"أَشۡرَاطُهَاۚ\",\"فَأَنَّىٰ\",\"لَهُمۡ\",\"إِذَا\",\"جَآءَتۡهُمۡ\",\"ذِكۡرَىٰهُمۡ\"],\"t\":\"Then do they await except that the Hour should come upon them unexpectedly? But already there have come [some of] its indications. Then what good to them, when it has come, will be their remembrance\"},{\"a\":19,\"w\":[\"فَٱعۡلَمۡ\",\"أَنَّهُۥ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"ٱللَّهُ\",\"وَٱسۡتَغۡفِرۡ\",\"لِذَنۢبِكَ\",\"وَلِلۡمُؤۡمِنِينَ\",\"وَٱلۡمُؤۡمِنَٰتِۗ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"مُتَقَلَّبَكُمۡ\",\"وَمَثۡوَىٰكُمۡ\"],\"t\":\"So know, [O Muhammad], that there is no deity except Allah and ask forgiveness for your sin and for the believing men and believing women. And Allah knows of your movement and your resting place\"},{\"a\":20,\"w\":[\"وَيَقُولُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَوۡلَا\",\"نُزِّلَتۡ\",\"سُورَةٞۖ\",\"فَإِذَآ\",\"أُنزِلَتۡ\",\"سُورَةٞ\",\"مُّحۡكَمَةٞ\",\"وَذُكِرَ\",\"فِيهَا\",\"ٱلۡقِتَالُ\",\"رَأَيۡتَ\",\"ٱلَّذِينَ\",\"فِي\",\"قُلُوبِهِم\",\"مَّرَضٞ\",\"يَنظُرُونَ\",\"إِلَيۡكَ\",\"نَظَرَ\",\"ٱلۡمَغۡشِيِّ\",\"عَلَيۡهِ\",\"مِنَ\",\"ٱلۡمَوۡتِۖ\",\"فَأَوۡلَىٰ\",\"لَهُمۡ\"],\"t\":\"Those who believe say, \\\"Why has a surah not been sent down? But when a precise surah is revealed and fighting is mentioned therein, you see those in whose hearts is hypocrisy looking at you with a look of one overcome by death. And more appropriate for them [would have been]\"},{\"a\":21,\"w\":[\"طَاعَةٞ\",\"وَقَوۡلٞ\",\"مَّعۡرُوفٞۚ\",\"فَإِذَا\",\"عَزَمَ\",\"ٱلۡأَمۡرُ\",\"فَلَوۡ\",\"صَدَقُواْ\",\"ٱللَّهَ\",\"لَكَانَ\",\"خَيۡرٗا\",\"لَّهُمۡ\"],\"t\":\"Obedience and good words. And when the matter [of fighting] was determined, if they had been true to Allah, it would have been better for them\"},{\"a\":22,\"w\":[\"فَهَلۡ\",\"عَسَيۡتُمۡ\",\"إِن\",\"تَوَلَّيۡتُمۡ\",\"أَن\",\"تُفۡسِدُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَتُقَطِّعُوٓاْ\",\"أَرۡحَامَكُمۡ\"],\"t\":\"So would you perhaps, if you turned away, cause corruption on earth and sever your [ties of] relationship\"},{\"a\":23,\"w\":[\"أُوْلَـٰٓئِكَ\",\"ٱلَّذِينَ\",\"لَعَنَهُمُ\",\"ٱللَّهُ\",\"فَأَصَمَّهُمۡ\",\"وَأَعۡمَىٰٓ\",\"أَبۡصَٰرَهُمۡ\"],\"t\":\"Those [who do so] are the ones that Allah has cursed, so He deafened them and blinded their vision\"},{\"a\":24,\"w\":[\"أَفَلَا\",\"يَتَدَبَّرُونَ\",\"ٱلۡقُرۡءَانَ\",\"أَمۡ\",\"عَلَىٰ\",\"قُلُوبٍ\",\"أَقۡفَالُهَآ\"],\"t\":\"Then do they not reflect upon the Qur'an, or are there locks upon [their] hearts\"},{\"a\":25,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"ٱرۡتَدُّواْ\",\"عَلَىٰٓ\",\"أَدۡبَٰرِهِم\",\"مِّنۢ\",\"بَعۡدِ\",\"مَا\",\"تَبَيَّنَ\",\"لَهُمُ\",\"ٱلۡهُدَى\",\"ٱلشَّيۡطَٰنُ\",\"سَوَّلَ\",\"لَهُمۡ\",\"وَأَمۡلَىٰ\",\"لَهُمۡ\"],\"t\":\"Indeed, those who reverted back [to disbelief] after guidance had become clear to them - Satan enticed them and prolonged hope for them\"},{\"a\":26,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَالُواْ\",\"لِلَّذِينَ\",\"كَرِهُواْ\",\"مَا\",\"نَزَّلَ\",\"ٱللَّهُ\",\"سَنُطِيعُكُمۡ\",\"فِي\",\"بَعۡضِ\",\"ٱلۡأَمۡرِۖ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"إِسۡرَارَهُمۡ\"],\"t\":\"That is because they said to those who disliked what Allah sent down, \\\"We will obey you in part of the matter.\\\" And Allah knows what they conceal\"},{\"a\":27,\"w\":[\"فَكَيۡفَ\",\"إِذَا\",\"تَوَفَّتۡهُمُ\",\"ٱلۡمَلَـٰٓئِكَةُ\",\"يَضۡرِبُونَ\",\"وُجُوهَهُمۡ\",\"وَأَدۡبَٰرَهُمۡ\"],\"t\":\"Then how [will it be] when the angels take them in death, striking their faces and their backs\"},{\"a\":28,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمُ\",\"ٱتَّبَعُواْ\",\"مَآ\",\"أَسۡخَطَ\",\"ٱللَّهَ\",\"وَكَرِهُواْ\",\"رِضۡوَٰنَهُۥ\",\"فَأَحۡبَطَ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"That is because they followed what angered Allah and disliked [what earns] His pleasure, so He rendered worthless their deeds\"},{\"a\":29,\"w\":[\"أَمۡ\",\"حَسِبَ\",\"ٱلَّذِينَ\",\"فِي\",\"قُلُوبِهِم\",\"مَّرَضٌ\",\"أَن\",\"لَّن\",\"يُخۡرِجَ\",\"ٱللَّهُ\",\"أَضۡغَٰنَهُمۡ\"],\"t\":\"Or do those in whose hearts is disease think that Allah would never expose their [feelings of] hatred\"},{\"a\":30,\"w\":[\"وَلَوۡ\",\"نَشَآءُ\",\"لَأَرَيۡنَٰكَهُمۡ\",\"فَلَعَرَفۡتَهُم\",\"بِسِيمَٰهُمۡۚ\",\"وَلَتَعۡرِفَنَّهُمۡ\",\"فِي\",\"لَحۡنِ\",\"ٱلۡقَوۡلِۚ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"أَعۡمَٰلَكُمۡ\"],\"t\":\"And if We willed, We could show them to you, and you would know them by their mark; but you will surely know them by the tone of [their] speech. And Allah knows your deeds\"},{\"a\":31,\"w\":[\"وَلَنَبۡلُوَنَّكُمۡ\",\"حَتَّىٰ\",\"نَعۡلَمَ\",\"ٱلۡمُجَٰهِدِينَ\",\"مِنكُمۡ\",\"وَٱلصَّـٰبِرِينَ\",\"وَنَبۡلُوَاْ\",\"أَخۡبَارَكُمۡ\"],\"t\":\"And We will surely test you until We make evident those who strive among you [for the cause of Allah] and the patient, and We will test your affairs\"},{\"a\":32,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَصَدُّواْ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَشَآقُّواْ\",\"ٱلرَّسُولَ\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"تَبَيَّنَ\",\"لَهُمُ\",\"ٱلۡهُدَىٰ\",\"لَن\",\"يَضُرُّواْ\",\"ٱللَّهَ\",\"شَيۡـٔٗا\",\"وَسَيُحۡبِطُ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"Indeed, those who disbelieved and averted [people] from the path of Allah and opposed the Messenger after guidance had become clear to them - never will they harm Allah at all, and He will render worthless their deeds\"},{\"a\":33,\"w\":[\"۞يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"أَطِيعُواْ\",\"ٱللَّهَ\",\"وَأَطِيعُواْ\",\"ٱلرَّسُولَ\",\"وَلَا\",\"تُبۡطِلُوٓاْ\",\"أَعۡمَٰلَكُمۡ\"],\"t\":\"O you who have believed, obey Allah and obey the Messenger and do not invalidate your deeds\"},{\"a\":34,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَصَدُّواْ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِ\",\"ثُمَّ\",\"مَاتُواْ\",\"وَهُمۡ\",\"كُفَّارٞ\",\"فَلَن\",\"يَغۡفِرَ\",\"ٱللَّهُ\",\"لَهُمۡ\"],\"t\":\"Indeed, those who disbelieved and averted [people] from the path of Allah and then died while they were disbelievers - never will Allah forgive them\"},{\"a\":35,\"w\":[\"فَلَا\",\"تَهِنُواْ\",\"وَتَدۡعُوٓاْ\",\"إِلَى\",\"ٱلسَّلۡمِ\",\"وَأَنتُمُ\",\"ٱلۡأَعۡلَوۡنَ\",\"وَٱللَّهُ\",\"مَعَكُمۡ\",\"وَلَن\",\"يَتِرَكُمۡ\",\"أَعۡمَٰلَكُمۡ\"],\"t\":\"So do not weaken and call for peace while you are superior; and Allah is with you and will never deprive you of [the reward of] your deeds\"},{\"a\":36,\"w\":[\"إِنَّمَا\",\"ٱلۡحَيَوٰةُ\",\"ٱلدُّنۡيَا\",\"لَعِبٞ\",\"وَلَهۡوٞۚ\",\"وَإِن\",\"تُؤۡمِنُواْ\",\"وَتَتَّقُواْ\",\"يُؤۡتِكُمۡ\",\"أُجُورَكُمۡ\",\"وَلَا\",\"يَسۡـَٔلۡكُمۡ\",\"أَمۡوَٰلَكُمۡ\"],\"t\":\"[This] worldly life is only amusement and diversion. And if you believe and fear Allah, He will give you your rewards and not ask you for your properties\"},{\"a\":37,\"w\":[\"إِن\",\"يَسۡـَٔلۡكُمُوهَا\",\"فَيُحۡفِكُمۡ\",\"تَبۡخَلُواْ\",\"وَيُخۡرِجۡ\",\"أَضۡغَٰنَكُمۡ\"],\"t\":\"If He should ask you for them and press you, you would withhold, and He would expose your unwillingness\"},{\"a\":38,\"w\":[\"هَـٰٓأَنتُمۡ\",\"هَـٰٓؤُلَآءِ\",\"تُدۡعَوۡنَ\",\"لِتُنفِقُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"فَمِنكُم\",\"مَّن\",\"يَبۡخَلُۖ\",\"وَمَن\",\"يَبۡخَلۡ\",\"فَإِنَّمَا\",\"يَبۡخَلُ\",\"عَن\",\"نَّفۡسِهِۦۚ\",\"وَٱللَّهُ\",\"ٱلۡغَنِيُّ\",\"وَأَنتُمُ\",\"ٱلۡفُقَرَآءُۚ\",\"وَإِن\",\"تَتَوَلَّوۡاْ\",\"يَسۡتَبۡدِلۡ\",\"قَوۡمًا\",\"غَيۡرَكُمۡ\",\"ثُمَّ\",\"لَا\",\"يَكُونُوٓاْ\",\"أَمۡثَٰلَكُم\"],\"t\":\"Here you are - those invited to spend in the cause of Allah - but among you are those who withhold [out of greed]. And whoever withholds only withholds [benefit] from himself; and Allah is the Free of need, while you are the needy. And if you turn away, He will replace you with another people; then they will not be the likes of you\"}]}]}]}]]}]\n18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1c:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n16:null\n1a:[[\"$\",\"title\",\"0\",{\"children\":\"Muhammad — Surah 47 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quran Roots\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Holy-Qur-an/icon.svg?icon.0k8xndm1lskh_.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Holy-Qur-an/apple-icon.png?apple-icon.1aiq4_oo29pdu.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L1c\",\"9\",{}]]\n"])</script></body></html>
