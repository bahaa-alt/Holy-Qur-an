ch is revealed unto Muhammad - and it is the truth from their Lord - He riddeth them of their ill-deeds and improveth their state\"},{\"a\":3,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"ٱتَّبَعُواْ\",\"ٱلۡبَٰطِلَ\",\"وَأَنَّ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّبَعُواْ\",\"ٱلۡحَقَّ\",\"مِن\",\"رَّبِّهِمۡۚ\",\"كَذَٰلِكَ\",\"يَضۡرِبُ\",\"ٱللَّهُ\",\"لِلنَّاسِ\",\"أَمۡثَٰلَهُمۡ\"],\"t\":\"That is because those who disbelieve follow falsehood, and those who believe follow the truth from their Lord. Thus does Allah present to the people their comparisons\",\"pickthall\":\"That is because those who disbelieve follow falsehood and because those who believe follow the truth from their Lord. Thus Allah coineth their similitudes for mankind\"},{\"a\":4,\"w\":[\"فَإِذَا\",\"لَقِيتُمُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"فَضَرۡبَ\",\"ٱلرِّقَابِ\",\"حَتَّىٰٓ\",\"إِذَآ\",\"أَثۡخَنتُمُوهُمۡ\",\"فَشُدُّواْ\",\"ٱلۡوَثَاقَ\",\"فَإِمَّا\",\"مَنَّۢا\",\"بَعۡدُ\",\"وَإِمَّا\",\"فِدَآءً\",\"حَتَّىٰ\",\"تَضَعَ\",\"ٱلۡحَرۡبُ\",\"أَوۡزَارَهَاۚ\",\"ذَٰلِكَۖ\",\"وَلَوۡ\",\"يَشَآءُ\",\"ٱللَّهُ\",\"لَٱنتَصَرَ\",\"مِنۡهُمۡ\",\"وَلَٰكِن\",\"لِّيَبۡلُوَاْ\",\"بَعۡضَكُم\",\"بِبَعۡضٖۗ\",\"وَٱلَّذِينَ\",\"قُتِلُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"فَلَن\",\"يُضِلَّ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"So when you meet those who disbelieve [in battle], strike [their] necks until, when you have inflicted slaughter upon them, then secure their bonds, and either [confer] favor afterwards or ransom [them] until the war lays down its burdens. That [is the command]. And if Allah had willed, He could have taken vengeance upon them [Himself], but [He ordered armed struggle] to test some of you by means of others. And those who are killed in the cause of Allah - never will He waste their deeds\",\"pickthall\":\"Now when ye meet in battle those who disbelieve, then it is smiting of the necks until, when ye have routed them, then making fast of bonds; and afterward either grace or ransom till the war lay down its burdens. That (is the ordinance). And if Allah willed He could have punished them (without you) but (thus it is ordained) that He may try some of you by means of others. And those who are slain in the way of Allah, He rendereth not their actions vain\"},{\"a\":5,\"w\":[\"سَيَهۡدِيهِمۡ\",\"وَيُصۡلِحُ\",\"بَالَهُمۡ\"],\"t\":\"He will guide them and amend their condition\",\"pickthall\":\"He will guide them and improve their state\"},{\"a\":6,\"w\":[\"وَيُدۡخِلُهُمُ\",\"ٱلۡجَنَّةَ\",\"عَرَّفَهَا\",\"لَهُمۡ\"],\"t\":\"And admit them to Paradise, which He has made known to them\",\"pickthall\":\"And bring them in unto the Garden which He hath made known to them\"},{\"a\":7,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِن\",\"تَنصُرُواْ\",\"ٱللَّهَ\",\"يَنصُرۡكُمۡ\",\"وَيُثَبِّتۡ\",\"أَقۡدَامَكُمۡ\"],\"t\":\"O you who have believed, if you support Allah, He will support you and plant firmly your feet\",\"pickthall\":\"O ye who believe! If ye help Allah, He will help you and will make your foothold firm\"},{\"a\":8,\"w\":[\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"فَتَعۡسٗا\",\"لَّهُمۡ\",\"وَأَضَلَّ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"But those who disbelieve - for them is misery, and He will waste their deeds\",\"pickthall\":\"And those who disbelieve, perdition is for them, and He will make their actions vain\"},{\"a\":9,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"كَرِهُواْ\",\"مَآ\",\"أَنزَلَ\",\"ٱللَّهُ\",\"فَأَحۡبَطَ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"That is because they disliked what Allah revealed, so He rendered worthless their deeds\",\"pickthall\":\"That is because they are averse to that which Allah hath revealed, therefor maketh He their actions fruitless\"},{\"a\":10,\"w\":[\"۞أَفَلَمۡ\",\"يَسِيرُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"فَيَنظُرُواْ\",\"كَيۡفَ\",\"كَانَ\",\"عَٰقِبَةُ\",\"ٱلَّذِينَ\",\"مِن\",\"قَبۡلِهِمۡۖ\",\"دَمَّرَ\",\"ٱللَّهُ\",\"عَلَيۡهِمۡۖ\",\"وَلِلۡكَٰفِرِينَ\",\"أَمۡثَٰلُهَا\"],\"t\":\"Have they not traveled through the land and seen how was the end of those before them? Allah destroyed [everything] over them, and for the disbelievers is something comparable\",\"pickthall\":\"Have they not travelled in the land to see the nature of the consequence for those who were before them? Allah wiped them out. And for the disbelievers there will be the like thereof\"},{\"a\":11,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّ\",\"ٱللَّهَ\",\"مَوۡلَى\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَأَنَّ\",\"ٱلۡكَٰفِرِينَ\",\"لَا\",\"مَوۡلَىٰ\",\"لَهُمۡ\"],\"t\":\"That is because Allah is the protector of those who have believed and because the disbelievers have no protector\",\"pickthall\":\"That is because Allah is patron of those who believe, and because the disbelievers have no patron\"},{\"a\":12,\"w\":[\"إِنَّ\",\"ٱللَّهَ\",\"يُدۡخِلُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"جَنَّـٰتٖ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُۖ\",\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"يَتَمَتَّعُونَ\",\"وَيَأۡكُلُونَ\",\"كَمَا\",\"تَأۡكُلُ\",\"ٱلۡأَنۡعَٰمُ\",\"وَٱلنَّارُ\",\"مَثۡوٗى\",\"لَّهُمۡ\"],\"t\":\"Indeed, Allah will admit those who have believed and done righteous deeds to gardens beneath which rivers flow, but those who disbelieve enjoy themselves and eat as grazing livestock eat, and the Fire will be a residence for them\",\"pickthall\":\"Lo! Allah will cause those who believe and do good works to enter Gardens underneath which rivers flow; while those who disbelieve take their comfort in this life and eat even as the cattle eat, and the Fire is their habitation\"},{\"a\":13,\"w\":[\"وَكَأَيِّن\",\"مِّن\",\"قَرۡيَةٍ\",\"هِيَ\",\"أَشَدُّ\",\"قُوَّةٗ\",\"مِّن\",\"قَرۡيَتِكَ\",\"ٱلَّتِيٓ\",\"أَخۡرَجَتۡكَ\",\"أَهۡلَكۡنَٰهُمۡ\",\"فَلَا\",\"نَاصِرَ\",\"لَهُمۡ\"],\"t\":\"And how many a city was stronger than your city [Makkah] which drove you out? We destroyed them; and there was no helper for them\",\"pickthall\":\"And how many a township stronger than thy township (O Muhammad) which hath cast thee out, have We destroyed, and they had no helper\"},{\"a\":14,\"w\":[\"أَفَمَن\",\"كَانَ\",\"عَلَىٰ\",\"بَيِّنَةٖ\",\"مِّن\",\"رَّبِّهِۦ\",\"كَمَن\",\"زُيِّنَ\",\"لَهُۥ\",\"سُوٓءُ\",\"عَمَلِهِۦ\",\"وَٱتَّبَعُوٓاْ\",\"أَهۡوَآءَهُم\"],\"t\":\"So is he who is on clear evidence from his Lord like him to whom the evil of his work has been made attractive and they follow their [own] desires\",\"pickthall\":\"Is he who relieth on a clear proof from his Lord like those for whom the evil that they do is beautified while they follow their own lusts\"},{\"a\":15,\"w\":[\"مَّثَلُ\",\"ٱلۡجَنَّةِ\",\"ٱلَّتِي\",\"وُعِدَ\",\"ٱلۡمُتَّقُونَۖ\",\"فِيهَآ\",\"أَنۡهَٰرٞ\",\"مِّن\",\"مَّآءٍ\",\"غَيۡرِ\",\"ءَاسِنٖ\",\"وَأَنۡهَٰرٞ\",\"مِّن\",\"لَّبَنٖ\",\"لَّمۡ\",\"يَتَغَيَّرۡ\",\"طَعۡمُهُۥ\",\"وَأَنۡهَٰرٞ\",\"مِّنۡ\",\"خَمۡرٖ\",\"لَّذَّةٖ\",\"لِّلشَّـٰرِبِينَ\",\"وَأَنۡهَٰرٞ\",\"مِّنۡ\",\"عَسَلٖ\",\"مُّصَفّٗىۖ\",\"وَلَهُمۡ\",\"فِيهَا\",\"مِن\",\"كُلِّ\",\"ٱلثَّمَرَٰتِ\",\"وَمَغۡفِرَةٞ\",\"مِّن\",\"رَّبِّهِمۡۖ\",\"كَمَنۡ\",\"هُوَ\",\"خَٰلِدٞ\",\"فِي\",\"ٱلنَّارِ\",\"وَسُقُواْ\",\"مَآءً\",\"حَمِيمٗا\",\"فَقَطَّعَ\",\"أَمۡعَآءَهُمۡ\"],\"t\":\"Is the description of Paradise, which the righteous are promised, wherein are rivers of water unaltered, rivers of milk the taste of which never changes, rivers of wine delicious to those who drink, and rivers of purified honey, in which they will have from all [kinds of] fruits and forgiveness from their Lord, like [that of] those who abide eternally in the Fire and are given to drink scalding water that will sever their intestines\",\"pickthall\":\"A similitude of the Garden which those who keep their duty (to Allah) are promised: Therein are rivers of water unpolluted, and rivers of milk whereof the flavour changeth not, and rivers of wine delicious to the drinkers, and rivers of clear-run honey; therein for them is every kind of fruit, with pardon from their Lord. (Are those who enjoy all this) like those who are immortal in the Fire and are given boiling water to drink so that it teareth their bowels\"},{\"a\":16,\"w\":[\"وَمِنۡهُم\",\"مَّن\",\"يَسۡتَمِعُ\",\"إِلَيۡكَ\",\"حَتَّىٰٓ\",\"إِذَا\",\"خَرَجُواْ\",\"مِنۡ\",\"عِندِكَ\",\"قَالُواْ\",\"لِلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡعِلۡمَ\",\"مَاذَا\",\"قَالَ\",\"ءَانِفًاۚ\",\"أُوْلَـٰٓئِكَ\",\"ٱلَّذِينَ\",\"طَبَعَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"قُلُوبِهِمۡ\",\"وَٱتَّبَعُوٓاْ\",\"أَهۡوَآءَهُمۡ\"],\"t\":\"And among them, [O Muhammad], are those who listen to you, until when they depart from you, they say to those who were given knowledge, \\\"What has he said just now?\\\" Those are the ones of whom Allah has sealed over their hearts and who have followed their [own] desires\",\"pickthall\":\"Among them are some who give ear unto thee (Muhammad) till, when they go forth from thy presence they say unto those who have been given knowledge: What was that he said just now? Those are they whose hearts Allah hath sealed, and they follow their own lusts\"},{\"a\":17,\"w\":[\"وَٱلَّذِينَ\",\"ٱهۡتَدَوۡاْ\",\"زَادَهُمۡ\",\"هُدٗى\",\"وَءَاتَىٰهُمۡ\",\"تَقۡوَىٰهُمۡ\"],\"t\":\"And those who are guided - He increases them in guidance and gives them their righteousness\",\"pickthall\":\"While as for those who walk aright, He addeth to their guidance, and giveth them their protection (against evil)\"},{\"a\":18,\"w\":[\"فَهَلۡ\",\"يَنظُرُونَ\",\"إِلَّا\",\"ٱلسَّاعَةَ\",\"أَن\",\"تَأۡتِيَهُم\",\"بَغۡتَةٗۖ\",\"فَقَدۡ\",\"جَآءَ\",\"أَشۡرَاطُهَاۚ\",\"فَأَنَّىٰ\",\"لَهُمۡ\",\"إِذَا\",\"جَآءَتۡهُمۡ\",\"ذِكۡرَىٰهُمۡ\"],\"t\":\"Then do they await except that the Hour should come upon them unexpectedly? But already there have come [some of] its indications. Then what good to them, when it has come, will be their remembrance\",\"pickthall\":\"Await they aught save the Hour, that it should come upon them unawares? And the beginnings thereof have already come. But how, when it hath come upon them, can they take their warning\"},{\"a\":19,\"w\":[\"فَٱعۡلَمۡ\",\"أَنَّهُۥ\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"ٱللَّهُ\",\"وَٱسۡتَغۡفِرۡ\",\"لِذَنۢبِكَ\",\"وَلِلۡمُؤۡمِنِينَ\",\"وَٱلۡمُؤۡمِنَٰتِۗ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"مُتَقَلَّبَكُمۡ\",\"وَمَثۡوَىٰكُمۡ\"],\"t\":\"So know, [O Muhammad], that there is no deity except Allah and ask forgiveness for your sin and for the believing men and believing women. And Allah knows of your movement and your resting place\",\"pickthall\":\"So know (O Muhammad) that there is no Allah save Allah, and ask forgiveness for thy sin and for believing men and believing women. Allah knoweth (both) your place of turmoil and your place of rest\"},{\"a\":20,\"w\":[\"وَيَقُولُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَوۡلَا\",\"نُزِّلَتۡ\",\"سُورَةٞۖ\",\"فَإِذَآ\",\"أُنزِلَتۡ\",\"سُورَةٞ\",\"مُّحۡكَمَةٞ\",\"وَذُكِرَ\",\"فِيهَا\",\"ٱلۡقِتَالُ\",\"رَأَيۡتَ\",\"ٱلَّذِينَ\",\"فِي\",\"قُلُوبِهِم\",\"مَّرَضٞ\",\"يَنظُرُونَ\",\"إِلَيۡكَ\",\"نَظَرَ\",\"ٱلۡمَغۡشِيِّ\",\"عَلَيۡهِ\",\"مِنَ\",\"ٱلۡمَوۡتِۖ\",\"فَأَوۡلَىٰ\",\"لَهُمۡ\"],\"t\":\"Those who believe say, \\\"Why has a surah not been sent down? But when a precise surah is revealed and fighting is mentioned therein, you see those in whose hearts is hypocrisy looking at you with a look of one overcome by death. And more appropriate for them [would have been]\",\"pickthall\":\"And those who believe say: If only a surah were revealed! But when a decisive surah is revealed and war is mentioned therein, thou seest those in whose hearts is a disease looking at thee with the look of men fainting unto death. Therefor woe unto them\"},{\"a\":21,\"w\":[\"طَاعَةٞ\",\"وَقَوۡلٞ\",\"مَّعۡرُوفٞۚ\",\"فَإِذَا\",\"عَزَمَ\",\"ٱلۡأَمۡرُ\",\"فَلَوۡ\",\"صَدَقُواْ\",\"ٱللَّهَ\",\"لَكَانَ\",\"خَيۡرٗا\",\"لَّهُمۡ\"],\"t\":\"Obedience and good words. And when the matter [of fighting] was determined, if they had been true to Allah, it would have been better for them\",\"pickthall\":\"Obedience and a civil word. Then, when the matter is determined, if they are loyal to Allah it will be well for them\"},{\"a\":22,\"w\":[\"فَهَلۡ\",\"عَسَيۡتُمۡ\",\"إِن\",\"تَوَلَّيۡتُمۡ\",\"أَن\",\"تُفۡسِدُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَتُقَطِّعُوٓاْ\",\"أَرۡحَامَكُمۡ\"],\"t\":\"So would you perhaps, if you turned away, cause corruption on earth and sever your [ties of] relationship\",\"pickthall\":\"Would ye then, if ye were given the command, work corruption in the land and sever your ties of kinship\"},{\"a\":23,\"w\":[\"أُوْلَـٰٓئِكَ\",\"ٱلَّذِينَ\",\"لَعَنَهُمُ\",\"ٱللَّهُ\",\"فَأَصَمَّهُمۡ\",\"وَأَعۡمَىٰٓ\",\"أَبۡصَٰرَهُمۡ\"],\"t\":\"Those [who do so] are the ones that Allah has cursed, so He deafened them and blinded their vision\",\"pickthall\":\"Such are they whom Allah curseth so that He deafeneth them and maketh blind their eyes\"},{\"a\":24,\"w\":[\"أَفَلَا\",\"يَتَدَبَّرُونَ\",\"ٱلۡقُرۡءَانَ\",\"أَمۡ\",\"عَلَىٰ\",\"قُلُوبٍ\",\"أَقۡفَالُهَآ\"],\"t\":\"Then do they not reflect upon the Qur'an, or are there locks upon [their] hearts\",\"pickthall\":\"Will they then not meditate on the Qur'an, or are there locks on the hearts\"},{\"a\":25,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"ٱرۡتَدُّواْ\",\"عَلَىٰٓ\",\"أَدۡبَٰرِهِم\",\"مِّنۢ\",\"بَعۡدِ\",\"مَا\",\"تَبَيَّنَ\",\"لَهُمُ\",\"ٱلۡهُدَى\",\"ٱلشَّيۡطَٰنُ\",\"سَوَّلَ\",\"لَهُمۡ\",\"وَأَمۡلَىٰ\",\"لَهُمۡ\"],\"t\":\"Indeed, those who reverted back [to disbelief] after guidance had become clear to them - Satan enticed them and prolonged hope for them\",\"pickthall\":\"Lo! those who turn back after the guidance hath been manifested unto them, Satan hath seduced them, and He giveth them the rein\"},{\"a\":26,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَالُواْ\",\"لِلَّذِينَ\",\"كَرِهُواْ\",\"مَا\",\"نَزَّلَ\",\"ٱللَّهُ\",\"سَنُطِيعُكُمۡ\",\"فِي\",\"بَعۡضِ\",\"ٱلۡأَمۡرِۖ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"إِسۡرَارَهُمۡ\"],\"t\":\"That is because they said to those who disliked what Allah sent down, \\\"We will obey you in part of the matter.\\\" And Allah knows what they conceal\",\"pickthall\":\"That is because they say unto those who hate what Allah hath revealed: We will obey you in some matters; and Allah knoweth their secret talk\"},{\"a\":27,\"w\":[\"فَكَيۡفَ\",\"إِذَا\",\"تَوَفَّتۡهُمُ\",\"ٱلۡمَلَـٰٓئِكَةُ\",\"يَضۡرِبُونَ\",\"وُجُوهَهُمۡ\",\"وَأَدۡبَٰرَهُمۡ\"],\"t\":\"Then how [will it be] when the angels take them in death, striking their faces and their backs\",\"pickthall\":\"Then how (will it be with them) when the angels gather them, smiting their faces and their backs\"},{\"a\":28,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمُ\",\"ٱتَّبَعُواْ\",\"مَآ\",\"أَسۡخَطَ\",\"ٱللَّهَ\",\"وَكَرِهُواْ\",\"رِضۡوَٰنَهُۥ\",\"فَأَحۡبَطَ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"That is because they followed what angered Allah and disliked [what earns] His pleasure, so He rendered worthless their deeds\",\"pickthall\":\"That will be because they followed that which angereth Allah, and hated that which pleaseth Him. Therefor He hath made their actions vain\"},{\"a\":29,\"w\":[\"أَمۡ\",\"حَسِبَ\",\"ٱلَّذِينَ\",\"فِي\",\"قُلُوبِهِم\",\"مَّرَضٌ\",\"أَن\",\"لَّن\",\"يُخۡرِجَ\",\"ٱللَّهُ\",\"أَضۡغَٰنَهُمۡ\"],\"t\":\"Or do those in whose hearts is disease think that Allah would never expose their [feelings of] hatred\",\"pickthall\":\"Or do those in whose hearts is a disease deem that Allah will not bring to light their (secret) hates\"},{\"a\":30,\"w\":[\"وَلَوۡ\",\"نَشَآءُ\",\"لَأَرَيۡنَٰكَهُمۡ\",\"فَلَعَرَفۡتَهُم\",\"بِسِيمَٰهُمۡۚ\",\"وَلَتَعۡرِفَنَّهُمۡ\",\"فِي\",\"لَحۡنِ\",\"ٱلۡقَوۡلِۚ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"أَعۡمَٰلَكُمۡ\"],\"t\":\"And if We willed, We could show them to you, and you would know them by their mark; but you will surely know them by the tone of [their] speech. And Allah knows your deeds\",\"pickthall\":\"And if We would, We could show them unto thee (Muhammad) so that thou shouldst know them surely by their marks. And thou shalt know them by the burden of their talk. And Allah knoweth your deeds\"},{\"a\":31,\"w\":[\"وَلَنَبۡلُوَنَّكُمۡ\",\"حَتَّىٰ\",\"نَعۡلَمَ\",\"ٱلۡمُجَٰهِدِينَ\",\"مِنكُمۡ\",\"وَٱلصَّـٰبِرِينَ\",\"وَنَبۡلُوَاْ\",\"أَخۡبَارَكُمۡ\"],\"t\":\"And We will surely test you until We make evident those who strive among you [for the cause of Allah] and the patient, and We will test your affairs\",\"pickthall\":\"And verily We shall try you till We know those of you who strive hard (for the cause of Allah) and the steadfast, and till We test your record\"},{\"a\":32,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَصَدُّواْ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَشَآقُّواْ\",\"ٱلرَّسُولَ\",\"مِنۢ\",\"بَعۡدِ\",\"مَا\",\"تَبَيَّنَ\",\"لَهُمُ\",\"ٱلۡهُدَىٰ\",\"لَن\",\"يَضُرُّواْ\",\"ٱللَّهَ\",\"شَيۡـٔٗا\",\"وَسَيُحۡبِطُ\",\"أَعۡمَٰلَهُمۡ\"],\"t\":\"Indeed, those who disbelieved and averted [people] from the path of Allah and opposed the Messenger after guidance had become clear to them - never will they harm Allah at all, and He will render worthless their deeds\",\"pickthall\":\"Lo! those who disbelieve and turn from the way of Allah and oppose the messenger after the guidance hath been manifested unto them, they hurt Allah not a jot, and He will make their actions fruitless\"},{\"a\":33,\"w\":[\"۞يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"أَطِيعُواْ\",\"ٱللَّهَ\",\"وَأَطِيعُواْ\",\"ٱلرَّسُولَ\",\"وَلَا\",\"تُبۡطِلُوٓاْ\",\"أَعۡمَٰلَكُمۡ\"],\"t\":\"O you who have believed, obey Allah and obey the Messenger and do not invalidate your deeds\",\"pickthall\":\"O ye who believe! Obey Allah and obey the messenger, and render not your actions vain\"},{\"a\":34,\"w\":[\"إِنَّ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"وَصَدُّواْ\",\"عَن\",\"سَبِيلِ\",\"ٱللَّهِ\",\"ثُمَّ\",\"مَاتُواْ\",\"وَهُمۡ\",\"كُفَّارٞ\",\"فَلَن\",\"يَغۡفِرَ\",\"ٱللَّهُ\",\"لَهُمۡ\"],\"t\":\"Indeed, those who disbelieved and averted [people] from the path of Allah and then died while they were disbelievers - never will Allah forgive them\",\"pickthall\":\"Lo! those who disbelieve and turn from the way of Allah and then die disbelievers, Allah surely will not pardon them\"},{\"a\":35,\"w\":[\"فَلَا\",\"تَهِنُواْ\",\"وَتَدۡعُوٓاْ\",\"إِلَى\",\"ٱلسَّلۡمِ\",\"وَأَنتُمُ\",\"ٱلۡأَع
