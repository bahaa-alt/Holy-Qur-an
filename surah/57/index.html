auses the day to enter the night, and he is Knowing of that within the breasts\",\"pickthall\":\"He causeth the night to pass into the day, and He causeth the day to pass into the night, and He is knower of all that is in the breasts\"},{\"a\":7,\"w\":[\"ءَامِنُواْ\",\"بِٱللَّهِ\",\"وَرَسُولِهِۦ\",\"وَأَنفِقُواْ\",\"مِمَّا\",\"جَعَلَكُم\",\"مُّسۡتَخۡلَفِينَ\",\"فِيهِۖ\",\"فَٱلَّذِينَ\",\"ءَامَنُواْ\",\"مِنكُمۡ\",\"وَأَنفَقُواْ\",\"لَهُمۡ\",\"أَجۡرٞ\",\"كَبِيرٞ\"],\"t\":\"Believe in Allah and His Messenger and spend out of that in which He has made you successors. For those who have believed among you and spent, there will be a great reward\",\"pickthall\":\"Believe in Allah and His messenger, and spend of that whereof He hath made you trustees; and such of you as believe and spend (aright), theirs will be a great reward\"},{\"a\":8,\"w\":[\"وَمَا\",\"لَكُمۡ\",\"لَا\",\"تُؤۡمِنُونَ\",\"بِٱللَّهِ\",\"وَٱلرَّسُولُ\",\"يَدۡعُوكُمۡ\",\"لِتُؤۡمِنُواْ\",\"بِرَبِّكُمۡ\",\"وَقَدۡ\",\"أَخَذَ\",\"مِيثَٰقَكُمۡ\",\"إِن\",\"كُنتُم\",\"مُّؤۡمِنِينَ\"],\"t\":\"And why do you not believe in Allah while the Messenger invites you to believe in your Lord and He has taken your covenant, if you should [truly] be believers\",\"pickthall\":\"What aileth you that ye believe not in Allah, when the messenger calleth you to believe in your Lord, and He hath already made a covenant with you, if ye are believers\"},{\"a\":9,\"w\":[\"هُوَ\",\"ٱلَّذِي\",\"يُنَزِّلُ\",\"عَلَىٰ\",\"عَبۡدِهِۦٓ\",\"ءَايَٰتِۭ\",\"بَيِّنَٰتٖ\",\"لِّيُخۡرِجَكُم\",\"مِّنَ\",\"ٱلظُّلُمَٰتِ\",\"إِلَى\",\"ٱلنُّورِۚ\",\"وَإِنَّ\",\"ٱللَّهَ\",\"بِكُمۡ\",\"لَرَءُوفٞ\",\"رَّحِيمٞ\"],\"t\":\"It is He who sends down upon His Servant [Muhammad] verses of clear evidence that He may bring you out from darknesses into the light. And indeed, Allah is to you Kind and Merciful\",\"pickthall\":\"He it is Who sendeth down clear revelations unto His slave, that He may bring you forth from darkness unto light; and lo! for you, Allah is Full of Pity, Merciful\"},{\"a\":10,\"w\":[\"وَمَا\",\"لَكُمۡ\",\"أَلَّا\",\"تُنفِقُواْ\",\"فِي\",\"سَبِيلِ\",\"ٱللَّهِ\",\"وَلِلَّهِ\",\"مِيرَٰثُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۚ\",\"لَا\",\"يَسۡتَوِي\",\"مِنكُم\",\"مَّنۡ\",\"أَنفَقَ\",\"مِن\",\"قَبۡلِ\",\"ٱلۡفَتۡحِ\",\"وَقَٰتَلَۚ\",\"أُوْلَـٰٓئِكَ\",\"أَعۡظَمُ\",\"دَرَجَةٗ\",\"مِّنَ\",\"ٱلَّذِينَ\",\"أَنفَقُواْ\",\"مِنۢ\",\"بَعۡدُ\",\"وَقَٰتَلُواْۚ\",\"وَكُلّٗا\",\"وَعَدَ\",\"ٱللَّهُ\",\"ٱلۡحُسۡنَىٰۚ\",\"وَٱللَّهُ\",\"بِمَا\",\"تَعۡمَلُونَ\",\"خَبِيرٞ\"],\"t\":\"And why do you not spend in the cause of Allah while to Allah belongs the heritage of the heavens and the earth? Not equal among you are those who spent before the conquest [of Makkah] and fought [and those who did so after it]. Those are greater in degree than they who spent afterwards and fought. But to all Allah has promised the best [reward]. And Allah, with what you do, is Acquainted\",\"pickthall\":\"And what aileth you that ye spend not in the way of Allah when unto Allah belongeth the inheritance of the heavens and the earth? Those who spent and fought before the victory are not upon a level (with the rest of you). Such are greater in rank than those who spent and fought afterwards. Unto each hath Allah promised good. And Allah is Informed of what ye do\"},{\"a\":11,\"w\":[\"مَّن\",\"ذَا\",\"ٱلَّذِي\",\"يُقۡرِضُ\",\"ٱللَّهَ\",\"قَرۡضًا\",\"حَسَنٗا\",\"فَيُضَٰعِفَهُۥ\",\"لَهُۥ\",\"وَلَهُۥٓ\",\"أَجۡرٞ\",\"كَرِيمٞ\"],\"t\":\"Who is it that would loan Allah a goodly loan so He will multiply it for him and he will have a noble reward\",\"pickthall\":\"Who is he that will lend unto Allah a goodly loan, that He may double it for him and his may be a rich reward\"},{\"a\":12,\"w\":[\"يَوۡمَ\",\"تَرَى\",\"ٱلۡمُؤۡمِنِينَ\",\"وَٱلۡمُؤۡمِنَٰتِ\",\"يَسۡعَىٰ\",\"نُورُهُم\",\"بَيۡنَ\",\"أَيۡدِيهِمۡ\",\"وَبِأَيۡمَٰنِهِمۖ\",\"بُشۡرَىٰكُمُ\",\"ٱلۡيَوۡمَ\",\"جَنَّـٰتٞ\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَاۚ\",\"ذَٰلِكَ\",\"هُوَ\",\"ٱلۡفَوۡزُ\",\"ٱلۡعَظِيمُ\"],\"t\":\"On the Day you see the believing men and believing women, their light proceeding before them and on their right, [it will be said], \\\"Your good tidings today are [of] gardens beneath which rivers flow, wherein you will abide eternally.\\\" That is what is the great attainment\",\"pickthall\":\"On the day when thou (Muhammad) wilt see the believers, men and women, their light shining forth before them and on their right hands, (and wilt hear it said unto them): Glad news for you this day: Gardens underneath which rivers flow, wherein ye are immortal. That is the supreme triumph\"},{\"a\":13,\"w\":[\"يَوۡمَ\",\"يَقُولُ\",\"ٱلۡمُنَٰفِقُونَ\",\"وَٱلۡمُنَٰفِقَٰتُ\",\"لِلَّذِينَ\",\"ءَامَنُواْ\",\"ٱنظُرُونَا\",\"نَقۡتَبِسۡ\",\"مِن\",\"نُّورِكُمۡ\",\"قِيلَ\",\"ٱرۡجِعُواْ\",\"وَرَآءَكُمۡ\",\"فَٱلۡتَمِسُواْ\",\"نُورٗاۖ\",\"فَضُرِبَ\",\"بَيۡنَهُم\",\"بِسُورٖ\",\"لَّهُۥ\",\"بَابُۢ\",\"بَاطِنُهُۥ\",\"فِيهِ\",\"ٱلرَّحۡمَةُ\",\"وَظَٰهِرُهُۥ\",\"مِن\",\"قِبَلِهِ\",\"ٱلۡعَذَابُ\"],\"t\":\"On the [same] Day the hypocrite men and hypocrite women will say to those who believed, \\\"Wait for us that we may acquire some of your light.\\\" It will be said, \\\"Go back behind you and seek light.\\\" And a wall will be placed between them with a door, its interior containing mercy, but on the outside of it is torment\",\"pickthall\":\"On the day when the hypocritical men and the hypocritical women will say unto those who believe: Look on us that we may borrow from your light! it will be said: Go back and seek for light! Then there will separate them a wall wherein is a gate, the inner side whereof containeth mercy, while the outer side thereof is toward the doom\"},{\"a\":14,\"w\":[\"يُنَادُونَهُمۡ\",\"أَلَمۡ\",\"نَكُن\",\"مَّعَكُمۡۖ\",\"قَالُواْ\",\"بَلَىٰ\",\"وَلَٰكِنَّكُمۡ\",\"فَتَنتُمۡ\",\"أَنفُسَكُمۡ\",\"وَتَرَبَّصۡتُمۡ\",\"وَٱرۡتَبۡتُمۡ\",\"وَغَرَّتۡكُمُ\",\"ٱلۡأَمَانِيُّ\",\"حَتَّىٰ\",\"جَآءَ\",\"أَمۡرُ\",\"ٱللَّهِ\",\"وَغَرَّكُم\",\"بِٱللَّهِ\",\"ٱلۡغَرُورُ\"],\"t\":\"The hypocrites will call to the believers, \\\"Were we not with you?\\\" They will say, \\\"Yes, but you afflicted yourselves and awaited [misfortune for us] and doubted, and wishful thinking deluded you until there came the command of Allah. And the Deceiver deceived you concerning Allah\",\"pickthall\":\"They will cry unto them (saying): Were we not with you? They will say: Yea, verily; but ye tempted one another, and hesitated, and doubted, and vain desires beguiled you till the ordinance of Allah came to pass; and the deceiver deceived you concerning Allah\"},{\"a\":15,\"w\":[\"فَٱلۡيَوۡمَ\",\"لَا\",\"يُؤۡخَذُ\",\"مِنكُمۡ\",\"فِدۡيَةٞ\",\"وَلَا\",\"مِنَ\",\"ٱلَّذِينَ\",\"كَفَرُواْۚ\",\"مَأۡوَىٰكُمُ\",\"ٱلنَّارُۖ\",\"هِيَ\",\"مَوۡلَىٰكُمۡۖ\",\"وَبِئۡسَ\",\"ٱلۡمَصِيرُ\"],\"t\":\"So today no ransom will be taken from you or from those who disbelieved. Your refuge is the Fire. It is most worthy of you, and wretched is the destination\",\"pickthall\":\"So this day no ransom can be taken from you nor from those who disbelieved. Your home is the Fire; that is your patron, and a hapless journey's end\"},{\"a\":16,\"w\":[\"۞أَلَمۡ\",\"يَأۡنِ\",\"لِلَّذِينَ\",\"ءَامَنُوٓاْ\",\"أَن\",\"تَخۡشَعَ\",\"قُلُوبُهُمۡ\",\"لِذِكۡرِ\",\"ٱللَّهِ\",\"وَمَا\",\"نَزَلَ\",\"مِنَ\",\"ٱلۡحَقِّ\",\"وَلَا\",\"يَكُونُواْ\",\"كَٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡكِتَٰبَ\",\"مِن\",\"قَبۡلُ\",\"فَطَالَ\",\"عَلَيۡهِمُ\",\"ٱلۡأَمَدُ\",\"فَقَسَتۡ\",\"قُلُوبُهُمۡۖ\",\"وَكَثِيرٞ\",\"مِّنۡهُمۡ\",\"فَٰسِقُونَ\"],\"t\":\"Has the time not come for those who have believed that their hearts should become humbly submissive at the remembrance of Allah and what has come down of the truth? And let them not be like those who were given the Scripture before, and a long period passed over them, so their hearts hardened; and many of them are defiantly disobedient\",\"pickthall\":\"Is not the time ripe for the hearts of those who believe to submit to Allah's reminder and to the truth which is revealed, that they become not as those who received the scripture of old but the term was prolonged for them and so their hearts were hardened, and many of them are evil-livers\"},{\"a\":17,\"w\":[\"ٱعۡلَمُوٓاْ\",\"أَنَّ\",\"ٱللَّهَ\",\"يُحۡيِ\",\"ٱلۡأَرۡضَ\",\"بَعۡدَ\",\"مَوۡتِهَاۚ\",\"قَدۡ\",\"بَيَّنَّا\",\"لَكُمُ\",\"ٱلۡأٓيَٰتِ\",\"لَعَلَّكُمۡ\",\"تَعۡقِلُونَ\"],\"t\":\"Know that Allah gives life to the earth after its lifelessness. We have made clear to you the signs; perhaps you will understand\",\"pickthall\":\"Know that Allah quickeneth the earth after its death. We have made clear Our revelations for you, that haply ye may understand\"},{\"a\":18,\"w\":[\"إِنَّ\",\"ٱلۡمُصَّدِّقِينَ\",\"وَٱلۡمُصَّدِّقَٰتِ\",\"وَأَقۡرَضُواْ\",\"ٱللَّهَ\",\"قَرۡضًا\",\"حَسَنٗا\",\"يُضَٰعَفُ\",\"لَهُمۡ\",\"وَلَهُمۡ\",\"أَجۡرٞ\",\"كَرِيمٞ\"],\"t\":\"Indeed, the men who practice charity and the women who practice charity and [they who] have loaned Allah a goodly loan - it will be multiplied for them, and they will have a noble reward\",\"pickthall\":\"Lo! those who give alms, both men and women, and lend unto Allah a goodly loan, it will be doubled for them, and theirs will be a rich reward\"},{\"a\":19,\"w\":[\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"بِٱللَّهِ\",\"وَرُسُلِهِۦٓ\",\"أُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلصِّدِّيقُونَۖ\",\"وَٱلشُّهَدَآءُ\",\"عِندَ\",\"رَبِّهِمۡ\",\"لَهُمۡ\",\"أَجۡرُهُمۡ\",\"وَنُورُهُمۡۖ\",\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"وَكَذَّبُواْ\",\"بِـَٔايَٰتِنَآ\",\"أُوْلَـٰٓئِكَ\",\"أَصۡحَٰبُ\",\"ٱلۡجَحِيمِ\"],\"t\":\"And those who have believed in Allah and His messengers - those are [in the ranks of] the supporters of truth and the martyrs, with their Lord. For them is their reward and their light. But those who have disbelieved and denied Our verses - those are the companions of Hellfire\",\"pickthall\":\"And those who believe in Allah and His messengers, they are the loyal, and the martyrs are with their Lord; they have their reward and their light; while as for those who disbelieve and deny Our revelations, they are owners of hell-fire\"},{\"a\":20,\"w\":[\"ٱعۡلَمُوٓاْ\",\"أَنَّمَا\",\"ٱلۡحَيَوٰةُ\",\"ٱلدُّنۡيَا\",\"لَعِبٞ\",\"وَلَهۡوٞ\",\"وَزِينَةٞ\",\"وَتَفَاخُرُۢ\",\"بَيۡنَكُمۡ\",\"وَتَكَاثُرٞ\",\"فِي\",\"ٱلۡأَمۡوَٰلِ\",\"وَٱلۡأَوۡلَٰدِۖ\",\"كَمَثَلِ\",\"غَيۡثٍ\",\"أَعۡجَبَ\",\"ٱلۡكُفَّارَ\",\"نَبَاتُهُۥ\",\"ثُمَّ\",\"يَهِيجُ\",\"فَتَرَىٰهُ\",\"مُصۡفَرّٗا\",\"ثُمَّ\",\"يَكُونُ\",\"حُطَٰمٗاۖ\",\"وَفِي\",\"ٱلۡأٓخِرَةِ\",\"عَذَابٞ\",\"شَدِيدٞ\",\"وَمَغۡفِرَةٞ\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرِضۡوَٰنٞۚ\",\"وَمَا\",\"ٱلۡحَيَوٰةُ\",\"ٱلدُّنۡيَآ\",\"إِلَّا\",\"مَتَٰعُ\",\"ٱلۡغُرُورِ\"],\"t\":\"Know that the life of this world is but amusement and diversion and adornment and boasting to one another and competition in increase of wealth and children - like the example of a rain whose [resulting] plant growth pleases the tillers; then it dries and you see it turned yellow; then it becomes [scattered] debris. And in the Hereafter is severe punishment and forgiveness from Allah and approval. And what is the worldly life except the enjoyment of delusion\",\"pickthall\":\"Know that the life of the world is only play, and idle talk, and pageantry, and boasting among you, and rivalry in respect of wealth and children; as the likeness of vegetation after rain, whereof the growth is pleasing to the husbandman, but afterward it drieth up and thou seest it turning yellow, then it becometh straw. And in the Hereafter there is grievous punishment, and (also) forgiveness from Allah and His good pleasure, whereas the life of the world is but matter of illusion\"},{\"a\":21,\"w\":[\"سَابِقُوٓاْ\",\"إِلَىٰ\",\"مَغۡفِرَةٖ\",\"مِّن\",\"رَّبِّكُمۡ\",\"وَجَنَّةٍ\",\"عَرۡضُهَا\",\"كَعَرۡضِ\",\"ٱلسَّمَآءِ\",\"وَٱلۡأَرۡضِ\",\"أُعِدَّتۡ\",\"لِلَّذِينَ\",\"ءَامَنُواْ\",\"بِٱللَّهِ\",\"وَرُسُلِهِۦۚ\",\"ذَٰلِكَ\",\"فَضۡلُ\",\"ٱللَّهِ\",\"يُؤۡتِيهِ\",\"مَن\",\"يَشَآءُۚ\",\"وَٱللَّهُ\",\"ذُو\",\"ٱلۡفَضۡلِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"Race toward forgiveness from your Lord and a Garden whose width is like the width of the heavens and earth, prepared for those who believed in Allah and His messengers. That is the bounty of Allah which He gives to whom He wills, and Allah is the possessor of great bounty\",\"pickthall\":\"Race one with another for forgiveness from your Lord and a Garden whereof the breadth is as the breadth of the heavens and the earth, which is in store for those who believe in Allah and His messengers. Such is the bounty of Allah, which He bestoweth upon whom He will, and Allah is of Infinite Bounty\"},{\"a\":22,\"w\":[\"مَآ\",\"أَصَابَ\",\"مِن\",\"مُّصِيبَةٖ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَلَا\",\"فِيٓ\",\"أَنفُسِكُمۡ\",\"إِلَّا\",\"فِي\",\"كِتَٰبٖ\",\"مِّن\",\"قَبۡلِ\",\"أَن\",\"نَّبۡرَأَهَآۚ\",\"إِنَّ\",\"ذَٰلِكَ\",\"عَلَى\",\"ٱللَّهِ\",\"يَسِيرٞ\"],\"t\":\"No disaster strikes upon the earth or among yourselves except that it is in a register before We bring it into being - indeed that, for Allah, is easy\",\"pickthall\":\"Naught of disaster befalleth in the earth or in yourselves but it is in a Book before we bring it into being - Lo! that is easy for Allah\"},{\"a\":23,\"w\":[\"لِّكَيۡلَا\",\"تَأۡسَوۡاْ\",\"عَلَىٰ\",\"مَا\",\"فَاتَكُمۡ\",\"وَلَا\",\"تَفۡرَحُواْ\",\"بِمَآ\",\"ءَاتَىٰكُمۡۗ\",\"وَٱللَّهُ\",\"لَا\",\"يُحِبُّ\",\"كُلَّ\",\"مُخۡتَالٖ\",\"فَخُورٍ\"],\"t\":\"In order that you not despair over what has eluded you and not exult [in pride] over what He has given you. And Allah does not like everyone self-deluded and boastful\",\"pickthall\":\"That ye grieve not for the sake of that which hath escaped you, nor yet exult because of that which hath been given. Allah loveth not all prideful boasters\"},{\"a\":24,\"w\":[\"ٱلَّذِينَ\",\"يَبۡخَلُونَ\",\"وَيَأۡمُرُونَ\",\"ٱلنَّاسَ\",\"بِٱلۡبُخۡلِۗ\",\"وَمَن\",\"يَتَوَلَّ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"هُوَ\",\"ٱلۡغَنِيُّ\",\"ٱلۡحَمِيدُ\"],\"t\":\"[Those] who are stingy and enjoin upon people stinginess. And whoever turns away - then indeed, Allah is the Free of need, the Praiseworthy\",\"pickthall\":\"Who hoard and who enjoin upon the people avarice. And whosoever turneth away, still Allah is the Absolute, the Owner of Praise\"},{\"a\":25,\"w\":[\"لَقَدۡ\",\"أَرۡسَلۡنَا\",\"رُسُلَنَا\",\"بِٱلۡبَيِّنَٰتِ\",\"وَأَنزَلۡنَا\",\"مَعَهُمُ\",\"ٱلۡكِتَٰبَ\",\"وَٱلۡمِيزَانَ\",\"لِيَقُومَ\",\"ٱلنَّاسُ\",\"بِٱلۡقِسۡطِۖ\",\"وَأَنزَلۡنَا\",\"ٱلۡحَدِيدَ\",\"فِيهِ\",\"بَأۡسٞ\",\"شَدِيدٞ\",\"وَمَنَٰفِعُ\",\"لِلنَّاسِ\",\"وَلِيَعۡلَمَ\",\"ٱللَّهُ\",\"مَن\",\"يَنصُرُهُۥ\",\"وَرُسُلَهُۥ\",\"بِٱلۡغَيۡبِۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"قَوِيٌّ\",\"عَزِيزٞ\"],\"t\":\"We have already sent Our messengers with clear evidences and sent down with them the Scripture and the balance that the people may maintain [their affairs] in justice. And We sent down iron, wherein is great military might and benefits for the people, and so that Allah may make evident those who support Him and His messengers unseen. Indeed, Allah is Powerful and Exalted in Might\",\"pickthall\":\"We verily sent Our messengers with clear proofs, and revealed with them the Scripture and the Balance, that mankind may observe right measure; and He revealed iron, wherein is mighty power and (many) uses for mankind, and that Allah may know him who helpeth Him and His messengers, though unseen. Lo! Allah is Strong, Almighty\"},{\"a\":26,\"w\":[\"وَلَقَدۡ\",\"أَرۡسَلۡنَا\",\"نُوحٗا\",\"وَإِبۡرَٰهِيمَ\",\"وَجَعَلۡنَا\",\"فِي\",\"ذُرِّيَّتِهِمَا\",\"ٱلنُّبُوَّةَ\",\"وَٱلۡكِتَٰبَۖ\",\"فَمِنۡهُم\",\"مُّهۡتَدٖۖ\",\"وَكَثِيرٞ\",\"مِّنۡهُمۡ\",\"فَٰسِقُونَ\"],\"t\":\"And We have already sent Noah and Abraham and placed in their descendants prophethood and scripture; and among them is he who is guided, but many of them are defiantly disobedient\",\"pickthall\":\"And We verily sent Noah and Abraham and placed the prophethood and the scripture among their seed, and among them there is he who goeth right, but many of them are evil-livers\"},{\"a\":27,\"w\":[\"ثُمَّ\",\"قَفَّيۡنَا\",\"عَلَىٰٓ\",\"ءَاثَٰرِهِم\",\"بِرُسُلِنَا\",\"وَقَفَّيۡنَا\",\"بِعِيسَى\",\"ٱبۡنِ\",\"مَرۡيَمَ\",\"وَءَاتَيۡنَٰهُ\",\"ٱلۡإِنجِيلَۖ\",\"وَجَعَلۡنَا\",\"فِي\",\"قُلُوبِ\",\"ٱلَّذِينَ\",\"ٱتَّبَعُوهُ\",\"رَأۡفَةٗ\",\"وَرَحۡمَةٗۚ\",\"وَرَهۡبَانِيَّةً\",\"ٱبۡتَدَعُوهَا\",\"مَا\",\"كَتَبۡنَٰهَا\",\"عَلَيۡهِمۡ\",\"إِلَّا\",\"ٱبۡتِغَآءَ\",\"رِضۡوَٰنِ\",\"ٱللَّهِ\",\"فَمَا\",\"رَعَوۡهَا\",\"حَقَّ\",\"رِعَايَتِهَاۖ\",\"فَـَٔاتَيۡنَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"مِنۡهُمۡ\",\"أَجۡرَهُمۡۖ\",\"وَكَثِيرٞ\",\"مِّنۡهُمۡ\",\"فَٰسِقُونَ\"],\"t\":\"Then We sent following their footsteps Our messengers and followed [them] with Jesus, the son of Mary, and gave him the Gospel. And We placed in the hearts of those who followed him compassion and mercy and monasticism, which they innovated; We did not prescribe it for them except [that they did so] seeking the approval of Allah. But they did not observe it with due observance. So We gave the ones who believed among them their reward, but many of them are defiantly disobedient\",\"pickthall\":\"Then We caused Our messengers to follow in their footsteps; and We caused Jesus, son of Mary, to follow, and gave him the Gospel, and placed compassion and mercy in the hearts of those who followed him. But monasticism they invented - We ordained it not for them - only seeking Allah's pleasure, and they observed it not with right observance. So We give those of them who believe their reward, but many of them are evil-livers\"},{\"a\":28,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّقُواْ\",\"ٱللَّهَ\",\"وَءَامِنُواْ\",\"بِرَسُولِهِۦ\",\"يُؤۡتِكُمۡ\",\"كِفۡلَيۡنِ\",\"مِن\",\"رَّحۡمَتِهِۦ\",\"وَيَجۡعَل\",\"لَّكُمۡ\",\"نُورٗا\",\"تَمۡشُونَ\",\"بِهِۦ\",\"وَيَغۡفِرۡ\",\"لَكُمۡۚ\",\"وَٱللَّهُ\",\"غَفُورٞ\",\"رَّحِيمٞ\"],\"t\":\"O you who have believed, fear Allah and believe in His Messenger; He will [then] give you a double portion of His mercy and make for you a light by which you will walk and forgive you; and Allah is Forgiving and Merciful\",\"pickthall\":\"O ye who believe! Be mindful of your duty to Allah and put faith in His messenger. He will give you twofold of His mercy and will appoint for you a light wherein ye shall walk, and will forgive you. Allah is Forgiving, Merciful\"},{\"a\":29,\"w\":[\"لِّئَلَّا\",\"يَعۡلَمَ\",\"أَهۡلُ\",\"ٱلۡكِتَٰبِ\",\"أَلَّا\",\"يَقۡدِرُونَ\",\"عَلَىٰ\",\"شَيۡءٖ\",\"مِّن\",\"فَضۡلِ\",\"ٱللَّهِ\",\"وَأَنَّ\",\"ٱلۡفَضۡلَ\",\"بِيَدِ\",\"ٱللَّهِ\",\"يُؤۡتِيهِ\",\"مَن\",\"يَشَآءُۚ\",\"وَٱللَّهُ\",\"ذُو\",\"ٱلۡفَضۡلِ\",\"ٱلۡعَظِيمِ\"],\"t\":\"[This is] so that the People of the Scripture may know that they are not able [to obtain] anything from the bounty of Allah and that [all] bounty is in the hand of Allah; He gives it to whom He wills. And Allah is the possessor of great bounty\",\"pickthall\":\"That the People of the Scripture may know that they control naught of the bounty of Allah, but that the bounty is in Allah's hand to give to whom He will. And Allah is of Infinite Bounty\"}]}]}]}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[81329,[\"/Holy-Qur-an/_next/static/chunks/1cmyd72bfjn9u.js\",\"/Holy-Qur-an/_next/static/chunks/3carqqy-2sdbp.js\"],\"IconMark\"]\nd:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Al-Hadid — Surah 57 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"h
