lds\"},{\"a\":3,\"w\":[\"أَمۡ\",\"يَقُولُونَ\",\"ٱفۡتَرَىٰهُۚ\",\"بَلۡ\",\"هُوَ\",\"ٱلۡحَقُّ\",\"مِن\",\"رَّبِّكَ\",\"لِتُنذِرَ\",\"قَوۡمٗا\",\"مَّآ\",\"أَتَىٰهُم\",\"مِّن\",\"نَّذِيرٖ\",\"مِّن\",\"قَبۡلِكَ\",\"لَعَلَّهُمۡ\",\"يَهۡتَدُونَ\"],\"t\":\"Or do they say, \\\"He invented it\\\"? Rather, it is the truth from your Lord, [O Muhammad], that you may warn a people to whom no warner has come before you [so] perhaps they will be guided\"},{\"a\":4,\"w\":[\"ٱللَّهُ\",\"ٱلَّذِي\",\"خَلَقَ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضَ\",\"وَمَا\",\"بَيۡنَهُمَا\",\"فِي\",\"سِتَّةِ\",\"أَيَّامٖ\",\"ثُمَّ\",\"ٱسۡتَوَىٰ\",\"عَلَى\",\"ٱلۡعَرۡشِۖ\",\"مَا\",\"لَكُم\",\"مِّن\",\"دُونِهِۦ\",\"مِن\",\"وَلِيّٖ\",\"وَلَا\",\"شَفِيعٍۚ\",\"أَفَلَا\",\"تَتَذَكَّرُونَ\"],\"t\":\"It is Allah who created the heavens and the earth and whatever is between them in six days; then He established Himself above the Throne. You have not besides Him any protector or any intercessor; so will you not be reminded\"},{\"a\":5,\"w\":[\"يُدَبِّرُ\",\"ٱلۡأَمۡرَ\",\"مِنَ\",\"ٱلسَّمَآءِ\",\"إِلَى\",\"ٱلۡأَرۡضِ\",\"ثُمَّ\",\"يَعۡرُجُ\",\"إِلَيۡهِ\",\"فِي\",\"يَوۡمٖ\",\"كَانَ\",\"مِقۡدَارُهُۥٓ\",\"أَلۡفَ\",\"سَنَةٖ\",\"مِّمَّا\",\"تَعُدُّونَ\"],\"t\":\"He arranges [each] matter from the heaven to the earth; then it will ascend to Him in a Day, the extent of which is a thousand years of those which you count\"},{\"a\":6,\"w\":[\"ذَٰلِكَ\",\"عَٰلِمُ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِ\",\"ٱلۡعَزِيزُ\",\"ٱلرَّحِيمُ\"],\"t\":\"That is the Knower of the unseen and the witnessed, the Exalted in Might, the Merciful\"},{\"a\":7,\"w\":[\"ٱلَّذِيٓ\",\"أَحۡسَنَ\",\"كُلَّ\",\"شَيۡءٍ\",\"خَلَقَهُۥۖ\",\"وَبَدَأَ\",\"خَلۡقَ\",\"ٱلۡإِنسَٰنِ\",\"مِن\",\"طِينٖ\"],\"t\":\"Who perfected everything which He created and began the creation of man from clay\"},{\"a\":8,\"w\":[\"ثُمَّ\",\"جَعَلَ\",\"نَسۡلَهُۥ\",\"مِن\",\"سُلَٰلَةٖ\",\"مِّن\",\"مَّآءٖ\",\"مَّهِينٖ\"],\"t\":\"Then He made his posterity out of the extract of a liquid disdained\"},{\"a\":9,\"w\":[\"ثُمَّ\",\"سَوَّىٰهُ\",\"وَنَفَخَ\",\"فِيهِ\",\"مِن\",\"رُّوحِهِۦۖ\",\"وَجَعَلَ\",\"لَكُمُ\",\"ٱلسَّمۡعَ\",\"وَٱلۡأَبۡصَٰرَ\",\"وَٱلۡأَفۡـِٔدَةَۚ\",\"قَلِيلٗا\",\"مَّا\",\"تَشۡكُرُونَ\"],\"t\":\"Then He proportioned him and breathed into him from His [created] soul and made for you hearing and vision and hearts; little are you grateful\"},{\"a\":10,\"w\":[\"وَقَالُوٓاْ\",\"أَءِذَا\",\"ضَلَلۡنَا\",\"فِي\",\"ٱلۡأَرۡضِ\",\"أَءِنَّا\",\"لَفِي\",\"خَلۡقٖ\",\"جَدِيدِۭۚ\",\"بَلۡ\",\"هُم\",\"بِلِقَآءِ\",\"رَبِّهِمۡ\",\"كَٰفِرُونَ\"],\"t\":\"And they say, \\\"When we are lost within the earth, will we indeed be [recreated] in a new creation?\\\" Rather, they are, in [the matter of] the meeting with their Lord, disbelievers\"},{\"a\":11,\"w\":[\"۞قُلۡ\",\"يَتَوَفَّىٰكُم\",\"مَّلَكُ\",\"ٱلۡمَوۡتِ\",\"ٱلَّذِي\",\"وُكِّلَ\",\"بِكُمۡ\",\"ثُمَّ\",\"إِلَىٰ\",\"رَبِّكُمۡ\",\"تُرۡجَعُونَ\"],\"t\":\"Say, \\\"The angel of death will take you who has been entrusted with you. Then to your Lord you will be returned\"},{\"a\":12,\"w\":[\"وَلَوۡ\",\"تَرَىٰٓ\",\"إِذِ\",\"ٱلۡمُجۡرِمُونَ\",\"نَاكِسُواْ\",\"رُءُوسِهِمۡ\",\"عِندَ\",\"رَبِّهِمۡ\",\"رَبَّنَآ\",\"أَبۡصَرۡنَا\",\"وَسَمِعۡنَا\",\"فَٱرۡجِعۡنَا\",\"نَعۡمَلۡ\",\"صَٰلِحًا\",\"إِنَّا\",\"مُوقِنُونَ\"],\"t\":\"If you could but see when the criminals are hanging their heads before their Lord, [saying], \\\"Our Lord, we have seen and heard, so return us [to the world]; we will work righteousness. Indeed, we are [now] certain\"},{\"a\":13,\"w\":[\"وَلَوۡ\",\"شِئۡنَا\",\"لَأٓتَيۡنَا\",\"كُلَّ\",\"نَفۡسٍ\",\"هُدَىٰهَا\",\"وَلَٰكِنۡ\",\"حَقَّ\",\"ٱلۡقَوۡلُ\",\"مِنِّي\",\"لَأَمۡلَأَنَّ\",\"جَهَنَّمَ\",\"مِنَ\",\"ٱلۡجِنَّةِ\",\"وَٱلنَّاسِ\",\"أَجۡمَعِينَ\"],\"t\":\"And if We had willed, We could have given every soul its guidance, but the word from Me will come into effect [that] \\\"I will surely fill Hell with jinn and people all together\"},{\"a\":14,\"w\":[\"فَذُوقُواْ\",\"بِمَا\",\"نَسِيتُمۡ\",\"لِقَآءَ\",\"يَوۡمِكُمۡ\",\"هَٰذَآ\",\"إِنَّا\",\"نَسِينَٰكُمۡۖ\",\"وَذُوقُواْ\",\"عَذَابَ\",\"ٱلۡخُلۡدِ\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"So taste [punishment] because you forgot the meeting of this, your Day; indeed, We have [accordingly] forgotten you. And taste the punishment of eternity for what you used to do\"},{\"a\":15,\"w\":[\"إِنَّمَا\",\"يُؤۡمِنُ\",\"بِـَٔايَٰتِنَا\",\"ٱلَّذِينَ\",\"إِذَا\",\"ذُكِّرُواْ\",\"بِهَا\",\"خَرُّواْۤ\",\"سُجَّدٗاۤ\",\"وَسَبَّحُواْ\",\"بِحَمۡدِ\",\"رَبِّهِمۡ\",\"وَهُمۡ\",\"لَا\",\"يَسۡتَكۡبِرُونَ۩\"],\"t\":\"Only those believe in Our verses who, when they are reminded by them, fall down in prostration and exalt [Allah] with praise of their Lord, and they are not arrogant\"},{\"a\":16,\"w\":[\"تَتَجَافَىٰ\",\"جُنُوبُهُمۡ\",\"عَنِ\",\"ٱلۡمَضَاجِعِ\",\"يَدۡعُونَ\",\"رَبَّهُمۡ\",\"خَوۡفٗا\",\"وَطَمَعٗا\",\"وَمِمَّا\",\"رَزَقۡنَٰهُمۡ\",\"يُنفِقُونَ\"],\"t\":\"They arise from [their] beds; they supplicate their Lord in fear and aspiration, and from what We have provided them, they spend\"},{\"a\":17,\"w\":[\"فَلَا\",\"تَعۡلَمُ\",\"نَفۡسٞ\",\"مَّآ\",\"أُخۡفِيَ\",\"لَهُم\",\"مِّن\",\"قُرَّةِ\",\"أَعۡيُنٖ\",\"جَزَآءَۢ\",\"بِمَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"And no soul knows what has been hidden for them of comfort for eyes as reward for what they used to do\"},{\"a\":18,\"w\":[\"أَفَمَن\",\"كَانَ\",\"مُؤۡمِنٗا\",\"كَمَن\",\"كَانَ\",\"فَاسِقٗاۚ\",\"لَّا\",\"يَسۡتَوُۥنَ\"],\"t\":\"Then is one who was a believer like one who was defiantly disobedient? They are not equal\"},{\"a\":19,\"w\":[\"أَمَّا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"فَلَهُمۡ\",\"جَنَّـٰتُ\",\"ٱلۡمَأۡوَىٰ\",\"نُزُلَۢا\",\"بِمَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"As for those who believed and did righteous deeds, for them will be the Gardens of Refuge as accommodation for what they used to do\"},{\"a\":20,\"w\":[\"وَأَمَّا\",\"ٱلَّذِينَ\",\"فَسَقُواْ\",\"فَمَأۡوَىٰهُمُ\",\"ٱلنَّارُۖ\",\"كُلَّمَآ\",\"أَرَادُوٓاْ\",\"أَن\",\"يَخۡرُجُواْ\",\"مِنۡهَآ\",\"أُعِيدُواْ\",\"فِيهَا\",\"وَقِيلَ\",\"لَهُمۡ\",\"ذُوقُواْ\",\"عَذَابَ\",\"ٱلنَّارِ\",\"ٱلَّذِي\",\"كُنتُم\",\"بِهِۦ\",\"تُكَذِّبُونَ\"],\"t\":\"But as for those who defiantly disobeyed, their refuge is the Fire. Every time they wish to emerge from it, they will be returned to it while it is said to them, \\\"Taste the punishment of the Fire which you used to deny\"},{\"a\":21,\"w\":[\"وَلَنُذِيقَنَّهُم\",\"مِّنَ\",\"ٱلۡعَذَابِ\",\"ٱلۡأَدۡنَىٰ\",\"دُونَ\",\"ٱلۡعَذَابِ\",\"ٱلۡأَكۡبَرِ\",\"لَعَلَّهُمۡ\",\"يَرۡجِعُونَ\"],\"t\":\"And we will surely let them taste the nearer punishment short of the greater punishment that perhaps they will repent\"},{\"a\":22,\"w\":[\"وَمَنۡ\",\"أَظۡلَمُ\",\"مِمَّن\",\"ذُكِّرَ\",\"بِـَٔايَٰتِ\",\"رَبِّهِۦ\",\"ثُمَّ\",\"أَعۡرَضَ\",\"عَنۡهَآۚ\",\"إِنَّا\",\"مِنَ\",\"ٱلۡمُجۡرِمِينَ\",\"مُنتَقِمُونَ\"],\"t\":\"And who is more unjust than one who is reminded of the verses of his Lord; then he turns away from them? Indeed We, from the criminals, will take retribution\"},{\"a\":23,\"w\":[\"وَلَقَدۡ\",\"ءَاتَيۡنَا\",\"مُوسَى\",\"ٱلۡكِتَٰبَ\",\"فَلَا\",\"تَكُن\",\"فِي\",\"مِرۡيَةٖ\",\"مِّن\",\"لِّقَآئِهِۦۖ\",\"وَجَعَلۡنَٰهُ\",\"هُدٗى\",\"لِّبَنِيٓ\",\"إِسۡرَـٰٓءِيلَ\"],\"t\":\"And We certainly gave Moses the Scripture, so do not be in doubt over his meeting. And we made the Torah guidance for the Children of Israel\"},{\"a\":24,\"w\":[\"وَجَعَلۡنَا\",\"مِنۡهُمۡ\",\"أَئِمَّةٗ\",\"يَهۡدُونَ\",\"بِأَمۡرِنَا\",\"لَمَّا\",\"صَبَرُواْۖ\",\"وَكَانُواْ\",\"بِـَٔايَٰتِنَا\",\"يُوقِنُونَ\"],\"t\":\"And We made from among them leaders guiding by Our command when they were patient and [when] they were certain of Our signs\"},{\"a\":25,\"w\":[\"إِنَّ\",\"رَبَّكَ\",\"هُوَ\",\"يَفۡصِلُ\",\"بَيۡنَهُمۡ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِ\",\"فِيمَا\",\"كَانُواْ\",\"فِيهِ\",\"يَخۡتَلِفُونَ\"],\"t\":\"Indeed, your Lord will judge between them on the Day of Resurrection concerning that over which they used to differ\"},{\"a\":26,\"w\":[\"أَوَلَمۡ\",\"يَهۡدِ\",\"لَهُمۡ\",\"كَمۡ\",\"أَهۡلَكۡنَا\",\"مِن\",\"قَبۡلِهِم\",\"مِّنَ\",\"ٱلۡقُرُونِ\",\"يَمۡشُونَ\",\"فِي\",\"مَسَٰكِنِهِمۡۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَٰتٍۚ\",\"أَفَلَا\",\"يَسۡمَعُونَ\"],\"t\":\"Has it not become clear to them how many generations We destroyed before them, [as] they walk among their dwellings? Indeed in that are signs; then do they not hear\"},{\"a\":27,\"w\":[\"أَوَلَمۡ\",\"يَرَوۡاْ\",\"أَنَّا\",\"نَسُوقُ\",\"ٱلۡمَآءَ\",\"إِلَى\",\"ٱلۡأَرۡضِ\",\"ٱلۡجُرُزِ\",\"فَنُخۡرِجُ\",\"بِهِۦ\",\"زَرۡعٗا\",\"تَأۡكُلُ\",\"مِنۡهُ\",\"أَنۡعَٰمُهُمۡ\",\"وَأَنفُسُهُمۡۚ\",\"أَفَلَا\",\"يُبۡصِرُونَ\"],\"t\":\"Have they not seen that We drive the water [in clouds] to barren land and bring forth thereby crops from which their livestock eat and [they] themselves? Then do they not see\"},{\"a\":28,\"w\":[\"وَيَقُولُونَ\",\"مَتَىٰ\",\"هَٰذَا\",\"ٱلۡفَتۡحُ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"And they say, \\\"When will be this conquest, if you should be truthful\"},{\"a\":29,\"w\":[\"قُلۡ\",\"يَوۡمَ\",\"ٱلۡفَتۡحِ\",\"لَا\",\"يَنفَعُ\",\"ٱلَّذِينَ\",\"كَفَرُوٓاْ\",\"إِيمَٰنُهُمۡ\",\"وَلَا\",\"هُمۡ\",\"يُنظَرُونَ\"],\"t\":\"Say, [O Muhammad], \\\"On the Day of Conquest the belief of those who had disbelieved will not benefit them, nor will they be reprieved\"},{\"a\":30,\"w\":[\"فَأَعۡرِضۡ\",\"عَنۡهُمۡ\",\"وَٱنتَظِرۡ\",\"إِنَّهُم\",\"مُّنتَظِرُونَ\"],\"t\":\"So turn away from them and wait. Indeed, they are waiting\"}]}]}]}]]}]\n18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1c:I[81329,[\"/Holy-Qur-an/_next/static/chunks/37nnnny7spsh1.js\"],\"IconMark\"]\n16:null\n1a:[[\"$\",\"title\",\"0\",{\"
