\"},{\"a\":12,\"w\":[\"وَلَوۡ\",\"تَرَىٰٓ\",\"إِذِ\",\"ٱلۡمُجۡرِمُونَ\",\"نَاكِسُواْ\",\"رُءُوسِهِمۡ\",\"عِندَ\",\"رَبِّهِمۡ\",\"رَبَّنَآ\",\"أَبۡصَرۡنَا\",\"وَسَمِعۡنَا\",\"فَٱرۡجِعۡنَا\",\"نَعۡمَلۡ\",\"صَٰلِحًا\",\"إِنَّا\",\"مُوقِنُونَ\"],\"t\":\"If you could but see when the criminals are hanging their heads before their Lord, [saying], \\\"Our Lord, we have seen and heard, so return us [to the world]; we will work righteousness. Indeed, we are [now] certain\",\"pickthall\":\"Couldst thou but see when the guilty hang their heads before their Lord, (and say): Our Lord! We have now seen and heard, so send us back; we will do right, now we are sure\"},{\"a\":13,\"w\":[\"وَلَوۡ\",\"شِئۡنَا\",\"لَأٓتَيۡنَا\",\"كُلَّ\",\"نَفۡسٍ\",\"هُدَىٰهَا\",\"وَلَٰكِنۡ\",\"حَقَّ\",\"ٱلۡقَوۡلُ\",\"مِنِّي\",\"لَأَمۡلَأَنَّ\",\"جَهَنَّمَ\",\"مِنَ\",\"ٱلۡجِنَّةِ\",\"وَٱلنَّاسِ\",\"أَجۡمَعِينَ\"],\"t\":\"And if We had willed, We could have given every soul its guidance, but the word from Me will come into effect [that] \\\"I will surely fill Hell with jinn and people all together\",\"pickthall\":\"And if We had so willed, We could have given every soul its guidance, but the word from Me concerning evildoers took effect: that I will fill hell with the jinn and mankind together\"},{\"a\":14,\"w\":[\"فَذُوقُواْ\",\"بِمَا\",\"نَسِيتُمۡ\",\"لِقَآءَ\",\"يَوۡمِكُمۡ\",\"هَٰذَآ\",\"إِنَّا\",\"نَسِينَٰكُمۡۖ\",\"وَذُوقُواْ\",\"عَذَابَ\",\"ٱلۡخُلۡدِ\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"So taste [punishment] because you forgot the meeting of this, your Day; indeed, We have [accordingly] forgotten you. And taste the punishment of eternity for what you used to do\",\"pickthall\":\"So taste (the evil of your deeds). Forasmuch as ye forgot the meeting of this your day, lo! We forget you. Taste the doom of immortality because of what ye used to do\"},{\"a\":15,\"w\":[\"إِنَّمَا\",\"يُؤۡمِنُ\",\"بِـَٔايَٰتِنَا\",\"ٱلَّذِينَ\",\"إِذَا\",\"ذُكِّرُواْ\",\"بِهَا\",\"خَرُّواْۤ\",\"سُجَّدٗاۤ\",\" etreat - a welcome (in reward) for what they used to do\"},{\"a\":20,\"w\":[\"وَأَمَّا\",\"ٱلَّذِينَ\",\"فَسَقُواْ\",\"فَمَأۡوَىٰهُمُ\",\"ٱلنَّارُۖ\",\"كُلَّمَآ\",\"أَرَادُوٓاْ\",\"أَن\",\"يَخۡرُجُواْ\",\"مِنۡهَآ\",\"أُعِيدُواْ\",\"فِيهَا\",\"وَقِيلَ\",\"لَهُمۡ\",\"ذُوقُواْ\",\"عَذَابَ\",\"ٱلنَّارِ\",\"ٱلَّذِي\",\"كُنتُم\",\"بِهِۦ\",\"تُكَذِّبُونَ\"],\"t\":\"But as for those who defiantly disobeyed, their refuge is the Fire. Every time they wish to emerge from it, they will be returned to it while it is said to them, \\\"Taste the punishment of the Fire which you used to deny\",\"pickthall\":\"And as for those who do evil, their retreat is the Fire. Whenever they desire to issue forth from thence, they are brought back thither. Unto them it is said: Taste the torment of the Fire which ye used to deny\"},{\"a\":21,\"w\":[\"وَلَنُذِيقَنَّهُم\",\"مِّنَ\",\"ٱلۡعَذَابِ\",\"ٱلۡأَدۡنَىٰ\",\"دُونَ\",\"ٱلۡعَذَابِ\",\"ٱلۡأَكۡبَرِ\",\"لَعَلَّهُمۡ\",\"يَرۡجِعُونَ\"],\"t\":\"And we will surely let them taste the nearer punishment short of the greater punishment that perhaps they will repent\",\"pickthall\":\"And verily We make them taste the lower punishment before the greater, that haply they may return\"},{\"a\":22,\"w\":[\"وَمَنۡ\",\"أَظۡلَمُ\",\"مِمَّن\",\"ذُكِّرَ\",\"بِـَٔايَٰتِ\",\"رَبِّهِۦ\",\"ثُمَّ\",\"أَعۡرَضَ\",\"عَنۡهَآۚ\",\"إِنَّا\",\"مِنَ\",\"ٱلۡمُجۡرِمِينَ\",\"مُنتَقِمُونَ\"],\"t\":\"And who is more unjust than one who is reminded of the verses of his Lord; then he turns away from them? Indeed We, from the criminals, will take retribution\",\"pickthall\":\"And who doth greater wrong than he who is reminded of the revelations of his Lord, then turneth from them. Lo! We shall requite the guilty\"},{\"a\":23,\"w\":[\"وَلَقَدۡ\",\"ءَاتَيۡنَا\",\"مُوسَى\",\"ٱلۡكِتَٰبَ\",\"فَلَا\",\"تَكُن\",\"فِي\",\"مِرۡيَةٖ\",\"مِّن\",\"لِّقَآئِهِۦۖ\",\"وَجَعَلۡنَٰهُ\",\"هُدٗى\",\"لِّبَنِيٓ\",\"إِسۡرَـٰٓءِيلَ\"],\"t\":\"And We certainly gave Moses the Scripture, so do not be in doubt over his meeting. And we made the Torah guidance for the Children of Israel\",\"pickthall\":\"We verily gave Moses the Scripture; so be not ye in doubt of his receiving it; and We appointed it a guidance for the Children of Israel\"},{\"a\":24,\"w\":[\"وَجَعَلۡنَا\",\"مِنۡهُمۡ\",\"أَئِمَّةٗ\",\"يَهۡدُونَ\",\"بِأَمۡرِنَا\",\"لَمَّا\",\"صَبَرُواْۖ\",\"وَكَانُواْ\",\"بِـَٔايَٰتِنَا\",\"يُوقِنُونَ\"],\"t\":\"And We made from among them leaders guiding by Our command when they were patient and [when] they were certain of Our signs\",\"pickthall\":\"And when they became steadfast and believed firmly in Our revelations, We appointed from among them leaders who guided by Our command\"},{\"a\":25,\"w\":[\"إِنَّ\",\"رَبَّكَ\",\"هُوَ\",\"يَفۡصِلُ\",\"بَيۡنَهُمۡ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِ\",\"فِيمَا\",\"كَانُواْ\",\"فِيهِ\",\"يَخۡتَلِفُونَ\"],\"t\":\"Indeed, your Lord will judge between them on the Day of Resurrection concerning that over which they used to differ\",\"pickthall\":\"Lo! thy Lord will judge between them on the Day of Resurrection concerning that wherein they used to differ\"},{\"a\":26,\"w\":[\"أَوَلَمۡ\",\"يَهۡدِ\",\"لَهُمۡ\",\"كَمۡ\",\"أَهۡلَكۡنَا\",\"مِن\",\"قَبۡلِهِم\",\"مِّنَ\",\"ٱلۡقُرُونِ\",\"يَمۡشُونَ\",\"فِي\",\"مَسَٰكِنِهِمۡۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَٰتٍۚ\",\"أَفَلَا\",\"يَسۡمَعُونَ\"],\"t\":\"Has it not become clear to them how many generations We destroyed before them, [as] they walk among their dwellings? Indeed in that are signs; then do they not hear\",\"pickthall\":\"Is it not a guidance for them (to observe) how many generations We destroyed before them, amid whose dwelling places they do walk? Lo! therein verily are portents! Will they not then heed\"},{\"a\":27,\"w\":[\"أَوَلَمۡ\",\"يَرَوۡاْ\",\"أَنَّا\",\"نَسُوقُ\",\"ٱلۡمَآءَ\",\"إِلَى\",\"ٱلۡأَرۡضِ\",\"ٱلۡجُرُزِ\",\"فَنُخۡرِجُ\",\"بِهِۦ\",\"زَرۡعٗا\",\"تَأۡكُلُ\",\"مِنۡهُ\",\"أَنۡعَٰمُهُمۡ\",\"وَأَنفُسُهُمۡۚ\",\"أَفَلَا\",\"يُبۡصِرُونَ\"],\"t\":\"Have they not seen that We
