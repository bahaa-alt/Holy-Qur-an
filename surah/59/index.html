\"لَمۡ\",\"يَحۡتَسِبُواْۖ\",\"وَقَذَفَ\",\"فِي\",\"قُلُوبِهِمُ\",\"ٱلرُّعۡبَۚ\",\"يُخۡرِبُونَ\",\"بُيُوتَهُم\",\"بِأَيۡدِيهِمۡ\",\"وَأَيۡدِي\",\"ٱلۡمُؤۡمِنِينَ\",\"فَٱعۡتَبِرُواْ\",\"يَـٰٓأُوْلِي\",\"ٱلۡأَبۡصَٰرِ\"],\"t\":\"It is He who expelled the ones who disbelieved among the People of the Scripture from their homes at the first gathering. You did not think they would leave, and they thought that their fortresses would protect them from Allah; but [the decree of] Allah came upon them from where they had not expected, and He cast terror into their hearts [so] they destroyed their houses by their [own] hands and the hands of the believers. So take warning, O people of vision\"},{\"a\":3,\"w\":[\"وَلَوۡلَآ\",\"أَن\",\"كَتَبَ\",\"ٱللَّهُ\",\"عَلَيۡهِمُ\",\"ٱلۡجَلَآءَ\",\"لَعَذَّبَهُمۡ\",\"فِي\",\"ٱلدُّنۡيَاۖ\",\"وَلَهُمۡ\",\"فِي\",\"ٱلۡأٓخِرَةِ\",\"عَذَابُ\",\"ٱلنَّارِ\"],\"t\":\"And if not that Allah had decreed for them evacuation, He would have punished them in [this] world, and for them in the Hereafter is the punishment of the Fire\"},{\"a\":4,\"w\":[\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"شَآقُّواْ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥۖ\",\"وَمَن\",\"يُشَآقِّ\",\"ٱللَّهَ\",\"فَإِنَّ\",\"ٱللَّهَ\",\"شَدِيدُ\",\"ٱلۡعِقَابِ\"],\"t\":\"That is because they opposed Allah and His Messenger. And whoever opposes Allah - then indeed, Allah is severe in penalty\"},{\"a\":5,\"w\":[\"مَا\",\"قَطَعۡتُم\",\"مِّن\",\"لِّينَةٍ\",\"أَوۡ\",\"تَرَكۡتُمُوهَا\",\"قَآئِمَةً\",\"عَلَىٰٓ\",\"أُصُولِهَا\",\"فَبِإِذۡنِ\",\"ٱللَّهِ\",\"وَلِيُخۡزِيَ\",\"ٱلۡفَٰسِقِينَ\"],\"t\":\"Whatever you have cut down of [their] palm trees or left standing on their trunks - it was by permission of Allah and so He would disgrace the defiantly disobedient\"},{\"a\":6,\"w\":[\"وَمَآ\",\"أَفَآءَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"رَسُولِهِۦ\",\"مِنۡهُمۡ\",\"فَمَآ\",\"أَوۡجَفۡتُمۡ\",\"عَلَيۡهِ\",\"مِنۡ\",\"خَيۡلٖ\",\"وَلَا\",\"رِكَابٖ\",\"وَلَٰكِنَّ\",\"ٱللَّهَ\",\"يُسَلِّطُ\",\"رُسُلَهُۥ\",\"عَلَىٰ\",\"مَن\",\"يَشَآءُۚ\",\"وَٱللَّهُ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٞ\"],\"t\":\"And what Allah restored [of property] to His Messenger from them - you did not spur for it [in an expedition] any horses or camels, but Allah gives His messengers power over whom He wills, and Allah is over all things competent\"},{\"a\":7,\"w\":[\"مَّآ\",\"أَفَآءَ\",\"ٱللَّهُ\",\"عَلَىٰ\",\"رَسُولِهِۦ\",\"مِنۡ\",\"أَهۡلِ\",\"ٱلۡقُرَىٰ\",\"فَلِلَّهِ\",\"وَلِلرَّسُولِ\",\"وَلِذِي\",\"ٱلۡقُرۡبَىٰ\",\"وَٱلۡيَتَٰمَىٰ\",\"وَٱلۡمَسَٰكِينِ\",\"وَٱبۡنِ\",\"ٱلسَّبِيلِ\",\"كَيۡ\",\"لَا\",\"يَكُونَ\",\"دُولَةَۢ\",\"بَيۡنَ\",\"ٱلۡأَغۡنِيَآءِ\",\"مِنكُمۡۚ\",\"وَمَآ\",\"ءَاتَىٰكُمُ\",\"ٱلرَّسُولُ\",\"فَخُذُوهُ\",\"وَمَا\",\"نَهَىٰكُمۡ\",\"عَنۡهُ\",\"فَٱنتَهُواْۚ\",\"وَٱتَّقُواْ\",\"ٱللَّهَۖ\",\"إِنَّ\",\"ٱللَّهَ\",\"شَدِيدُ\",\"ٱلۡعِقَابِ\"],\"t\":\"And what Allah restored to His Messenger from the people of the towns - it is for Allah and for the Messenger and for [his] near relatives and orphans and the [stranded] traveler - so that it will not be a perpetual distribution among the rich from among you. And whatever the Messenger has given you - take; and what he has forbidden you - refrain from. And fear Allah; indeed, Allah is severe in penalty\"},{\"a\":8,\"w\":[\"لِلۡفُقَرَآءِ\",\"ٱلۡمُهَٰجِرِينَ\",\"ٱلَّذِينَ\",\"أُخۡرِجُواْ\",\"مِن\",\"دِيَٰرِهِمۡ\",\"وَأَمۡوَٰلِهِمۡ\",\"يَبۡتَغُونَ\",\"فَضۡلٗا\",\"مِّنَ\",\"ٱللَّهِ\",\"وَرِضۡوَٰنٗا\",\"وَيَنصُرُونَ\",\"ٱللَّهَ\",\"وَرَسُولَهُۥٓۚ\",\"أُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلصَّـٰدِقُونَ\"],\"t\":\"For the poor emigrants who were expelled from their homes and their properties, seeking bounty from Allah and [His] approval and supporting Allah and His Messenger, [there is also a share]. Those are the truthful\"},{\"a\":9,\"w\":[\"وَٱلَّذِينَ\",\"تَبَوَّءُو\",\"ٱلدَّارَ\",\"وَٱلۡإِيمَٰنَ\",\"مِن\",\"قَبۡلِهِمۡ\",\"يُحِبُّونَ\",\"مَنۡ\",\"هَاجَرَ\",\"إِلَيۡهِمۡ\",\"وَلَا\",\"يَجِدُونَ\",\"فِي\",\"صُدُورِهِمۡ\",\"حَاجَةٗ\",\"مِّمَّآ\",\"أُوتُواْ\",\"وَيُؤۡثِرُونَ\",\"عَلَىٰٓ\",\"أَنفُسِهِمۡ\",\"وَلَوۡ\",\"كَانَ\",\"بِهِمۡ\",\"خَصَاصَةٞۚ\",\"وَمَن\",\"يُوقَ\",\"شُحَّ\",\"نَفۡسِهِۦ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡمُفۡلِحُونَ\"],\"t\":\"And [also for] those who were settled in al-Madinah and [adopted] the faith before them. They love those who emigrated to them and find not any want in their breasts of what the emigrants were given but give [them] preference over themselves, even though they are in privation. And whoever is protected from the stinginess of his soul - it is those who will be the successful\"},{\"a\":10,\"w\":[\"وَٱلَّذِينَ\",\"جَآءُو\",\"مِنۢ\",\"بَعۡدِهِمۡ\",\"يَقُولُونَ\",\"رَبَّنَا\",\"ٱغۡفِرۡ\",\"لَنَا\",\"وَلِإِخۡوَٰنِنَا\",\"ٱلَّذِينَ\",\"سَبَقُونَا\",\"بِٱلۡإِيمَٰنِ\",\"وَلَا\",\"تَجۡعَلۡ\",\"فِي\",\"قُلُوبِنَا\",\"غِلّٗا\",\"لِّلَّذِينَ\",\"ءَامَنُواْ\",\"رَبَّنَآ\",\"إِنَّكَ\",\"رَءُوفٞ\",\"رَّحِيمٌ\"],\"t\":\"And [there is a share for] those who came after them, saying, \\\"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful\"},{\"a\":11,\"w\":[\"۞أَلَمۡ\",\"تَرَ\",\"إِلَى\",\"ٱلَّذِينَ\",\"نَافَقُواْ\",\"يَقُولُونَ\",\"لِإِخۡوَٰنِهِمُ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"مِنۡ\",\"أَهۡلِ\",\"ٱلۡكِتَٰبِ\",\"لَئِنۡ\",\"أُخۡرِجۡتُمۡ\",\"لَنَخۡرُجَنَّ\",\"مَعَكُمۡ\",\"وَلَا\",\"نُطِيعُ\",\"فِيكُمۡ\",\"أَحَدًا\",\"أَبَدٗا\",\"وَإِن\",\"قُوتِلۡتُمۡ\",\"لَنَنصُرَنَّكُمۡ\",\"وَٱللَّهُ\",\"يَشۡهَدُ\",\"إِنَّهُمۡ\",\"لَكَٰذِبُونَ\"],\"t\":\"Have you not considered those who practice hypocrisy, saying to their brothers who have disbelieved among the People of the Scripture, \\\"If you are expelled, we will surely leave with you, and we will not obey, in regard to you, anyone - ever; and if you are fought, we will surely aid you.\\\" But Allah testifies that they are liars\"},{\"a\":12,\"w\":[\"لَئِنۡ\",\"أُخۡرِجُواْ\",\"لَا\",\"يَخۡرُجُونَ\",\"مَعَهُمۡ\",\"وَلَئِن\",\"قُوتِلُواْ\",\"لَا\",\"يَنصُرُونَهُمۡ\",\"وَلَئِن\",\"نَّصَرُوهُمۡ\",\"لَيُوَلُّنَّ\",\"ٱلۡأَدۡبَٰرَ\",\"ثُمَّ\",\"لَا\",\"يُنصَرُونَ\"],\"t\":\"If they are expelled, they will not leave with them, and if they are fought, they will not aid them. And [even] if they should aid them, they will surely turn their backs; then [thereafter] they will not be aided\"},{\"a\":13,\"w\":[\"لَأَنتُمۡ\",\"أَشَدُّ\",\"رَهۡبَةٗ\",\"فِي\",\"صُدُورِهِم\",\"مِّنَ\",\"ٱللَّهِۚ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَوۡمٞ\",\"لَّا\",\"يَفۡقَهُونَ\"],\"t\":\"You [believers] are more fearful within their breasts than Allah. That is because they are a people who do not understand\"},{\"a\":14,\"w\":[\"لَا\",\"يُقَٰتِلُونَكُمۡ\",\"جَمِيعًا\",\"إِلَّا\",\"فِي\",\"قُرٗى\",\"مُّحَصَّنَةٍ\",\"أَوۡ\",\"مِن\",\"وَرَآءِ\",\"جُدُرِۭۚ\",\"بَأۡسُهُم\",\"بَيۡنَهُمۡ\",\"شَدِيدٞۚ\",\"تَحۡسَبُهُمۡ\",\"جَمِيعٗا\",\"وَقُلُوبُهُمۡ\",\"شَتَّىٰۚ\",\"ذَٰلِكَ\",\"بِأَنَّهُمۡ\",\"قَوۡمٞ\",\"لَّا\",\"يَعۡقِلُونَ\"],\"t\":\"They will not fight you all except within fortified cities or from behind walls. Their violence among themselves is severe. You think they are together, but their hearts are diverse. That is because they are a people who do not reason\"},{\"a\":15,\"w\":[\"كَمَثَلِ\",\"ٱلَّذِينَ\",\"مِن\",\"قَبۡلِهِمۡ\",\"قَرِيبٗاۖ\",\"ذَاقُواْ\",\"وَبَالَ\",\"أَمۡرِهِمۡ\",\"وَلَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"[Theirs is] like the example of those shortly before them: they tasted the bad consequence of their affair, and they will have a painful punishment\"},{\"a\":16,\"w\":[\"كَمَثَلِ\",\"ٱلشَّيۡطَٰنِ\",\"إِذۡ\",\"قَالَ\",\"لِلۡإِنسَٰنِ\",\"ٱكۡفُرۡ\",\"فَلَمَّا\",\"كَفَرَ\",\"قَالَ\",\"إِنِّي\",\"بَرِيٓءٞ\",\"مِّنكَ\",\"إِنِّيٓ\",\"أَخَافُ\",\"ٱللَّهَ\",\"رَبَّ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"[The hypocrites are] like the example of Satan when he says to man, \\\"Disbelieve.\\\" But when he disbelieves, he says, \\\"Indeed, I am disassociated from you. Indeed, I fear Allah, Lord of the worlds\"},{\"a\":17,\"w\":[\"فَكَانَ\",\"عَٰقِبَتَهُمَآ\",\"أَنَّهُمَا\",\"فِي\",\"ٱلنَّارِ\",\"خَٰلِدَيۡنِ\",\"فِيهَاۚ\",\"وَذَٰلِكَ\",\"جَزَـٰٓؤُاْ\",\"ٱلظَّـٰلِمِينَ\"],\"t\":\"So the outcome for both of them is that they will be in the Fire, abiding eternally therein. And that is the recompense of the wrong-doers\"},{\"a\":18,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّقُواْ\",\"ٱللَّهَ\",\"وَلۡتَنظُرۡ\",\"نَفۡسٞ\",\"مَّا\",\"قَدَّمَتۡ\",\"لِغَدٖۖ\",\"وَٱتَّقُواْ\",\"ٱللَّهَۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"خَبِيرُۢ\",\"بِمَا\",\"تَعۡمَلُونَ\"],\"t\":\"O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow - and fear Allah. Indeed, Allah is Acquainted with what you do\"},{\"a\":19,\"w\":[\"وَلَا\",\"تَكُونُواْ\",\"كَٱلَّذِينَ\",\"نَسُواْ\",\"ٱللَّهَ\",\"فَأَنسَىٰهُمۡ\",\"أَنفُسَهُمۡۚ\",\"أُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡفَٰسِقُونَ\"],\"t\":\"And be not like those who forgot Allah, so He made them forget themselves. Those are the defiantly disobedient\"},{\"a\":20,\"w\":[\"لَا\",\"يَسۡتَوِيٓ\",\"أَصۡحَٰبُ\",\"ٱلنَّارِ\",\"وَأَصۡحَٰبُ\",\"ٱلۡجَنَّةِۚ\",\"أَصۡحَٰبُ\",\"ٱلۡجَنَّةِ\",\"هُمُ\",\"ٱلۡفَآئِزُونَ\"],\"t\":\"Not equal are the companions of the Fire and the companions of Paradise. The companions of Paradise - they are the attainers [of success]\"},{\"a\":21,\"w\":[\"لَوۡ\",\"أَنزَلۡنَا\",\"هَٰذَا\",\"ٱلۡقُرۡءَانَ\",\"عَلَىٰ\",\"جَبَلٖ\",\"لَّرَأَيۡتَهُۥ\",\"خَٰشِعٗا\",\"مُّتَصَدِّعٗا\",\"مِّنۡ\",\"خَشۡيَةِ\",\"ٱللَّهِۚ\",\"وَتِلۡكَ\",\"ٱلۡأَمۡثَٰلُ\",\"نَضۡرِبُهَا\",\"لِلنَّاسِ\",\"لَعَلَّهُمۡ\",\"يَتَفَكَّرُونَ\"],\"t\":\"If We had sent down this Qur'an upon a mountain, you would have seen it humbled and coming apart from fear of Allah. And these examples We present to the people that perhaps they will give thought\"},{\"a\":22,\"w\":[\"هُوَ\",\"ٱللَّهُ\",\"ٱلَّذِي\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَۖ\",\"عَٰلِمُ\",\"ٱلۡغَيۡبِ\",\"وَٱلشَّهَٰدَةِۖ\",\"هُوَ\",\"ٱلرَّحۡمَٰنُ\",\"ٱلرَّحِيمُ\"],\"t\":\"He is Allah, other than whom there is no deity, Knower of the unseen and the witnessed. He is the Entirely Merciful, the Especially Merciful\"},{\"a\":23,\"w\":[\"هُوَ\",\"ٱللَّهُ\",\"ٱلَّذِي\",\"لَآ\",\"إِلَٰهَ\",\"إِلَّا\",\"هُوَ\",\"ٱلۡمَلِكُ\",\"ٱلۡقُدُّوسُ\",\"ٱلسَّلَٰمُ\",\"ٱلۡمُؤۡمِنُ\",\"ٱلۡمُهَيۡمِنُ\",\"ٱلۡعَزِيزُ\",\"ٱلۡجَبَّارُ\",\"ٱلۡمُتَكَبِّرُۚ\",\"سُبۡحَٰنَ\",\"ٱللَّهِ\",\"عَمَّا\",\"يُشۡرِكُونَ\"],\"t\":\"He is Allah, other than whom there is no deity, the Sovereign, the Pure, the Perfection, the Bestower of Faith, the Overseer, the Exalted in Might, the Compeller, the Superior. Exalted is Allah above whatever they associate with Him\"},{\"a\":24,\"w\":[\"هُوَ\",\"ٱللَّهُ\",\"ٱلۡخَٰلِقُ\",\"ٱلۡبَارِئُ\",\"ٱلۡمُصَوِّرُۖ\",\"لَهُ\",\"ٱلۡأَسۡمَآءُ\",\"ٱلۡحُسۡنَىٰۚ\",\"يُسَبِّحُ\",\"لَهُۥ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۖ\",\"وَهُوَ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"He is Allah, the Creator, the Inventor, the Fashioner; to Him belong the best names. Whatever is in the heavens and earth is exalting Him. And He is the Exalted in Might, the Wise\"}]}]}]}]]}]\n16:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1a:I[81329,[\"/Holy-Qur-an/_next/static/chunks/31d7_njve0k9_.js\"],\"IconMark\"]\n14:null\n18:[[\"$\",\"title\",\"0\",{\"children\":\"Al-Hashr — Surah 59 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",
