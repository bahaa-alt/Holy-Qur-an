ُونَ\",\"وَهُم\",\"مُّسۡتَكۡبِرُونَ\"],\"t\":\"And when it is said to them, \\\"Come, the Messenger of Allah will ask forgiveness for you,\\\" they turn their heads aside and you see them evading while they are arrogant\",\"pickthall\":\"And when it is said unto them: Come! The messenger of Allah will ask forgiveness for you! they avert their faces and thou seest them turning away, disdainful\"},{\"a\":6,\"w\":[\"سَوَآءٌ\",\"عَلَيۡهِمۡ\",\"أَسۡتَغۡفَرۡتَ\",\"لَهُمۡ\",\"أَمۡ\",\"لَمۡ\",\"تَسۡتَغۡفِرۡ\",\"لَهُمۡ\",\"لَن\",\"يَغۡفِرَ\",\"ٱللَّهُ\",\"لَهُمۡۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"لَا\",\"يَهۡدِي\",\"ٱلۡقَوۡمَ\",\"ٱلۡفَٰسِقِينَ\"],\"t\":\"It is all the same for them whether you ask forgiveness for them or do not ask forgiveness for them; never will Allah forgive them. Indeed, Allah does not guide the defiantly disobedient people\",\"pickthall\":\"Whether thou ask forgiveness for them or ask not forgiveness for them is all one for them; Allah will not forgive them. Lo! Allah guideth not the evil-living folk\"},{\"a\":7,\"w\":[\"هُمُ\",\"ٱلَّذِينَ\",\"يَقُولُونَ\",\"لَا\",\"تُنفِقُواْ\",\"عَلَىٰ\",\"مَنۡ\",\"عِندَ\",\"رَسُولِ\",\"ٱللَّهِ\",\"حَتَّىٰ\",\"يَنفَضُّواْۗ\",\"وَلِلَّهِ\",\"خَزَآئِنُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِ\",\"وَلَٰكِنَّ\",\"ٱلۡمُنَٰفِقِينَ\",\"لَا\",\"يَفۡقَهُونَ\"],\"t\":\"They are the ones who say, \\\"Do not spend on those who are with the Messenger of Allah until they disband.\\\" And to Allah belongs the depositories of the heavens and the earth, but the hypocrites do not understand\",\"pickthall\":\"They it is who say: Spend not on behalf of those (who dwell) with Allah's messenger that they may disperse (and go away from you); when Allah's are the treasures of the heavens and the earth; but the hypocrites comprehend not\"},{\"a\":8,\"w\":[\"يَقُولُونَ\",\"لَئِن\",\"رَّجَعۡنَآ\",\"إِلَى\",\"ٱلۡمَدِينَةِ\",\"لَيُخۡرِجَنَّ\",\"ٱلۡأَعَزُّ\",\"مِنۡهَا\",\"ٱلۡأَذَلَّۚ\",\"وَلِلَّهِ\",\"ٱلۡعِزَّةُ\",\"وَلِرَسُولِهِۦ\",\"وَلِلۡمُؤۡمِنِينَ\",\"وَلَٰكِنَّ\",\"ٱلۡمُنَٰفِقِينَ\",\"لَا\",\"يَعۡلَمُونَ\"],\"t\":\"They say, \\\"If we return to al-Madinah, the more honored [for power] will surely expel therefrom the more humble.\\\" And to Allah belongs [all] honor, and to His Messenger, and to the believers, but the hypocrites do not know\",\"pickthall\":\"They say: Surely, if we return to Al-Madinah the mightier will soon drive out the weaker; when might belongeth to Allah and to His messenger and to the believers; but the hypocrites know not\"},{\"a\":9,\"w\":[\"يَـٰٓأَيُّهَا\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"لَا\",\"تُلۡهِكُمۡ\",\"أَمۡوَٰلُكُمۡ\",\"وَلَآ\",\"أَوۡلَٰدُكُمۡ\",\"عَن\",\"ذِكۡرِ\",\"ٱللَّهِۚ\",\"وَمَن\",\"يَفۡعَلۡ\",\"ذَٰلِكَ\",\"فَأُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡخَٰسِرُونَ\"],\"t\":\"O you who have believed, let not your wealth and your children divert you from remembrance of Allah. And whoever does that - then those are the losers\",\"pickthall\":\"O ye who believe! Let not your wealth nor your children distract you from remembrance of Allah. Those who do so, they are the losers\"},{\"a\":10,\"w\":[\"وَأَنفِقُواْ\",\"مِن\",\"مَّا\",\"رَزَقۡنَٰكُم\",\"مِّن\",\"قَبۡلِ\",\"أَن\",\"يَأۡتِيَ\",\"أَحَدَكُمُ\",\"ٱلۡمَوۡتُ\",\"فَيَقُولَ\",\"رَبِّ\",\"لَوۡلَآ\",\"أَخَّرۡتَنِيٓ\",\"إِلَىٰٓ\",\"أَجَلٖ\",\"قَرِيبٖ\",\"فَأَصَّدَّقَ\",\"وَأَكُن\",\"مِّنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"And spend [in the way of Allah] from what We have provided you before death approaches one of you and he says, \\\"My Lord, if only You would delay me for a brief term so I would give charity and be among the righteous\",\"pickthall\":\"And spend of that wherewith We have provided you before death cometh unto one of you and he saith: My Lord! If only thou wouldst reprieve me for a little while, then I would give alms and be among the righteous\"},{\"a\":11,\"w\":[\"وَلَن\",\"يُؤَخِّرَ\",\"ٱللَّهُ\",\"نَفۡسًا\",\"إِذَا\",\"جَآءَ\",\"أَجَلُهَاۚ\",\"وَٱللَّهُ\",\"خَبِيرُۢ\",\"بِمَا\",\"تَعۡمَلُونَ\"],\"t\":\"But never will Allah delay a soul when its time has come. And Allah is Acquainted with what you do\",\"pickthall\":\"But Allah reprieveth no soul when its term cometh, and Allah is Informed of what ye do\"}]}]}]}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[81329,[\"/Holy-Qur-an/_next/static/chunks/2ahexrwxily4l.js\",\"/Holy-Qur-an/_next/static/chunks/3carqqy-2sdbp.js\"],\"IconMark\"]\nd:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Al-Munafiqun — Surah 63 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quran Roots\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Holy-Qur-an/icon.svg?icon.0k8xndm1lskh_.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Holy-Qur-an/apple-icon.png?apple-icon.1aiq4_oo29pdu.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"9\",{}]]\n"])</script></body></html>
