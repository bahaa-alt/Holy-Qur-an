\"t\":\"He knows what penetrates into the earth and what emerges from it and what descends from the heaven and what ascends therein. And He is the Merciful, the Forgiving\"},{\"a\":3,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لَا\",\"تَأۡتِينَا\",\"ٱلسَّاعَةُۖ\",\"قُلۡ\",\"بَلَىٰ\",\"وَرَبِّي\",\"لَتَأۡتِيَنَّكُمۡ\",\"عَٰلِمِ\",\"ٱلۡغَيۡبِۖ\",\"لَا\",\"يَعۡزُبُ\",\"عَنۡهُ\",\"مِثۡقَالُ\",\"ذَرَّةٖ\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَلَا\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَلَآ\",\"أَصۡغَرُ\",\"مِن\",\"ذَٰلِكَ\",\"وَلَآ\",\"أَكۡبَرُ\",\"إِلَّا\",\"فِي\",\"كِتَٰبٖ\",\"مُّبِينٖ\"],\"t\":\"But those who disbelieve say, \\\"The Hour will not come to us.\\\" Say, \\\"Yes, by my Lord, it will surely come to you. [Allah is] the Knower of the unseen.\\\" Not absent from Him is an atom's weight within the heavens or within the earth or [what is] smaller than that or greater, except that it is in a clear register\"},{\"a\":4,\"w\":[\"لِّيَجۡزِيَ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِۚ\",\"أُوْلَـٰٓئِكَ\",\"لَهُم\",\"مَّغۡفِرَةٞ\",\"وَرِزۡقٞ\",\"كَرِيمٞ\"],\"t\":\"That He may reward those who believe and do righteous deeds. Those will have forgiveness and noble provision\"},{\"a\":5,\"w\":[\"وَٱلَّذِينَ\",\"سَعَوۡ\",\"فِيٓ\",\"ءَايَٰتِنَا\",\"مُعَٰجِزِينَ\",\"أُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"عَذَابٞ\",\"مِّن\",\"رِّجۡزٍ\",\"أَلِيمٞ\"],\"t\":\"But those who strive against Our verses [seeking] to cause failure - for them will be a painful punishment of foul nature\"},{\"a\":6,\"w\":[\"وَيَرَى\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡعِلۡمَ\",\"ٱلَّذِيٓ\",\"أُنزِلَ\",\"إِلَيۡكَ\",\"مِن\",\"رَّبِّكَ\",\"هُوَ\",\"ٱلۡحَقَّ\",\"وَيَهۡدِيٓ\",\"إِلَىٰ\",\"صِرَٰطِ\",\"ٱلۡعَزِيزِ\",\"ٱلۡحَمِيدِ\"],\"t\":\"And those who have been given knowledge see that what is revealed to you from your Lord is the truth, and it guides to the path of the Exalted in Might, the Praiseworthy\"},{\"a\":7,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"هَلۡ\",\"نَدُلُّكُمۡ\",\"عَلَىٰ\",\"رَجُلٖ\",\"يُنَبِّئُكُمۡ\",\"إِذَا\",\"مُزِّقۡتُمۡ\",\"كُلَّ\",\"مُمَزَّقٍ\",\"إِنَّكُمۡ\",\"لَفِي\",\"خَلۡقٖ\",\"جَدِيدٍ\"],\"t\":\"But those who disbelieve say, \\\"Shall we direct you to a man who will inform you [that] when you have disintegrated in complete disintegration, you will [then] be [recreated] in a new creation\"},{\"a\":8,\"w\":[\"أَفۡتَرَىٰ\",\"عَلَى\",\"ٱللَّهِ\",\"كَذِبًا\",\"أَم\",\"بِهِۦ\",\"جِنَّةُۢۗ\",\"بَلِ\",\"ٱلَّذِينَ\",\"لَا\",\"يُؤۡمِنُونَ\",\"بِٱلۡأٓخِرَةِ\",\"فِي\",\"ٱلۡعَذَابِ\",\"وَٱلضَّلَٰلِ\",\"ٱلۡبَعِيدِ\"],\"t\":\"Has he invented about Allah a lie or is there in him madness?\\\" Rather, they who do not believe in the Hereafter will be in the punishment and [are in] extreme error\"},{\"a\":9,\"w\":[\"أَفَلَمۡ\",\"يَرَوۡاْ\",\"إِلَىٰ\",\"مَا\",\"بَيۡنَ\",\"أَيۡدِيهِمۡ\",\"وَمَا\",\"خَلۡفَهُم\",\"مِّنَ\",\"ٱلسَّمَآءِ\",\"وَٱلۡأَرۡضِۚ\",\"إِن\",\"نَّشَأۡ\",\"نَخۡسِفۡ\",\"بِهِمُ\",\"ٱلۡأَرۡضَ\",\"أَوۡ\",\"نُسۡقِطۡ\",\"عَلَيۡهِمۡ\",\"كِسَفٗا\",\"مِّنَ\",\"ٱلسَّمَآءِۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَةٗ\",\"لِّكُلِّ\",\"عَبۡدٖ\",\"مُّنِيبٖ\"],\"t\":\"Then, do they not look at what is before them and what is behind them of the heaven and earth? If We should will, We could cause the earth to swallow them or [could] let fall upon them fragments from the sky. Indeed in that is a sign for every servant turning back [to Allah]\"},{\"a\":10,\"w\":[\"۞وَلَقَدۡ\",\"ءَاتَيۡنَا\",\"دَاوُۥدَ\",\"مِنَّا\",\"فَضۡلٗاۖ\",\"يَٰجِبَالُ\",\"أَوِّبِي\",\"مَعَهُۥ\",\"وَٱلطَّيۡرَۖ\",\"وَأَلَنَّا\",\"لَهُ\",\"ٱلۡحَدِيدَ\"],\"t\":\"And We certainly gave David from Us bounty. [We said], \\\"O mountains, repeat [Our] praises with him, and the birds [as well].\\\" And We made pliable for him iron\"},{\"a\":11,\"w\":[\"أَنِ\",\"ٱعۡمَلۡ\",\"سَٰبِغَٰتٖ\",\"وَقَدِّرۡ\",\"فِي\",\"ٱلسَّرۡدِۖ\",\"وَٱعۡمَلُواْ\",\"صَٰلِحًاۖ\",\"إِنِّي\",\"بِمَا\",\"تَعۡمَلُونَ\",\"بَصِيرٞ\"],\"t\":\"[Commanding him], \\\"Make full coats of mail and calculate [precisely] the links, and work [all of you] righteousness. Indeed I, of what you do, am Seeing\"},{\"a\":12,\"w\":[\"وَلِسُلَيۡمَٰنَ\",\"ٱلرِّيحَ\",\"غُدُوُّهَا\",\"شَهۡرٞ\",\"وَرَوَاحُهَا\",\"شَهۡرٞۖ\",\"وَأَسَلۡنَا\",\"لَهُۥ\",\"عَيۡنَ\",\"ٱلۡقِطۡرِۖ\",\"وَمِنَ\",\"ٱلۡجِنِّ\",\"مَن\",\"يَعۡمَلُ\",\"بَيۡنَ\",\"يَدَيۡهِ\",\"بِإِذۡنِ\",\"رَبِّهِۦۖ\",\"وَمَن\",\"يَزِغۡ\",\"مِنۡهُمۡ\",\"عَنۡ\",\"أَمۡرِنَا\",\"نُذِقۡهُ\",\"مِنۡ\",\"عَذَابِ\",\"ٱلسَّعِيرِ\"],\"t\":\"And to Solomon [We subjected] the wind - its morning [journey was that of] a month - and its afternoon [journey was that of] a month, and We made flow for him a spring of [liquid] copper. And among the jinn were those who worked for him by the permission of his Lord. And whoever deviated among them from Our command - We will make him taste of the punishment of the Blaze\"},{\"a\":13,\"w\":[\"يَعۡمَلُونَ\",\"لَهُۥ\",\"مَا\",\"يَشَآءُ\",\"مِن\",\"مَّحَٰرِيبَ\",\"وَتَمَٰثِيلَ\",\"وَجِفَانٖ\",\"كَٱلۡجَوَابِ\",\"وَقُدُورٖ\",\"رَّاسِيَٰتٍۚ\",\"ٱعۡمَلُوٓاْ\",\"ءَالَ\",\"دَاوُۥدَ\",\"شُكۡرٗاۚ\",\"وَقَلِيلٞ\",\"مِّنۡ\",\"عِبَادِيَ\",\"ٱلشَّكُورُ\"],\"t\":\"They made for him what he willed of elevated chambers, statues, bowls like reservoirs, and stationary kettles. [We said], \\\"Work, O family of David, in gratitude.\\\" And few of My servants are grateful\"},{\"a\":14,\"w\":[\"فَلَمَّا\",\"قَضَيۡنَا\",\"عَلَيۡهِ\",\"ٱلۡمَوۡتَ\",\"مَا\",\"دَلَّهُمۡ\",\"عَلَىٰ\",\"مَوۡتِهِۦٓ\",\"إِلَّا\",\"دَآبَّةُ\",\"ٱلۡأَرۡضِ\",\"تَأۡكُلُ\",\"مِنسَأَتَهُۥۖ\",\"فَلَمَّا\",\"خَرَّ\",\"تَبَيَّنَتِ\",\"ٱلۡجِنُّ\",\"أَن\",\"لَّوۡ\",\"كَانُواْ\",\"يَعۡلَمُونَ\",\"ٱلۡغَيۡبَ\",\"مَا\",\"لَبِثُواْ\",\"فِي\",\"ٱلۡعَذَابِ\",\"ٱلۡمُهِينِ\"],\"t\":\"And when We decreed for Solomon death, nothing indicated to the jinn his death except a creature of the earth eating his staff. But when he fell, it became clear to the jinn that if they had known the unseen, they would not have remained in humiliating punishment\"},{\"a\":15,\"w\":[\"لَقَدۡ\",\"كَانَ\",\"لِسَبَإٖ\",\"فِي\",\"مَسۡكَنِهِمۡ\",\"ءَايَةٞۖ\",\"جَنَّتَانِ\",\"عَن\",\"يَمِينٖ\",\"وَشِمَالٖۖ\",\"كُلُواْ\",\"مِن\",\"رِّزۡقِ\",\"رَبِّكُمۡ\",\"وَٱشۡكُرُواْ\",\"لَهُۥۚ\",\"بَلۡدَةٞ\",\"طَيِّبَةٞ\",\"وَرَبٌّ\",\"غَفُورٞ\"],\"t\":\"There was for [the tribe of] Saba' in their dwelling place a sign: two [fields of] gardens on the right and on the left. [They were told], \\\"Eat from the provisions of your Lord and be grateful to Him. A good land [have you], and a forgiving Lord\"},{\"a\":16,\"w\":[\"فَأَعۡرَضُواْ\",\"فَأَرۡسَلۡنَا\",\"عَلَيۡهِمۡ\",\"سَيۡلَ\",\"ٱلۡعَرِمِ\",\"وَبَدَّلۡنَٰهُم\",\"بِجَنَّتَيۡهِمۡ\",\"جَنَّتَيۡنِ\",\"ذَوَاتَيۡ\",\"أُكُلٍ\",\"خَمۡطٖ\",\"وَأَثۡلٖ\",\"وَشَيۡءٖ\",\"مِّن\",\"سِدۡرٖ\",\"قَلِيلٖ\"],\"t\":\"But they turned away [refusing], so We sent upon them the flood of the dam, and We replaced their two [fields of] gardens with gardens of bitter fruit, tamarisks and something of sparse lote trees\"},{\"a\":17,\"w\":[\"ذَٰلِكَ\",\"جَزَيۡنَٰهُم\",\"بِمَا\",\"كَفَرُواْۖ\",\"وَهَلۡ\",\"نُجَٰزِيٓ\",\"إِلَّا\",\"ٱلۡكَفُورَ\"],\"t\":\"[By] that We repaid them because they disbelieved. And do We [thus] repay except the ungrateful\"},{\"a\":18,\"w\":[\"وَجَعَلۡنَا\",\"بَيۡنَهُمۡ\",\"وَبَيۡنَ\",\"ٱلۡقُرَى\",\"ٱلَّتِي\",\"بَٰرَكۡنَا\",\"فِيهَا\",\"قُرٗى\",\"ظَٰهِرَةٗ\",\"وَقَدَّرۡنَا\",\"فِيهَا\",\"ٱلسَّيۡرَۖ\",\"سِيرُواْ\",\"فِيهَا\",\"لَيَالِيَ\",\"وَأَيَّامًا\",\"ءَامِنِينَ\"],\"t\":\"And We placed between them and the cities which We had blessed [many] visible cities. And We determined between them the [distances of] journey, [saying], \\\"Travel between them by night or day in safety\"},{\"a\":19,\"w\":[\"فَقَالُواْ\",\"رَبَّنَا\",\"بَٰعِدۡ\",\"بَيۡنَ\",\"أَسۡفَارِنَا\",\"وَظَلَمُوٓاْ\",\"أَنفُسَهُمۡ\",\"فَجَعَلۡنَٰهُمۡ\",\"أَحَادِيثَ\",\"وَمَزَّقۡنَٰهُمۡ\",\"كُلَّ\",\"مُمَزَّقٍۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَٰتٖ\",\"لِّكُلِّ\",\"صَبَّارٖ\",\"شَكُورٖ\"],\"t\":\"But [insolently] they said, \\\"Our Lord, lengthen the distance between our journeys,\\\" and wronged themselves, so We made them narrations and dispersed them in total dispersion. Indeed in that are signs for everyone patient and grateful\"},{\"a\":20,\"w\":[\"وَلَقَدۡ\",\"صَدَّقَ\",\"عَلَيۡهِمۡ\",\"إِبۡلِيسُ\",\"ظَنَّهُۥ\",\"فَٱتَّبَعُوهُ\",\"إِلَّا\",\"فَرِيقٗا\",\"مِّنَ\",\"ٱلۡمُؤۡمِنِينَ\"],\"t\":\"And Iblees had already confirmed through them his assumption, so they followed him, except for a party of believers\"},{\"a\":21,\"w\":[\"وَمَا\",\"كَانَ\",\"لَهُۥ\",\"عَلَيۡهِم\",\"مِّن\",\"سُلۡطَٰنٍ\",\"إِلَّا\",\"لِنَعۡلَمَ\",\"مَن\",\"يُؤۡمِنُ\",\"بِٱلۡأٓخِرَةِ\",\"مِمَّنۡ\",\"هُوَ\",\"مِنۡهَا\",\"فِي\",\"شَكّٖۗ\",\"وَرَبُّكَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٍ\",\"حَفِيظٞ\"],\"t\":\"And he had over them no authority except [it was decreed] that We might make evident who believes in the Hereafter from who is thereof in doubt. And your Lord, over all things, is Guardian\"},{\"a\":22,\"w\":[\"قُلِ\",\"ٱدۡعُواْ\",\"ٱلَّذِينَ\",\"زَعَمۡتُم\",\"مِّن\",\"دُونِ\",\"ٱللَّهِ\",\"لَا\",\"يَمۡلِكُونَ\",\"مِثۡقَالَ\",\"ذَرَّةٖ\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَلَا\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَمَا\",\"لَهُمۡ\",\"فِيهِمَا\",\"مِن\",\"شِرۡكٖ\",\"وَمَا\",\"لَهُۥ\",\"مِنۡهُم\",\"مِّن\",\"ظَهِيرٖ\"],\"t\":\"Say, [O Muhammad], \\\"Invoke those you claim [as deities] besides Allah.\\\" They do not possess an atom's weight [of ability] in the heavens or on the earth, and they do not have therein any partnership [with Him], nor is there for Him from among them any assistant\"},{\"a\":23,\"w\":[\"وَلَا\",\"تَنفَعُ\",\"ٱلشَّفَٰعَةُ\",\"عِندَهُۥٓ\",\"إِلَّا\",\"لِمَنۡ\",\"أَذِنَ\",\"لَهُۥۚ\",\"حَتَّىٰٓ\",\"إِذَا\",\"فُزِّعَ\",\"عَن\",\"قُلُوبِهِمۡ\",\"قَالُواْ\",\"مَاذَا\",\"قَالَ\",\"رَبُّكُمۡۖ\",\"قَالُواْ\",\"ٱلۡحَقَّۖ\",\"وَهُوَ\",\"ٱلۡعَلِيُّ\",\"ٱلۡكَبِيرُ\"],\"t\":\"And intercession does not benefit with Him except for one whom He permits. [And those wait] until, when terror is removed from their hearts, they will say [to one another], \\\"What has your Lord said?\\\" They will say, \\\"The truth.\\\" And He is the Most High, the Grand\"},{\"a\":24,\"w\":[\"۞قُلۡ\",\"مَن\",\"يَرۡزُقُكُم\",\"مِّنَ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۖ\",\"قُلِ\",\"ٱللَّهُۖ\",\"وَإِنَّآ\",\"أَوۡ\",\"إِيَّاكُمۡ\",\"لَعَلَىٰ\",\"هُدًى\",\"أَوۡ\",\"فِي\",\"ضَلَٰلٖ\",\"مُّبِينٖ\"],\"t\":\"Say, \\\"Who provides for you from the heavens and the earth?\\\" Say, \\\"Allah. And indeed, we or you are either upon guidance or in clear error\"},{\"a\":25,\"w\":[\"قُل\",\"لَّا\",\"تُسۡـَٔلُونَ\",\"عَمَّآ\",\"أَجۡرَمۡنَا\",\"وَلَا\",\"نُسۡـَٔلُ\",\"عَمَّا\",\"تَعۡمَلُونَ\"],\"t\":\"Say, \\\"You will not be asked about what we committed, and we will not be asked about what you do\"},{\"a\":26,\"w\":[\"قُلۡ\",\"يَجۡمَعُ\",\"بَيۡنَنَا\",\"رَبُّنَا\",\"ثُمَّ\",\"يَفۡتَحُ\",\"بَيۡنَنَا\",\"بِٱلۡحَقِّ\",\"وَهُوَ\",\"ٱلۡفَتَّاحُ\",\"ٱلۡعَلِيمُ\"],\"t\":\"Say, \\\"Our Lord will bring us together; then He will judge between us in truth. And He is the Knowing Judge\"},{\"a\":27,\"w\":[\"قُلۡ\",\"أَرُونِيَ\",\"ٱلَّذِينَ\",\"أَلۡحَقۡتُم\",\"بِهِۦ\",\"شُرَكَآءَۖ\",\"كَلَّاۚ\",\"بَلۡ\",\"هُوَ\",\"ٱللَّهُ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"Say, \\\"Show me those whom you have attached to Him as partners. No! Rather, He [alone] is Allah, the Exalted in Might, the Wise\"},{\"a\":28,\"w\":[\"وَمَآ\",\"أَرۡسَلۡنَٰكَ\",\"إِلَّا\",\"كَآفَّةٗ\",\"لِّلنَّاسِ\",\"بَشِيرٗا\",\"وَنَذِيرٗا\",\"وَلَٰكِنَّ\",\"أَكۡثَرَ\",\"ٱلنَّاسِ\",\"لَا\",\"يَعۡلَمُونَ\"],\"t\":\"And We have not sent you except comprehensively to mankind as a bringer of good tidings and a warner. But most of the people do not know\"},{\"a\":29,\"w\":[\"وَيَقُولُونَ\",\"مَتَىٰ\",\"هَٰذَا\",\"ٱلۡوَعۡدُ\",\"إِن\",\"كُنتُمۡ\",\"صَٰدِقِينَ\"],\"t\":\"And they say, \\\"When is this promise, if you should be truthful\"},{\"a\":30,\"w\":[\"قُل\",\"لَّكُم\",\"مِّيعَادُ\",\"يَوۡمٖ\",\"لَّا\",\"تَسۡتَـٔۡخِرُونَ\",\"عَنۡهُ\",\"سَاعَةٗ\",\"وَلَا\",\"تَسۡتَقۡدِمُونَ\"],\"t\":\"Say, \\\"For you is the appointment of a Day [when] you will not remain thereafter an hour, nor will you precede [it]\"},{\"a\":31,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لَن\",\"نُّؤۡمِنَ\",\"بِهَٰذَا\",\"ٱلۡقُرۡءَانِ\",\"وَلَا\",\"بِٱلَّذِي\",\"بَيۡنَ\",\"يَدَيۡهِۗ\",\"وَلَوۡ\",\"تَرَىٰٓ\",\"إِذِ\",\"ٱلظَّـٰلِمُونَ\",\"مَوۡقُوفُونَ\",\"عِندَ\",\"رَبِّهِمۡ\",\"يَرۡجِعُ\",\"بَعۡضُهُمۡ\",\"إِلَىٰ\",\"بَعۡضٍ\",\"ٱلۡقَوۡلَ\",\"يَقُولُ\",\"ٱلَّذِينَ\",\"ٱسۡتُضۡعِفُواْ\",\"لِلَّذِينَ\",\"ٱسۡتَكۡبَرُواْ\",\"لَوۡلَآ\",\"أَنتُمۡ\",\"لَكُنَّا\",\"مُؤۡمِنِينَ\"],\"t\":\"And those who disbelieve say, \\\"We will never believe in this Qur'an nor in that before it.\\\" But if you could see when the wrongdoers are made to stand before their Lord, refuting each other's words... Those who were oppressed will say to those who were arrogant, \\\"If not for you, we would have been believers\"},{\"a\":32,\"w\":[\"قَالَ\",\"ٱلَّذِينَ\",\"ٱسۡتَكۡبَرُواْ\",\"لِلَّذِينَ\",\"ٱسۡتُضۡعِفُوٓاْ\",\"أَنَحۡنُ\",\"صَدَدۡنَٰكُمۡ\",\"عَنِ\",\"ٱلۡهُدَىٰ\",\"بَعۡدَ\",\"إِذۡ\",\"جَآءَكُمۖ\",\"بَلۡ\",\"كُنتُم\",\"مُّجۡرِمِينَ\"],\"t\":\"Those who were arrogant will say to those who were oppressed, \\\"Did we avert you from guidance after it had come to you? Rather, you were criminals\"},{\"a\":33,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"ٱسۡتُضۡعِفُواْ\",\"لِلَّذِينَ\",\"ٱسۡتَكۡبَرُواْ\",\"بَلۡ\",\"مَكۡرُ\",\"ٱلَّيۡلِ\",\"وَٱلنَّهَارِ\",\"إِذۡ\",\"تَأۡمُرُونَنَآ\",\"أَن\",\"نَّكۡفُرَ\",\"بِٱللَّهِ\",\"وَنَجۡعَلَ\",\"لَهُۥٓ\",\"أَندَادٗاۚ\",\"وَأَسَرُّواْ\",\"ٱلنَّدَامَةَ\",\"لَمَّا\",\"رَأَوُاْ\",\"ٱلۡعَذَابَۚ\",\"وَجَعَلۡنَا\",\"ٱلۡأَغۡلَٰلَ\",\"فِيٓ\",\"أَعۡنَاقِ\",\"ٱلَّذِينَ\",\"كَفَرُواْۖ\",\"هَلۡ\",\"يُجۡزَوۡنَ\",\"إِلَّا\",\"مَا\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"Those who were oppressed will say to those who were arrogant, \\\"Rather, [it was your] conspiracy of night and day when you were ordering us to disbelieve in Allah and attribute to Him equals.\\\" But they will [all] confide regret when they see the punishment; and We will put shackles on the necks of those who disbelieved. Will they be recompensed except for what they used to do\"},{\"a\":34,\"w\":[\"وَمَآ\",\"أَرۡسَلۡنَا\",\"فِي\",\"قَرۡيَةٖ\",\"مِّن\",\"نَّذِيرٍ\",\"إِلَّا\",\"قَالَ\",\"مُتۡرَفُوهَآ\",\"إِنَّا\",\"بِمَآ\",\"أُرۡسِلۡتُم\",\"بِهِۦ\",\"كَٰفِرُونَ\"],\"t\":\"And We did not send into a city any warner except that its affluent said, \\\"Indeed we, in that with which you were sent, are disbelievers\"},{\"a\":35,\"w\":[\"وَقَالُواْ\",\"نَحۡنُ\",\"أَكۡثَرُ\",\"أَمۡوَٰلٗا\",\"وَأَوۡلَٰدٗا\",\"وَمَا\",\"نَحۡنُ\",\"بِمُعَذَّبِينَ\"],\"t\":\"And they said, \\\"We are more [than the believers] in wealth and children, and we are not to be punished\"},{\"a\":36,\"w\":[\"قُلۡ\",\"إِنَّ\",\"رَبِّي\",\"يَبۡسُطُ\",\"ٱلرِّزۡقَ\",\"لِمَن\",\"يَشَآءُ\",\"وَيَقۡدِرُ\",\"وَلَٰكِنَّ\",\"أَكۡثَرَ\",\"ٱلنَّاسِ\",\"لَا\",\"يَعۡلَمُونَ\"],\"t\":\"Say, \\\"Indeed, my Lord extends provision for whom He wills and restricts [it], but most of the people do not know\"},{\"a\":37,\"w\":[\"وَمَآ\",\"أَمۡوَٰلُكُمۡ\",\"وَلَآ\",\"أَوۡلَٰدُكُم\",\"بِٱلَّتِي\",\"تُقَرِّبُكُمۡ\",\"عِندَنَا\",\"زُلۡفَىٰٓ\",\"إِلَّا\",\"مَنۡ\",\"ءَامَنَ\",\"وَعَمِلَ\",\"صَٰلِحٗا\",\"فَأُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"جَزَآءُ\",\"ٱلضِّعۡفِ\",\"بِمَا\",\"عَمِلُواْ\",\"وَهُمۡ\",\"فِي\",\"ٱلۡغُرُفَٰتِ\",\"ءَامِنُونَ\"],\"t\":\"And it is not your wealth or your children that bring you nearer to Us in position, but it is [by being] one who has believed and done righteousness. For them there will be the double reward for what they did, and they will be in the upper chambers [of Paradise], safe [and secure]\"},{\"a\":38,\"w\":[\"وَٱلَّذِينَ\",\"يَسۡعَوۡنَ\",\"فِيٓ\",\"ءَايَٰتِنَا\",\"مُعَٰجِزِينَ\",\"أُوْلَـٰٓئِكَ\",\"فِي\",\"ٱلۡعَذَابِ\",\"مُحۡضَرُونَ\"],\"t\":\"And the ones who strive against Our verses to cause [them] failure - those will be brought into the punishment [to remain]\"},{\"a\":39,\"w\":[\"قُلۡ\",\"إِنَّ\",\"رَبِّي\",\"يَبۡسُطُ\",\"ٱلرِّزۡقَ\",\"لِمَن\",\"يَشَآءُ\",\"مِنۡ\",\"عِبَادِهِۦ\",\"وَيَقۡدِرُ\",\"لَهُۥۚ\",\"وَمَآ\",\"أَنفَقۡتُم\",\"مِّن\",\"شَيۡءٖ\",\"فَهُوَ\",\"يُخۡلِفُهُۥۖ\",\"وَهُوَ\",\"خَيۡرُ\",\"ٱلرَّـٰزِقِينَ\"],\"t\":\"Say, \\\"Indeed, my Lord extends provision for whom He wills of His servants and restricts [it] for him. But whatever thing you spend [in His cause] - He will compensate it; and He is the best of providers\"},{\"a\":40,\"w\":[\"وَيَوۡمَ\",\"يَحۡشُرُهُمۡ\",\"جَمِيعٗا\",\"ثُمَّ\",\"يَقُولُ\",\"لِلۡمَلَـٰٓئِكَةِ\",\"أَهَـٰٓؤُلَآءِ\",\"إِيَّاكُمۡ\",\"كَانُواْ\",\"يَعۡبُدُونَ\"],\"t\":\"And [mention] the Day when He will gather them all and then say to the angels, \\\"Did these [people] used to worship you\"},{\"a\":41,\"w\":[\"قَالُواْ\",\"سُبۡحَٰنَكَ\",\"أَنتَ\",\"وَلِيُّنَا\",\"مِن\",\"دُونِهِمۖ\",\"بَلۡ\",\"كَانُواْ\",\"يَعۡبُدُونَ\",\"ٱلۡجِنَّۖ\",\"أَكۡثَرُهُم\",\"بِهِم\",\"مُّؤۡمِنُونَ\"],\"t\":\"They will say, \\\"Exalted are You! You, [O Allah], are our benefactor not them. Rather, they used to worship the jinn; most of them were believers in them\"},{\"a\":42,\"w\":[\"فَٱلۡيَوۡمَ\",\"لَا\",\"يَمۡلِكُ\",\"بَعۡضُكُمۡ\",\"لِبَعۡضٖ\",\"نَّفۡعٗا\",\"وَلَا\",\"ضَرّٗا\",\"وَنَقُولُ\",\"لِلَّذِينَ\",\"ظَلَمُواْ\",\"ذُوقُواْ\",\"عَذَابَ\",\"ٱلنَّارِ\",\"ٱلَّتِي\",\"كُنتُم\",\"بِهَا\",\"تُكَذِّبُونَ\"],\"t\":\"But today you do not hold for one another [the power of] benefit or harm, and We will say to those who wronged, \\\"Taste the punishment of the Fire, which you used to deny\"},{\"a\":43,\"w\":[\"وَإِذَا\",\"تُتۡلَىٰ\",\"عَلَيۡهِمۡ\",\"ءَايَٰتُنَا\",\"بَيِّنَٰتٖ\",\"قَالُواْ\",\"مَا\",\"هَٰذَآ\",\"إِلَّا\",\"رَجُلٞ\",\"يُرِيدُ\",\"أَن\",\"يَصُدَّكُمۡ\",\"عَمَّا\",\"كَانَ\",\"يَعۡبُدُ\",\"ءَابَآؤُكُمۡ\",\"وَقَالُواْ\",\"مَا\",\"هَٰذَآ\",\"إِلَّآ\",\"إِفۡكٞ\",\"مُّفۡتَرٗىۚ\",\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لِلۡحَقِّ\",\"لَمَّا\",\"جَآءَهُمۡ\",\"إِنۡ\",\"هَٰذَآ\",\"إِلَّا\",\"سِحۡرٞ\",\"مُّبِينٞ\"],\"t\":\"And when our verses are recited to them as clear evidences, they say, \\\"This is not but a man who wishes to avert you from that which your fathers were worshipping.\\\" And they say, \\\"This is not except a lie invented.\\\" And those who disbelieve say of the truth when it has come to them, \\\"This is not but obvious magic\"},{\"a\":44,\"w\":[\"وَمَآ\",\"ءَاتَيۡنَٰهُم\",\"مِّن\",\"كُتُبٖ\",\"يَدۡرُسُونَهَاۖ\",\"وَمَآ\",\"أَرۡسَلۡنَآ\",\"إِلَيۡهِمۡ\",\"قَبۡلَكَ\",\"مِن\",\"نَّذِيرٖ\"],\"t\":\"And We had not given them any scriptures which they could study, and We had not sent to them before you, [O Muhammad], any warner\"},{\"a\":45,\"w\":[\"وَكَذَّبَ\",\"ٱلَّذِينَ\",\"مِن\",\"قَبۡلِهِمۡ\",\"وَمَا\",\"بَلَغُواْ\",\"مِعۡشَارَ\",\"مَآ\",\"ءَاتَيۡنَٰهُمۡ\",\"فَكَذَّبُواْ\",\"رُسُلِيۖ\",\"فَكَيۡفَ\",\"كَانَ\",\"نَكِيرِ\"],\"t\":\"And those before them denied, and the people of Makkah have not attained a tenth of what We had given them. But the former peoples denied My messengers, so how [terrible] was My reproach\"},{\"a\":46,\"w\":[\"۞قُلۡ\",\"إِنَّمَآ\",\"أَعِظُكُم\",\"بِوَٰحِدَةٍۖ\",\"أَن\",\"تَقُومُواْ\",\"لِلَّهِ\",\"مَثۡنَىٰ\",\"وَفُرَٰدَىٰ\",\"ثُمَّ\",\"تَتَفَكَّرُواْۚ\",\"مَا\",\"بِصَاحِبِكُم\",\"مِّن\",\"جِنَّةٍۚ\",\"إِنۡ\",\"هُوَ\",\"إِلَّا\",\"نَذِيرٞ\",\"لَّكُم\",\"بَيۡنَ\",\"يَدَيۡ\",\"عَذَابٖ\",\"شَدِيدٖ\"],\"t\":\"Say, \\\"I only advise you of one [thing] - that you stand for Allah, [seeking truth] in pairs and individually, and then give thought.\\\" There is not in your companion any madness. He is only a warner to you before a severe punishment\"},{\"a\":47,\"w\":[\"قُلۡ\",\"مَا\",\"سَأَلۡتُكُم\",\"مِّنۡ\",\"أَجۡرٖ\",\"فَهُوَ\",\"لَكُمۡۖ\",\"إِنۡ\",\"أَجۡرِيَ\",\"إِلَّا\",\"عَلَى\",\"ٱللَّهِۖ\",\"وَهُوَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"شَهِيدٞ\"],\"t\":\"Say, \\\"Whatever payment I might have asked of you - it is yours. My payment is only from Allah, and He is, over all things, Witness\"},{\"a\":48,\"w\":[\"قُلۡ\",\"إِنَّ\",\"رَبِّي\",\"يَقۡذِفُ\",\"بِٱلۡحَقِّ\",\"عَلَّـٰمُ\",\"ٱلۡغُيُوبِ\"],\"t\":\"Say, \\\"Indeed, my Lord projects the truth. Knower of the unseen\"},{\"a\":49,\"w\":[\"قُلۡ\",\"جَآءَ\",\"ٱلۡحَقُّ\",\"وَمَا\",\"يُبۡدِئُ\",\"ٱلۡبَٰطِلُ\",\"وَمَا\",\"يُعِيدُ\"],\"t\":\"Say, \\\"The truth has come, and falsehood can neither begin [anything] nor repeat [it]\"},{\"a\":50,\"w\":[\"قُلۡ\",\"إِن\",\"ضَلَلۡتُ\",\"فَإِنَّمَآ\",\"أَضِلُّ\",\"عَلَىٰ\",\"نَفۡسِيۖ\",\"وَإِنِ\",\"ٱهۡتَدَيۡتُ\",\"فَبِمَا\",\"يُوحِيٓ\",\"إِلَيَّ\",\"رَبِّيٓۚ\",\"إِنَّهُۥ\",\"سَمِيعٞ\",\"قَرِيبٞ\"],\"t\":\"Say, \\\"If I should err, I would only err against myself. But if I am guided, it is by what my Lord reveals to me. Indeed, He is Hearing and near\"},{\"a\":51,\"w\":[\"وَلَوۡ\",\"تَرَىٰٓ\",\"إِذۡ\",\"فَزِعُواْ\",\"فَلَا\",\"فَوۡتَ\",\"وَأُخِذُواْ\",\"مِن\",\"مَّكَانٖ\",\"قَرِيبٖ\"],\"t\":\"And if you could see when they are terrified but there is no escape, and they will be seized from a place nearby\"},{\"a\":52,\"w\":[\"وَقَالُوٓاْ\",\"ءَامَنَّا\",\"بِهِۦ\",\"وَأَنَّىٰ\",\"لَهُمُ\",\"ٱلتَّنَاوُشُ\",\"مِن\",\"مَّكَانِۭ\",\"بَعِيدٖ\"],\"t\":\"And they will [then] say, \\\"We believe in it!\\\" But how for them will be the taking [of faith] from a place far away\"},{\"a\":53,\"w\":[\"وَقَدۡ\",\"كَفَرُواْ\",\"بِهِۦ\",\"مِن\",\"قَبۡلُۖ\",\"وَيَقۡذِفُونَ\",\"بِٱلۡغَيۡبِ\",\"مِن\",\"مَّكَانِۭ\",\"بَعِيدٖ\"],\"t\":\"And they had already disbelieved in it before and would assault the unseen from a place far away\"},{\"a\":54,\"w\":[\"وَحِيلَ\",\"بَيۡنَهُمۡ\",\"وَبَيۡنَ\",\"مَا\",\"يَشۡتَهُونَ\",\"كَمَا\",\"فُعِلَ\",\"بِأَشۡيَاعِهِم\",\"مِّن\",\"قَبۡلُۚ\",\"إِنَّهُمۡ\",\"كَانُواْ\",\"فِي\",\"شَكّٖ\",\"مُّرِيبِۭ\"],\"t\":\"And prevention will be placed between them and what they desire, as was done with their kind before. Indeed, they were in disquieting denial\"}]}]}]}]]}]\n16:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"med
