and He will surely make evident the liars\"},{\"a\":4,\"w\":[\"أَمۡ\",\"حَسِبَ\",\"ٱلَّذِينَ\",\"يَعۡمَلُونَ\",\"ٱلسَّيِّـَٔاتِ\",\"أَن\",\"يَسۡبِقُونَاۚ\",\"سَآءَ\",\"مَا\",\"يَحۡكُمُونَ\"],\"t\":\"Or do those who do evil deeds think they can outrun Us? Evil is what they judge\"},{\"a\":5,\"w\":[\"مَن\",\"كَانَ\",\"يَرۡجُواْ\",\"لِقَآءَ\",\"ٱللَّهِ\",\"فَإِنَّ\",\"أَجَلَ\",\"ٱللَّهِ\",\"لَأٓتٖۚ\",\"وَهُوَ\",\"ٱلسَّمِيعُ\",\"ٱلۡعَلِيمُ\"],\"t\":\"Whoever should hope for the meeting with Allah - indeed, the term decreed by Allah is coming. And He is the Hearing, the Knowing\"},{\"a\":6,\"w\":[\"وَمَن\",\"جَٰهَدَ\",\"فَإِنَّمَا\",\"يُجَٰهِدُ\",\"لِنَفۡسِهِۦٓۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"لَغَنِيٌّ\",\"عَنِ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"And whoever strives only strives for [the benefit of] himself. Indeed, Allah is free from need of the worlds\"},{\"a\":7,\"w\":[\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"لَنُكَفِّرَنَّ\",\"عَنۡهُمۡ\",\"سَيِّـَٔاتِهِمۡ\",\"وَلَنَجۡزِيَنَّهُمۡ\",\"أَحۡسَنَ\",\"ٱلَّذِي\",\"كَانُواْ\",\"يَعۡمَلُونَ\"],\"t\":\"And those who believe and do righteous deeds - We will surely remove from them their misdeeds and will surely reward them according to the best of what they used to do\"},{\"a\":8,\"w\":[\"وَوَصَّيۡنَا\",\"ٱلۡإِنسَٰنَ\",\"بِوَٰلِدَيۡهِ\",\"حُسۡنٗاۖ\",\"وَإِن\",\"جَٰهَدَاكَ\",\"لِتُشۡرِكَ\",\"بِي\",\"مَا\",\"لَيۡسَ\",\"لَكَ\",\"بِهِۦ\",\"عِلۡمٞ\",\"فَلَا\",\"تُطِعۡهُمَآۚ\",\"إِلَيَّ\",\"مَرۡجِعُكُمۡ\",\"فَأُنَبِّئُكُم\",\"بِمَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"And We have enjoined upon man goodness to parents. But if they endeavor to make you associate with Me that of which you have no knowledge, do not obey them. To Me is your return, and I will inform you about what you used to do\"},{\"a\":9,\"w\":[\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"لَنُدۡخِلَنَّهُمۡ\",\"فِي\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"And those who believe and do righteous deeds - We will surely admit them among the righteous [into Paradise]\"},{\"a\":10,\"w\":[\"وَمِنَ\",\"ٱلنَّاسِ\",\"مَن\",\"يَقُولُ\",\"ءَامَنَّا\",\"بِٱللَّهِ\",\"فَإِذَآ\",\"أُوذِيَ\",\"فِي\",\"ٱللَّهِ\",\"جَعَلَ\",\"فِتۡنَةَ\",\"ٱلنَّاسِ\",\"كَعَذَابِ\",\"ٱللَّهِۖ\",\"وَلَئِن\",\"جَآءَ\",\"نَصۡرٞ\",\"مِّن\",\"رَّبِّكَ\",\"لَيَقُولُنَّ\",\"إِنَّا\",\"كُنَّا\",\"مَعَكُمۡۚ\",\"أَوَلَيۡسَ\",\"ٱللَّهُ\",\"بِأَعۡلَمَ\",\"بِمَا\",\"فِي\",\"صُدُورِ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"And of the people are some who say, \\\"We believe in Allah,\\\" but when one [of them] is harmed for [the cause of] Allah, they consider the trial of the people as [if it were] the punishment of Allah. But if victory comes from your Lord, they say, \\\"Indeed, We were with you.\\\" Is not Allah most knowing of what is within the breasts of all creatures\"},{\"a\":11,\"w\":[\"وَلَيَعۡلَمَنَّ\",\"ٱللَّهُ\",\"ٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَلَيَعۡلَمَنَّ\",\"ٱلۡمُنَٰفِقِينَ\"],\"t\":\"And Allah will surely make evident those who believe, and He will surely make evident the hypocrites\"},{\"a\":12,\"w\":[\"وَقَالَ\",\"ٱلَّذِينَ\",\"كَفَرُواْ\",\"لِلَّذِينَ\",\"ءَامَنُواْ\",\"ٱتَّبِعُواْ\",\"سَبِيلَنَا\",\"وَلۡنَحۡمِلۡ\",\"خَطَٰيَٰكُمۡ\",\"وَمَا\",\"هُم\",\"بِحَٰمِلِينَ\",\"مِنۡ\",\"خَطَٰيَٰهُم\",\"مِّن\",\"شَيۡءٍۖ\",\"إِنَّهُمۡ\",\"لَكَٰذِبُونَ\"],\"t\":\"And those who disbelieve say to those who believe, \\\"Follow our way, and we will carry your sins.\\\" But they will not carry anything of their sins. Indeed, they are liars\"},{\"a\":13,\"w\":[\"وَلَيَحۡمِلُنَّ\",\"أَثۡقَالَهُمۡ\",\"وَأَثۡقَالٗا\",\"مَّعَ\",\"أَثۡقَالِهِمۡۖ\",\"وَلَيُسۡـَٔلُنَّ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِ\",\"عَمَّا\",\"كَانُواْ\",\"يَفۡتَرُونَ\"],\"t\":\"But they will surely carry their [own] burdens and [other] burdens along with their burdens, and they will surely be questioned on the Day of Resurrection about what they used to invent\"},{\"a\":14,\"w\":[\"وَلَقَدۡ\",\"أَرۡسَلۡنَا\",\"نُوحًا\",\"إِلَىٰ\",\"قَوۡمِهِۦ\",\"فَلَبِثَ\",\"فِيهِمۡ\",\"أَلۡفَ\",\"سَنَةٍ\",\"إِلَّا\",\"خَمۡسِينَ\",\"عَامٗا\",\"فَأَخَذَهُمُ\",\"ٱلطُّوفَانُ\",\"وَهُمۡ\",\"ظَٰلِمُونَ\"],\"t\":\"And We certainly sent Noah to his people, and he remained among them a thousand years minus fifty years, and the flood seized them while they were wrongdoers\"},{\"a\":15,\"w\":[\"فَأَنجَيۡنَٰهُ\",\"وَأَصۡحَٰبَ\",\"ٱلسَّفِينَةِ\",\"وَجَعَلۡنَٰهَآ\",\"ءَايَةٗ\",\"لِّلۡعَٰلَمِينَ\"],\"t\":\"But We saved him and the companions of the ship, and We made it a sign for the worlds\"},{\"a\":16,\"w\":[\"وَإِبۡرَٰهِيمَ\",\"إِذۡ\",\"قَالَ\",\"لِقَوۡمِهِ\",\"ٱعۡبُدُواْ\",\"ٱللَّهَ\",\"وَٱتَّقُوهُۖ\",\"ذَٰلِكُمۡ\",\"خَيۡرٞ\",\"لَّكُمۡ\",\"إِن\",\"كُنتُمۡ\",\"تَعۡلَمُونَ\"],\"t\":\"And [We sent] Abraham, when he said to his people, \\\"Worship Allah and fear Him. That is best for you, if you should know\"},{\"a\":17,\"w\":[\"إِنَّمَا\",\"تَعۡبُدُونَ\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"أَوۡثَٰنٗا\",\"وَتَخۡلُقُونَ\",\"إِفۡكًاۚ\",\"إِنَّ\",\"ٱلَّذِينَ\",\"تَعۡبُدُونَ\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"لَا\",\"يَمۡلِكُونَ\",\"لَكُمۡ\",\"رِزۡقٗا\",\"فَٱبۡتَغُواْ\",\"عِندَ\",\"ٱللَّهِ\",\"ٱلرِّزۡقَ\",\"وَٱعۡبُدُوهُ\",\"وَٱشۡكُرُواْ\",\"لَهُۥٓۖ\",\"إِلَيۡهِ\",\"تُرۡجَعُونَ\"],\"t\":\"You only worship, besides Allah, idols, and you produce a falsehood. Indeed, those you worship besides Allah do not possess for you [the power of] provision. So seek from Allah provision and worship Him and be grateful to Him. To Him you will be returned\"},{\"a\":18,\"w\":[\"وَإِن\",\"تُكَذِّبُواْ\",\"فَقَدۡ\",\"كَذَّبَ\",\"أُمَمٞ\",\"مِّن\",\"قَبۡلِكُمۡۖ\",\"وَمَا\",\"عَلَى\",\"ٱلرَّسُولِ\",\"إِلَّا\",\"ٱلۡبَلَٰغُ\",\"ٱلۡمُبِينُ\"],\"t\":\"And if you [people] deny [the message] - already nations before you have denied. And there is not upon the Messenger except [the duty of] clear notification\"},{\"a\":19,\"w\":[\"أَوَلَمۡ\",\"يَرَوۡاْ\",\"كَيۡفَ\",\"يُبۡدِئُ\",\"ٱللَّهُ\",\"ٱلۡخَلۡقَ\",\"ثُمَّ\",\"يُعِيدُهُۥٓۚ\",\"إِنَّ\",\"ذَٰلِكَ\",\"عَلَى\",\"ٱللَّهِ\",\"يَسِيرٞ\"],\"t\":\"Have they not considered how Allah begins creation and then repeats it? Indeed that, for Allah, is easy\"},{\"a\":20,\"w\":[\"قُلۡ\",\"سِيرُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"فَٱنظُرُواْ\",\"كَيۡفَ\",\"بَدَأَ\",\"ٱلۡخَلۡقَۚ\",\"ثُمَّ\",\"ٱللَّهُ\",\"يُنشِئُ\",\"ٱلنَّشۡأَةَ\",\"ٱلۡأٓخِرَةَۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"عَلَىٰ\",\"كُلِّ\",\"شَيۡءٖ\",\"قَدِيرٞ\"],\"t\":\"Say, [O Muhammad], \\\"Travel through the land and observe how He began creation. Then Allah will produce the final creation. Indeed Allah, over all things, is competent\"},{\"a\":21,\"w\":[\"يُعَذِّبُ\",\"مَن\",\"يَشَآءُ\",\"وَيَرۡحَمُ\",\"مَن\",\"يَشَآءُۖ\",\"وَإِلَيۡهِ\",\"تُقۡلَبُونَ\"],\"t\":\"He punishes whom He wills and has mercy upon whom He wills, and to Him you will be returned\"},{\"a\":22,\"w\":[\"وَمَآ\",\"أَنتُم\",\"بِمُعۡجِزِينَ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَلَا\",\"فِي\",\"ٱلسَّمَآءِۖ\",\"وَمَا\",\"لَكُم\",\"مِّن\",\"دُونِ\",\"ٱللَّهِ\",\"مِن\",\"وَلِيّٖ\",\"وَلَا\",\"نَصِيرٖ\"],\"t\":\"And you will not cause failure [to Allah] upon the earth or in the heaven. And you have not other than Allah any protector or any helper\"},{\"a\":23,\"w\":[\"وَٱلَّذِينَ\",\"كَفَرُواْ\",\"بِـَٔايَٰتِ\",\"ٱللَّهِ\",\"وَلِقَآئِهِۦٓ\",\"أُوْلَـٰٓئِكَ\",\"يَئِسُواْ\",\"مِن\",\"رَّحۡمَتِي\",\"وَأُوْلَـٰٓئِكَ\",\"لَهُمۡ\",\"عَذَابٌ\",\"أَلِيمٞ\"],\"t\":\"And the ones who disbelieve in the signs of Allah and the meeting with Him - those have despaired of My mercy, and they will have a painful punishment\"},{\"a\":24,\"w\":[\"فَمَا\",\"كَانَ\",\"جَوَابَ\",\"قَوۡمِهِۦٓ\",\"إِلَّآ\",\"أَن\",\"قَالُواْ\",\"ٱقۡتُلُوهُ\",\"أَوۡ\",\"حَرِّقُوهُ\",\"فَأَنجَىٰهُ\",\"ٱللَّهُ\",\"مِنَ\",\"ٱلنَّارِۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَٰتٖ\",\"لِّقَوۡمٖ\",\"يُؤۡمِنُونَ\"],\"t\":\"And the answer of Abraham's people was not but that they said, \\\"Kill him or burn him,\\\" but Allah saved him from the fire. Indeed in that are signs for a people who believe\"},{\"a\":25,\"w\":[\"وَقَالَ\",\"إِنَّمَا\",\"ٱتَّخَذۡتُم\",\"مِّن\",\"دُونِ\",\"ٱللَّهِ\",\"أَوۡثَٰنٗا\",\"مَّوَدَّةَ\",\"بَيۡنِكُمۡ\",\"فِي\",\"ٱلۡحَيَوٰةِ\",\"ٱلدُّنۡيَاۖ\",\"ثُمَّ\",\"يَوۡمَ\",\"ٱلۡقِيَٰمَةِ\",\"يَكۡفُرُ\",\"بَعۡضُكُم\",\"بِبَعۡضٖ\",\"وَيَلۡعَنُ\",\"بَعۡضُكُم\",\"بَعۡضٗا\",\"وَمَأۡوَىٰكُمُ\",\"ٱلنَّارُ\",\"وَمَا\",\"لَكُم\",\"مِّن\",\"نَّـٰصِرِينَ\"],\"t\":\"And [Abraham] said, \\\"You have only taken, other than Allah, idols as [a bond of] affection among you in worldly life. Then on the Day of Resurrection you will deny one another and curse one another, and your refuge will be the Fire, and you will not have any helpers\"},{\"a\":26,\"w\":[\"۞فَـَٔامَنَ\",\"لَهُۥ\",\"لُوطٞۘ\",\"وَقَالَ\",\"إِنِّي\",\"مُهَاجِرٌ\",\"إِلَىٰ\",\"رَبِّيٓۖ\",\"إِنَّهُۥ\",\"هُوَ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"And Lot believed him. [Abraham] said, \\\"Indeed, I will emigrate to [the service of] my Lord. Indeed, He is the Exalted in Might, the Wise\"},{\"a\":27,\"w\":[\"وَوَهَبۡنَا\",\"لَهُۥٓ\",\"إِسۡحَٰقَ\",\"وَيَعۡقُوبَ\",\"وَجَعَلۡنَا\",\"فِي\",\"ذُرِّيَّتِهِ\",\"ٱلنُّبُوَّةَ\",\"وَٱلۡكِتَٰبَ\",\"وَءَاتَيۡنَٰهُ\",\"أَجۡرَهُۥ\",\"فِي\",\"ٱلدُّنۡيَاۖ\",\"وَإِنَّهُۥ\",\"فِي\",\"ٱلۡأٓخِرَةِ\",\"لَمِنَ\",\"ٱلصَّـٰلِحِينَ\"],\"t\":\"And We gave to Him Isaac and Jacob and placed in his descendants prophethood and scripture. And We gave him his reward in this world, and indeed, he is in the Hereafter among the righteous\"},{\"a\":28,\"w\":[\"وَلُوطًا\",\"إِذۡ\",\"قَالَ\",\"لِقَوۡمِهِۦٓ\",\"إِنَّكُمۡ\",\"لَتَأۡتُونَ\",\"ٱلۡفَٰحِشَةَ\",\"مَا\",\"سَبَقَكُم\",\"بِهَا\",\"مِنۡ\",\"أَحَدٖ\",\"مِّنَ\",\"ٱلۡعَٰلَمِينَ\"],\"t\":\"And [mention] Lot, when he said to his people, \\\"Indeed, you commit such immorality as no one has preceded you with from among the worlds\"},{\"a\":29,\"w\":[\"أَئِنَّكُمۡ\",\"لَتَأۡتُونَ\",\"ٱلرِّجَالَ\",\"وَتَقۡطَعُونَ\",\"ٱلسَّبِيلَ\",\"وَتَأۡتُونَ\",\"فِي\",\"نَادِيكُمُ\",\"ٱلۡمُنكَرَۖ\",\"فَمَا\",\"كَانَ\",\"جَوَابَ\",\"قَوۡمِهِۦٓ\",\"إِلَّآ\",\"أَن\",\"قَالُواْ\",\"ٱئۡتِنَا\",\"بِعَذَابِ\",\"ٱللَّهِ\",\"إِن\",\"كُنتَ\",\"مِنَ\",\"ٱلصَّـٰدِقِينَ\"],\"t\":\"Indeed, you approach men and obstruct the road and commit in your meetings [every] evil.\\\" And the answer of his people was not but they said, \\\"Bring us the punishment of Allah, if you should be of the truthful\"},{\"a\":30,\"w\":[\"قَالَ\",\"رَبِّ\",\"ٱنصُرۡنِي\",\"عَلَى\",\"ٱلۡقَوۡمِ\",\"ٱلۡمُفۡسِدِينَ\"],\"t\":\"He said, \\\"My Lord, support me against the corrupting people\"},{\"a\":31,\"w\":[\"وَلَمَّا\",\"جَآءَتۡ\",\"رُسُلُنَآ\",\"إِبۡرَٰهِيمَ\",\"بِٱلۡبُشۡرَىٰ\",\"قَالُوٓاْ\",\"إِنَّا\",\"مُهۡلِكُوٓاْ\",\"أَهۡلِ\",\"هَٰذِهِ\",\"ٱلۡقَرۡيَةِۖ\",\"إِنَّ\",\"أَهۡلَهَا\",\"كَانُواْ\",\"ظَٰلِمِينَ\"],\"t\":\"And when Our messengers came to Abraham with the good tidings, they said, \\\"Indeed, we will destroy the people of that Lot's city. Indeed, its people have been wrongdoers\"},{\"a\":32,\"w\":[\"قَالَ\",\"إِنَّ\",\"فِيهَا\",\"لُوطٗاۚ\",\"قَالُواْ\",\"نَحۡنُ\",\"أَعۡلَمُ\",\"بِمَن\",\"فِيهَاۖ\",\"لَنُنَجِّيَنَّهُۥ\",\"وَأَهۡلَهُۥٓ\",\"إِلَّا\",\"ٱمۡرَأَتَهُۥ\",\"كَانَتۡ\",\"مِنَ\",\"ٱلۡغَٰبِرِينَ\"],\"t\":\"[Abraham] said, \\\"Indeed, within it is Lot.\\\" They said, \\\"We are more knowing of who is within it. We will surely save him and his family, except his wife. She is to be of those who remain behind\"},{\"a\":33,\"w\":[\"وَلَمَّآ\",\"أَن\",\"جَآءَتۡ\",\"رُسُلُنَا\",\"لُوطٗا\",\"سِيٓءَ\",\"بِهِمۡ\",\"وَضَاقَ\",\"بِهِمۡ\",\"ذَرۡعٗاۖ\",\"وَقَالُواْ\",\"لَا\",\"تَخَفۡ\",\"وَلَا\",\"تَحۡزَنۡ\",\"إِنَّا\",\"مُنَجُّوكَ\",\"وَأَهۡلَكَ\",\"إِلَّا\",\"ٱمۡرَأَتَكَ\",\"كَانَتۡ\",\"مِنَ\",\"ٱلۡغَٰبِرِينَ\"],\"t\":\"And when Our messengers came to Lot, he was distressed for them and felt for them great discomfort. They said, \\\"Fear not, nor grieve. Indeed, we will save you and your family, except your wife; she is to be of those who remain behind\"},{\"a\":34,\"w\":[\"إِنَّا\",\"مُنزِلُونَ\",\"عَلَىٰٓ\",\"أَهۡلِ\",\"هَٰذِهِ\",\"ٱلۡقَرۡيَةِ\",\"رِجۡزٗا\",\"مِّنَ\",\"ٱلسَّمَآءِ\",\"بِمَا\",\"كَانُواْ\",\"يَفۡسُقُونَ\"],\"t\":\"Indeed, we will bring down on the people of this city punishment from the sky because they have been defiantly disobedient\"},{\"a\":35,\"w\":[\"وَلَقَد\",\"تَّرَكۡنَا\",\"مِنۡهَآ\",\"ءَايَةَۢ\",\"بَيِّنَةٗ\",\"لِّقَوۡمٖ\",\"يَعۡقِلُونَ\"],\"t\":\"And We have certainly left of it a sign as clear evidence for a people who use reason\"},{\"a\":36,\"w\":[\"وَإِلَىٰ\",\"مَدۡيَنَ\",\"أَخَاهُمۡ\",\"شُعَيۡبٗا\",\"فَقَالَ\",\"يَٰقَوۡمِ\",\"ٱعۡبُدُواْ\",\"ٱللَّهَ\",\"وَٱرۡجُواْ\",\"ٱلۡيَوۡمَ\",\"ٱلۡأٓخِرَ\",\"وَلَا\",\"تَعۡثَوۡاْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"مُفۡسِدِينَ\"],\"t\":\"And to Madyan [We sent] their brother Shu'ayb, and he said, \\\"O my people, worship Allah and expect the Last Day and do not commit abuse on the earth, spreading corruption\"},{\"a\":37,\"w\":[\"فَكَذَّبُوهُ\",\"فَأَخَذَتۡهُمُ\",\"ٱلرَّجۡفَةُ\",\"فَأَصۡبَحُواْ\",\"فِي\",\"دَارِهِمۡ\",\"جَٰثِمِينَ\"],\"t\":\"But they denied him, so the earthquake seized them, and they became within their home [corpses] fallen prone\"},{\"a\":38,\"w\":[\"وَعَادٗا\",\"وَثَمُودَاْ\",\"وَقَد\",\"تَّبَيَّنَ\",\"لَكُم\",\"مِّن\",\"مَّسَٰكِنِهِمۡۖ\",\"وَزَيَّنَ\",\"لَهُمُ\",\"ٱلشَّيۡطَٰنُ\",\"أَعۡمَٰلَهُمۡ\",\"فَصَدَّهُمۡ\",\"عَنِ\",\"ٱلسَّبِيلِ\",\"وَكَانُواْ\",\"مُسۡتَبۡصِرِينَ\"],\"t\":\"And [We destroyed] 'Aad and Thamud, and it has become clear to you from their [ruined] dwellings. And Satan had made pleasing to them their deeds and averted them from the path, and they were endowed with perception\"},{\"a\":39,\"w\":[\"وَقَٰرُونَ\",\"وَفِرۡعَوۡنَ\",\"وَهَٰمَٰنَۖ\",\"وَلَقَدۡ\",\"جَآءَهُم\",\"مُّوسَىٰ\",\"بِٱلۡبَيِّنَٰتِ\",\"فَٱسۡتَكۡبَرُواْ\",\"فِي\",\"ٱلۡأَرۡضِ\",\"وَمَا\",\"كَانُواْ\",\"سَٰبِقِينَ\"],\"t\":\"And [We destroyed] Qarun and Pharaoh and Haman. And Moses had already come to them with clear evidences, and they were arrogant in the land, but they were not outrunners [of Our punishment]\"},{\"a\":40,\"w\":[\"فَكُلًّا\",\"أَخَذۡنَا\",\"بِذَنۢبِهِۦۖ\",\"فَمِنۡهُم\",\"مَّنۡ\",\"أَرۡسَلۡنَا\",\"عَلَيۡهِ\",\"حَاصِبٗا\",\"وَمِنۡهُم\",\"مَّنۡ\",\"أَخَذَتۡهُ\",\"ٱلصَّيۡحَةُ\",\"وَمِنۡهُم\",\"مَّنۡ\",\"خَسَفۡنَا\",\"بِهِ\",\"ٱلۡأَرۡضَ\",\"وَمِنۡهُم\",\"مَّنۡ\",\"أَغۡرَقۡنَاۚ\",\"وَمَا\",\"كَانَ\",\"ٱللَّهُ\",\"لِيَظۡلِمَهُمۡ\",\"وَلَٰكِن\",\"كَانُوٓاْ\",\"أَنفُسَهُمۡ\",\"يَظۡلِمُونَ\"],\"t\":\"So each We seized for his sin; and among them were those upon whom We sent a storm of stones, and among them were those who were seized by the blast [from the sky], and among them were those whom We caused the earth to swallow, and among them were those whom We drowned. And Allah would not have wronged them, but it was they who were wronging themselves\"},{\"a\":41,\"w\":[\"مَثَلُ\",\"ٱلَّذِينَ\",\"ٱتَّخَذُواْ\",\"مِن\",\"دُونِ\",\"ٱللَّهِ\",\"أَوۡلِيَآءَ\",\"كَمَثَلِ\",\"ٱلۡعَنكَبُوتِ\",\"ٱتَّخَذَتۡ\",\"بَيۡتٗاۖ\",\"وَإِنَّ\",\"أَوۡهَنَ\",\"ٱلۡبُيُوتِ\",\"لَبَيۡتُ\",\"ٱلۡعَنكَبُوتِۚ\",\"لَوۡ\",\"كَانُواْ\",\"يَعۡلَمُونَ\"],\"t\":\"The example of those who take allies other than Allah is like that of the spider who takes a home. And indeed, the weakest of homes is the home of the spider, if they only knew\"},{\"a\":42,\"w\":[\"إِنَّ\",\"ٱللَّهَ\",\"يَعۡلَمُ\",\"مَا\",\"يَدۡعُونَ\",\"مِن\",\"دُونِهِۦ\",\"مِن\",\"شَيۡءٖۚ\",\"وَهُوَ\",\"ٱلۡعَزِيزُ\",\"ٱلۡحَكِيمُ\"],\"t\":\"Indeed, Allah knows whatever thing they call upon other than Him. And He is the Exalted in Might, the Wise\"},{\"a\":43,\"w\":[\"وَتِلۡكَ\",\"ٱلۡأَمۡثَٰلُ\",\"نَضۡرِبُهَا\",\"لِلنَّاسِۖ\",\"وَمَا\",\"يَعۡقِلُهَآ\",\"إِلَّا\",\"ٱلۡعَٰلِمُونَ\"],\"t\":\"And these examples We present to the people, but none will understand them except those of knowledge\"},{\"a\":44,\"w\":[\"خَلَقَ\",\"ٱللَّهُ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضَ\",\"بِٱلۡحَقِّۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَأٓيَةٗ\",\"لِّلۡمُؤۡمِنِينَ\"],\"t\":\"Allah created the heavens and the earth in truth. Indeed in that is a sign for the believers\"},{\"a\":45,\"w\":[\"ٱتۡلُ\",\"مَآ\",\"أُوحِيَ\",\"إِلَيۡكَ\",\"مِنَ\",\"ٱلۡكِتَٰبِ\",\"وَأَقِمِ\",\"ٱلصَّلَوٰةَۖ\",\"إِنَّ\",\"ٱلصَّلَوٰةَ\",\"تَنۡهَىٰ\",\"عَنِ\",\"ٱلۡفَحۡشَآءِ\",\"وَٱلۡمُنكَرِۗ\",\"وَلَذِكۡرُ\",\"ٱللَّهِ\",\"أَكۡبَرُۗ\",\"وَٱللَّهُ\",\"يَعۡلَمُ\",\"مَا\",\"تَصۡنَعُونَ\"],\"t\":\"Recite, [O Muhammad], what has been revealed to you of the Book and establish prayer. Indeed, prayer prohibits immorality and wrongdoing, and the remembrance of Allah is greater. And Allah knows that which you do\"},{\"a\":46,\"w\":[\"۞وَلَا\",\"تُجَٰدِلُوٓاْ\",\"أَهۡلَ\",\"ٱلۡكِتَٰبِ\",\"إِلَّا\",\"بِٱلَّتِي\",\"هِيَ\",\"أَحۡسَنُ\",\"إِلَّا\",\"ٱلَّذِينَ\",\"ظَلَمُواْ\",\"مِنۡهُمۡۖ\",\"وَقُولُوٓاْ\",\"ءَامَنَّا\",\"بِٱلَّذِيٓ\",\"أُنزِلَ\",\"إِلَيۡنَا\",\"وَأُنزِلَ\",\"إِلَيۡكُمۡ\",\"وَإِلَٰهُنَا\",\"وَإِلَٰهُكُمۡ\",\"وَٰحِدٞ\",\"وَنَحۡنُ\",\"لَهُۥ\",\"مُسۡلِمُونَ\"],\"t\":\"And do not argue with the People of the Scripture except in a way that is best, except for those who commit injustice among them, and say, \\\"We believe in that which has been revealed to us and revealed to you. And our God and your God is one; and we are Muslims [in submission] to Him\"},{\"a\":47,\"w\":[\"وَكَذَٰلِكَ\",\"أَنزَلۡنَآ\",\"إِلَيۡكَ\",\"ٱلۡكِتَٰبَۚ\",\"فَٱلَّذِينَ\",\"ءَاتَيۡنَٰهُمُ\",\"ٱلۡكِتَٰبَ\",\"يُؤۡمِنُونَ\",\"بِهِۦۖ\",\"وَمِنۡ\",\"هَـٰٓؤُلَآءِ\",\"مَن\",\"يُؤۡمِنُ\",\"بِهِۦۚ\",\"وَمَا\",\"يَجۡحَدُ\",\"بِـَٔايَٰتِنَآ\",\"إِلَّا\",\"ٱلۡكَٰفِرُونَ\"],\"t\":\"And thus We have sent down to you the Qur'an. And those to whom We [previously] gave the Scripture believe in it. And among these [people of Makkah] are those who believe in it. And none reject Our verses except the disbelievers\"},{\"a\":48,\"w\":[\"وَمَا\",\"كُنتَ\",\"تَتۡلُواْ\",\"مِن\",\"قَبۡلِهِۦ\",\"مِن\",\"كِتَٰبٖ\",\"وَلَا\",\"تَخُطُّهُۥ\",\"بِيَمِينِكَۖ\",\"إِذٗا\",\"لَّٱرۡتَابَ\",\"ٱلۡمُبۡطِلُونَ\"],\"t\":\"And you did not recite before it any scripture, nor did you inscribe one with your right hand. Otherwise the falsifiers would have had [cause for] doubt\"},{\"a\":49,\"w\":[\"بَلۡ\",\"هُوَ\",\"ءَايَٰتُۢ\",\"بَيِّنَٰتٞ\",\"فِي\",\"صُدُورِ\",\"ٱلَّذِينَ\",\"أُوتُواْ\",\"ٱلۡعِلۡمَۚ\",\"وَمَا\",\"يَجۡحَدُ\",\"بِـَٔايَٰتِنَآ\",\"إِلَّا\",\"ٱلظَّـٰلِمُونَ\"],\"t\":\"Rather, the Qur'an is distinct verses [preserved] within the breasts of those who have been given knowledge. And none reject Our verses except the wrongdoers\"},{\"a\":50,\"w\":[\"وَقَالُواْ\",\"لَوۡلَآ\",\"أُنزِلَ\",\"عَلَيۡهِ\",\"ءَايَٰتٞ\",\"مِّن\",\"رَّبِّهِۦۚ\",\"قُلۡ\",\"إِنَّمَا\",\"ٱلۡأٓيَٰتُ\",\"عِندَ\",\"ٱللَّهِ\",\"وَإِنَّمَآ\",\"أَنَا۠\",\"نَذِيرٞ\",\"مُّبِينٌ\"],\"t\":\"But they say, \\\"Why are not signs sent down to him from his Lord?\\\" Say, \\\"The signs are only with Allah, and I am only a clear warner\"},{\"a\":51,\"w\":[\"أَوَلَمۡ\",\"يَكۡفِهِمۡ\",\"أَنَّآ\",\"أَنزَلۡنَا\",\"عَلَيۡكَ\",\"ٱلۡكِتَٰبَ\",\"يُتۡلَىٰ\",\"عَلَيۡهِمۡۚ\",\"إِنَّ\",\"فِي\",\"ذَٰلِكَ\",\"لَرَحۡمَةٗ\",\"وَذِكۡرَىٰ\",\"لِقَوۡمٖ\",\"يُؤۡمِنُونَ\"],\"t\":\"And is it not sufficient for them that We revealed to you the Book which is recited to them? Indeed in that is a mercy and reminder for a people who believe\"},{\"a\":52,\"w\":[\"قُلۡ\",\"كَفَىٰ\",\"بِٱللَّهِ\",\"بَيۡنِي\",\"وَبَيۡنَكُمۡ\",\"شَهِيدٗاۖ\",\"يَعۡلَمُ\",\"مَا\",\"فِي\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضِۗ\",\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"بِٱلۡبَٰطِلِ\",\"وَكَفَرُواْ\",\"بِٱللَّهِ\",\"أُوْلَـٰٓئِكَ\",\"هُمُ\",\"ٱلۡخَٰسِرُونَ\"],\"t\":\"Say, \\\"Sufficient is Allah between me and you as Witness. He knows what is in the heavens and earth. And they who have believed in falsehood and disbelieved in Allah - it is those who are the losers\"},{\"a\":53,\"w\":[\"وَيَسۡتَعۡجِلُونَكَ\",\"بِٱلۡعَذَابِ\",\"وَلَوۡلَآ\",\"أَجَلٞ\",\"مُّسَمّٗى\",\"لَّجَآءَهُمُ\",\"ٱلۡعَذَابُۚ\",\"وَلَيَأۡتِيَنَّهُم\",\"بَغۡتَةٗ\",\"وَهُمۡ\",\"لَا\",\"يَشۡعُرُونَ\"],\"t\":\"And they urge you to hasten the punishment. And if not for [the decree of] a specified term, punishment would have reached them. But it will surely come to them suddenly while they perceive not\"},{\"a\":54,\"w\":[\"يَسۡتَعۡجِلُونَكَ\",\"بِٱلۡعَذَابِ\",\"وَإِنَّ\",\"جَهَنَّمَ\",\"لَمُحِيطَةُۢ\",\"بِٱلۡكَٰفِرِينَ\"],\"t\":\"They urge you to hasten the punishment. And indeed, Hell will be encompassing of the disbelievers\"},{\"a\":55,\"w\":[\"يَوۡمَ\",\"يَغۡشَىٰهُمُ\",\"ٱلۡعَذَابُ\",\"مِن\",\"فَوۡقِهِمۡ\",\"وَمِن\",\"تَحۡتِ\",\"أَرۡجُلِهِمۡ\",\"وَيَقُولُ\",\"ذُوقُواْ\",\"مَا\",\"كُنتُمۡ\",\"تَعۡمَلُونَ\"],\"t\":\"On the Day the punishment will cover them from above them and from below their feet and it is said, \\\"Taste [the result of] what you used to do\"},{\"a\":56,\"w\":[\"يَٰعِبَادِيَ\",\"ٱلَّذِينَ\",\"ءَامَنُوٓاْ\",\"إِنَّ\",\"أَرۡضِي\",\"وَٰسِعَةٞ\",\"فَإِيَّـٰيَ\",\"فَٱعۡبُدُونِ\"],\"t\":\"O My servants who have believed, indeed My earth is spacious, so worship only Me\"},{\"a\":57,\"w\":[\"كُلُّ\",\"نَفۡسٖ\",\"ذَآئِقَةُ\",\"ٱلۡمَوۡتِۖ\",\"ثُمَّ\",\"إِلَيۡنَا\",\"تُرۡجَعُونَ\"],\"t\":\"Every soul will taste death. Then to Us will you be returned\"},{\"a\":58,\"w\":[\"وَٱلَّذِينَ\",\"ءَامَنُواْ\",\"وَعَمِلُواْ\",\"ٱلصَّـٰلِحَٰتِ\",\"لَنُبَوِّئَنَّهُم\",\"مِّنَ\",\"ٱلۡجَنَّةِ\",\"غُرَفٗا\",\"تَجۡرِي\",\"مِن\",\"تَحۡتِهَا\",\"ٱلۡأَنۡهَٰرُ\",\"خَٰلِدِينَ\",\"فِيهَاۚ\",\"نِعۡمَ\",\"أَجۡرُ\",\"ٱلۡعَٰمِلِينَ\"],\"t\":\"And those who have believed and done righteous deeds - We will surely assign to them of Paradise [elevated] chambers beneath which rivers flow, wherein they abide eternally. Excellent is the reward of the [righteous] workers\"},{\"a\":59,\"w\":[\"ٱلَّذِينَ\",\"صَبَرُواْ\",\"وَعَلَىٰ\",\"رَبِّهِمۡ\",\"يَتَوَكَّلُونَ\"],\"t\":\"Who have been patient and upon their Lord rely\"},{\"a\":60,\"w\":[\"وَكَأَيِّن\",\"مِّن\",\"دَآبَّةٖ\",\"لَّا\",\"تَحۡمِلُ\",\"رِزۡقَهَا\",\"ٱللَّهُ\",\"يَرۡزُقُهَا\",\"وَإِيَّاكُمۡۚ\",\"وَهُوَ\",\"ٱلسَّمِيعُ\",\"ٱلۡعَلِيمُ\"],\"t\":\"And how many a creature carries not its [own] provision. Allah provides for it and for you. And He is the Hearing, the Knowing\"},{\"a\":61,\"w\":[\"وَلَئِن\",\"سَأَلۡتَهُم\",\"مَّنۡ\",\"خَلَقَ\",\"ٱلسَّمَٰوَٰتِ\",\"وَٱلۡأَرۡضَ\",\"وَسَخَّرَ\",\"ٱلشَّمۡسَ\",\"وَٱلۡقَمَرَ\",\"لَيَقُولُنَّ\",\"ٱللَّهُۖ\",\"فَأَنَّىٰ\",\"يُؤۡفَكُونَ\"],\"t\":\"If you asked them, \\\"Who created the heavens and earth and subjected the sun and the moon?\\\" they would surely say, \\\"Allah.\\\" Then how are they deluded\"},{\"a\":62,\"w\":[\"ٱللَّهُ\",\"يَبۡسُطُ\",\"ٱلرِّزۡقَ\",\"لِمَن\",\"يَشَآءُ\",\"مِنۡ\",\"عِبَادِهِۦ\",\"وَيَقۡدِرُ\",\"لَهُۥٓۚ\",\"إِنَّ\",\"ٱللَّهَ\",\"بِكُلِّ\",\"شَيۡءٍ\",\"عَلِيمٞ\"],\"t\":\"Allah extends provision for whom He wills of His servants and restricts for him. Indeed Allah is, of all things, Knowing\"},{\"a\":63,\"w\":[\"وَلَئِن\",\"سَأَلۡتَهُم\",\"مَّن\",\"نَّزَّلَ\",\"مِنَ\",\"ٱلسَّمَآءِ\",\"مَآءٗ\",\"فَأَحۡيَا\",\"بِهِ\",\"ٱلۡأَرۡضَ\",\"مِنۢ\",\"بَعۡدِ\",\"مَوۡتِهَا\",\"لَيَقُولُنَّ\",\"ٱللَّهُۚ\",\"قُلِ\",\"ٱلۡحَمۡدُ\",\"لِلَّهِۚ\",\"بَلۡ\",\"أَكۡثَرُهُمۡ\",\"لَا\",\"يَعۡقِلُونَ\"],\"t\":\"And if you asked them, \\\"Who sends down rain from the sky and gives life thereby to the earth after its lifelessness?\\\" they would surely say \\\" Allah.\\\" Say, \\\"Praise to Allah \\\"; but most of them do not reason\"},{\"a\":64,\"w\":[\"وَمَا\",\"هَٰذِهِ\",\"ٱلۡحَيَوٰةُ\",\"ٱلدُّنۡيَآ\",\"إِلَّا\",\"لَهۡوٞ\",\"وَلَعِبٞۚ\",\"وَإِنَّ\",\"ٱلدَّارَ\",\"ٱلۡأٓخِرَةَ\",\"لَهِيَ\",\"ٱلۡحَيَوَانُۚ\",\"لَوۡ\",\"كَانُواْ\",\"يَعۡلَمُونَ\"],\"t\":\"And this worldly life is not but diversion and amusement. And indeed, the home of the Hereafter - that is the [eternal] life, if only they knew\"},{\"a\":65,\"w\":[\"فَإِذَا\",\"رَكِبُواْ\",\"فِي\",\"ٱلۡفُلۡكِ\",\"دَعَوُاْ\",\"ٱللَّهَ\",\"مُخۡلِصِينَ\",\"لَهُ\",\"ٱلدِّينَ\",\"فَلَمَّا\",\"نَجَّىٰهُمۡ\",\"إِلَى\",\"ٱلۡبَرِّ\",\"إِذَا\",\"هُمۡ\",\"يُشۡرِكُونَ\"],\"t\":\"And when they board a ship, they supplicate Allah, sincere to Him in religion. But when He delivers them to the land, at once they associate others with Him\"},{\"a\":66,\"w\":[\"لِيَكۡفُرُواْ\",\"بِمَآ\",\"ءَاتَيۡنَٰهُمۡ\",\"وَلِيَتَمَتَّعُواْۚ\",\"فَسَوۡفَ\",\"يَعۡلَمُونَ\"],\"t\":\"So that they will deny what We have granted them, and they will enjoy themselves. But they are going to know\"},{\"a\":67,\"w\":[\"أَوَلَمۡ\",\"يَرَوۡاْ\",\"أَنَّا\",\"جَعَلۡنَا\",\"حَرَمًا\",\"ءَامِنٗا\",\"وَيُتَخَطَّفُ\",\"ٱلنَّاسُ\",\"مِنۡ\",\"حَوۡلِهِمۡۚ\",\"أَفَبِٱلۡبَٰطِلِ\",\"يُؤۡمِنُونَ\",\"وَبِنِعۡمَةِ\",\"ٱللَّهِ\",\"يَكۡفُرُونَ\"],\"t\":\"Have they not seen that We made [Makkah] a safe sanctuary, while people are being taken away all around them? Then in falsehood do they believe, and in the favor of Allah they disbelieve\"},{\"a\":68,\"w\":[\"وَمَنۡ\",\"أَظۡلَمُ\",\"مِمَّنِ\",\"ٱفۡتَرَىٰ\",\"عَلَى\",\"ٱللَّهِ\",\"كَذِبًا\",\"أَوۡ\",\"كَذَّبَ\",\"بِٱلۡحَقِّ\",\"لَمَّا\",\"جَآءَهُۥٓۚ\",\"أَلَيۡسَ\",\"فِي\",\"جَهَنَّمَ\",\"مَثۡوٗى\",\"لِّلۡكَٰفِرِينَ\"],\"t\":\"And who is more unjust than one who invents a lie about Allah or denies the truth when it has come to him? Is there not in Hell a [sufficient] residence for the disbelievers\"},{\"a\":69,\"w\":[\"وَٱلَّذِينَ\",\"جَٰهَدُواْ\",\"فِينَا\",\"لَنَهۡدِيَنَّهُمۡ\",\"سُبُلَنَاۚ\",\"وَإِنَّ\",\"ٱللَّهَ\",\"لَمَعَ\",\"ٱلۡمُحۡسِنِينَ\"],\"t\":\"And those who strive for Us - We will surely guide them to Our ways. And indeed, Allah is with the doers of good\"}]}]}]}]]}]\n16:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7faf9\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0d0c\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n1a:I[81329,[\"/Holy-Qur-an/_next/static/chunks/31d7_njve0k9_.js\"],\"IconMark\"]\n14:null\n18:[[\"$\",\"title\",\"0\",{\"children\":\"Al-'Ankabut — Surah 29 · Quran Root Research\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A free, open-source, offline-capable tool for researching Qur'anic Arabic roots and word forms: every derivative, every occurrence, with the Uthmani text and translation.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Quran Root Research\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/Holy-Qur-an/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quran Roots\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"icon\",\"href\":\"/Holy-Qur-an/icon.svg?icon.0k8xndm1lskh_.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"link\",\"8\",{\"rel\":\"apple-touch-icon\",\"href\":\"/Holy-Qur-an/apple-icon.png?apple-icon.1aiq4_oo29pdu.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L1a\",\"9\",{}]]\n"])</script></body></html>
